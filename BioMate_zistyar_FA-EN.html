نویسی و ترجمه هم‌زمان‌اند، اما در یوکاریوت رونویسی در هسته و ترجمه در سیتوپلاسم انجام می‌شود.\"],\n[\"مندل ۷ صفت را در حدود ۲۸ هزار گیاه نخود بررسی کرد و دو قانون را نتیجه گرفت: جدایی (دو اَلل هر ژن هنگام تشکیل گامت جدا می‌شوند) و جور‌شدن مستقل (اَلل‌های ژن‌های روی کروموزوم‌های متفاوت مستقل از هم جدا می‌شوند). از تلاقی آزمونی (تلاقی با نهفته‌ی خالص) می‌توان ژنوتیپ فرد غالب را فهمید: اگر همه‌ی نتایج غالب باشند فرد هموزیگوت است و نسبت ۱:۱ نشان‌دهنده‌ی هتروزیگوت.\",\"در کراسینگ‌اور پیوستگی ژن‌ها شکسته می‌شود و فراوانی نوترکیبی معیار فاصله‌ی ژنی است؛ ۱ درصد نوترکیبی برابر ۱ سانتی‌مورگان است و بر این اساس نقشه‌ی ژنی کشیده می‌شود. نسبت‌های مندلی را می‌توان با آزمون کای‌دو (χ²) با نتایج واقعی مقایسه کرد. نکته‌ی مهم دیگر این است که نسبت‌های ژنتیکی به احتمال اشاره دارند و هر فرزند مستقل از فرزندان پیشین است.\"],\n[\"گروه خونی ABO از ژن I با سه اَلل Iᴬ، Iᴮ و i تعیین می‌شود؛ Iᴬ و Iᴮ نسبت به i غالب‌اند و با هم هم‌بارز. در هموفیلی A که وابسته به X است، ژن عامل VIII انعقاد جهش یافته است: مرد با یک X جهش‌یافته مبتلا می‌شود، ولی زن باید دو X جهش‌یافته داشته باشد، پس زنان ناقل اغلب سالم‌اند. در زنان یکی از دو X تصادفی در هر سلول خاموش می‌شود (غیرفعال‌شدن X، جسم بار) و این موزاییک‌گرایی در گربه‌ی سه‌رنگ دیده می‌شود.\",\"صفات پلی‌ژنی مانند قد و رنگ پوست توزیع پیوسته (زنگوله‌ای) دارند و محیط نیز اثر می‌گذارد. اپیستازی یعنی ژنی بیان ژن دیگر را بپوشاند، مانند رنگ خز لابرادور. توارث میتوکندریایی فقط از مادر است. وراثت چندعاملی و وراثت‌پذیری (h²) سهم ژنتیک در تنوع صفت در یک جمعیت را نشان می‌دهد و درباره‌ی یک فرد خاص معنی ندارد. بیماری‌های تک‌ژنی مانند فنیل‌کتونوری (اتوزومی نهفته) با فقدان آنزیم فنیل‌آلانین هیدروکسیلاز ایجاد می‌شوند.\"],\n[\"جهش‌های جانشینی به سه نوع‌اند: خاموش (آمینواسید ثابت)، بدمعنی (آمینواسید دیگر) و بی‌معنی (رمزه‌ی پایان زودرس). حذف یا اضافه‌شدن تعداد غیرمضرب سه باعث تغییر چارچوب خواندن می‌شود. جهش‌های بزرگ‌تر شامل حذف، تکثیر، وارونگی و جابه‌جایی‌اند. سلول سازوکارهای ترمیم دارد: ترمیم برداشتن باز، ترمیم برداشتن نوکلئوتید (برای دیمرهای تیمین ناشی از UV)، ترمیم ناجور‌جفتی و ترمیم شکست دورشته‌ای. نقص در ترمیم باعث بیماری‌هایی مانند گزرودرما پیگمنتوزوم می‌شود.\",\"در CRISPR-Cas9، RNA راهنما (sgRNA) حدود ۲۰ نوکلئوتید مکمل جایگاه هدف دارد و Cas9 باید توالی PAM (مانند NGG) را در کنار هدف بیابد؛ سپس شکست دورشته‌ای ایجاد می‌شود که با اتصال انتهای غیرهمولوگ (NHEJ، ایجاد حذف و اضافه) یا ترمیم هدایت‌شده با الگو (HDR) بسته می‌شود. نگرانی اصلی اثرات خارج از هدف است. اپی‌ژنتیک شامل متیلاسیون DNA در جزایر CpG (خاموشی) و تغییر هیستون است و برخی تغییرات هنگام تقسیم به نسل بعد منتقل می‌شوند.\"]],\n\nmic:[\n[\"رنگ‌آمیزی گرم بر پایه‌ی ضخامت پپتیدوگلیکان است: لایه‌ی ضخیم در گرم مثبت‌ها بنفش را نگه می‌دارد و در گرم منفی‌ها لایه‌ی نازک با غشای خارجی حاوی لیپوپلی‌ساکارید (اندوتوکسین) قرار دارد که مقاومت بیشتری به آنتی‌بیوتیک می‌دهد. باکتری‌ها با سه راه DNA را منتقل می‌کنند: تبدیل (جذب DNA آزاد)، ترارسانی (با فاژ) و پیوند (کونژوگاسیون با پیلوس جنسی). پلاسمید R ژن‌های مقاومت دارویی را حمل می‌کند. هاگ‌های باکتری‌هایی مانند باسیلوس و کلستریدیوم به گرما و مواد شیمیایی بسیار مقاوم‌اند.\",\"میکروبیوم روده حدود ۳۸ تریلیون باکتری دارد؛ آن‌ها کربوهیدرات‌های غیرقابل هضم را تخمیر کرده و اسیدهای چرب کوتاه‌زنجیر (بوتیرات) می‌سازند که منبع انرژی سلول‌های روده‌اند، ویتامین K و بخشی از ویتامین‌های B را می‌سازند و در تکامل ایمنی نقش دارند. اشرشیاکلی، رایج‌ترین مدل آزمایشگاهی، ژنومی با ۴٫۶ میلیون جفت باز و چرخه‌ی تقسیم حدود ۲۰ دقیقه دارد.\"],\n[\"ژنوم ویروس‌ها می‌تواند DNA یا RNA، تک‌رشته‌ای یا دورشته‌ای باشد. چرخه‌ی لیتیک ویروس را پس از همانندسازی با تخریب سلول آزاد می‌کند و در چرخه‌ی لیزوژنی (فاژ لامبدا) ژنوم به کروموزوم میزبان می‌پیوندد (پروفاژ) و با هر تقسیم منتقل می‌شود. ویروس HIV رتروویروس است: آنزیم ترانس‌کریپتاز معکوس از RNA، DNA می‌سازد و اینتگراز آن را وارد ژنوم می‌کند و لنفوسیت‌های T کمک‌کننده (CD4⁺) را هدف می‌گیرد.\",\"ویروس‌های دارای ژنوم RNA (مانند آنفلوآنزا) چون RNA پلیمراز آن‌ها تصحیح‌خوانی ندارد، نرخ جهش بالایی دارند. ژنوم آنفلوآنزا قطعه‌قطعه است و در آلودگی هم‌زمان با دو سویه قطعات را عوض می‌کنند (تغییر آنتی‌ژنی بزرگ). پروتئین‌های سطحی هماگلوتینین (H) و نورآمینیداز (N) نام زیرگونه‌ها را تعیین می‌کنند (مثلاً H1N1). ویروس‌ها داروهای اختصاصی دارند، مثل مهارکننده‌های پروتئاز و پلیمراز، ولی آنتی‌بیوتیک‌ها روی ویروس اثر ندارند.\"],\n[\"دیواره‌ی قارچ‌ها از کیتین ساخته شده و غشای آن‌ها به جای کلسترول ارگوسترول دارد؛ داروهای ضدقارچ مانند آزول‌ها ساخت ارگوسترول را مهار می‌کنند. تولید هاگ جنسی و غیرجنسی در قارچ‌ها رایج است و گروه‌های اصلی آن‌ها زیگومیست‌ها، آسکومیست‌ها و بازیدیومیست‌ها هستند. مخمر ساکارومایسس سروزیه در تخمیر الکلی گلوکز را به اتانول و CO₂ تبدیل می‌کند و مدل مهمی برای زیست‌شناسی سلولی است. قارچ‌ها برای هضم، آنزیم را به بیرون ترشح می‌کنند و مواد را جذب می‌کنند.\",\"آغازیان گروهی پارافیلتیک (غیرتک‌نیایی) هستند. پلاسمودیوم مالاریا چرخه‌ای پیچیده در پشه‌ی آنوفل و انسان دارد: اسپوروزوئیت‌ها به کبد و سپس گلبول‌های قرمز می‌روند و تب‌های دوره‌ای را موجب می‌شوند. تریپانوزوما عامل بیماری خواب با تغییر مداوم پروتئین سطحی از ایمنی می‌گریزد. دیاتوم‌ها و جلبک‌های قهوه‌ای در دریا فتوسنتز می‌کنند و بخش مهمی از پلانکتون هستند.\"],\n[\"ایمنی ذاتی با گیرنده‌های شناسایی الگو (مانند Toll-like receptors) الگوهای مولکولی مشترک میکروب‌ها (مثلاً LPS و دیواره‌ی قارچ) را می‌شناسد. نوتروفیل‌ها فراوان‌ترین گلبول‌های سفیدند و با ماکروفاژها بیگانه‌خواری می‌کنند. سیستم کمپلمان گروهی از پروتئین‌های پلاسما است که با آبشار فعال‌شدن میکروب را نشانه‌گذاری یا سوراخ می‌کند. سلول‌های کشنده‌ی طبیعی (NK) سلول‌هایی را می‌کشند که MHC-I ندارند. اینترفرون‌ها حالت ضدویروسی در سلول‌های همسایه ایجاد می‌کنند.\",\"التهاب با ترشح هیستامین از ماست‌سل‌ها آغاز می‌شود که نفوذپذیری رگ را بالا می‌برد؛ سیتوکین‌ها (مانند IL-1 و TNF-α) و پروستاگلاندین‌ها گلبول‌های سفید را فرا می‌خوانند و در مغز نقطه‌ی تنظیم دما را بالا می‌برند (تب). تب سرعت تکثیر بسیاری از میکروب‌ها را کم می‌کند. التهاب مزمن در بیماری‌هایی مانند آترواسکلروز و دیابت نوع ۲ نقش دارد.\"],\n[\"لنفوسیت‌های B دارای گیرنده‌ی سطحی (BCR) و T دارای گیرنده‌ی TCR‌اند و تنوع این گیرنده‌ها از نوترکیبی ژنی V(D)J پدید می‌آید که توانایی شناخت بیش از ۱۰¹⁰ آنتی‌ژن را فراهم می‌کند. سلول‌های عرضه‌کننده‌ی آنتی‌ژن قطعه‌ای از آن را روی MHC-II به T کمک‌کننده (CD4) نشان می‌دهند و سلول‌های آلوده روی MHC-I به T کشنده (CD8). پادتن‌ها (ایمونوگلوبولین‌ها) پنج رده دارند: IgG فراوان‌ترین و از جفت عبور می‌کند، IgA در شیر و اشک، IgM اولین پاسخ، IgE آلرژی و انگل‌ها و IgD گیرنده‌ی B.\",\"انتخاب کلونی: هر لنفوسیت یک گیرنده‌ی اختصاصی دارد و آنتی‌ژن کلون مناسب را انتخاب و تکثیر می‌کند. لنفوسیت‌های خودواکنشگر در تیموس و مغز استخوان حذف می‌شوند (تحمل مرکزی)؛ شکست آن به بیماری‌های خودایمنی مانند دیابت نوع ۱ و ام‌اس می‌انجامد. در پاسخ اولیه ۵ تا ۱۰ روز تا تولید پادتن زمان می‌برد و پاسخ ثانویه ظرف ۱ تا ۳ روز و با مقدار بیشتر و میل ترکیبی بالاتر انجام می‌شود.\"],\n[\"انواع واکسن: زنده‌ی ضعیف‌شده (سرخک، سرخجه)، کشته‌شده (آنفلوآنزای تزریقی)، زیرواحدی/نوترکیب (هپاتیت B)، توکسوئید (کزاز، دیفتری) و mRNA. در واکسن mRNA، mRNA درون نانوذره‌ی لیپیدی وارد سلول می‌شود و ریبوزوم پروتئین (مثلاً سنبله‌ی ویروس) می‌سازد؛ mRNA پس از چند روز تجزیه می‌شود و وارد ژنوم نمی‌شود. ایمنی جمعی وقتی حاصل می‌شود که کسر ایمن جامعه از ۱ − ۱/R₀ بیشتر شود؛ برای سرخک با R₀ حدود ۱۲ تا ۱۸ باید بیش از ۹۲ تا ۹۴ درصد ایمن باشند.\",\"آنتی‌بیوتیک‌ها بر اهداف اختصاصی باکتری اثر دارند: بتالاکتام‌ها (پنی‌سیلین) ساخت دیواره، تتراسایکلین‌ها و ماکرولیدها ریبوزوم ۷۰S، کینولون‌ها آنزیم ژیراز و ریفامپین RNA پلیمراز. مقاومت از جهش، پلاسمید یا آنزیم‌هایی مانند بتالاکتاماز می‌آید؛ MRSA نمونه‌ی مهم است. مصرف نادرست انتخاب سویه‌های مقاوم را تسریع می‌کند و سازمان بهداشت جهانی آن را از تهدیدهای بزرگ سلامت می‌داند.\"]]\n};\n\nS.plant=[\n[\"در ریشه، لایه‌ی درون‌پوست نوار کاسپاری (آغشته به سوبرین) دارد که مسیر آپوپلاستی را می‌بندد و جذب را مجبور به عبور از غشا می‌کند و گزینش یون ایجاد می‌شود. ریشه آب را بر پایه‌ی شیب پتانسیل آب (اسمز) و املاح را با ناقل‌ها و انتقال فعال جذب می‌کند. در ساقه‌ی دولپه‌ای‌ها، کامبیوم آوندساز با تقسیم، چوب ثانویه (به داخل) و آبکش ثانویه (به بیرون) می‌سازد و باعث افزایش ضخامت ساقه می‌شود. تفاوت چوب بهاره و تابستانه حلقه‌های سالانه را می‌سازد.\",\"آوند چوبی از عناصر آوندی مرده با دیواره‌ی لیگنینی (تراکئید و عنصر آوندی) ساخته شده است. آبکش از سلول‌های غربالی زنده با سلول‌های همراه ساخته می‌شود و شیره‌ی پرورده با نظریه‌ی جریان فشاری (مونش) از منبع (برگ، فشار اسمزی زیاد) به مخزن (ریشه، میوه) می‌رود. روزنه با تغییر آماس سلول‌های نگهبان باز می‌شود: ورود پتاسیم و آب با تحریک نور آبی. گیاه بیش از ۹۵ درصد آب جذب‌شده را تعرق می‌کند.\"],\n[\"واکنش‌های نوری: کلروفیل a و b و کاروتنوئیدها نور را جذب می‌کنند (قله‌ی جذب کلروفیل در نور آبی و قرمز و بازتاب سبز). شیب پروتون بین لومن تیلاکوئید و بستره ATP سنتاز را می‌چرخاند (فسفوریلاسیون نوری). جریان الکترون حلقوی فقط ATP می‌سازد. چرخه‌ی کالوین سه مرحله دارد: تثبیت (روبیسکو)، کاهش (با ATP و NADPH) و بازسازی RuBP. روبیسکو کند است (حدود ۳ واکنش بر ثانیه) و برای جبران، مقدار بسیار زیادی از آن در برگ هست.\",\"در فتوتنفس، روبیسکو به جای CO₂ اکسیژن را می‌پذیرد و ترکیب سمی فسفوگلیکولات می‌سازد که با مصرف انرژی بازیافت می‌شود. گیاهان C4 (ذرت، نیشکر) در سلول‌های میانبرگ CO₂ را با آنزیم PEP کربوکسیلاز به ترکیب ۴کربنه تبدیل و در سلول‌های غلاف آوندی آزاد می‌کنند و غلظت CO₂ را کنار روبیسکو بالا می‌برند. در گیاهان CAM تثبیت شبانه و کالوین در روز انجام می‌شود. عوامل محدودکننده: نور، CO₂ و دما (قانون عوامل محدودکننده‌ی بلک‌من).\"],\n[\"چرخه‌ی زندگی گیاهان تناوب نسل دارد: اسپوروفیت دیپلوئید با میوز هاگ هاپلوئید می‌سازد و هاگ به گامتوفیت هاپلوئید می‌رسد که با میتوز گامت می‌سازد. در خزه‌ها گامتوفیت غالب است و در بقیه اسپوروفیت. سرخس‌ها لقاح وابسته به آب دارند. بازدانگان گرده‌ی بادی و دانه‌ی لخت (مانند کاج و سرو) دارند. نهان‌دانگان گل، میوه و لقاح مضاعف دارند و حدود ۹۰ درصد گونه‌های گیاهی خشکی‌اند.\",\"تک‌لپه‌ای‌ها یک لپه، برگ با رگبرگ موازی، گلبرگ‌ها در مضرب ۳، ریشه‌ی افشان و دسته‌های آوندی پراکنده در ساقه دارند. دولپه‌ای‌ها دو لپه، رگبرگ شبکه‌ای، گلبرگ‌ها مضرب ۴ یا ۵، ریشه‌ی راست و دسته‌های آوندی حلقه‌وار دارند. فناوری DNA نشان داد این گروه‌بندی کاملاً تکاملی نیست و بسیاری از دولپه‌ای‌های قدیمی گروه جداگانه‌اند.\"],\n[\"در بساک، سلول مادر گرده با میوز چهار هاگ نر می‌دهد و هر دانه‌ی گرده دو سلول دارد (رویشی و زایشی). در تخمک، کیسه‌ی رویانی هفت‌سلولی هشت‌هسته‌ای است: تخمزا، دو هم‌یار، سه پادپا و یک سلول مرکزی با دو هسته‌ی قطبی. لقاح مضاعف: یک اسپرم با تخمزا زیگوت دیپلوئید و اسپرم دیگر با دو هسته‌ی قطبی درون‌دانه‌ی سه‌لاد (3n) می‌سازد که ذخیره‌ی غذایی است. دانه پس از رسیدن، با جذب آب و جیبرلین جوانه می‌زند.\",\"خودناسازگاری از خودلقاحی جلوگیری می‌کند و ژن‌های S کلاله دانه‌ی گرده‌ی هم‌ژن را رد می‌کنند. تکثیر رویشی (پیوند و قلمه) با میتوز نتایج یکسان می‌دهد. میوه از دیواره‌ی تخمدان (و گاهی بخش‌های دیگر گل) ساخته می‌شود و با گوشتی بودن یا بالدار بودن به پراکنش کمک می‌کند. گرده‌افشانی در بعضی گیاهان با یک حشره‌ی ویژه هم‌تکاملی دارد.\"],\n[\"اکسین (ایندول‌استیک‌اسید) در نوک ساقه ساخته می‌شود و با ناقل‌های PIN به صورت قطبی جابه‌جا می‌شود. نظریه‌ی اسیدی رشد: اکسین پمپ پروتون را فعال می‌کند، pH دیواره پایین می‌آید و دیواره سست می‌شود و آب وارد می‌شود. غلظت زیاد اکسین ریشه را کند می‌کند و بالا بودن اکسین در نوک از رشد جوانه‌های جانبی جلوگیری می‌کند (چیرگی رأسی)، که با سیتوکینین خنثی می‌شود. علف‌کش 2,4-D شبه‌اکسینی است.\",\"جیبرلین آلفا-آمیلاز را در لایه‌ی آلورون القا می‌کند تا نشاسته‌ی دانه هضم شود. آبسزیک‌اسید خواب دانه را حفظ و روزنه را در کم‌آبی می‌بندد. اتیلن (C₂H₄) رسیدن، ریزش برگ و پاسخ به آسیب را تنظیم می‌کند. فیتوکروم گیرنده‌ی نور قرمز و قرمز دور است و گل‌دهی را متناسب با طول شب (گیاهان روز کوتاه و روز بلند) کنترل می‌کند. در واقع گیاه طول شب را می‌سنجد، نه روز.\"],\n[\"بسیاری از بیابان‌زیان اتلاف آب را با کوتیکول ضخیم، روزنه‌های فرورفته و برگ کاهش‌یافته کم می‌کنند. گیاهان CAM با پروتئین PEPC شب CO₂ را به مالات تبدیل و در واکوئل ذخیره می‌کنند. نمک‌دوست‌ها غدد دفع نمک دارند. در گیاهان آبزی، آئرانشیم هوا را به ریشه می‌رساند. تیره‌ی نخود با ریزوبیوم گره‌های ریشه‌ای می‌سازد که آنزیم نیتروژناز آن N₂ را به آمونیاک تبدیل می‌کند (واکنشی پرمصرف از نظر انرژی که اکسیژن آن را مهار می‌کند)؛ لگ‌هموگلوبین اکسیژن را در گره کنترل می‌کند.\",\"گیاهان گوشتخوار (ونوس مگس‌خوار، نپنتس) نیتروژن و فسفر را از طعمه می‌گیرند و فتوسنتز را حفظ می‌کنند. دام ونوس با تحریک دو بار پیاپی موی حسی (ظرف حدود ۲۰ ثانیه) بسته می‌شود. میکوریز ۸۰ تا ۹۰ درصد گیاهان را در برمی‌گیرد و قارچ برای فسفر و آب، قند می‌گیرد. دفاع شیمیایی گیاهان مثل آلکالوئیدها (نیکوتین، کافئین)، ترپن‌ها و فنل‌ها منبع برخی داروهای بشرند.\"]];\n\nS.anim=[\n[\"بی‌مهرگان بر اساس تقارن، حفره‌ی بدن و رشد جنینی رده‌بندی می‌شوند. نخستین‌دهانان (پروتوستوم) مانند نرم‌تنان و بندپایان دهان را از منفذ جنینی می‌سازند و دومین‌دهانان (دوترواستوم) مثل خارپوستان و طنابداران دهان را از منفذ دیگر. بندپایان اسکلت بیرونی کیتینی دارند که با پوست‌اندازی (انسلاخ) رشد می‌کند و سامانه‌ی گردش باز با همولنف و تنفس تراشه‌ای (نای‌چه‌ای) در حشرات دارند. نرم‌تنان مانتو و پا دارند و سرپایان (هشت‌پا و ماهی مرکب) گردش خون بسته‌ی سه‌قلبی دارند.\",\"اسفنج‌ها سلول‌های یقه‌دار (کوآنوسیت) دارند که با تاژک آب را عبور می‌دهند و غذا می‌گیرند. کیسه‌تنان (مانند مرجان‌ها و عروس دریایی) سلول‌های نیش‌زن (کنیدوسیت) و دو شکل بدنی پولیپ و مدوز دارند. کرم‌های پهن (پلاناریا) گوارش ناکامل و حلقوی‌ها (کرم خاکی) سامانه‌ی گردش بسته و نفریدی دارند. خارپوستان سامانه‌ی آب‌گردی (پای لوله‌ای) برای حرکت و قدرت بازسازی بالا دارند.\"],\n[\"مهره‌داران طناب پشتی را در جنین دارند که بعدها جای خود را به ستون مهره می‌دهد. سامانه‌ی گردش: ماهی (قلب دوحفره‌ای، یک مدار)، دوزیستان (سه‌حفره‌ای)، خزندگان (بیشتر سه‌حفره‌ای با دیواره‌ی ناقص؛ تمساح‌ها چهارحفره‌ای) و پرندگان و پستانداران (چهارحفره‌ای، دو مدار جدا) که اکسیژن‌رسانی کارآمدتری برای خون‌گرمی فراهم می‌کند. ماهی استخوانی مثانه‌ی شنا و خط جانبی دارد.\",\"تخم آمنیوتی چهار پرده دارد: آمنیون، کوریون، کیسه‌ی زرده و آلانتوئیس؛ آمنیون محیط آبی کوچکی برای جنین می‌سازد. پرندگان کیسه‌های هوایی دارند که جریان یک‌طرفه‌ی هوا را در ریه‌ها تأمین می‌کند. پستانداران با جفت (در جفت‌داران)، کیسه‌داران با نوزاد نارس در کیسه، و تک‌منفذیان (نوک‌اردکی) با تخم‌گذاری تکثیر می‌شوند. دمای بدن پستانداران حدود ۳۷ تا ۳۹ درجه است و عایق مو و چربی دارد.\"],\n[\"لقاح در حیوانات با واکنش آکروزومی همراه است که آنزیم‌ها لایه‌ی بیرونی تخمک را می‌شکنند و سپس واکنش قشری مانع ورود اسپرم دوم می‌شود. شیارشدن (کلیواژ) تقسیمات سریع میتوزی بدون رشد کلی است و بلاستولا از آن پدید می‌آید. گاسترولاسیون با حرکت سلول‌ها سه لایه‌ی اکتودرم (پوست، عصب)، مزودرم (ماهیچه، استخوان، گردش خون) و آندودرم (لوله‌ی گوارش و غدد) می‌سازد. القای جنینی و ژن‌های Hox ساختار محور سر-دم را مشخص می‌کنند.\",\"دگردیسی در حشرات کامل (تخم، لارو، شفیره، بالغ مانند پروانه) و ناقص (پوره مانند ملخ) است و با هورمون‌های اکدیزون و هورمون جوانی کنترل می‌شود. در قورباغه، هورمون تیروکسین دگردیسی را راه می‌اندازد. بعضی جانوران مانند سخت‌پوستان و ستاره‌ی دریایی بازسازی عضو دارند. تولیدمثل بکرزایی در زنبور (نر از تخم بارورنشده) و برخی مارمولک‌ها رایج است.\"],\n[\"در شتر کلیه ادرار بسیار غلیظ می‌سازد، دمای بدن در روز تا ۶ درجه بالا می‌رود تا تعریق نکند، و گلبول قرمز بیضوی آن هنگام نوشیدن ناگهانی آب فراوان تا چند برابر متورم می‌شود ولی نمی‌ترکد. خفاش با فرکانس ۲۰ تا ۲۰۰ کیلوهرتز صوت می‌فرستد و فاصله و جهت را از تأخیر پژواک تشخیص می‌دهد. پروتئین ضدیخ در ماهی‌های قطبی تشکیل بلور یخ را مهار می‌کند. سم دارت‌فراگ (آلکالوئید باتراکوتوکسین) با باز نگه داشتن کانال‌های سدیمی عصب و ماهیچه را فلج می‌کند. آفتاب‌پرست با تغییر ساختار نانوبلورهای گوانین در سلول‌های پوست رنگ را عوض می‌کند.\",\"خواب زمستانی با کاهش شدید سوخت‌وساز، ضربان قلب و دما همراه است و بدن از چربی قهوه‌ای و ذخایر استفاده می‌کند. خرس هنگام خواب زمستانی بدون خوردن و ادرار، اوره را بازیافت می‌کند. این مثال‌ها یادآور این‌اند که سازگاری الزاماً کامل نیست و محصول سازش تکاملی است.\"],\n[\"عصب‌شناسی: نورون‌ها با سیناپس‌های الکتریکی (اتصال شکافی) یا شیمیایی ارتباط می‌گیرند. از شبکه‌ی عصبی پخشی هیدر (کیسه‌تنان) تا سامانه‌ی عصبی مرکزی با مغز در مهره‌داران تکامل یافته است. در حشرات، گانگلیون‌های سر مغز را می‌سازند و طناب عصبی شکمی است. در پستانداران، قشر مخ شیارداری بیشتر و سطح بزرگ‌تری دارد. عدسی چشم مهره‌داران تصویر را روی شبکیه با گیرنده‌های استوانه‌ای (نور کم) و مخروطی (رنگ) متمرکز می‌کند.\",\"اندام‌های حسی ویژه: دماسنج‌های مادون‌قرمز در مار زنگی، مغناطیس‌گیرها در پرندگان (کریپتوکروم)، خط جانبی ماهی برای ارتعاش آب و گیرنده‌ی الکتریکی در کوسه و پلاتیپوس. زنبور عسل رنگ فرابنفش را می‌بیند و نور قطبیده را حس می‌کند. حافظه و یادگیری با تقویت درازمدت (LTP) در سیناپس‌ها رخ می‌دهد.\"],\n[\"همزیستی انواع دارد. مفیدزیستی: باکتری‌های روده‌ی نشخوارکنندگان سلولز را تخمیر می‌کنند و ترمیت‌ها پروتیست‌های سلولزخوار دارند. مرجان و جلبک همزیست (زوکسانتلا) قند می‌دهند و مرجان پناه و مواد معدنی؛ اگر دما بالا رود جلبک از دست می‌رود و مرجان سفید می‌شود. شکارگری و دفاع باعث هم‌تکاملی می‌شود: رقابت تسلیحاتی بین شکارچی و شکار. تقلید بتسی (طعمه‌ی بی‌ضرر شبیه جانور سمی) و تقلید مولر (چند گونه‌ی سمی شبیه هم) نمونه‌اند.\",\"انگل‌های درونی مانند کرم کدو و کرم کیست آبدار (اکینوکوک) چرخه‌های پیچیده با چند میزبان دارند. برخی انگل‌ها رفتار میزبان را دستکاری می‌کنند؛ مثلاً توکسوپلاسما موش را از بوی گربه نمی‌ترساند. انگل اجتماعی (انگل لانه‌ای) مانند فاخته که تخم خود را در لانه‌ی گونه‌ی دیگر می‌گذارد. مفهوم گونه‌ی کلیدی: گونه‌ای که تأثیرش بر بوم‌سازگان از فراوانی آن بیشتر است، مثل ستاره‌ی دریایی پیسستر یا سمور دریایی.\"]];\n\nS.human=[\n[\"قلب با سلول‌های ضربان‌ساز (گره‌ی سینوسی-دهلیزی SA) خودکار ضربان می‌سازد: SA حدود ۶۰ تا ۱۰۰ بار در دقیقه، پیام به گره‌ی دهلیزی-بطنی (AV)، دسته‌ی هیس و رشته‌های پورکنژ می‌رسد. دریچه‌های دولتی (میترال) و سه‌لتی بین دهلیز و بطن و دریچه‌های سیگموئید (آئورتی و ریوی) هستند؛ صدای «لَب‌دَپ» قلب بسته‌شدن آن‌هاست. برون‌ده‌ی قلبی = ضربان × حجم ضربه‌ای ≈ ۷۰ × ۷۰ = حدود ۵ لیتر در دقیقه. فشار خون عادی ۱۲۰/۸۰ میلی‌متر جیوه است.\",\"خون حدود ۵۵ درصد پلاسما (۹۰٪ آب) و ۴۵ درصد سلول دارد. گلبول قرمز بالغ هسته ندارد، عمر ۱۲۰ روز دارد و در مغز استخوان با هورمون اریتروپویتین (از کلیه) تولید می‌شود. هر هموگلوبین چهار هم دارد و هر گلبول حدود ۲۷۰ میلیون هموگلوبین. لخته‌شدن: پلاکت‌ها گرد هم می‌آیند، آبشار انعقاد فیبرینوژن را به فیبرین تبدیل می‌کند. گروه Rh و ناسازگاری مادر-جنین مثال مهم ایمونولوژی خون است.\"],\n[\"مسیر هوا: بینی، حلق، حنجره، نای، نایژه‌ها و نایژک‌ها تا آلوئول‌ها (حدود ۳۰۰ میلیون، مساحت تبادل ۷۰ تا ۱۰۰ متر مربع). سورفاکتانت (فسفولیپید و پروتئین) تنش سطحی را کم می‌کند تا آلوئول‌ها فرو نریزند؛ کمبود آن در نوزادان نارس سندروم زجر تنفسی می‌دهد. تهویه با اختلاف فشار انجام می‌شود (قانون بویل): دم یعنی انقباض دیافراگم و ماهیچه‌های بین‌دنده‌ای و افزایش حجم قفسه. ظرفیت حیاتی حدود ۴ تا ۵ لیتر است.\",\"تبادل گاز با اختلاف فشار جزئی انجام می‌شود. O₂ در خون ۹۸ درصد به هموگلوبین (اشباع) و CO₂ ۷۰ درصد به صورت بی‌کربنات (با آنزیم کربنیک‌انیدراز)، ۲۳ درصد به هموگلوبین و ۷ درصد محلول حمل می‌شود. منحنی تفکیک اکسیژن S شکل است و با افزایش دما یا اسیدیته به راست می‌رود. مونوکسید کربن میل ترکیبی ~۲۰۰ برابر بیشتر از O₂ با هموگلوبین دارد و کشنده است. مرکز تنفس در بصل‌النخاع به CO₂ و pH خون پاسخ می‌دهد.\"],\n[\"دهان: آمیلاز بزاق نشاسته را به مالتوز می‌شکند. معده با ترشح HCl (pH حدود ۲) و پپسینوژن (که پپسین می‌شود) پروتئین را آغاز به هضم می‌کند و مخاط ضخیم و بی‌کربنات از دیواره محافظت می‌کند. در دوازدهه، صفرا چربی را امولسیون می‌کند، آنزیم‌های لوزالمعده (تریپسین، کیموتریپسین، لیپاز، آمیلاز) وارد می‌شوند و بی‌کربنات pH را بالا می‌برد. آنزیم‌های حاشیه‌ی مسواکی (لاکتاز، مالتاز، سوکراز) هضم را کامل می‌کنند.\",\"روده‌ی باریک (۶ متر) با چین‌ها، پرزها و ریزپرزها مساحتی حدود ۳۰ متر مربع (برآوردهای قدیمی‌تر تا ۲۰۰ هم گفته‌اند) دارد. آمینواسیدها و گلوکز با انتقال فعال ثانویه و چربی‌ها به صورت شیلومیکرون وارد لنف می‌شوند. ویتامین B12 به فاکتور داخلی نیاز دارد. روده‌ی بزرگ آب و الکترولیت جذب می‌کند و میکروبیوم آن ویتامین K می‌سازد. کنترل هورمونی: گاسترین (ترشح معده)، سکرتین (بی‌کربنات) و کوله‌سیستوکینین (صفرا و آنزیم).\"],\n[\"پتانسیل استراحت حدود منفی ۷۰ میلی‌ولت است (پمپ سدیم-پتاسیم و کانال‌های نشتی پتاسیم). با رسیدن به آستانه (حدود منفی ۵۵ میلی‌ولت) کانال‌های سدیمی ولتاژی باز و سدیم وارد می‌شود (دپلاریزاسیون تا +۳۰)، سپس کانال‌های پتاسیمی باز می‌شوند (رپلاریزاسیون) و دوره‌ی ناپاسخی مانع برگشت پیام می‌شود. در آکسون‌های میلین‌دار (سلول‌های شوان و الیگودندروسیت) جهش نمکی با سرعت تا ۱۲۰ متر بر ثانیه رخ می‌دهد. ام‌اس ناشی از تخریب میلین است.\",\"در سیناپس شیمیایی، ورود کلسیم وزیکول‌ها را همجوش می‌کند و ناقل (استیل‌کولین، گلوتامات، گابا، دوپامین، سروتونین) به گیرنده‌ی پس‌سیناپسی می‌رسد و پتانسیل تحریکی یا مهاری می‌سازد؛ جمع‌شدن مکانی و زمانی تصمیم شلیک را می‌گیرد. دستگاه عصبی خودمختار: هم‌حس (جنگ یا گریز، نوراپی‌نفرین) و پادهم‌حس (استراحت و گوارش، استیل‌کولین). مغز ۲ درصد وزن بدن را دارد ولی حدود ۲۰ درصد انرژی مصرف می‌کند.\"],\n[\"هیپوتالاموس هورمون‌های آزادکننده‌ی هیپوفیز را کنترل می‌کند. هیپوفیز پیشین هورمون رشد (GH)، TSH، ACTH، پرولاکتین، FSH و LH را و هیپوفیز پسین اکسی‌توسین و ADH (ساخته‌شده در هیپوتالاموس) را آزاد می‌کند. تیروئید T3 و T4 (حاوی ید) را می‌سازد و کمبود ید یا کم‌کاری با ورم غده (گواتر) نمایان می‌شود. پاراتیروئید با PTH کلسیم خون را بالا می‌برد و کلسی‌تونین آن را کم می‌کند. کورتیزول آدرنال استرس بلندمدت و قند را تنظیم می‌کند.\",\"هورمون‌های پپتیدی با گیرنده‌ی غشایی و پیک ثانویه (cAMP) و هورمون‌های استروئیدی و تیروئیدی با گیرنده‌ی درون‌سلولی بیان ژن را تغییر می‌دهند. انسولین (سلول‌های β) ورود گلوکز و ذخیره‌ی گلیکوژن را زیاد می‌کند؛ در دیابت نوع ۱ سلول‌های β توسط ایمنی نابود می‌شوند و در نوع ۲ مقاومت به انسولین وجود دارد. نشانه‌ها: پرنوشی، پرادراری و قند خون ناشتای بالای ۱۲۶ میلی‌گرم بر دسی‌لیتر.\"],\n[\"کلیه‌ها حدود ۲۰ تا ۲۵ درصد برون‌ده‌ی قلبی را دریافت می‌کنند و حدود ۱۸۰ لیتر مایع در روز صاف می‌کنند که تنها حدود ۱٫۵ لیتر ادرار می‌شود. فیلتراسیون در گلومرول (فشار خون)، بازجذب در لوله‌ی پیچ‌خورده‌ی نزدیک (۶۵٪ آب و سدیم، همه‌ی گلوکز و آمینواسید)، قوس هنله (افزایش غلظت اسمزی با سازوکار ضدجریان)، لوله‌ی پیچ‌خورده‌ی دور و مجرای جمع‌کننده (تنظیم با ADH و آلدوسترون). ترشح یون هیدروژن و پتاسیم و داروها در لوله‌ها رخ می‌دهد.\",\"سامانه‌ی رنین-آنژیوتانسین-آلدوسترون در افت فشار فعال می‌شود: آنژیوتانسین II رگ را تنگ و آلدوسترون سدیم و آب را حفظ می‌کند. کلیه اریتروپویتین، کلسیتریول (ویتامین D فعال) و رنین می‌سازد. سنگ کلیه از بلورهای کلسیم اگزالات و اسید اوریک است. نارسایی کلیه میزان فیلتراسیون گلومرولی (GFR) را کم می‌کند و با کراتینین خون تشخیص داده می‌شود.\"],\n[\"استخوان از ماتریس معدنی (هیدروکسی‌آپاتیت کلسیم فسفات) و کلاژن ساخته شده است. سلول‌های استخوان‌ساز (استئوبلاست)، استخوان‌خوار (استئوکلاست) و استئوسیت بازسازی را انجام می‌دهند؛ هورمون پاراتیروئید و ویتامین D کلسیم را تنظیم می‌کنند. پوکی استخوان با افت تراکم همراه است. مفصل‌های متحرک مایع سینوویال و غضروف دارند. مغز استخوان قرمز خون می‌سازد.\",\"ساختار ماهیچه: تار ماهیچه ← میوفیبریل ← سارکومر (واحد انقباض بین دو خط Z). در انقباض (نظریه‌ی رشته‌های لغزان) سرهای میوزین به اکتین می‌چسبند و با مصرف ATP می‌کشند؛ در لحظه‌ی استراحت تروپونین و تروپومیوزین مانع‌اند و ورود Ca²⁺ از شبکه‌ی سارکوپلاسمی آن را برمی‌دارد. انرژی: کراتین‌فسفات، گلیکولیز بی‌هوازی (لاکتات) و تنفس هوازی؛ تارهای کند (هوازی، ماراتن) و تند (بی‌هوازی، دوی سرعت).\"]];\n\nS.beh=[\n[\"لورنز و تینبرگن رفتار را با «الگوی عمل ثابت» (FAP) و «محرک نشانه‌ای» تعریف کردند؛ مثل پاسخ جوجه‌ی مرغ دریایی نقره‌ای به نقطه‌ی قرمز منقار مادر. یادگیری با عادی‌شدن (حذف پاسخ به محرک بی‌اهمیت)، شرطی‌شدن کلاسیک (پاولوف: محرک شرطی + غیرشرطی ← پاسخ)، شرطی‌شدن فعال (اسکینر: پاداش و تنبیه) و یادگیری مشاهده‌ای انجام می‌شود. نقش‌پذیری در دوره‌ی حساس رخ می‌دهد و بعدها تقریباً برگشت‌ناپذیر است.\",\"بحث طبیعت در برابر تربیت امروز یک اثر متقابل می‌داند؛ آواز پرندگان آوازخوان گرایش ذاتی عمومی دارد، اما لهجه‌ی محلی را از همنوعان (مثلاً پدر) می‌آموزند. در مغز، قشر و هیپوکامپ حافظه را می‌سازند، و دوپامین در سامانه‌ی پاداش، تقویت را انجام می‌دهد. شامپانزه‌ها با شاخه از لانه‌ی موریانه شکار می‌کنند و فرهنگ ابزار در گروه‌ها فرق دارد.\"],\n[\"ارتباط شیمیایی با فرومون‌ها طولانی‌ترین اثر را دارد: پروانه‌ی نر ابریشم مولکول بومبیکول ماده را از چند کیلومتر حس می‌کند. ارتباط شنیداری در جیرجیرک و قورباغه و پرندگان برای جلب جفت و قلمرو است. رقص زنبور (کارل فون فریش، نوبل ۱۹۷۳): رقص حلقوی برای منبع نزدیک و رقص نوسانی هشت‌شکل برای دور؛ زاویه‌ی رقص نسبت به عمود، زاویه‌ی منبع غذا نسبت به خورشید را و مدت رقص فاصله را می‌گوید.\",\"پیام درست باید صادق یا قابل اعتماد باشد، وگرنه دریافت‌کننده آن را نادیده می‌گیرد. در تقلید، ارتباط فریبنده هم هست؛ مثلاً ماده‌ی کرم شب‌تاب فوتوریس نور جفت‌یابی گونه‌ی دیگر را تقلید می‌کند و نر آن را شکار می‌کند. رقابت سیگنال‌ها در محیط پرسروصدا باعث تغییر فرکانس آواز می‌شود، مانند پرندگان شهری.\"],\n[\"مهاجرت با ساعت زیستی و سرنخ‌های محیطی (طول روز) و هورمون‌ها شروع می‌شود. لاک‌پشت دریایی میدان مغناطیسی (شیب و شدت) را به عنوان نقشه‌ی مغناطیسی به کار می‌برد. پرندگان از خورشید، ستاره‌ها و کریپتوکروم چشم برای حس میدان استفاده می‌کنند. ماهی آزاد با بوی رودخانه‌ی زادگاه بازمی‌گردد. شاه‌پروانه طی چند نسل حدود ۴۰۰۰ کیلومتر مهاجرت می‌کند.\",\"ساعت شبانه‌روزی در پستانداران در هسته‌ی سوپراکیاسماتیک هیپوتالاموس است و با ژن‌های ساعتی (PER و CLOCK) حلقه‌ی پسخورد حدود ۲۴ ساعته می‌سازد. گیرنده‌های نور (ملانوپسین) در شبکیه آن را با روشنایی هماهنگ می‌کنند. هورمون ملاتونین شب آزاد می‌شود. جت‌لگ و کار شبانه این ساعت را به هم می‌زنند.\"],\n[\"قانون همیلتون: ژن ایثار وقتی گسترش می‌یابد که rB > C (r ضریب خویشاوندی، B سود گیرنده و C هزینه‌ی کنشگر). در زنبور و مورچه به دلیل هاپلودیپلوئیدی، خواهران ۷۵٪ ژن مشترک دارند و نازایی کارگر توجیه می‌شود. دلیل دیگر ایثار دوجانبه است (خفاش خون‌آشام که غذا به هم‌لانه‌ای گرسنه می‌دهد). موش‌خلد برهنه جامعه‌ای با ملکه دارد و از معدود پستانداران دارای این الگو (یوسوسیالیته) است.\",\"اجتماعی بودن سودها و هزینه‌هایی دارد: دفاع بیشتر، شکار گروهی، اما رقابت و انتقال بیماری. سلسله‌مراتب با رقابت ایجاد می‌شود تا درگیری کم شود (مثلاً سلسله‌مراتب نوک‌زدن در مرغ). همکاری در تربیت فرزند (فیل‌ها و برخی پرندگان) و آموزش (مانند میرکت‌ها و شیرها) رخ می‌دهد.\"],\n[\"در نظریه‌ی تریورز، جنسی که هزینه‌ی والدگری بیشتر دارد (معمولاً ماده) گزینش‌گرتر است و جنس دیگر برای دسترسی رقابت می‌کند. دم طاووس نمونه‌ی «اصل ناتوانی» زاهاوی است: نشان می‌دهد صاحبش با وجود آن زنده مانده است. انتخاب جنسی دو نوع دارد: رقابت درون‌جنسی (شاخ گوزن) و انتخاب جنس مخالف (دم طاووس). در برخی گونه‌ها نقش جنسی برعکس است، مانند اسب دریایی که نر آبستن می‌شود.\",\"سیستم‌های جفت‌گیری: تک‌همسری (بیشتر پرندگان)، چندهمسری و چندشوهری. قلمروخواهی منابع را حفظ می‌کند. مراقبت والدینی هزینه‌ی تولیدمثل آینده را بالا می‌برد. برخی نرها تاکتیک «دزد» دارند و بدون نمایش جفت می‌گیرند؛ اسپرم‌ها هم رقابت می‌کنند (رقابت اسپرمی).\"]];\n\nS.evo=[\n[\"داروین با «تبار با تغییر» و والاس مستقل از او انتخاب طبیعی را مطرح کردند. مدل ریاضی: تغییر فراوانی اَلل در یک نسل Δp ≈ s·p·q/w̄ (در ساده‌ترین حالت) به ضریب انتخاب (s) و فراوانی اَلل‌ها بستگی دارد؛ شایستگی نسبی (w) میانگین تعداد نوادگان زنده‌مانده است. انتخاب سه شکل دارد: جهت‌دار (یک انتها)، پایدارکننده (میانه، مثل وزن زمان تولد انسان) و گسسته‌کننده (دو انتها، مثل منقار سهره‌ی آفریقایی). پروانه‌ی فلفلی (Biston betularia) نمونه‌ی کلاسیک انتخاب جهت‌دار در دوره‌ی انقلاب صنعتی است.\",\"شایستگی فراگیر (همیلتون) شامل فرزندان و خویشاوندان است. انتخاب ممکن است بر ژن‌ها، افراد یا گروه‌ها اثر کند ولی تغییر تکاملی همیشه در سطح فراوانی اَلل جمعیت اندازه‌گیری می‌شود. انتخاب فشرده‌ی ناشی از انسان (انتخاب مصنوعی) در گیاهان و دام‌ها نمونه‌های روشنی دارد: ذرت از گیاه تئوسینت و سگ از گرگ. مثال مستند: ظهور مقاومت HIV و باکتری‌ها به دارو در طول چند سال.\"],\n[\"فسیل‌ها با پرتوسنجی (کربن ۱۴ تا ۵۰ هزار سال، اورانیوم-سرب تا میلیاردها سال) تاریخ‌گذاری می‌شوند. جانوران گذار: تیکتالیک (۳۷۵ میلیون سال، ماهی با گردن و استخوان بازو)، آرکئوپتریکس (پر و دندان)، و فسیل‌های نهنگ‌های دوزیست (پاکیستوس، آمبولوسه‌توس). همولوژی از ساختار پایه‌ی اندام پنج‌انگشتی تا ژن‌های Hox مشترک؛ ساختارهای هم‌کارکرد (آنالوژی) مانند بال پرنده و حشره از تکامل همگرا هستند.\",\"شواهد مولکولی: کد ژنتیک جهانی است و ژن‌های ترمیم و ریبوزومی حفاظت‌شده‌اند. انسان ژن ویتامین C (GULO) را به شکل شبه‌ژن غیرفعال دارد؛ این ژن در نخستی‌های هم‌خانواده هم همان جهش را دارد. کروموزوم ۲ انسان از جوش‌خوردن دو کروموزوم نیای شامپانزه‌مانند پدید آمده (۲۳ جفت در برابر ۲۴). شواهد زیست‌جغرافیایی: بیشتر پستانداران استرالیا کیسه‌دارند و جانوران جزیره‌ها اغلب بومی‌اند.\"],\n[\"مفهوم‌های گونه‌زایی: دگرمیهنی (پس از جدایی جغرافیایی)، هم‌میهنی و پیرامیهنی (در حاشیه‌ی دو جمعیت). سدهای پیش از لقاح: جدایی زیستگاه، زمان، رفتار، مکانیکی و گامتی. سدهای پس از لقاح: مرگ دورگه، نازایی (قاطر) و فروپاشی دورگه. چندلادی در گیاهان (افزایش شمار مجموعه‌های کروموزومی، اغلب پس از دورگه‌گیری) گونه‌ی جدید را در یک نسل می‌سازد؛ گندم نان شش‌لاد (۲n=۴۲) از سه گونه‌ی نیا است.\",\"تابش سازشی: سیکلیدهای دریاچه‌ی ویکتوریا حدود ۵۰۰ گونه را در کمتر از ۱۵ هزار سال ساخت. سهره‌های داروین (۱۸ گونه) در جزایر گالاپاگوس طول و ضخامت منقار را مطابق غذا تغییر دادند و پیتر و رزمری گرانت اندازه‌ی منقار را در خشکسالی ۱۹۷۷ در حال تغییر دیدند. منطقه‌ی دورگه‌ی میان دو گونه‌ی نزدیک جاهایی است که تقویت سد تولیدمثلی را می‌توان مطالعه کرد.\"],\n[\"هاردی-واینبرگ: p + q = ۱ و p² + 2pq + q² = ۱. اگر ۱ نفر از ۱۰۰۰۰ مبتلا به بیماری نهفته باشد، q² = ۰٫۰۰۰۱، q = ۰٫۰۱ و بسامد ناقلان ۲pq ≈ ۲ درصد است. پنج عامل تغییر: رانش، جریان ژن، جهش، آمیزش غیرتصادفی و انتخاب. رانش در جمعیت کوچک شدیدتر است و به تثبیت یا حذف اَلل می‌انجامد. اثر بنیان‌گذار: بسامد زیاد برخی بیماری‌ها در جمعیت‌های منزوی (مثلاً بیماری هانتینگتون در دریاچه‌ی ماراکایبو).\",\"اثر بطری: چیتا (یوزپلنگ) در ۱۰ هزار سال پیش گلوگاه جمعیتی شدیدی داشته و تنوع ژنتیکی بسیار کم است (پیوند پوست بین افراد پس نمی‌خورد). جهش منبع نهایی تنوع است ولی بیشتر جهش‌ها خنثی یا زیان‌بارند (نظریه‌ی خنثی کیمورا). جریان ژن جمعیت‌ها را همگن می‌کند و جدایی جغرافیایی آن را قطع می‌کند. «آمیزش هم‌تبار» بسامد هموزیگوت را افزایش می‌دهد و بیماری‌های نهفته را آشکار می‌کند.\"],\n[\"شاخه‌ی هومینین‌ها از حدود ۶ تا ۷ میلیون سال پیش از شامپانزه‌ها جدا شد (ساحلانتروپوس، اوررین). استرالوپیتکوس آفارنسیس (لوسی، ۳٫۲ میلیون سال) دوپا و دارای حجم مغز حدود ۴۵۰ سانتی‌مترمکعب بود. هومو هابیلیس ابزار سنگی ساخت (حدود ۲ میلیون سال)، هومو اِرکتوس (حجم مغز ۸۵۰ تا ۱۱۰۰) آتش‌افروزی و مهاجرت از آفریقا و هومو ساپینس ۳۰۰ هزار سال پیش (جبل ایرهود در مراکش) پدید آمد؛ حجم مغز ما حدود ۱۳۵۰ است.\",\"تحلیل DNA باستانی نشان داده انسان‌های غیرآفریقایی ۱ تا ۲ درصد DNA نئاندرتال و برخی جمعیت‌های اقیانوسیه ۳ تا ۶ درصد DNA دنیسووایی دارند. تنوع ژنتیکی در آفریقا از سایر قاره‌ها بیشتر است و این با مهاجرت از آفریقا و اثر بنیان‌گذار سازگار است. تکامل انسان خطی نیست و چندین گونه هم‌زمان می‌زیستند. در ایران، غارهای بیستون و وزمه شواهدی از ابزار موسترین (نئاندرتال‌ها) دارند.\"],\n[\"فیلوژنی با روش‌هایی مانند بیشینه‌ی امساک (کمترین تغییر)، بیشینه‌ی درست‌نمایی و بیزین، بر پایه‌ی ویژگی‌های ریخت‌شناسی یا توالی DNA ساخته می‌شود. ویژگی‌های مشترک مشتق‌شده (سین‌آپومورفی) کلاد را تعریف می‌کنند. تک‌تباری (monophyly) یعنی نیا و همه‌ی نوادگان؛ ماهی‌ها و خزندگان به معنای سنتی گروه‌هایی نایک‌تبار (پارافیلتیک)اند چون پرندگان از خزندگان و چهارپایان از ماهی‌ها آمده‌اند.\",\"ساعت مولکولی بر پایه‌ی نرخ نسبتاً ثابت جهش‌های خنثی زمان انشعاب را برآورد می‌کند و با فسیل‌ها کالیبره می‌شود. انتقال افقی ژن در باکتری‌ها درخت را شبکه‌ای می‌کند. نظریه‌ی درون‌همزیستی نشان می‌دهد برخی شاخه‌ها (یوکاریوت) از ادغام شاخه‌ها پدید آمده‌اند. بر پایه‌ی پژوهش‌های اخیر، LUCA (آخرین نیای مشترک جهانی) حدود ۳٫۵ تا ۴٫۲ میلیارد سال پیش می‌زیسته است.\"]];\n\nS.tax=[\n[\"کارل ووز با مقایسه‌ی توالی ۱۶S/۱۸S rRNA سه قلمرو را پیشنهاد کرد (۱۹۹۰). آرکی‌ها ریبوزوم و ماشین رونویسی شبیه یوکاریوت (RNA پلیمراز پیچیده، هیستون) دارند ولی ساختار سلولی شبیه باکتری. غشای آن‌ها پیوند اتری و زنجیره‌ی فایتانیل دارد و در محیط‌های سخت (ترموفیل، هالوفیل، متان‌زا) زندگی می‌کنند. یافته‌ی آرکی‌های آسگارد نشان داده یوکاریوت‌ها از درون آرکی‌ها می‌آیند.\",\"باکتری‌ها بیشترین تنوع متابولیک را دارند: فتواتوتروف، شیمیواتوتروف (نیتریفایر)، هتروتروف و بی‌هوازی. یوکاریا شامل آغازیان، گیاهان، قارچ‌ها و جانوران است. قارچ‌ها و جانوران با یکدیگر خویشاوندترند تا با گیاهان (گروه اوپیستوکانت). ویروس‌ها در درخت زندگی جای ندارند چون سلول نیستند.\"],\n[\"رده‌بندی از ۸ سطح اصلی: قلمرو، سلسله، شاخه، رده، راسته، تیره، سرده، گونه (به‌علاوه‌ی زیرسطح‌ها). قواعد نام‌گذاری (ICZN و ICN): نام علمی دوبخشی لاتین، سرده با حرف بزرگ و گونه کوچک، ایتالیک؛ نخستین نام معتبر اولویت دارد. کلید دوشاخه‌ای برای شناسایی به کار می‌رود. بارکدینگ DNA با ژن COI (جانوران) یا rbcL و matK (گیاهان) گونه‌ها را شناسایی می‌کند.\",\"رده‌بندی امروزی فیلوژنی‌محور است و گروه‌های غیرتک‌تبار را دوباره می‌شکند. مثال: پرندگان در درون دایناسورها (تروپودها) جای دارند. نام‌های رایج گاه گمراه‌کننده‌اند (ستاره‌ی دریایی و عروس دریایی ماهی نیستند). تغییرات رده‌بندی طبیعی است و با داده‌ی تازه اصلاح می‌شود.\"],\n[\"مفهوم زیستی گونه (مایر): گروه‌های طبیعی از جمعیت‌های هم‌آمیز که از نظر تولیدمثلی از دیگر گروه‌ها جدا هستند. محدودیت: غیرجنسی‌ها، فسیل‌ها و گونه‌های دورگه‌ساز (بلوط، گرگ و کایوت). مفهوم‌های دیگر: ریخت‌شناختی، بوم‌شناختی (آشیان)، فیلوژنتیک و شناسایی. حلقه‌ی گونه‌ای: مثلاً مرغ‌های دریایی حلقه‌ی قطبی که همسایه‌ها آمیزش می‌کنند ولی دو انتهای حلقه نه.\",\"گونه‌های پنهان (cryptic) از نظر ظاهری مشابه اما از نظر ژنتیکی جدا هستند و DNA بسیاری از آن‌ها را آشکار کرده است. دورگه‌ها برای رده‌بندی چالش‌اند: قاطر (اسب×الاغ) و لایگر. گونه‌ی کلیدی و گونه‌ی چتر (مانند یوزپلنگ و پلنگ) در حفاظت اهمیت دارند.\"],\n[\"نرخ انقراض زمینه حدود ۰٫۱ تا ۱ گونه به ازای هر میلیون گونه‌سال است و نرخ کنونی ۱۰۰ تا ۱۰۰۰ برابر آن برآورد می‌شود. پنج انقراض دسته‌جمعی پیشین: اردوویسین، دوونین، پرمین (۹۶٪ گونه‌های دریایی)، تریاس و کرتاسه (دایناسورها، ۶۶ میلیون سال پیش). عوامل کنونی (HIPPO): تخریب زیستگاه، گونه‌های مهاجم، آلودگی، جمعیت انسان و بهره‌برداری بیش از حد. رابطه‌ی گونه-مساحت: با ۹۰٪ کاهش مساحت، حدود نیمی از گونه‌ها حذف می‌شوند.\",\"طبقه‌های فهرست سرخ: ناچیز (LC)، نزدیک به تهدید (NT)، آسیب‌پذیر (VU)، در خطر (EN)، به شدت در خطر (CR)، منقرض در طبیعت (EW) و منقرض (EX). حفاظت درجا (پارک‌ها) و برون‌جا (باغ‌وحش، بانک بذر). موفقیت‌ها: کرکس کالیفرنیا، شیر دریایی و بیسون. جمعیت یوزپلنگ آسیایی در ایران کمتر از ۵۰ قلاده است و تلفات جاده و کمبود طعمه خطر اصلی آن‌هاست.\"],\n[\"شاخص نقطه‌ی داغ مایرز: دست‌کم ۱٬۵۰۰ گونه‌ی گیاهی بومی و از دست رفتن ۷۰ درصد زیستگاه اولیه. جهان ۳۶ نقطه‌ی داغ دارد که حدود ۲٫۵ درصد خشکی‌اند و بیش از نیمی از گیاهان بومی و ۴۳٪ مهره‌داران خشکی‌زی را دارند. ایران بخشی از نقطه‌های داغ ایران-آناتولی و قفقاز را در بر می‌گیرد. جنگل‌های هیرکانی (حدود ۵۰ میلیون سال قدمت) در سال ۲۰۱۹ جزو میراث جهانی شدند.\",\"تنوع زیستی در سه سطح بررسی می‌شود: ژنتیکی، گونه‌ای و بوم‌سازگانی. شاخص‌هایی مانند شاخص شانون، H = −Σ pᵢ ln pᵢ، تنوع را می‌سنجند. خدمات بوم‌سازگان شامل گرده‌افشانی، پالایش آب، ذخیره‌ی کربن و کنترل آفت است. تنوع بالا بوم‌سازگان را در برابر اختلال پایدار می‌کند (فرضیه‌ی بیمه).\"]];\n\nS.eco=[\n[\"سطوح: فرد ← جمعیت ← جامعه ← بوم‌سازگان ← زیست‌بوم (بیوم) ← زیست‌کره. در بوم‌شناسی جمعیت، تراکم و پراکنش (یکنواخت، تصادفی، تجمعی) و ساختار سنی (هرم سنی) توصیف می‌شوند. آشیان بوم‌شناختی مجموعه‌ی شرایط و منابع مورد نیاز گونه است. اصل طرد رقابتی (گاوزه): دو گونه با آشیان یکسان نمی‌توانند پایدار هم‌زیست باشند. هم‌زیستی با تقسیم آشیان رخ می‌دهد.\",\"روش نمونه‌برداری: کوادرات و ترانسکت برای تراکم؛ روش گرفتن-نشانه‌گذاری-بازگرفتن (لینکلن-پترسن) برای جانوران متحرک با N = (M × C)/R. نمونه: ۵۰ مارک‌شده، در گرفتن دوم ۴۰ حیوان و ۱۰ مارک‌دار ← N = ۵۰×۴۰/۱۰ = ۲۰۰. گونه‌ی کلیدی و مهندس بوم‌سازگان (بیور) ساختار جامعه را تعیین می‌کنند. توالی بوم‌شناختی: توالی اولیه (روی سنگ لخت) و ثانویه (پس از آتش‌سوزی) تا اوج جامعه.\"],\n[\"تولید اولیه‌ی ناخالص (GPP) منهای تنفس گیاه برابر تولید اولیه‌ی خالص (NPP) است. بازده انتقال انرژی بین سطوح غذایی حدود ۵ تا ۲۰ درصد (میانگین ۱۰٪) است؛ جانوران خون‌گرم بازده کمتری از خون‌سردها دارند. به همین دلیل زنجیره‌های غذایی ۳ تا ۵ حلقه دارند و گوشت‌خواران بالا کم‌اند. هرم‌ها: تعداد، زیست‌توده و انرژی؛ هرم انرژی از پایه به رأس همیشه کاهش می‌یابد ولی هرم تعداد یا زیست‌توده ممکن است وارونه باشد (فیتوپلانکتون).\",\"بزرگ‌نمایی زیستی: آفت‌کش DDT (در بافت چربی) و متیل‌جیوه (در پروتئین‌های ماهیچه) تجمع می‌یابند و غلظتشان در هر سطح چند برابر می‌شود؛ ضعف پوسته‌ی تخم عقاب‌ها نمونه‌ی آن بود. تجزیه‌کننده‌ها (باکتری و قارچ) مواد آلی مرده را معدنی می‌کنند. آب کم‌اکسیژن (ناحیه‌ی مرده) از شکوفایی جلبکی حاصل از کودهای نیتروژن و فسفر در مصب‌ها ایجاد می‌شود.\"],\n[\"چرخه‌ی کربن: ذخیره‌ی بزرگ در سنگ‌های آهکی و سوخت فسیلی؛ جو حدود ۸۰۰ گیگاتن کربن دارد. غلظت CO₂ جو از حدود ۲۸۰ ppm پیش از صنعت به بیش از ۴۲۰ ppm رسیده است. چرخه‌ی نیتروژن: تثبیت (N₂ → NH₃ با باکتری‌ها و رعد و برق)، آمونیفیکاسیون (تجزیه)، نیتریفیکاسیون (NH₄⁺ → NO₂⁻ → NO₃⁻ با نیتروزوموناس و نیتروباکتر) و دنیتریفیکاسیون (NO₃⁻ → N₂). فرآیند هابر-بوش تولید صنعتی کود را ممکن کرد و چرخه‌ی نیتروژن را دگرگون کرد.\",\"چرخه‌ی فسفر رسوبی است و جوی ندارد؛ فسفر در بسیاری از آب‌ها عامل محدودکننده است. چرخه‌ی آب با تبخیر، چگالش و بارش انجام می‌شود. یوتریفیکاسیون: مواد مغذی ← شکوفایی جلبکی ← مرگ جلبک و مصرف اکسیژن توسط باکتری‌ها ← مرگ آبزیان. اسیدی‌شدن اقیانوس‌ها (جذب CO₂، pH از ۸٫۲ به ۸٫۱) تشکیل صدف و اسکلت مرجان‌ها را دشوار می‌کند.\"],\n[\"مدل نمایی dN/dt = rN (r نرخ ذاتی افزایش) و مدل لجستیک dN/dt = rN(K − N)/K که در N = K/2 بیشترین رشد را دارد. راهبردهای r (زاد و ولد بالا، عمر کوتاه، بدون مراقبت: حشرات و علف‌ها) و K (فرزندان کم، مراقبت، عمر طولانی: فیل و انسان). جدول زندگی و منحنی‌های بقا (نوع I مانند انسان، II مانند پرندگان، III مانند صدف و ماهی).\",\"رابطه‌ی شکارچی-طعمه (لوتکا-ولترا) نوسان دوره‌ای می‌سازد: خرگوش و سیاه‌گوش کانادایی (لینکس) حدود ۱۰ سال. عوامل وابسته به تراکم (رقابت، بیماری، شکار) و مستقل از تراکم (آب‌وهوا). رشد جمعیت انسان از ۱ میلیارد در ۱۸۰۰ به ۸ میلیارد در ۲۰۲۲ رسید؛ مدل انتقال جمعیتی کاهش مرگ‌ومیر و سپس زاد و ولد را شرح می‌دهد.\"],\n[\"زیست‌بوم‌های خشکی: جنگل بارانی گرمسیری (بیش از ۲۰۰۰ میلی‌متر بارش، خاک فقیر)، علفزار و ساوانا، بیابان (کمتر از ۲۵۰ میلی‌متر)، شاپارال، جنگل برگ‌ریز معتدل، تایگا و تندرا (یخ‌زمین پایدار). ایران ۱۱ اقلیم از ۱۳ اقلیم کوپن را دارد. آبزی‌بوم‌ها: اقیانوس‌ها (۷۱٪ زمین)، صخره‌های مرجانی (کمتر از ۱٪ بستر ولی ۲۵٪ گونه‌های دریایی)، مصب‌ها، و تالاب‌ها. منطقه‌ی نوری تا ۲۰۰ متر فتوسنتز دارد.\",\"مناطق دریایی: ستون آب (پلاژیک) و کفی (بنتیک)، ژرف‌ها و دودکش‌های گرمابی که در آن‌ها باکتری‌های شیمیوسنتزکننده پایه‌ی زنجیره‌اند. تالاب‌ها کنوانسیون رامسر (۱۹۷۱، در ایران امضا شد) دارند. دریاچه‌ی ارومیه نمونه‌ای از بحران آبی با کاهش بیش از ۸۰ درصد مساحت ظرف دو دهه است.\"],\n[\"اثر گلخانه‌ای طبیعی حدود ۳۳ درجه گرم‌تر از وضعیت بدون آن می‌کند. گازهای گلخانه‌ای: CO₂ (حدود ۷۵٪ گازهای گلخانه‌ای انسان‌ساخت)، CH₄ (۲۸ تا ۳۰ برابر قوی‌تر در ۱۰۰ سال)، N₂O و گازهای فلوئوردار. دمای میانگین زمین حدود ۱٫۳ تا ۱٫۴ درجه بالاتر از دوره‌ی پیشاصنعتی است و توافق پاریس ۱٫۵ درجه را هدف قرار می‌دهد. بازخوردهای مثبت: ذوب یخ و کاهش بازتاب (آلبیدو) و آزادسازی متان یخ‌زمین.\",\"پیامدهای زیستی: جابه‌جایی دامنه‌ی گونه‌ها به سمت قطب و ارتفاع، ناهماهنگی زمانی (فنولوژی) میان گل‌ها و گرده‌افشان‌ها، سفیدشدگی مرجان‌ها و انتشار بیماری‌ها. راهکارها: کاهش انتشار (انرژی تجدیدپذیر)، جذب کربن (جنگل، تالاب، خاک)، سازگاری و حفاظت از زیستگاه. ردپای کربن به صورت CO₂ معادل محاسبه می‌شود.\"]];\n\nS.bio=[\n[\"مهندسی ژنتیک: آنزیم‌های برشی نوع II (EcoRI برش GAATTC) انتهای چسبنده می‌سازند. پلاسمید ناقل شامل ori، ژن نشانگر مقاومت (مثلاً ampR) و جایگاه چندبرشی است. تراریختگی باکتری با شوک گرمایی یا الکتروپوریشن و انتخاب با آنتی‌بیوتیک؛ نشانگر lacZ (کلنی‌های آبی-سفید) درج موفق را نشان می‌دهد. در گیاهان از اگروباکتریوم تومه‌فاسینس (پلاسمید Ti) برای انتقال ژن استفاده می‌شود.\",\"نمونه‌ها: انسولین نوترکیب (۱۹۷۸)، هورمون رشد، فاکتور VIII، واکسن هپاتیت B، پنبه‌ی Bt (پروتئین کشنده‌ی حشرات) و برنج طلایی (بتاکاروتن). ژن‌درمانی با ناقل ویروسی (آدنو-وابسته AAV) بیماری‌هایی مانند آتروفی عضلانی نخاعی را درمان می‌کند. چالش‌ها: ایمنی، ناقل، جایگاه درج و هزینه.\"],\n[\"مراحل PCR: واسرشت‌سازی ۹۴ تا ۹۸ درجه، اتصال آغازگر ۵۰ تا ۶۵ درجه، گسترش ۷۲ درجه با Taq پلیمراز (از Thermus aquaticus). پس از n چرخه، ۲ⁿ نسخه؛ ۳۰ چرخه حدود یک میلیارد نسخه. RT-PCR از RNA، و qPCR با رنگ فلورسانت مقدار اولیه را اندازه می‌گیرد. الکتروفورز ژل آگارز: DNA بار منفی دارد و به سمت قطب مثبت می‌رود؛ قطعات کوچک‌تر سریع‌ترند.\",\"توالی‌یابی سانگر با دی‌دی‌اکسی‌نوکلئوتیدهای پایان‌دهنده‌ی زنجیره؛ نسل جدید (Illumina) میلیاردها قطعه‌ی کوتاه را موازی می‌خواند و ژنوم انسان زیر ۱۰۰۰ دلار و در یک روز. توالی‌یابی نانوپور مولکول‌های بلند را می‌خواند. از کاربردهای دیگر: اثر انگشت DNA با تکرارهای کوتاه پشت‌هم (STR) در پزشکی قانونی و آزمون تشخیص پدری.\"],\n[\"سلول‌های بنیادی دو ویژگی دارند: خودنوسازی و تمایز. رده‌بندی: همه‌توان (زیگوت)، پرتوان (جنینی)، چندتوان (مغز استخوان) و تک‌توان. شینیا یاماناکا با چهار عامل (Oct4، Sox2، Klf4، c-Myc) سلول‌های پرتوان القایی ساخت و در ۲۰۱۲ نوبل گرفت. این سلول‌ها برای مدل‌سازی بیماری، آزمایش دارو و آینده‌ی پیوند خودی کاربرد دارند. ارگانوئیدها ساختارهای سه‌بعدی شبیه اندام‌اند.\",\"کلونینگ: انتقال هسته‌ی سلول بالغ به تخمک بی‌هسته (SCNT) میش دالی را در ۱۹۹۶ پدید آورد. کلونینگ درمانی و تولیدمثلی؛ دومی برای انسان ممنوع است. چالش‌ها: ریسک تومور، رد پیوند، اخلاقیات جنین. استفاده از سلول‌های بنیادی خون بند ناف برای بیماری‌های خونی.\"],\n[\"پایگاه‌های داده: GenBank و UniProt و PDB. BLAST توالی را با پایگاه داده مقایسه می‌کند و E-value تعداد تطابق‌های تصادفی مورد انتظار را نشان می‌دهد. همترازی توالی چندگانه، درخت فیلوژنی و پیش‌بینی ژن از ژنوم از کارهای اصلی‌اند. تحلیل بیان ژن RNA-seq با میلیون‌ها خوانش و آمار پیچیده‌ی مقایسه‌ی گروه‌ها.\",\"آلفافولد ۲ (۲۰۲۰) ساختار پروتئین را از توالی با دقت نزدیک به آزمایش پیش‌بینی می‌کند و دیمیس هسابیس و جان جامپر در ۲۰۲۴ نوبل شیمی گرفتند؛ پایگاه آن ساختار بیش از ۲۰۰ میلیون پروتئین را دارد. طراحی دارو و پزشکی شخصی‌شده بر پایه‌ی ژنوم بیمار پیش می‌رود. محدودیت‌ها: کیفیت داده، سوگیری و تفسیرپذیری مدل‌ها.\"],\n[\"در کشاورزی: گیاهان مقاوم به علف‌کش (گلیفوسیت)، به حشره (Bt)، به خشکی و ارزش غذایی بالاتر. تخمیر صنعتی از مخمر و باکتری برای اتانول، آنتی‌بیوتیک، اسید سیتریک و آنزیم‌ها استفاده می‌کند. زیست‌پالایی با باکتری‌هایی مانند سودوموناس نفت و فلزات را تجزیه یا تثبیت می‌کند. بیوراکتور محیط کنترل‌شده‌ی دما، pH و اکسیژن را برای تخمیر در مقیاس بزرگ فراهم می‌کند.\",\"مباحث اخلاقی و قانونی: برچسب‌گذاری، ایمنی مصرف، جریان ژن به خویشاوندان وحشی، مالکیت فکری بذر و دسترسی به غذا. زیست‌شناسی ترکیبی (سینتتیک) مدارهای ژنی طراحی‌شده می‌سازد. پروتکل‌های ایمنی زیستی سطح ۱ تا ۴ برای میکروب‌های متفاوت به کار می‌روند.\"],\n[\"روش علمی چرخه‌ی تکرارشونده است: مشاهده، پرسش، فرضیه، پیش‌بینی، آزمایش، تحلیل و بازنگری. آزمایش خوب: متغیر مستقل، وابسته، کنترل شده، گروه شاهد و تکرار با اندازه‌ی نمونه‌ی کافی. آمار: میانگین، انحراف معیار و آزمون‌هایی مانند t و χ²؛ مقدار p کمتر از ۰٫۰۵ یعنی اگر فرض صفر درست باشد احتمال مشاهده‌ی چنین داده‌ای کمتر از ۵ درصد است. همبستگی لزوماً علیت نیست.\",\"میکروسکوپ نوری توان تفکیک حدود ۰٫۲ میکرومتر دارد و بزرگ‌نمایی مفید حداکثر حدود ۱۵۰۰ برابر؛ میکروسکوپ الکترونی عبوری تا ۰٫۱ نانومتر و SEM سطح سه‌بعدی را نشان می‌دهد. میکروسکوپ فلورسانس با پروتئین سبز فلورسان (GFP) پروتئین‌ها را در سلول زنده ردیابی می‌کند. سانتریفیوژ اندامک‌ها را بر پایه‌ی چگالی و اندازه جدا می‌کند. کشت سلول و رنگ‌آمیزی دیگر ابزارهای رایج‌اند.\"]];\n\n(function(){\nvar ch={id:\"org\",h:0,name:\"اندام‌های بدن\",hl:\"اندام‌ها\",tag:\"آناتومی\",scale:\"۱ تا ۳۰ سانتی‌متر\",\nintro:\"هر اندام چند بافت را کنار هم می‌گذارد تا یک کار ویژه انجام دهد. اینجا دوازده اندام اصلی بدن انسان را جداگانه می‌خوانید: جایگاه، ساختار، سلول‌ها، کار و بیماری‌های شایع.\",\ntopics:[\n[\"مغز\",\"مغز مرکز فرمان بدن است و در جمجمه جای دارد. حدود ۱٫۳ تا ۱٫۴ کیلوگرم وزن دارد و نزدیک ۸۶ میلیارد نورون و تعداد مشابهی سلول پشتیبان (نوروگلیا) دارد. کارش دریافت اطلاعات حسی، پردازش، تصمیم‌گیری، حافظه، هیجان و کنترل حرکت و نیز تنظیم کارهای حیاتی مانند تنفس است.\",[\"مخ\",\"مخچه\",\"ساقه‌ی مغز\",\"هیپوکامپ\",\"سد خونی-مغزی\"]],\n[\"قلب\",\"قلب پمپی ماهیچه‌ای به اندازه‌ی مشت و وزن حدود ۳۰۰ گرم است که میان دو ریه، کمی به چپ، قرار دارد. روزانه حدود ۱۰۰ هزار بار می‌تپد و خون را در دو مدار ریوی و عمومی می‌چرخاند. چهار حفره (دو دهلیز و دو بطن) و چهار دریچه دارد.\",[\"میوکارد\",\"دریچه\",\"سرخرگ کرونری\",\"گره سینوسی\"]],\n[\"ریه‌ها\",\"ریه‌ها دو اندام اسفنجی در قفسه‌ی سینه‌اند که تبادل اکسیژن و دی‌اکسید کربن را بین هوا و خون انجام می‌دهند. ریه‌ی راست سه لوب و ریه‌ی چپ دو لوب دارد (برای جای دادن قلب). هر ریه با دو لایه‌ی جنب پوشیده شده است.\",[\"نایژه\",\"آلوئول\",\"جنب\",\"سورفاکتانت\"]],\n[\"کبد\",\"کبد بزرگ‌ترین اندام داخلی (حدود ۱٫۵ کیلوگرم) است و در سمت راست بالای شکم قرار دارد. بیش از ۵۰۰ کار حیاتی انجام می‌دهد: ساخت صفرا و پروتئین‌های خون، ذخیره‌ی گلیکوژن و ویتامین‌ها، سم‌زدایی و تنظیم قند و چربی خون.\",[\"هپاتوسیت\",\"صفرا\",\"آلبومین\",\"ورید باب\"]],\n[\"معده\",\"معده کیسه‌ای ماهیچه‌ای به شکل J است که غذا را موقتاً نگه می‌دارد، با اسید و آنزیم هضم پروتئین را آغاز می‌کند و با حرکات خود آن را به کیموس تبدیل می‌کند. ظرفیت آن حدود ۱ تا ۱٫۵ لیتر است و می‌تواند تا چند برابر بزرگ شود.\",[\"اسید معده\",\"پپسین\",\"گاسترین\",\"پیلور\"]],\n[\"روده‌ی باریک\",\"روده‌ی باریک لوله‌ای حدود ۶ متری است که در آن هضم نهایی و بیش از ۹۰ درصد جذب مواد مغذی رخ می‌دهد. سه بخش دوازدهه، ژژنوم و ایلئوم دارد و دیواره‌ی آن برای افزایش سطح جذب پرز و ریزپرز دارد.\",[\"دوازدهه\",\"پرز\",\"ریزپرز\",\"شیلومیکرون\"]],\n[\"روده‌ی بزرگ\",\"روده‌ی بزرگ حدود ۱٫۵ متر طول دارد و آب و املاح باقی‌مانده را جذب، مدفوع را شکل و ذخیره می‌کند. میلیاردها باکتری مفید در آن زندگی می‌کنند. شامل سکوم، کولون (بالارو، عرضی، پایین‌رو و سیگموئید)، راست‌روده و مقعد است.\",[\"سکوم\",\"کولون\",\"میکروبیوم\",\"آپاندیس\"]],\n[\"لوزالمعده\",\"لوزالمعده (پانکراس) غده‌ای ۱۵ سانتی‌متری پشت معده است که هم آنزیم‌های گوارشی (بخش برون‌ریز) و هم هورمون‌های تنظیم‌کننده‌ی قند خون (بخش درون‌ریز) می‌سازد؛ یعنی هم‌زمان یک غده‌ی گوارشی و یک غده‌ی هورمونی است.\",[\"جزایر لانگرهانس\",\"انسولین\",\"گلوکاگون\",\"تریپسین\"]],\n[\"کلیه‌ها\",\"کلیه‌ها دو اندام لوبیایی‌شکل پشت حفره‌ی شکم‌اند که خون را صاف می‌کنند، مواد زائد را دفع، حجم و ترکیب مایعات بدن، فشار خون و pH را تنظیم و هورمون می‌سازند. هر کدام حدود ۱۵۰ گرم وزن و ۱۱ سانتی‌متر طول دارد.\",[\"نفرون\",\"گلومرول\",\"حالب\",\"مثانه\"]],\n[\"پوست\",\"پوست بزرگ‌ترین اندام بدن است (حدود ۱٫۵ تا ۲ مترمربع و ۱۵ درصد وزن). سد محافظ در برابر میکروب، از دست رفتن آب و پرتو UV است و حس لمس و دما را می‌گیرد و دمای بدن را تنظیم می‌کند و ویتامین D می‌سازد.\",[\"اپیدرم\",\"درم\",\"ملانین\",\"غده‌ی عرق\"]],\n[\"چشم\",\"چشم اندام بینایی است؛ کره‌ای با قطر حدود ۲۴ میلی‌متر که نور را متمرکز و به پیام عصبی تبدیل می‌کند. قرنیه و عدسی تصویر وارونه‌ای روی شبکیه می‌اندازند و مغز آن را تفسیر می‌کند.\",[\"قرنیه\",\"عدسی\",\"شبکیه\",\"عصب بینایی\"]],\n[\"گوش\",\"گوش دو کار انجام می‌دهد: شنیدن و حفظ تعادل. سه بخش دارد: گوش خارجی، میانی و داخلی. موج صوتی در آن به ارتعاش مکانیکی و سپس به پیام عصبی تبدیل می‌شود.\",[\"پرده‌ی صماخ\",\"استخوانچه\",\"حلزون\",\"مجاری نیم‌دایره\"]]],\nfact:\"اگر همه‌ی پرزهای روده‌ی باریک را باز کنیم، سطح جذب حدود ۳۰ مترمربع می‌شود، یعنی چندین برابر سطح پوست، و مغز با وجود ۲ درصد وزن بدن حدود ۲۰ درصد انرژی را مصرف می‌کند.\",\nquiz:[\n{q:\"بزرگ‌ترین اندام داخلی بدن کدام است؟\",o:[\"مغز\",\"کبد\",\"ریه\",\"معده\"],a:1,e:\"کبد حدود ۱٫۵ کیلوگرم وزن دارد.\"},\n{q:\"بیشتر جذب مواد مغذی در کدام اندام انجام می‌شود؟\",o:[\"معده\",\"روده‌ی بزرگ\",\"روده‌ی باریک\",\"کلیه\"],a:2,e:\"پرزها و ریزپرزهای روده‌ی باریک سطح جذب را بسیار زیاد می‌کنند.\"},\n{q:\"واحد ساختاری و عملکردی کلیه چه نام دارد؟\",o:[\"آلوئول\",\"نفرون\",\"هپاتوسیت\",\"نورون\"],a:1,e:\"هر کلیه حدود یک میلیون نفرون دارد.\"}]};\nvar X1=[\n{m:\"مخ بزرگ‌ترین بخش مغز است و دو نیمکره دارد که با جسم پینه‌ای به هم وصل‌اند. هر نیمکره چهار لوب دارد: پیشانی (برنامه‌ریزی، حرکت ارادی، گفتار بروکا)، آهیانه (حس لامسه و جهت‌یابی)، گیجگاهی (شنوایی، حافظه، زبان) و پس‌سری (بینایی). سه لایه‌ی پرده‌ی مننژ (سخت‌شامه، عنکبوتیه و نرم‌شامه) و مایع مغزی-نخاعی (حدود ۱۵۰ میلی‌لیتر) از مغز محافظت می‌کنند.\",k:[\"مخچه تعادل و هماهنگی حرکت را کنترل می‌کند\",\"هیپوتالاموس دما، تشنگی و هورمون‌ها را تنظیم می‌کند\",\"ساقه‌ی مغز تنفس و ضربان قلب را کنترل می‌کند\"],x:\"آسیب به ناحیه‌ی بروکا در لوب پیشانی توان تولید گفتار را مختل می‌کند، اما فرد معنی را می‌فهمد.\"},\n{m:\"دیواره‌ی قلب سه لایه دارد: اپی‌کارد (بیرونی)، میوکارد (ماهیچه‌ی قلبی) و اندوکارد (درونی). دهلیز راست خون کم‌اکسیژن را از وریدهای اجوف می‌گیرد، بطن راست آن را به ریه‌ها می‌فرستد، دهلیز چپ خون اکسیژن‌دار ریه را می‌گیرد و بطن چپ (با دیواره‌ی ضخیم‌تر) آن را از آئورت به بدن پمپ می‌کند. خود قلب با سرخرگ‌های کرونری تغذیه می‌شود.\",k:[\"دریچه‌ها جهت جریان خون را یک‌طرفه نگه می‌دارند\",\"ضربان از گره‌ی سینوسی-دهلیزی آغاز می‌شود\",\"بطن چپ قوی‌ترین حفره است\"],x:\"انسداد سرخرگ کرونری باعث سکته‌ی قلبی می‌شود، چون بخشی از ماهیچه‌ی قلب اکسیژن نمی‌گیرد.\"},\n{m:\"هوا از نای به دو نایژه‌ی اصلی و پس از حدود ۲۳ انشعاب به نایژک‌ها و کیسه‌های آلوئولی می‌رسد. دیواره‌ی آلوئول فقط یک سلول ضخامت دارد (پنوموسیت نوع I) و کنار مویرگ قرار می‌گیرد. پنوموسیت نوع II سورفاکتانت می‌سازد. ظرفیت کل ریه حدود ۶ لیتر است، اما در تنفس عادی فقط حدود نیم لیتر در هر دم جابه‌جا می‌شود.\",k:[\"جنب اصطکاک ریه با قفسه را کم می‌کند\",\"مژک‌های مجاری هوایی گرد و غبار را بالا می‌رانند\",\"دیافراگم اصلی‌ترین ماهیچه‌ی دم است\"],x:\"در آسم، نایژه‌ها تنگ و ملتهب می‌شوند و بازدم دشوار می‌شود.\"},\n{m:\"کبد دو منبع خون دارد: ورید باب (حدود ۷۵٪، پر از مواد مغذی از روده) و سرخرگ کبدی (۲۵٪، اکسیژن‌دار). واحد ساختاری آن لوبول کبدی شش‌ضلعی است که در آن هپاتوسیت‌ها به صورت صفحه‌هایی دور ورید مرکزی چیده شده‌اند و خون در سینوزوئیدها از کنارشان می‌گذرد. صفرا (روزانه ۵۰۰ تا ۱۰۰۰ میلی‌لیتر) در مجاری صفراوی جمع و در کیسه‌ی صفرا غلیظ می‌شود.\",k:[\"کبد آمونیاک را به اوره تبدیل می‌کند\",\"آنزیم‌های سیتوکروم P450 داروها را تجزیه می‌کنند\",\"کبد توان بازسازی بالایی دارد\"],x:\"پس از برداشتن بخشی از کبد، بقیه در چند هفته تا حد زیادی رشد می‌کند.\"},\n{m:\"معده چهار ناحیه دارد: کاردیا، فوندوس، تنه و پیلور. غدد معده سلول‌های متنوعی دارند: سلول‌های جداری (HCl و فاکتور داخلی)، سلول‌های اصلی (پپسینوژن)، مخاطی (موکوس و بی‌کربنات) و G (گاسترین). pH معده حدود ۱ تا ۲ است و لایه‌ی مخاط از دیواره محافظت می‌کند. غذا ۲ تا ۶ ساعت می‌ماند و به شکل کیموس وارد دوازدهه می‌شود.\",k:[\"مخاط معده هر ۳ تا ۵ روز نو می‌شود\",\"فاکتور داخلی برای جذب B12 لازم است\",\"پیلور خروج غذا را تنظیم می‌کند\"],x:\"باکتری هلیکوباکتر پیلوری عامل بسیاری از زخم‌های معده است؛ مارشال و وارن برای کشف آن در ۲۰۰۵ نوبل گرفتند.\"},\n{m:\"دوازدهه (۲۵ سانتی‌متر) صفرا و شیره‌ی لوزالمعده می‌گیرد؛ ژژنوم بیشترین جذب را دارد و ایلئوم ویتامین B12 و نمک‌های صفراوی را جذب می‌کند. دیواره‌ی آن چین‌های حلقوی، پرز (هر کدام دارای مویرگ و مجرای لنفی لاکتئال) و ریزپرز دارد که مساحت را به حدود ۳۰ مترمربع می‌رساند. سلول‌های بنیادی در کریپت‌ها تقسیم می‌شوند و هر ۳ تا ۵ روز دیواره نو می‌شود.\",k:[\"چربی‌ها از راه لنف جذب می‌شوند\",\"پلاک‌های پیر بخشی از ایمنی روده‌اند\",\"آنزیم‌های حاشیه‌ی مسواکی هضم را کامل می‌کنند\"],x:\"در بیماری سلیاک، گلوتن پرزها را تخریب و جذب را کم می‌کند.\"},\n{m:\"کولون حدود ۱٫۵ لیتر آب در روز جذب می‌کند و مدفوع را آماده می‌کند؛ حرکت‌های توده‌ای آن را به راست‌روده می‌رسانند. چین‌های هاستراها و ماهیچه‌ی طولی (تنیا) به آن ظاهر حبابی می‌دهند. باکتری‌های روده فیبر را تخمیر و ویتامین K و اسیدهای چرب کوتاه‌زنجیر می‌سازند. زمان گذر معمولاً ۲۴ تا ۷۲ ساعت است.\",k:[\"آپاندیس زائده‌ای لنفی در ابتدای کولون است\",\"فیبر برای سلامت کولون ضروری است\",\"مدفوع از باکتری، فیبر و سلول‌های ریخته‌شده ساخته می‌شود\"],x:\"سرطان روده‌ی بزرگ با غربالگری (کولونوسکوپی) در مراحل اولیه قابل پیشگیری است.\"},\n{m:\"بخش برون‌ریز (حدود ۹۸٪) از اسینی‌هایی ساخته شده که پیش‌آنزیم‌های غیرفعال تریپسینوژن و کیموتریپسینوژن و نیز آنزیم‌های فعال لیپاز و آمیلاز را ترشح می‌کنند؛ فعال‌شدن تریپسین توسط آنتروکیناز در دوازدهه صورت می‌گیرد. مجاری آن بی‌کربنات ترشح می‌کنند تا اسید معده را خنثی کنند. بخش درون‌ریز جزایر لانگرهانس است: سلول‌های آلفا (گلوکاگون)، بتا (انسولین)، دلتا (سوماتواستاتین) و PP.\",k:[\"انسولین قند خون را پایین می‌آورد\",\"گلوکاگون قند خون را بالا می‌برد\",\"آنزیم‌های پروتئین‌بر به شکل غیرفعال ساخته می‌شوند\"],x:\"در پانکراتیت، آنزیم‌ها درون خود غده فعال می‌شوند و بافت را هضم می‌کنند.\"},\n{m:\"کلیه سه ناحیه دارد: قشر (کورتکس)، مغز (مدولا) با هرم‌های کلیوی و لگنچه. سرخرگ کلیوی حدود ۲۰ تا ۲۵ درصد برون‌ده‌ی قلب را (حدود ۱٫۲ لیتر در دقیقه) می‌آورد. ادرار از لگنچه با حالب به مثانه و سپس با میزراه بیرون می‌رود. کلیه همچنین اریتروپویتین (تولید گلبول قرمز)، رنین و شکل فعال ویتامین D را می‌سازد.\",k:[\"کلیه‌ها روزانه حدود ۱۸۰ لیتر مایع صاف می‌کنند\",\"ظرفیت مثانه حدود ۴۰۰ تا ۶۰۰ میلی‌لیتر است\",\"سنگ کلیه از بلورهای املاح ساخته می‌شود\"],x:\"در دیالیز دستگاهی به جای کلیه، خون را از مواد زائد پاک می‌کند.\"},\n{m:\"پوست سه لایه دارد. اپیدرم (بدون رگ) پنج لایه دارد و کراتینوسیت‌ها از لایه‌ی پایه به سطح می‌روند و پس از حدود ۲۸ روز می‌میرند و می‌ریزند. ملانوسیت‌ها ملانین را می‌سازند که از DNA در برابر UV محافظت می‌کند. درم دارای کلاژن، رگ، عصب، فولیکول مو و غده‌های عرق و چربی است. هیپودرم چربی و عایق است.\",k:[\"لانگرهانس سلول‌های ایمنی پوست‌اند\",\"پوست با تعریق و گشادی رگ‌ها دما را تنظیم می‌کند\",\"نور خورشید ساخت ویتامین D را آغاز می‌کند\"],x:\"ملانوم سرطان سلول‌های رنگدانه‌ساز است و زود تشخیص دادنش جان فرد را نجات می‌دهد.\"},\n{m:\"نور از قرنیه (حدود دو سوم توان شکست چشم) و عدسی عبور می‌کند. ماهیچه‌های مژگانی شکل عدسی را برای دید نزدیک و دور تغییر می‌دهند (تطابق). شبکیه حدود ۱۲۰ میلیون استوانه (دید کم‌نور، رودوپسین) و ۶ میلیون مخروط (رنگ؛ سه نوع) دارد. لکه‌ی زرد با گودی مرکزی (فووآ) بیشترین وضوح را دارد و محل ورود عصب بینایی نقطه‌ی کور است.\",k:[\"عنبیه اندازه‌ی مردمک را تنظیم می‌کند\",\"زلالیه فشار چشم را حفظ می‌کند\",\"ویتامین A برای ساخت رودوپسین لازم است\"],x:\"در نزدیک‌بینی تصویر جلوی شبکیه می‌افتد و با عدسی مقعر اصلاح می‌شود.\"},\n{m:\"گوش خارجی صدا را به پرده‌ی صماخ می‌رساند. در گوش میانی سه استخوانچه (چکشی، سندانی، رکابی؛ کوچک‌ترین استخوان‌های بدن) ارتعاش را تقویت و به دریچه‌ی بیضی حلزون می‌رسانند. در حلزون (۲٫۵ دور)، ارتعاش مایع غشای قاعده‌ای را می‌لرزاند و حدود ۱۶ هزار سلول مویی اندام کورتی پیام عصبی می‌سازند. فرکانس‌های بالا نزدیک پایه‌ی حلزون و پایین در نوک آن ثبت می‌شوند. دامنه‌ی شنوایی انسان حدود ۲۰ تا ۲۰ هزار هرتز است.\",k:[\"شیپور استاش فشار گوش میانی را با هوا برابر می‌کند\",\"مجاری نیم‌دایره حرکت چرخشی سر را حس می‌کنند\",\"سلول‌های مویی در انسان بازسازی نمی‌شوند\"],x:\"صدای بسیار بلند سلول‌های مویی را آسیب می‌زند و کم‌شنوایی دائمی ایجاد می‌کند.\"}];\nvar S1=[\n[\"نورون‌ها با دندریت دریافت و با آکسون ارسال می‌کنند و در ماده‌ی خاکستری (جسم سلولی) و ماده‌ی سفید (آکسون‌های میلین‌دار) قرار دارند. سلول‌های گلیال: آستروسیت‌ها به ایجاد و حفظ سد خونی-مغزی کمک می‌کنند و قند و یون‌ها را مدیریت می‌کنند، الیگودندروسیت‌ها میلین می‌سازند و میکروگلیا ایمنی مغز است. سد خونی-مغزی با اتصال محکم سلول‌های درون‌پوشی مویرگ از ورود بیشتر مولکول‌ها جلوگیری می‌کند. مغز کم‌ذخیره‌ی انرژی است؛ چند دقیقه کمبود اکسیژن آسیب‌زاست.\",\"حافظه‌ی صریح در هیپوکامپ تثبیت می‌شود و در قشر ذخیره می‌گردد؛ آمیگدال هیجان‌ها (ترس) را ارزیابی می‌کند. در یادگیری، سیناپس‌ها با تقویت درازمدت (LTP) و گیرنده‌های NMDA تغییر می‌کنند. بیماری آلزایمر با رسوب پلاک آمیلوئید و کلافه‌ی تائو و از دست رفتن سیناپس همراه است؛ پارکینسون با مرگ نورون‌های دوپامینی جسم سیاه.\"],\n[\"بافت هادی: گره‌ی سینوسی-دهلیزی (ضربان‌ساز اولیه) ← گره‌ی دهلیزی-بطنی (تأخیر ۰٫۱ ثانیه برای پرشدن بطن‌ها) ← دسته‌ی هیس ← رشته‌های پورکنژ. نوار قلب (ECG): موج P (دپلاریزاسیون دهلیز)، کمپلکس QRS (بطن) و موج T (رپلاریزاسیون بطن). سلول‌های ماهیچه‌ی قلبی با دیسک‌های بینابینی و اتصال شکافی به هم وصل‌اند و مانند یک واحد (سین‌سیشیوم) منقبض می‌شوند. قلب میتوکندری فراوان دارد (۳۰٪ حجم سلول).\",\"سیستول و دیاستول چرخه‌ی ۰٫۸ ثانیه‌ای را می‌سازند (در ۷۵ ضربه بر دقیقه). قانون فرانک-استارلینگ: کشش بیشتر دیواره (پیش‌بار) انقباض قوی‌تر می‌دهد. بار بطن چپ (فشار آئورت) پس‌بار است. نارسایی قلب یعنی پمپ‌کردن ناکافی. فشار خون بالای مزمن، بطن را ضخیم می‌کند. سکته‌ی قلبی با تروپونین بالا در خون تشخیص داده می‌شود.\"],\n[\"مجاری هادی (تا نایژک‌های انتهایی) حدود ۱۵۰ میلی‌لیتر فضای مرده دارند و تبادل فقط در بخش تنفسی انجام می‌شود. سد خون-هوا بسیار نازک است (حدود ۰٫۵ میکرومتر) و گاز با انتشار از آن رد می‌شود. نسبت تهویه به خون‌رسانی (V/Q) برای تبادل بهینه مهم است؛ جاذبه آن را در قسمت‌های بالا و پایین ریه تغییر می‌دهد. مایع جنب فشار منفی را حفظ می‌کند و ورود هوا (پنوموتوراکس) ریه را جمع می‌کند.\",\"COPD (برونشیت مزمن و آمفیزم) اغلب از دود سیگار است و مجاری و آلوئول‌ها را تخریب می‌کند. در فیبروز ریوی بافت سفت می‌شود. سرطان ریه شایع‌ترین علت مرگ سرطانی در جهان است. سیستم دفاعی ریه: مخاط و مژک (پلکان مخاطی-مژکی) و ماکروفاژهای آلوئولی. اسپیرومتری حجم‌ها را اندازه می‌گیرد: FEV₁ و FVC.\"],\n[\"سلول اصلی کبد هپاتوسیت است و حدود ۸۰٪ حجم کبد را می‌سازد. کار متابولیکی: گلوکونئوژنز و گلیکوژنولیز (قند خون ثابت)، ساخت کلسترول و لیپوپروتئین‌ها، چرخه‌ی اوره (تبدیل NH₃ سمی به اوره)، ساخت فاکتورهای انعقادی و آلبومین (فشار اسمزی پلاسما) و ذخیره‌ی آهن و ویتامین‌های A, D, B12. فاز I (سیتوکروم P450) و فاز II (کونژوگاسیون) داروها و سموم را برای دفع محلول می‌کنند.\",\"بیلی‌روبین حاصل از تجزیه‌ی هِم گلبول‌های قرمز در کبد کونژوگه و با صفرا ترشح می‌شود؛ تجمع آن در خون زردی می‌دهد. هپاتیت (ویروس A تا E، الکل، سموم) التهاب کبد است و سیروز یعنی جایگزینی بافت با اسکار. کبد چرب غیرالکلی با چاقی شایع است. سلول‌های کوپفر ماکروفاژهای کبدند. کبد تا ۷۰٪ برداشته‌شدنی است و بازسازی می‌شود.\"],\n[\"تنظیم ترشح: فاز سری (دیدن و بوییدن غذا)، فاز معده‌ای (کشش و پپتیدها ← گاسترین ← HCl) و فاز روده‌ای (بازخورد منفی). HCl پپسینوژن را فعال و باکتری‌ها را نابود می‌کند. پمپ پروتون H⁺/K⁺-ATPase سلول جداری اسید را ترشح می‌کند و داروهایی مانند امپرازول آن را مهار می‌کنند. مخاط با ترشح بی‌کربنات، موکوس و پروستاگلاندین‌ها محافظت می‌شود.\",\"داروهایی مانند آسپیرین پروستاگلاندین را کم و خطر زخم را زیاد می‌کنند. ریفلاکس معده-مری با ضعف اسفنکتر تحتانی مری ایجاد می‌شود و سوزش سردل می‌دهد. سرطان معده با هلیکوباکتر و رژیم پرنمک ارتباط دارد. گرلین (هورمون گرسنگی) از معده ترشح می‌شود و لپتین (سیری) از بافت چربی.\"],\n[\"هضم نهایی: آنزیم‌های حاشیه‌ی مسواکی (مالتاز، ساکاراز، لاکتاز، پپتیدازها) دی‌ساکاریدها و دی‌پپتیدها را به واحدهای جذب‌شدنی می‌شکنند. جذب: گلوکز و گالاکتوز با SGLT1 (وابسته به سدیم)، فروکتوز با GLUT5، آمینواسیدها با ناقل‌های وابسته به سدیم و چربی‌ها به صورت میسل و سپس شیلومیکرون. آهن و کلسیم (با کمک ویتامین D) بیشتر در دوازدهه و B12 در ایلئوم جذب می‌شود.\",\"جنبش‌ها: قطعه‌قطعه‌شدن (مخلوط‌کردن) و حرکت دودی (پریستالسیس) با سیستم عصبی روده‌ای (شبکه‌ی میانتریک و زیرمخاطی) هماهنگ می‌شود. هورمون‌های روده: سکرتین، CCK، GIP و GLP-1 (هدف داروهای دیابت و کاهش وزن). عدم تحمل لاکتوز و بیماری کرون و سلیاک بیماری‌های شایع‌اند.\"],\n[\"مخاط کولون پرز ندارد و غدد پر از سلول جام (موکوس) دارد. جذب آب با انتقال سدیم و اسمز انجام می‌شود. اسهال کاهش جذب یا افزایش ترشح است و یبوست کند بودن حرکت. میکروبیوم بیشتر شامل باکتری‌هایی از شاخه‌های باکتروئیدوتا و فیرمیکوتس و سرده‌ی بیفیدوباکتریوم است؛ تخمیر فیبر بوتیرات برای سلول‌های کولون می‌دهد و بر ایمنی و حتی حالت روانی (محور روده-مغز) اثر دارد.\",\"رفلکس مدفوع‌دفع با کشش راست‌روده و اسفنکترهای داخلی (غیرارادی) و خارجی (ارادی) انجام می‌شود. پولیپ‌ها می‌توانند طی سال‌ها به سرطان تبدیل شوند (توالی آدنوم-کارسینوم). بیماری التهابی روده (کرون و کولیت اولسراتیو) با واکنش نابجای سامانه‌ی ایمنی همراه است. پیوند میکروبیوم مدفوعی برای عفونت کلستریدیوم دیفیسیل به کار می‌رود.\"],\n[\"کنترل هورمونی: کولسیستوکینین (CCK) از دوازدهه با ورود چربی آنزیم‌ها را برمی‌انگیزد و سکرتین بی‌کربنات را. گلوکز بالا انسولین را از سلول‌های β آزاد می‌کند (کانال K⁺ حساس به ATP بسته می‌شود، سلول دپلاریزه، Ca²⁺ وارد و وزیکول‌ها آزاد می‌شوند). انسولین ورود گلوکز به عضله و چربی (GLUT4) و ساخت گلیکوژن را زیاد می‌کند. گلوکاگون برعکس در کبد گلیکوژن را تجزیه می‌کند.\",\"دیابت نوع ۱: تخریب خودایمنی سلول‌های β (نیاز به انسولین)؛ نوع ۲: مقاومت به انسولین و ناتوانی تدریجی β. HbA1c میانگین قند ۲ تا ۳ ماه را نشان می‌دهد. پیوند جزایر لانگرهانس و پمپ انسولین از درمان‌هاست. سرطان پانکراس اغلب دیر تشخیص داده می‌شود.\"],\n[\"نفرون: کپسول بومن و گلومرول (مویرگ‌ها با منافذ، غشای پایه‌ی بارمنفی و سلول‌های پودوسیت) ← لوله‌ی پیچ‌خورده‌ی نزدیک (بازجذب ۶۵٪ سدیم و آب، گلوکز و آمینواسید با انتقال ثانویه) ← قوس هنله (شاخه‌ی نزولی نفوذپذیر به آب، صعودی نفوذپذیر به نمک و فعال) ← لوله‌ی دور ← مجرای جمع‌کننده. با سازوکار ضدجریان و اوره، مدولا غلیظ می‌شود (تا ۱۲۰۰ میلی‌اسمول) و بدن می‌تواند ادرار غلیظ بسازد. GFR طبیعی حدود ۱۲۵ میلی‌لیتر در دقیقه است.\",\"تنظیم: ADH آکواپورین ۲ را در مجرای جمع‌کننده می‌گذارد و بازجذب آب را زیاد می‌کند؛ آلدوسترون جذب Na⁺ و دفع K⁺ را زیاد می‌کند؛ ANP (از دهلیز) دفع سدیم را زیاد می‌کند. کلیه pH را با دفع H⁺ و بازجذب HCO₃⁻ تنظیم می‌کند. بیماری‌ها: نفریت، سنگ، عفونت ادراری، نارسایی مزمن (دیابت و فشار خون علت اصلی‌اند).\"],\n[\"لایه‌های اپیدرم از پایین: پایه، خاردار، دانه‌دار، شفاف (در کف دست و پا) و شاخی. کراتین ضدآب است. حس لامسه: مرکل، میسنر، پاچینی و روفینی؛ درد و دما: پایانه‌های آزاد عصبی. غده‌های اکرین (عرق، دمایی) و آپوکرین (زیربغل، فرومونی) و سباسه (سبوم). مو و ناخن مشتقات کراتینی‌اند. پوست حدود ۱۵۰ میلی‌لیتر عرق برای خنک‌کردن در هر ساعت (در گرما) ترشح می‌کند.\",\"ترمیم زخم: انعقاد، التهاب، تکثیر (بافت دانه‌ای و مهاجرت کراتینوسیت‌ها) و بازسازی (کلاژن). سوختگی درجه‌ی ۱ فقط اپیدرم، درجه‌ی ۲ درم و درجه‌ی ۳ تمام ضخامت را درگیر می‌کند. اشعه‌ی UVB باعث ساخت ویتامین D می‌شود ولی مقدار زیاد جهش DNA (دیمر تیمین) و سرطان پوست (بازال‌سل، سنگفرشی و ملانوم) ایجاد می‌کند. پوست میکروبیوم خاص خود را دارد.\"],\n[\"پیام نوری: در تاریکی، رودوپسین (اپسین + رتینال) فعال‌نشده است و استوانه‌ها دپلاریزه‌اند و ناقل را آزاد می‌کنند؛ با فتون، رتینال شکل عوض می‌کند، آبشار ترانسدوسین ← فسفودی‌استراز cGMP را می‌شکند، کانال‌ها بسته می‌شوند و سلول هیپرپلاریزه می‌شود. پس شبکیه به شکل غیرمعمول با هیپرپلاریزه شدن پاسخ می‌دهد. سه نوع مخروط (آبی، سبز، قرمز) رنگ را می‌سازند؛ کوررنگی قرمز-سبز وابسته به X است.\",\"اپتیک: قدرت شکست قرنیه حدود ۴۳ دیوپتر و عدسی ۱۵ تا ۲۰ است. دوربینی (تصویر پشت شبکیه، عدسی محدب)، آستیگماتیسم (قرنیه‌ی نایکنواخت)، پیرچشمی (سفت‌شدن عدسی). آب مروارید کدر شدن عدسی و آب سیاه (گلوکوم) افزایش فشار چشم و تخریب عصب بینایی است. تقاطع عصب‌ها در کیاسمای بینایی باعث می‌شود نیمکره‌ی راست میدان دید چپ را ببیند.\"],\n[\"مسیر شنوایی: ارتعاش پرده ← استخوانچه‌ها (تقویت حدود ۲۰ برابر) ← دریچه‌ی بیضی ← مایع پری‌لنف ← غشای قاعده‌ای ← خم‌شدن مژک‌های سلول مویی ← باز شدن کانال یونی ← پیام در عصب حلزونی ← هسته‌های ساقه‌ی مغز ← تالاموس ← قشر شنوایی (لوب گیجگاهی). سلول‌های مویی بیرونی صدا را تقویت می‌کنند. شدت صدا با دسی‌بل اندازه‌گیری می‌شود؛ مکالمه‌ی عادی حدود ۶۰ و بالاتر از ۸۵ دسی‌بل پس از ساعت‌ها آسیب‌زاست.\",\"تعادل: اوتریکل و ساکول (سنگریزه‌های کلسیمی اوتولیت) شتاب خطی و جاذبه را حس می‌کنند و سه مجرای نیم‌دایره با مایع شتاب زاویه‌ای سر را. در BPPV سنگریزه‌ها جابه‌جا می‌شوند و سرگیجه‌ی ناگهانی می‌دهند. عفونت گوش میانی (اوتیت) در کودکان شایع است. سمعک و کاشت حلزون (الکترود در حلزون) کم‌شنوایی شدید را جبران می‌کنند.\"]];\nvar i=D.findIndex(function(c){return c.id===\"human\"})+1;\nD.splice(i,0,ch);X.org=X1;S.org=S1;\n})();\n\nvar ADV={\nmol:[\n\"زاویه‌ی پیوند H–O–H در مولکول آب حدود ۱۰۴٫۵ درجه است و هر مولکول می‌تواند با چهار مولکول دیگر پیوند هیدروژنی بسازد. در یخ این پیوندها یک شبکه‌ی چهاروجهی منظم و پرفضا می‌سازند که چگالی را از آب مایع (بیشینه در ۴ درجه‌ی سانتی‌گراد) کمتر می‌کند. گرمای نهان تبخیر آب حدود ۲۲۶۰ کیلوژول بر کیلوگرم است. کشش سطحی بالا، چسبندگی و پیوستگی، به همراه خاصیت مویینگی، صعود آب در آوندهای چوبی را توضیح می‌دهند (نظریه‌ی چسبندگی-پیوستگی-تعرق). آب همچنین در واکنش‌ها شرکت می‌کند: در آبکافت، پیوند ساختارهای بزرگ با افزودن آب شکسته می‌شود و در سنتز آبگیری، با خروج آب پیوند می‌سازد.\\n\\nثابت یونش آب باعث می‌شود pH خالص ۷ باشد؛ سامانه‌های بافری مانند بی‌کربنات و هموگلوبین pH خون را در ۷٫۳۵ تا ۷٫۴۵ نگه می‌دارند و تغییر فقط ۰٫۳ واحد می‌تواند کشنده باشد.\",\n\"تک‌قندی‌ها بر پایه‌ی تعداد کربن (تری‌اوز، پنتوز، هگزوز) و گروه عاملی (آلدوز یا کتوز) رده‌بندی می‌شوند. گلوکز آلدوهگزوز و فروکتوز کتوهگزوز است؛ هر دو فرمول C₆H₁₂O₆ دارند ولی ایزومرند. گلوکز در محلول به شکل حلقوی (آلفا و بتا) وجود دارد و تفاوت آلفا و بتا در جهت گروه هیدروکسیل کربن ۱ است. نشاسته مخلوطی از آمیلوز (پیوند α-۱٬۴ خطی) و آمیلوپکتین (با انشعاب α-۱٬۶) است؛ گلیکوژن شاخه‌های بیشتر دارد و آزادسازی سریع‌تر گلوکز را ممکن می‌کند. در سلولز پیوند β-۱٬۴ باعث می‌شود هر گلوکز نسبت به قبلی ۱۸۰ درجه بچرخد و رشته‌های راست با پیوندهای هیدروژنی بین‌زنجیره‌ای میکروفیبریل مستحکم بسازند.\\n\\nکیتین، پلی‌ساکارید دارای نیتروژن، دیواره‌ی قارچ‌ها و اسکلت بیرونی بندپایان را می‌سازد. پپتیدوگلیکان دیواره‌ی باکتری‌ها از قند و آمینواسید ساخته شده است.\",\n\"تری‌گلیسرید از استری‌شدن سه اسید چرب با گلیسرول ساخته می‌شود. اسیدهای چرب سیرشده پیوند دوگانه ندارند و زنجیره‌ی مستقیم‌شان در دمای اتاق جامد است؛ نوع سیرنشده با پیوند دوگانه‌ی cis خمیده است و مایع می‌ماند. چربی‌های ترانس که با هیدروژن‌دار کردن صنعتی ساخته می‌شوند خطر بیماری قلبی را بالا می‌برند. اسیدهای چرب ضروری مانند لینولئیک و آلفا-لینولنیک را بدن نمی‌سازد. فسفولیپیدها در آب میسل یا دولایه می‌سازند. کلسترول در غشای جانوری میان دم‌ها قرار می‌گیرد: در دمای بالا سیالیت را کم و در دمای پایین از انجماد غشا جلوگیری می‌کند.\\n\\nاستروئیدهایی مانند تستوسترون، استروژن و کورتیزول همگی از کلسترول ساخته می‌شوند و چون آب‌گریزند، از غشا می‌گذرند و به گیرنده‌ی درون سلولی می‌چسبند و بیان ژن را تغییر می‌دهند.\",\n\"پیوند پپتیدی یک پیوند آمیدی است که بین گروه کربوکسیل یک آمینواسید و گروه آمین بعدی به‌وسیله‌ی ریبوزوم ساخته می‌شود و ویژگی دوگانه‌ی نسبی دارد؛ همین سبب می‌شود چرخش حول آن محدود و ساختار صفحه‌ای باشد. ساختار دوم با پیوند هیدروژنی میان اسکلت‌های پپتیدی پایدار می‌شود: مارپیچ α هر ۳٫۶ آمینواسید یک دور می‌چرخد. ساختار سوم را برهم‌کنش‌های زنجیره‌های جانبی (آب‌گریز در مرکز، پل دی‌سولفیدی بین سیستئین‌ها، پیوند یونی) تعیین می‌کند. پروتئین‌های همراه (شاپرون) به تاخوردگی درست کمک می‌کنند و تاخوردگی نادرست در بیماری‌هایی مانند آلزایمر و بیماری پریونی نقش دارد.\\n\\nدر هموگلوبین چهار زنجیره (دو آلفا و دو بتا) و چهار گروه هم حاوی آهن هست و اتصال O₂ همیاری مثبت دارد: اتصال اولین مولکول، اتصال بعدی را آسان‌تر می‌کند و نمودار اشباع سیگموئیدی می‌شود.\",\n\"باز آلی در DNA و RNA شامل پورین‌ها (آدنین و گوانین، دو حلقه) و پیریمیدین‌ها (سیتوزین، تیمین، اوراسیل، یک حلقه) است. نوکلئوتیدها با پیوند فسفودی‌استر بین کربن ۳' یک قند و کربن ۵' قند بعدی متصل می‌شوند و رشته جهت‌دار می‌شود (۵' به ۳'). در DNA مارپیچ B هر دور حدود ۱۰٫۵ جفت باز دارد و قطر آن ۲ نانومتر است. وجود گروه هیدروکسیل ۲' در ریبوز، RNA را نسبت به آبکافت ناپایدارتر می‌کند. چندین نوع RNA وجود دارد: mRNA، tRNA، rRNA، و RNAهای کوچک تنظیمی مانند miRNA.\\n\\nATP با آبکافت پیوند فسفات انتهایی حدود ۳۰٫۵ کیلوژول بر مول انرژی آزاد می‌کند. NAD و FAD نیز نوکلئوتید‌های ناقل الکترون‌اند.\",\n\"در مدل «قفل و کلید»، شکل پیش‌ماده کاملاً با جایگاه فعال سازگار است ولی در مدل «تناسب القایی» اتصال پیش‌ماده شکل جایگاه را تغییر می‌دهد و واکنش را به سمت حالت گذار می‌برد. سرعت واکنش آنزیمی با معادله‌ی میکائیلیس-منتن توصیف می‌شود: V = Vmax·[S] / (Km + [S]) و Km غلظتی از پیش‌ماده است که سرعت را به نصف بیشینه می‌رساند و هرچه کوچک‌تر باشد میل ترکیبی بالاتر است. بازدارنده‌ی رقابتی با پیش‌ماده بر سر جایگاه فعال می‌جنگد و با افزایش پیش‌ماده اثرش کم می‌شود؛ بازدارنده‌ی غیررقابتی به جایگاه دیگری می‌چسبد و Vmax را کاهش می‌دهد. در بازدارندگی بازخوردی، فرآورده‌ی نهایی مسیر آنزیم نخست را مهار می‌کند.\\n\\nبسیاری از آنزیم‌ها به هم‌آنزیم‌هایی مانند NAD⁺ و فلزاتی مثل Zn²⁺ نیاز دارند و ویتامین‌های گروه B پیش‌ساز هم‌آنزیم‌ها هستند.\"],\n\ncell:[\n\"سلول باکتریایی سیتوپلاسم، غشا، دیواره، ریبوزوم 70S و نوکلئوئید دارد. ریبوزوم یوکاریوت 80S است و این تفاوت پایه‌ی کار بسیاری از آنتی‌بیوتیک‌ها (مثل تتراسایکلین) است که ریبوزوم باکتری را هدف می‌گیرند. سلول یوکاریوتی علاوه بر هسته، شبکه‌ی غشایی داخلی دارد که بخش‌بندی را ممکن می‌کند. نسبت سطح به حجم در سلول کوچک بالاست و تبادل سریع‌تر انجام می‌شود، بنابراین سلول‌ها با رشد، تقسیم می‌شوند تا این نسبت از دست نرود. آرکی‌ها اگرچه پیش‌هسته‌ای‌اند، رونویسی و پروتئین‌های هیستون‌مانند آن‌ها شبیه یوکاریوت‌هاست.\\n\\nپروتئین‌های اسکلت سلولی FtsZ در باکتری‌ها هم‌ارز توبولین و MreB هم‌ارز اکتین‌اند. این نشان می‌دهد اسکلت سلولی تاریخچه‌ی بسیار کهنی دارد.\",\n\"هسته با دو غشا (پوشش هسته) پوشیده شده و منفذهای هسته‌ای ورود و خروج مولکول‌ها را کنترل می‌کنند. RNA ریبوزومی در هستک ساخته می‌شود. ریبوزوم‌های آزاد پروتئین‌های سیتوزولی و ریبوزوم‌های روی شبکه‌ی زبر پروتئین‌های ترشحی و غشایی می‌سازند؛ آن‌ها به کمک توالی سیگنال به شبکه هدایت می‌شوند. گلژی دارای سمت cis (ورودی) و trans (خروجی) است و گلیکوزیلاسیون و بسته‌بندی در وزیکول‌ها را انجام می‌دهد. لیزوزوم حدود ده‌ها آنزیم هیدرولاز اسیدی (pH نزدیک ۵) دارد و پراکسی‌زوم H₂O₂ را با کاتالاز تجزیه می‌کند.\\n\\nمیتوکندری DNA حلقوی و ریبوزوم 70S خود را دارد و تقریباً تنها از مادر به ارث می‌رسد. در کلروپلاست، تیلاکوئیدها به صورت دسته‌های گرانا قرار گرفته‌اند.\",\n\"دولایه‌ی فسفولیپیدی حدود ۷ تا ۸ نانومتر ضخامت دارد. در مدل موزاییک سیال سینگر و نیکولسون، پروتئین‌ها در غشا شناورند و مولکول‌ها در سطح می‌توانند جابه‌جا شوند. پروتئین‌های انتگرال سراسر غشا را می‌پیمایند (اغلب با مارپیچ‌های آلفا) و پروتئین‌های محیطی در سطح‌اند. سیالیت غشا به دما، میزان اسیدهای چرب سیرنشده و کلسترول بستگی دارد. اتصالات سلولی شامل اتصال محکم (آب‌بندی)، دسموزوم (چسبندگی مکانیکی) و اتصال شکافی (کانال ارتباطی) است. گیرنده‌های غشایی پیام‌های شیمیایی را از طریق پیک ثانویه‌ای مانند cAMP به درون سلول می‌رسانند.\\n\\nدر گیاهان، دیواره‌ی نخستین سلولز و پکتین دارد و تیغه‌ی میانی سلول‌ها را به هم می‌چسباند؛ پلاسمودسم‌ها سیتوپلاسم سلول‌های مجاور را به هم وصل می‌کنند.\",\n\"در انتشار تسهیل‌شده، پروتئین‌های ناقل مثل GLUT برای گلوکز و کانال‌های آکواپورین برای آب در جهت شیب غلظت کار می‌کنند. اسمز را با پتانسیل آب (Ψ) توصیف می‌کنند که برابر مجموع پتانسیل املاح و فشار است. سلول گیاهی در محیط هیپوتونیک فشار تورژسانس می‌گیرد و دیواره مانع ترکیدن می‌شود؛ سلول جانوری در همین محیط می‌ترکد. پمپ سدیم-پتاسیم (Na⁺/K⁺-ATPase) با هر چرخه ۳ سدیم را بیرون و ۲ پتاسیم را داخل می‌برد و شیب الکتروشیمیایی می‌سازد. انتقال فعال ثانویه از این شیب برای انتقال هم‌سو (سیم‌پورت) گلوکز در روده استفاده می‌کند.\\n\\nدر اندوسیتوز با واسطه‌ی گیرنده، مولکول‌هایی مانند LDL به گیرنده می‌چسبند و حفره‌های پوشیده از کلاترین وزیکول می‌سازند؛ نقص این گیرنده سبب هیپرکلسترولمی خانوادگی می‌شود.\",\n\"گلیکولیز در ده مرحله یک گلوکز (۶ کربنه) را به دو پیرووات می‌شکند و خالص ۲ ATP و ۲ NADH می‌دهد. پیرووات وارد ماتریکس میتوکندری می‌شود، به استیل-کوآ تبدیل می‌شود و CO₂ آزاد می‌کند. چرخه‌ی کربس هر دور ۳ NADH، ۱ FADH₂ و ۱ ATP (یا GTP) می‌سازد. در زنجیره‌ی انتقال الکترون در غشای درونی، الکترون‌ها از کمپلکس‌ها می‌گذرند و پروتون‌ها را به فضای بین‌غشایی می‌رانند؛ بازگشت پروتون از ATP سنتاز، ATP می‌سازد (کموسموز، فرضیه‌ی میچل). حاصل کل نظری حدود ۳۰ تا ۳۲ ATP برای هر گلوکز است. سیانید کمپلکس IV را مهار می‌کند و باعث مرگ سریع می‌شود.\\n\\nدر تخمیر لاکتیکی، پیرووات با NADH به لاکتات تبدیل و NAD⁺ بازسازی می‌شود تا گلیکولیز ادامه یابد. در فتوسنتز، فتوسیستم II آب را می‌شکند و فتوسیستم I NADPH می‌سازد و در چرخه‌ی کالوین برای هر ۶ CO₂ یک گلوکز با مصرف ۱۸ ATP و ۱۲ NADPH ساخته می‌شود.\",\n\"چرخه‌ی سلولی به‌وسیله‌ی سیکلین‌ها و کیناز‌های وابسته به سیکلین (CDK) کنترل می‌شود. در نقاط وارسی G1/S، G2/M و میانی M، سلول بررسی می‌کند که DNA سالم و کروموزوم‌ها درست متصل باشند. پروتئین p53 «نگهبان ژنوم» است و در صورت آسیب DNA چرخه را متوقف یا آپوپتوز را آغاز می‌کند؛ جهش p53 در بیش از نیمی از سرطان‌ها دیده می‌شود. در میتوز، دوک تقسیم از ریزلوله‌ها ساخته می‌شود و سانترومر محل اتصال کینه‌توکور است. در پروفاز I میوز، کروموزوم‌های همتا تتراد می‌سازند و کراسینگ‌اور در کیاسما رخ می‌دهد. جدانشدن کروموزوم‌ها (نان‌دیسجانکشن) به سندرم داون (تریزومی ۲۱) می‌انجامد.\\n\\nآپوپتوز مرگ برنامه‌ریزی‌شده با کاسپازهاست و در تکوین، مثلاً از بین بردن پرده‌ی بین انگشتان جنین، نقش دارد.\"],\n\ngen:[\n\"قطر مارپیچ ۲ نانومتر و فاصله‌ی هر جفت باز ۰٫۳۴ نانومتر است. در مارپیچ شیارهای بزرگ و کوچک وجود دارند و پروتئین‌های تنظیمی از شیار بزرگ توالی را می‌شناسند. قانون چارگاف می‌گوید در DNA دو رشته‌ای A=T و G=C است. در هسته، ۱۴۷ جفت باز DNA دور هشت‌تایی هیستونی می‌پیچد و نوکلئوزوم می‌سازد؛ فشرده‌سازی بعدی رشته‌ی ۳۰ نانومتری و حلقه‌ها را می‌سازد. هتروکروماتین فشرده و غیرفعال و یوکروماتین بازتر و فعال است. تلومرها توالی‌های تکراری انتهای کروموزوم‌اند (TTAGGG در انسان) و با هر تقسیم کوتاه می‌شوند، مگر آنکه تلومراز فعال باشد.\\n\\nDNA میتوکندری حلقوی و ۱۶٫۵ هزار جفت باز دارد و ۳۷ ژن را رمز می‌کند.\",\n\"همانندسازی دو‌جهته از چندین نقطه‌ی آغاز در یوکاریوت‌ها شروع می‌شود و حباب همانندسازی می‌سازد. توپوایزومراز فشار پیچشی جلوی چنگال را برمی‌دارد و پروتئین‌های SSB رشته‌ی باز‌شده را پایدار نگه می‌دارند. پرایماز RNA آغازگر می‌سازد، DNA پلیمراز III (در باکتری) از انتهای ۳' آن ادامه می‌دهد و DNA پلیمراز I آغازگر را برمی‌دارد. DNA پلیمرازها فعالیت ویرایشی ۳'→۵' دارند و خطا را به حدود ۱ در ۱۰⁷ می‌رسانند و سامانه‌ی ترمیم ناجور آن را به حدود ۱ در ۱۰⁹ می‌رساند. مسئله‌ی انتهای کروموزوم خطی را تلومراز با RNA الگوی داخلی خود حل می‌کند.\\n\\nآزمایش میزلسون و استال با نیتروژن سنگین ¹⁵N و ¹⁴N نیمه‌حفاظتی بودن همانندسازی را اثبات کرد.\",\n\"رونویسی در سه مرحله‌ی آغاز، طویل‌شدن و پایان انجام می‌شود. در باکتری‌ها فاکتور سیگما RNA پلیمراز را به راه‌انداز می‌رساند و در یوکاریوت‌ها RNA پلیمراز II با عوامل رونویسی عمومی و جایگاه TATA کار می‌کند. پیش‌ساز mRNA کلاهک ۵' و دم پلی‌آدنین ۳' می‌گیرد و اینترون‌ها با اسپلایسوزوم حذف می‌شوند؛ اسپلایس دگرگزین باعث می‌شود یک ژن چند پروتئین بسازد. رمزگان ۶۴ حالت دارد: ۶۱ رمزه آمینواسید را و ۳ رمزه‌ی UAA، UAG و UGA پایان را مشخص می‌کنند. ترجمه سه مرحله دارد: آغاز با Met و AUG، طویل‌شدن با جایگاه‌های A، P و E و پایان با فاکتور رهاسازی.\\n\\nدر اپرون لاک باکتری، لاکتوز القاگر است و پروتئین مهارکننده را از اپراتور جدا می‌کند و ژن‌های تجزیه‌ی لاکتوز بیان می‌شوند.\",\n\"مندل دو قانون استخراج کرد: جدا شدن اَلل‌ها در تشکیل گامت و جور شدن مستقل. تلاقی آزمون (با والد هموزیگوت نهفته) ژنوتیپ فرد با فنوتیپ غالب را معلوم می‌کند. احتمال‌ها مستقل‌اند و با قاعده‌ی ضرب ترکیب می‌شوند: احتمال AaBb×AaBb برای aabb برابر ¼×¼ = ۱/۱۶ است. بعدها با تعیین جایگاه ژن روی کروموزوم و نظریه‌ی کروموزومی وراثت (مورگان با مگس سرکه) روشن شد که جور شدن مستقل فقط برای ژن‌هایی است که روی کروموزوم‌های متفاوت یا فاصله‌ی دور قرار دارند.\\n\\nشجره‌نامه‌ها برای تحلیل الگوی وراثت (اتوزومی غالب، اتوزومی نهفته، وابسته به X) به کار می‌روند و اغلب نشانگرهای بیماری‌های ژنتیکی را آشکار می‌کنند.\",\n\"در وراثت چندژنی مانند قد، صفت پیوسته است و توزیع زنگوله‌ای دارد. اثر متقابل ژن‌ها (اپیستازی) زمانی رخ می‌دهد که ژنی بیان ژن دیگر را بپوشاند، مثل رنگ موی لابرادور. در گروه خونی ABO، اَلل‌های I^A و I^B هم‌توان‌اند و i نهفته است. گروه Rh با اَلل غالب D مشخص می‌شود و ناسازگاری Rh مادر منفی با جنین مثبت می‌تواند به بیماری همولیتیک نوزاد بینجامد. کوررنگی در مردان با فراوانی حدود ۸٪ و زنان حدود ۰٫۵٪ دیده می‌شود. غیرفعال‌شدن تصادفی یکی از X ها در زنان (اجسام بار) موجب موزاییک بودن ظاهر می‌شود، مانند گربه‌ی سه‌رنگ.\\n\\nاثر محیط نیز مهم است: دمای محیط رنگ خز خرگوش هیمالیایی را تعیین می‌کند.\",\n\"جهش‌های جانشینی می‌توانند بی‌معنی (رمزه‌ی پایان)، دگرمعنا (آمینواسید متفاوت) یا خاموش باشند. جهش‌های درج و حذف باعث تغییر چارچوب خواندن می‌شوند. انواع جهش‌های کروموزومی: حذف، مضاعف‌شدگی، وارونگی و جابه‌جایی. در ترمیم DNA، سامانه‌ی برداشت نوکلئوتید دیمرهای تیمین ناشی از پرتو فرابنفش را اصلاح می‌کند و نقص آن در بیماری گزرودرما پیگمنتوزوم مشاهده می‌شود. اپی‌ژنتیک شامل متیلاسیون DNA (غالباً خاموش‌کننده) و تغییر هیستون‌هاست. در CRISPR-Cas9، RNA راهنما (gRNA) حدود ۲۰ نوکلئوتید دارد و Cas9 دو رشته را می‌برد و ترمیم سلول می‌تواند ژن را غیرفعال یا اصلاح کند.\\n\\nژن‌درمانی با ناقل‌های ویروسی (AAV) ژن سالم را به سلول می‌رساند و برای برخی بیماری‌های ارثی تأیید شده است.\"],\n\nmic:[\n\"دیواره‌ی باکتری‌های گرم مثبت لایه‌ی ضخیم پپتیدوگلیکان با اسید تایکوییک دارد و رنگ بنفش کریستال ویوله را نگه می‌دارد؛ گرم منفی‌ها لایه‌ی نازک و غشای بیرونی با لیپوپلی‌ساکارید (اندوتوکسین) دارند. پنی‌سیلین سنتز پپتیدوگلیکان را مهار می‌کند. باکتری‌ها تولیدمثل غیرجنسی دارند ولی انتقال ژن افقی از راه تبدیل، ترنسداکشن و کونژوگاسیون انجام می‌شود. اپرون‌ها ژن‌ها را هماهنگ کنترل می‌کنند. باکتری‌ها با تشکیل زیست‌لایه (بیوفیلم) در برابر آنتی‌بیوتیک و ایمنی مقاوم‌تر می‌شوند. سیانوباکتری‌ها حدود ۲٫۵ میلیارد سال پیش اکسیژن را در جو افزایش دادند.\\n\\nمیکروبیوم روده ویتامین K و بعضی B را می‌سازد و بر ایمنی، متابولیسم و حتی خلق‌وخو اثر دارد.\",\n\"ویروس‌ها بر اساس نوع ژنوم دسته‌بندی می‌شوند: DNA یا RNA، یک‌رشته‌ای یا دو‌رشته‌ای. چرخه‌ی لیتیک سلول را می‌ترکاند، در چرخه‌ی لیزوژنیک ژنوم ویروس در DNA میزبان ادغام می‌شود و پروفاژ می‌سازد. HIV رتروویروس است: آنزیم نسخه‌بردار معکوس از RNA، DNA می‌سازد و ادغام‌کننده آن را در ژنوم جا می‌دهد و گیرنده‌ی CD4 لنفوسیت T کمک‌کننده را هدف می‌گیرد؛ کاهش این سلول‌ها ایمنی را فرو می‌ریزد. ویروس آنفلوآنزا ژنوم قطعه‌قطعه دارد و ترکیب قطعات (جابه‌جایی آنتی‌ژنی) سویه‌های جدید و پاندمی می‌سازد. درمان‌های ضدویروسی مانند مهارکننده‌های پروتئاز و پلیمراز آنزیم‌های ویژه‌ی ویروس را هدف می‌گیرند.\\n\\nپریون‌ها پروتئین‌های بد‌تاخورده‌ای هستند که بدون اسید نوکلئیک بیماری ایجاد می‌کنند، مانند جنون گاوی.\",\n\"قارچ‌ها از هاگ‌ها زاده می‌شوند و ریسه (هیف) دیواره‌ی کیتینی دارد. برخی ریسه‌ها دیواره‌ی عرضی ندارند (هم‌بافت). قارچ‌ها در بیرون سلول آنزیم‌های گوارشی ترشح می‌کنند و مواد را جذب می‌کنند. شاخه‌های اصلی: زیگومیکوتا (کپک نان)، آسکومیکوتا (مخمر، پنی‌سیلیوم)، بازیدیومیکوتا (قارچ‌های خوراکی). گلسنگ همزیستی قارچ و جلبک یا سیانوباکتری است. در آغازیان، دینوفلاژله‌ها در شکوفایی جلبکی (جزر و مد قرمز) سم تولید می‌کنند و فورامینیفرها پوسته‌ی آهکی دارند. پلاسمودیوم چرخه‌ی پیچیده‌ای میان پشه (آنوفل) و کبد و گلبول‌های قرمز انسان دارد.\\n\\nقارچ‌کش‌ها و داروهای ضدقارچ باید اختصاصی عمل کنند چون سلول قارچ و انسان هر دو یوکاریوت‌اند.\",\n\"پاسخ ذاتی شامل گیرنده‌هایی مانند TLR است که الگوهای مولکولی مشترک میکروب‌ها (مثلاً لیپوپلی‌ساکارید) را می‌شناسند. نوتروفیل‌ها فراوان‌ترین گلبول سفیدند و اولین سلول‌هایی هستند که به محل عفونت می‌رسند. ماکروفاژها و سلول‌های دندریتیک علاوه بر بلع، آنتی‌ژن را به لنفوسیت T ارائه می‌کنند. سلول‌های کشنده‌ی طبیعی (NK) سلول‌های فاقد MHC یا آلوده را از بین می‌برند. دستگاه مکمل چند ده پروتئین پلاسماست که با فعال‌شدن زنجیره‌ای، میکروب را نشانه‌گذاری و سوراخ می‌کند. اینترفرون‌ها پیک‌های ضدویروس‌اند. تب با ترشح اینترلوکین-۱ و پیروژن‌ها از ماکروفاژها آغاز می‌شود.\\n\\nالتهاب مزمن در بیماری‌هایی مانند آترواسکلروز و دیابت نوع ۲ نقش دارد.\",\n\"مولکول‌های MHC (در انسان HLA) آنتی‌ژن را به لنفوسیت T ارائه می‌کنند: MHC-I روی همه‌ی سلول‌های هسته‌دار برای T کشنده (CD8) و MHC-II روی سلول‌های ارائه‌دهنده برای T کمک‌کننده (CD4). تنوع گیرنده‌های لنفوسیتی از نوترکیبی V(D)J ژن‌ها به وجود می‌آید و میلیاردها گیرنده‌ی متفاوت پدید می‌آورد. انتخاب کلونی: آنتی‌ژن لنفوسیتی را که گیرنده‌ی مناسب دارد فعال و تکثیر می‌کند. پادتن‌ها پنج رده‌اند: IgG (فراوان‌ترین و عبور از جفت)، IgM (پاسخ اول)، IgA (مخاط و شیر)، IgE (آلرژی) و IgD. پادتن‌های تک‌دودمانی در درمان سرطان کاربرد دارند. در پیوند اعضا ناسازگاری HLA موجب رد پیوند می‌شود.\\n\\nپاسخ اولیه چند روز طول می‌کشد، اما پاسخ ثانویه با سلول‌های حافظه در چند ساعت و با تیتر بسیار بالاتر انجام می‌شود.\",\n\"واکسن‌ها انواعی دارند: زنده‌ی تضعیف‌شده (سرخک)، غیرفعال (فلج اطفال تزریقی)، زیرواحد پروتئینی (هپاتیت B)، توکسوئید (کزاز) و mRNA یا ناقل ویروسی. افزودنی‌هایی به نام ادجوانت پاسخ ایمنی را تقویت می‌کنند. آستانه‌ی ایمنی جمعی بسته به عدد تکثیر پایه R₀ تعیین می‌شود: ۱−۱/R₀؛ برای سرخک با R₀ نزدیک ۱۲ تا ۱۸ حدود ۹۲ تا ۹۵٪ جامعه باید ایمن باشد. آنتی‌بیوتیک‌ها بر هدف‌های متفاوت اثر دارند: دیواره، ریبوزوم، همانندسازی DNA یا متابولیسم. مقاومت از طریق جهش یا انتقال ژن، پمپ‌های خروج دارو و آنزیم‌های غیرفعال‌کننده (بتالاکتاماز) ایجاد می‌شود.\\n\\nسازمان جهانی بهداشت مقاومت ضدمیکروبی را یکی از بزرگ‌ترین تهدیدهای بهداشت عمومی می‌داند.\"],\n\nplant:[\n\"ریشه نوک ریشه‌ی خود را با کلاهک محافظت می‌کند و ناحیه‌ی مریستم تقسیم می‌شود. در مقطع ریشه از بیرون به داخل روپوست، پوست (قشر)، درون‌پوست با نوار کاسپاری و استوانه‌ی مرکزی دیده می‌شود. نوار کاسپاری پر از سوبرین است و آب را مجبور می‌کند از غشای سلول بگذرد تا انتخابی جذب شود. حرکت آب و املاح در چوب با نیروی کشش تعرق است و انتقال قندها در آبکش با مدل جریان فشاری (منبع به مصرف) انجام می‌شود. کامبیوم آوندساز و کامبیوم چوب‌پنبه‌ساز رشد ثانویه (قطور شدن) را می‌سازند.\\n\\nروزنه را دو سلول نگهبان می‌سازند که با ورود K⁺ و آب تورژسانس می‌گیرند و باز می‌شوند.\",\n\"کلروفیل a و b نور قرمز و آبی را جذب و سبز را بازتاب می‌دهند؛ کاروتنوئیدها رنگیزه‌های کمکی‌اند. در واکنش‌های نوری، فتوسیستم II (P680) آب را به O₂، پروتون و الکترون می‌شکند. الکترون‌ها از زنجیره‌ی انتقال به فتوسیستم I (P700) می‌روند و NADPH ساخته می‌شود. پروتون‌ها در تیلاکوئید جمع می‌شوند و ATP سنتاز ATP می‌سازد (فتوفسفریلاسیون). در کالوین، روبیسکو CO₂ را به ریبولوز بیس‌فسفات (RuBP) وصل می‌کند و دو مولکول ۳-فسفوگلیسرات می‌سازد؛ سپس احیا و بازسازی RuBP انجام می‌شود. روبیسکو با O₂ هم واکنش می‌دهد و تنفس نوری رخ می‌دهد که کارایی را کم می‌کند.\\n\\nگیاهان C4 CO₂ را ابتدا به ترکیب چهارکربنی تبدیل و به سلول‌های غلاف آوندی می‌فرستند تا تنفس نوری کم شود.\",\n\"تناوب نسل در گیاهان شامل نسل گامتوفیت (هاپلوئید) و اسپوروفیت (دیپلوئید) است. در خزه‌ها گامتوفیت غالب است ولی در سرخس‌ها و دانه‌داران اسپوروفیت غالب است و گامتوفیت بسیار کوچک و وابسته. دانه‌دارها گرده و دانه ساختند که تولیدمثل را از آب مستقل کرد. در بازدانگان دانه روی پولک مخروط قرار دارد و بدون تخمدان است. در نهان‌دانگان کیسه‌ی روبینی (گامتوفیت ماده) هشت هسته و هفت سلول دارد. گیاهان با جانوران و قارچ‌ها تعامل دارند: گرده‌افشانی، پراکنش میوه و همزیستی.\\n\\nساخت لیگنین در دیواره‌ی آوندها استحکام و عبور آب را ممکن کرد و اندازه‌ی درختان را بزرگ کرد.\",\n\"گرده شامل سلول رویشی و سلول زایشی است که دو اسپرم می‌سازد. وقتی گرده روی کلاله می‌نشیند لوله‌ی گرده در خامه رشد می‌کند و به تخمک می‌رسد. یک اسپرم با تخمزا زیگوت (2n) و دیگری با دو هسته‌ی قطبی درون‌دانه (3n) می‌سازد. دانه‌ها در دوره‌ی خواب هستند و با جذب آب (آب‌گیری)، شکست خواب و جیبرلین جوانه می‌زنند. سازوکارهای ناسازگاری خودی از خودلقاحی جلوگیری می‌کنند. میوه‌های گوشتی، خشک و کاذب هر یک راهی برای پراکنش دانه‌اند. بعضی گیاهان بدون لقاح (بکرزایی) نیز میوه می‌سازند، مانند موز.\\n\\nگل‌دهی تحت‌تأثیر طول شب است: گیاهان روز‌کوتاه مثل شاهدانه و روز‌بلند مثل اسفناج؛ رنگیزه‌ی فیتوکروم نور قرمز و فرو‌قرمز را تشخیص می‌دهد.\",\n\"اکسین (IAA) در نوک ساقه ساخته می‌شود و انتقال قطبی دارد. بر پایه‌ی نظریه‌ی رشد اسیدی، اکسین پمپ پروتون را فعال و دیواره را نرم می‌کند و سلول طویل می‌شود. غالبیت رأسی: اکسین جوانه‌های جانبی را مهار می‌کند و هرس ساقه این مهار را برمی‌دارد. سیتوکینین‌ها در ریشه ساخته می‌شوند و غالبیت رأسی را کاهش می‌دهند. جیبرلین باعث رشد ساقه و تولید آنزیم آمیلاز در دانه می‌شود. آبسزیک‌اسید با افزایش Ca²⁺ و خروج K⁺ از سلول نگهبان روزنه را می‌بندد. اتیلن واکنش سه‌گانه و ریزش برگ را القا می‌کند. فیتوکروم و کریپتوکر
