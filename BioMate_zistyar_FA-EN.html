 cell its shape and helps it move.\",\n\"microtubule\":\"A hollow protein tube in the cytoskeleton that supports the cell and moves chromosomes and cargo.\",\n\"fluid mosaic model\":\"The idea that a membrane is a flexible, fluid layer of lipids with proteins floating in it.\",\n\"glycocalyx\":\"A sugar-rich coat on the outside of a cell membrane that helps cells recognize each other.\",\n\"receptor\":\"A protein that binds a specific signal molecule and triggers a response in the cell.\",\n\"second messenger\":\"A small molecule inside the cell that passes on and amplifies a signal received at the surface.\",\n\"gap junction\":\"A tiny channel that directly connects the insides of two neighboring cells.\",\n\"osmosis\":\"The movement of water across a membrane toward the side with more dissolved substances.\",\n\"diffusion\":\"The spreading of particles from where they are crowded to where they are less crowded.\",\n\"active transport\":\"Movement of substances across a membrane against their concentration gradient, using energy.\",\n\"endocytosis\":\"The process by which a cell takes in material by wrapping its membrane around it.\",\n\"exocytosis\":\"The process by which a cell releases material by fusing a membrane sac with the cell surface.\",\n\"aquaporin\":\"A protein channel in the membrane that lets water pass through quickly.\",\n\"hypotonic\":\"Having a lower concentration of dissolved substances than another solution, so water tends to flow in.\",\n\"hypertonic\":\"Having a higher concentration of dissolved substances than another solution, so water tends to flow out.\",\n\"plasmolysis\":\"The shrinking of a plant cell’s contents away from its wall when it loses water.\",\n\"turgor\":\"The pressure of water inside a plant cell pushing against its wall, keeping it firm.\",\n\"glycolysis\":\"The breakdown of one glucose molecule into two pyruvate molecules, releasing a little ATP.\",\n\"Krebs cycle\":\"A cycle of reactions in the mitochondrion that breaks down fuel molecules and releases carbon dioxide and energy carriers.\",\n\"citric acid cycle\":\"A cycle of reactions in the mitochondrion that breaks down fuel molecules and releases carbon dioxide and energy carriers.\",\n\"electron transport chain\":\"A series of proteins that pass electrons along and use the energy to pump protons across a membrane.\",\n\"chemiosmosis\":\"The production of ATP using the energy of protons flowing back through a membrane protein.\",\n\"fermentation\":\"Making a little ATP from sugar without oxygen, producing lactic acid or alcohol.\",\n\"photosystem\":\"A cluster of pigments and proteins in the thylakoid membrane that captures light energy.\",\n\"chlorophyll\":\"The green pigment that absorbs light for photosynthesis.\",\n\"thylakoid\":\"A flattened membrane sac inside a chloroplast where the light reactions of photosynthesis occur.\",\n\"stroma\":\"The fluid inside a chloroplast, around the thylakoids, where sugar is made.\",\n\"Rubisco\":\"The enzyme that captures carbon dioxide from the air in photosynthesis.\",\n\"photorespiration\":\"A wasteful process in which Rubisco binds oxygen instead of carbon dioxide.\",\n\"cell cycle\":\"The series of stages a cell goes through from its formation until it divides.\",\n\"mitosis\":\"Cell division that produces two genetically identical cells.\",\n\"meiosis\":\"Cell division that produces four cells with half the usual number of chromosomes, used to make gametes.\",\n\"crossing over\":\"The swapping of pieces of DNA between paired chromosomes during meiosis.\",\n\"chiasma\":\"The X-shaped point where paired chromosomes are linked after crossing over.\",\n\"chiasmata\":\"The X-shaped points where paired chromosomes are linked after crossing over.\",\n\"nondisjunction\":\"An error in which chromosomes fail to separate properly during cell division.\",\n\"cyclin\":\"A protein whose level rises and falls to drive the cell through the stages of the cell cycle.\",\n\"checkpoint\":\"A control point in the cell cycle where the cell checks for damage before continuing.\",\n\"oncogene\":\"A gene that, when overactive or mutated, can push cells to divide uncontrollably and cause cancer.\",\n\"apoptosis\":\"Programmed, orderly cell death.\",\n\"telomere\":\"A protective cap of repeated DNA at the end of a chromosome.\",\n\"telomerase\":\"An enzyme that rebuilds telomeres at chromosome ends.\",\n\"chromatid\":\"One of the two identical copies of a duplicated chromosome.\",\n\"gene\":\"A segment of DNA that carries the instructions for making a protein or RNA molecule.\",\n\"allele\":\"One of the alternative versions of a gene.\",\n\"genotype\":\"The set of alleles an individual carries.\",\n\"phenotype\":\"The observable traits of an individual, such as color or height.\",\n\"homozygous\":\"Having two identical alleles of a gene.\",\n\"heterozygous\":\"Having two different alleles of a gene.\",\n\"double helix\":\"The twisted-ladder shape of DNA, made of two strands wound around each other.\",\n\"antiparallel\":\"Running in opposite directions, like the two strands of DNA.\",\n\"histone\":\"A protein around which DNA is wound to package it inside the nucleus.\",\n\"nucleosome\":\"A unit of DNA packaging: a stretch of DNA wrapped around a core of histone proteins.\",\n\"chromatin\":\"The complex of DNA and proteins that makes up chromosomes.\",\n\"replication\":\"The copying of DNA before a cell divides.\",\n\"helicase\":\"An enzyme that unwinds and separates the two strands of the DNA double helix.\",\n\"ligase\":\"An enzyme that joins pieces of DNA together.\",\n\"semiconservative\":\"Describes DNA copying in which each new molecule has one old strand and one new strand.\",\n\"transcription\":\"The copying of a gene’s DNA sequence into RNA.\",\n\"translation\":\"The process in which a ribosome reads mRNA to build a protein.\",\n\"mRNA\":\"Messenger RNA, a copy of a gene that carries instructions to the ribosome.\",\n\"tRNA\":\"Transfer RNA, a molecule that brings the correct amino acid to the ribosome.\",\n\"rRNA\":\"Ribosomal RNA, the main RNA component of ribosomes.\",\n\"miRNA\":\"MicroRNA, a tiny RNA that switches off genes by blocking mRNA.\",\n\"codon\":\"A group of three bases in mRNA that codes for one amino acid or a stop signal.\",\n\"anticodon\":\"A three-base sequence on tRNA that pairs with a matching codon on mRNA.\",\n\"promoter\":\"A DNA sequence where the transcription machinery attaches to start reading a gene.\",\n\"intron\":\"A stretch of a gene that is cut out of the RNA before it is used.\",\n\"exon\":\"A stretch of a gene that stays in the final RNA and is used to build the protein.\",\n\"spliceosome\":\"A molecular machine that cuts out introns and joins exons together in RNA.\",\n\"mutation\":\"A permanent change in the DNA sequence.\",\n\"frameshift mutation\":\"A mutation that adds or removes bases and shifts the way the rest of the gene is read.\",\n\"CRISPR\":\"A gene-editing tool, adapted from bacteria, that cuts DNA at a chosen location.\",\n\"Cas9\":\"The enzyme in CRISPR gene editing that cuts DNA at a site chosen by a guide RNA.\",\n\"epigenetics\":\"The study of changes in gene activity that do not alter the DNA sequence itself.\",\n\"methylation\":\"The addition of a small methyl group to DNA or proteins, often switching genes off.\",\n\"Punnett square\":\"A grid used to predict the possible genotypes of offspring from two parents.\",\n\"codominance\":\"A pattern in which both alleles in a heterozygote are fully expressed.\",\n\"incomplete dominance\":\"A pattern in which a heterozygote shows a blend of the two parents’ traits.\",\n\"multiple alleles\":\"A situation in which a gene has more than two versions in a population, as in human ABO blood groups.\",\n\"epistasis\":\"When one gene masks or changes the effect of another gene.\",\n\"X-linked\":\"Describes a gene located on the X chromosome, so its inheritance differs between males and females.\",\n\"centimorgan\":\"A unit of distance between genes on a chromosome, based on how often they are separated by crossing over.\",\n\"genome\":\"The complete set of DNA in an organism.\",\n\"chromosome\":\"A long, packaged molecule of DNA that carries genes.\",\n\"autosome\":\"Any chromosome that is not a sex chromosome.\",\n\"haploid\":\"Having a single set of chromosomes.\",\n\"diploid\":\"Having two sets of chromosomes, one from each parent.\",\n\"polyploid\":\"Having more than two complete sets of chromosomes.\",\n\"gamete\":\"A sex cell, such as a sperm or an egg.\",\n\"zygote\":\"The cell formed when a sperm and an egg fuse.\",\n\"heterochromatin\":\"Tightly packed chromatin whose genes are mostly switched off.\",\n\"euchromatin\":\"Loosely packed chromatin whose genes can be active.\",\n\"conjugation\":\"The transfer of DNA from one bacterium to another through direct contact.\",\n\"endospore\":\"A tough, dormant structure formed inside some bacteria that survives harsh conditions.\",\n\"microbiome\":\"The community of microorganisms living in a particular place, such as the human gut.\",\n\"capsid\":\"The protein coat that surrounds a virus’s genetic material.\",\n\"bacteriophage\":\"A virus that infects bacteria.\",\n\"retrovirus\":\"An RNA virus that copies its genome into DNA and inserts it into the host’s DNA.\",\n\"reverse transcriptase\":\"An enzyme that makes DNA from an RNA template.\",\n\"prophage\":\"Viral DNA that has inserted into a bacterium’s chromosome and is passed on when the bacterium divides.\",\n\"hemagglutinin\":\"A protein on the surface of influenza viruses that lets them attach to cells.\",\n\"ergosterol\":\"A lipid in fungal cell membranes, similar to cholesterol in animals; many antifungal drugs target it.\",\n\"hypha\":\"A thread-like filament that forms the body of a fungus.\",\n\"hyphae\":\"The thread-like filaments that form the body of a fungus.\",\n\"mycelium\":\"A mass of fungal threads that forms the main body of a fungus.\",\n\"mycelia\":\"Masses of fungal threads that form the main bodies of fungi.\",\n\"mycorrhiza\":\"A partnership between a fungus and plant roots in which they exchange nutrients.\",\n\"mycorrhizae\":\"Partnerships between fungi and plant roots in which they exchange nutrients.\",\n\"protist\":\"A mostly single-celled eukaryote that is not a plant, animal or fungus.\",\n\"Plasmodium\":\"The single-celled parasite that causes malaria.\",\n\"innate immunity\":\"The body’s fast, general defenses that respond the same way to any invader.\",\n\"adaptive immunity\":\"The slower, targeted defense that learns to recognize specific invaders and remembers them.\",\n\"phagocytosis\":\"The process in which a cell engulfs and digests particles or microbes.\",\n\"macrophage\":\"A large white blood cell that engulfs microbes and debris.\",\n\"neutrophil\":\"The most common white blood cell, which quickly engulfs bacteria at a site of infection.\",\n\"complement\":\"A group of blood proteins that help destroy microbes by marking or bursting them.\",\n\"interferon\":\"A signal protein released by virus-infected cells that warns neighbors to defend themselves.\",\n\"histamine\":\"A chemical released in allergic reactions and inflammation that widens blood vessels and causes swelling.\",\n\"cytokine\":\"A small signal protein that cells of the immune system use to communicate.\",\n\"antibody\":\"A Y-shaped protein made by immune cells that binds to a specific antigen.\",\n\"antigen\":\"A molecule that the immune system recognizes as foreign and can respond to.\",\n\"lymphocyte\":\"A type of white blood cell, such as a B cell or T cell, that carries out targeted immune responses.\",\n\"clonal selection\":\"The process in which an antigen selects the matching immune cell, which then multiplies.\",\n\"autoimmunity\":\"A condition in which the immune system attacks the body’s own tissues.\",\n\"herd immunity\":\"Indirect protection of a community when enough people are immune that a disease cannot spread easily.\",\n\"toxoid\":\"A harmless, inactivated toxin used in a vaccine to train the immune system.\",\n\"drug resistance\":\"The ability of microbes to survive drugs that once killed them.\",\n\"xylem\":\"The plant tissue that carries water and minerals up from the roots.\",\n\"phloem\":\"The plant tissue that carries sugars from the leaves to the rest of the plant.\",\n\"stoma\":\"A tiny pore in a leaf that opens and closes to let gases in and out.\",\n\"stomata\":\"Tiny pores in leaves that open and close to let gases in and out.\",\n\"transpiration\":\"The loss of water vapor from plant leaves, which pulls water up through the plant.\",\n\"cambium\":\"A layer of dividing cells that makes a plant stem or root grow thicker.\",\n\"Casparian strip\":\"A waxy band in root cell walls that forces water to pass through cells rather than between them.\",\n\"apoplast\":\"The pathway through cell walls and spaces between cells, outside the cell membranes.\",\n\"Calvin cycle\":\"The set of reactions in photosynthesis that uses ATP and NADPH to build sugar from carbon dioxide.\",\n\"alternation of generations\":\"A life cycle in which a spore-making stage and a gamete-making stage take turns.\",\n\"sporophyte\":\"The spore-producing, diploid stage of a plant’s life cycle.\",\n\"gametophyte\":\"The gamete-producing, haploid stage of a plant’s life cycle.\",\n\"spore\":\"A tiny reproductive cell that can grow into a new organism without fusing with another cell.\",\n\"gymnosperm\":\"A seed plant with naked seeds that are not enclosed in a fruit, such as a pine.\",\n\"angiosperm\":\"A flowering plant whose seeds are enclosed in a fruit.\",\n\"monocot\":\"A flowering plant whose seed has one seed leaf, such as grass or a lily.\",\n\"dicot\":\"A flowering plant whose seed has two seed leaves, such as a bean or a rose.\",\n\"double fertilization\":\"In flowering plants, the process in which one sperm fertilizes the egg and another forms the food tissue.\",\n\"endosperm\":\"The nutrient-rich tissue in a seed that feeds the growing embryo.\",\n\"ovary\":\"The part of a flower that holds the ovules and becomes the fruit, or the organ that produces eggs in animals.\",\n\"ovaries\":\"The parts of flowers that hold the ovules, or the organs that produce eggs in animals.\",\n\"stigma\":\"The sticky top of a flower’s female part, where pollen lands.\",\n\"stigmata\":\"The sticky tops of flowers’ female parts, where pollen lands.\",\n\"auxin\":\"A plant hormone that promotes cell elongation and controls growth toward light.\",\n\"gibberellin\":\"A plant hormone that promotes stem growth and seed germination.\",\n\"cytokinin\":\"A plant hormone that promotes cell division and delays aging.\",\n\"ethylene\":\"A gaseous plant hormone that helps fruit ripen and leaves fall.\",\n\"phytochrome\":\"A plant pigment that senses red and far-red light and helps control flowering and growth.\",\n\"apical dominance\":\"The way a plant’s main shoot tip suppresses the growth of side buds.\",\n\"phototropism\":\"The bending of a plant toward light.\",\n\"nitrogenase\":\"The enzyme in some bacteria that converts nitrogen gas from the air into ammonia.\",\n\"invertebrate\":\"An animal without a backbone.\",\n\"arthropod\":\"An invertebrate with a hard outer skeleton and jointed legs, such as an insect or crab.\",\n\"mollusk\":\"A soft-bodied invertebrate, often with a shell, such as a snail, clam or octopus.\",\n\"echinoderm\":\"A marine animal with spiny skin and five-part symmetry, such as a sea star.\",\n\"hemolymph\":\"The fluid that fills the body cavity of arthropods and many mollusks, acting like blood.\",\n\"metamorphosis\":\"A dramatic change of body form during development, as when a caterpillar becomes a butterfly.\",\n\"notochord\":\"A flexible rod along the back of chordate embryos that supports the body.\",\n\"amnion\":\"The fluid-filled membrane that surrounds and protects an embryo.\",\n\"cleavage\":\"The rapid series of cell divisions that turns a fertilized egg into many smaller cells.\",\n\"blastula\":\"A hollow ball of cells formed early in animal development.\",\n\"gastrula\":\"An early embryo stage in which the cells fold inward to form layers.\",\n\"ectoderm\":\"The outer embryonic layer, which forms the skin and nervous system.\",\n\"mesoderm\":\"The middle embryonic layer, which forms muscle, bone and blood.\",\n\"endoderm\":\"The inner embryonic layer, which forms the lining of the gut and lungs.\",\n\"parthenogenesis\":\"Reproduction in which an egg develops into an embryo without being fertilized.\",\n\"echolocation\":\"Finding objects by sending out sounds and listening to the echoes.\",\n\"mutualism\":\"A relationship in which both species benefit.\",\n\"commensalism\":\"A relationship in which one species benefits and the other is neither helped nor harmed.\",\n\"keystone species\":\"A species that has a much larger effect on its ecosystem than its numbers would suggest.\",\n\"coevolution\":\"The process in which two interacting species evolve in response to each other.\",\n\"sinoatrial node\":\"The cluster of cells in the wall of the heart’s upper right chamber that sets the heartbeat rhythm.\",\n\"atrium\":\"An upper chamber of the heart that receives blood.\",\n\"atria\":\"The upper chambers of the heart that receive blood.\",\n\"ventricle\":\"A lower chamber of the heart that pumps blood out.\",\n\"cardiac output\":\"The volume of blood the heart pumps out each minute.\",\n\"plasma\":\"The liquid part of blood, which carries cells, nutrients and hormones.\",\n\"erythropoietin\":\"A hormone made mainly by the kidneys that tells bone marrow to make more red blood cells.\",\n\"platelet\":\"A small cell fragment in blood that helps form clots.\",\n\"fibrin\":\"A stringy protein that forms a mesh to hold a blood clot together.\",\n\"alveolus\":\"A tiny air sac in the lung where oxygen and carbon dioxide are exchanged.\",\n\"alveoli\":\"The tiny air sacs in the lungs where oxygen and carbon dioxide are exchanged.\",\n
