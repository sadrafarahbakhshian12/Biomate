وم گیرنده‌های نور‌اند و تروپیسم‌ها (نورگرایی، زمین‌گرایی) پاسخ جهت‌دار به محرک‌اند.\\n\\nعلف‌کش‌های ۲٬۴-D تقلیدی از اکسین هستند و در دولپه‌ای‌ها رشد کنترل‌نشده می‌سازند.\",\n\"گیاهان نیمه‌خشک‌زی با تعرق کم، برگ‌های کوچک و پوشش مومی و ریشه‌های عمیق سازگار می‌شوند. گیاهان CAM روزنه را شب باز می‌کنند و CO₂ را به مالات تبدیل و در واکوئل ذخیره می‌کنند و در روز آن را به کالوین می‌دهند. گیاهان شورپسند با غدد نمک، نمک اضافی را دفع می‌کنند و گیاهان آبزی بافت هوادار (آئرانشیم) دارند. گیاهان گوشتخوار مانند ونوس‌مگس‌خوار با تحریک موهای حساس برگ را می‌بندند و پروتئین حشره را هضم می‌کنند. در همزیستی ریزوبیوم، گره‌های ریشه‌ی لگوم‌ها نیتروژناز دارند که N₂ را به آمونیاک تبدیل می‌کند و لگ‌هموگلوبین اکسیژن را از نیتروژناز دور نگه می‌دارد.\\n\\nمیکوریزها جذب فسفر را چند برابر می‌کنند و بیش از ۸۰٪ گیاهان با آن‌ها همزیستی دارند.\"]\n};\n\nObject.assign(ADV,{\nanim:[\n\"اسفنج‌ها سلول‌های یقه‌دار (کوآنوسیت) دارند که با تاژک آب را از منافذ می‌کشند و ذرات غذا را فیلتر می‌کنند. مرجانیان و عروس‌های دریایی سلول‌های نیش‌زن (نماتوسیست) دارند. در بی‌مهرگان، کرم‌های پهن (پلاناریا) تقارن دوطرفه و سر‌گرایی دارند، کرم‌های لوله‌ای مثل آسکاریس حفره‌ی عمومی دارند و کرم‌های حلقوی سامانه‌ی گردش خون بسته و قطعه‌بندی دارند. نرم‌تنان سه بخش اصلی دارند: پا، توده‌ی احشایی و گوشته. بندپایان کیتین، اندام‌های مفصل‌دار و پوست‌اندازی دارند و سامانه‌ی گردش خون باز و نای یا آبشش کتابی برای تنفس. خارپوستان سامانه‌ی آبگردشی و پاهای لوله‌ای دارند.\\n\\nحشرات تنها بی‌مهرگانی هستند که بال دارند. دگردیسی کامل (تخم، لارو، شفیره، بالغ) در پروانه و زنبور و دگردیسی ناقص در ملخ دیده می‌شود.\",\n\"مهره‌داران طناب پشتی و دم پشت مخرج و شیارهای حلقی را حداقل در مرحله‌ای از زندگی دارند. ماهی‌ها آبشش و خط جانبی برای حس ارتعاش دارند و گردش خون ساده با قلب دوحفره‌ای. در دوزیستان قلب سه‌حفره‌ای و پوست در تنفس نقش دارد. در خزندگان قلب سه‌حفره‌ای با دیواره‌ی ناقص (در تمساح چهارحفره‌ای) و کلیه‌ی دفع اسید اوریک وجود دارد. پرندگان استخوان‌های هوادار و کیسه‌های هوایی دارند و تنفس یک‌طرفه‌ی کارآمد. پستانداران به تکریاخته‌ها (پلاتیپوس)، کیسه‌داران و جفت‌داران تقسیم می‌شوند. جفت اندامی است که تبادل مواد بین مادر و جنین را بدون اختلاط خون انجام می‌دهد.\\n\\nپوشش بدن نیز تنوع دارد: فلس، پوست مرطوب، پر و مو که هر کدام به تنظیم دما و حفاظت کمک می‌کنند.\",\n\"در تولیدمثل جنسی، میوز و لقاح تنوع ایجاد می‌کنند. در لقاح، اسپرم با آکروزوم آنزیم می‌ریزد و غشای تخمک را عبور می‌کند و واکنش قشری مانع ورود اسپرم دوم می‌شود. تقسیمات اولیه (شکافت) بدون رشد سلول‌ها انجام می‌شود و بلاستولا را می‌سازد. در گاسترولا لایه‌های اکتودرم (پوست و عصب)، مزودرم (ماهیچه، استخوان، قلب، کلیه) و اندودرم (لوله‌ی گوارش و ریه) پدید می‌آیند. القاگرها و ژن‌های هاکس محور سر به دم را تعیین می‌کنند. مرگ برنامه‌ریزی‌شده شکل اندام‌ها را می‌سازد. در پستانداران، تخمک بارورشده در رحم لانه‌گزینی می‌کند و جفت و بند ناف تشکیل می‌شود.\\n\\nهورمون تیروکسین دگردیسی قورباغه را القا می‌کند و بدون آن نوزاد قورباغه (دم‌باریکه) به قورباغه‌ی بالغ تبدیل نمی‌شود.\",\n\"شتر با ذخیره‌ی چربی در کوهان، کاهش تعرق و ادرار غلیظ و تحمل افزایش دمای بدن تا ۴۱ درجه در شرایط کم‌آبی سازگار است. خفاش‌ها فرکانس‌های فراصوت (۲۰ تا ۱۲۰ کیلوهرتز) می‌فرستند و زمان بازگشت پژواک را مغز به فاصله تبدیل می‌کند. سازگاری‌های ساختاری، فیزیولوژیک و رفتاری سه سطح‌اند. تقلید (میمیکری) در پروانه‌ی نایب‌السلطنه و شاه‌پروانه دیده می‌شود؛ گونه‌ی بی‌ضرر شبیه گونه‌ی سمی می‌شود. همگرایی تکاملی یعنی شباهت ساختار در گونه‌های دور از هم با محیط مشابه، مثل شکل بدن دلفین و کوسه.\\n\\nانگل‌ها با چرخه‌ی زندگی پیچیده سازگار شده‌اند؛ مثلاً کرم کدو چند میزبان واسط دارد.\",\n\"نورون‌های حسی، رابط و حرکتی کمان بازتاب را می‌سازند. در حشرات زنجیره‌ی عصبی شکمی و گانگلیون‌های مغزی دیده می‌شود و در هشت‌پا مغز متمرکز و پیچیده با نورون‌های بسیار. مغز مهره‌داران به پیش‌مغز (مخ، تالاموس، هیپوتالاموس)، میان‌مغز و پس‌مغز (مخچه، پل، بصل‌النخاع) تقسیم می‌شود. قشر مخ در پستانداران چین‌خورده است و سطح بیشتری می‌دهد. یادگیری به تغییر در قدرت سیناپس‌ها (تقویت درازمدت در هیپوکامپ) وابسته است. اندام‌های حسی ویژه: ماهی‌های برقی میدان الکتریکی را حس می‌کنند، مارها گیرنده‌ی فروسرخ دارند و کبوتر میدان مغناطیسی را حس می‌کند.\\n\\nمغز انسان حدود ۸۶ میلیارد نورون و تریلیون‌ها سیناپس دارد.\",\n\"انواع همزیستی بر پایه‌ی هزینه و سود سنجیده می‌شود. مفیدزیستی اجباری مانند همزیستی موریانه و تک‌یاخته‌هایی که سلولز را هضم می‌کنند و همزیستی مرجان و جلبک زوگزانتلا؛ با افزایش دما این جلبک‌ها دفع می‌شوند و مرجان سفید می‌شود. زنبور انجیر و درخت انجیر هر کدام فقط به گونه‌ی دیگر وابسته‌اند. انگل‌های خارجی (کنه) و داخلی (کرم نواری) فرایندهای متفاوتی دارند. شکارچی-طعمه رابطه‌ای است که در طول زمان به رقابت تسلیحاتی تکاملی می‌انجامد. گونه‌های کلیدی (مثل سمور آبی که سد می‌سازد) تأثیر زیادی بر ساختار بوم‌سازگان دارند.\\n\\nتعامل با میکروبیوم نیز نوعی همزیستی است که در سلامت جانور اهمیت دارد.\"],\n\nhuman:[\n\"سیکل قلبی دو مرحله دارد: انقباض (سیستول) و استراحت (دیاستول). پیام الکتریکی از گره‌ی سینوسی-دهلیزی (ضربان‌ساز) شروع می‌شود، به گره‌ی دهلیزی-بطنی و سپس دسته‌ی هیس و رشته‌های پورکنژ می‌رسد. صدای «تاپ-تاپ» قلب از بسته‌شدن دریچه‌هاست. برون‌ده‌ی قلبی = ضربان قلب × حجم ضربه‌ای (حدود ۵ لیتر در دقیقه). فشار خون طبیعی تقریباً ۱۲۰/۸۰ میلی‌متر جیوه است. در سرخرگ‌ها دیواره‌ی ضخیم و کشسان است، در سیاهرگ‌ها دریچه وجود دارد و مویرگ‌ها یک لایه سلول دارند. پلاسما حدود ۵۵٪ خون است و هماتوکریت حدود ۴۵٪ حجم خون را گلبول‌های قرمز می‌سازند. گلبول قرمز هسته ندارد و حدود ۱۲۰ روز عمر می‌کند.\\n\\nلخته شدن خون: پلاکت‌ها به رگ آسیب‌دیده می‌چسبند، فیبرینوژن به فیبرین تبدیل می‌شود و شبکه‌ی لخته را می‌سازد.\",\n\"مسیر هوا: بینی، حلق، حنجره (با تارهای صوتی)، نای (دارای حلقه‌های غضروفی C شکل)، نایژه‌ها، نایژک‌ها و آلوئول‌ها. دیواره‌ی آلوئول سورفاکتانت ترشح می‌کند که کشش سطحی را کم می‌کند و نبودن آن در نوزادان نارس به سندرم زجر تنفسی می‌انجامد. حجم جاری حدود ۵۰۰ میلی‌لیتر و ظرفیت حیاتی ۴ تا ۵ لیتر است. در بافت‌ها منحنی تفکیک اکسیژن-هموگلوبین با اثر بور به راست می‌رود؛ یعنی با افزایش CO₂ و کاهش pH هموگلوبین اکسیژن را آسان‌تر رها می‌کند. مونوکسید کربن میل ترکیبی بسیار بیشتری از اکسیژن به هموگلوبین دارد و مسمومیت ایجاد می‌کند.\\n\\nمرکز تنفس بصل‌النخاع با حسگرهای شیمیایی شریان‌ها که غلظت CO₂ و H⁺ را اندازه می‌گیرند تنظیم می‌شود.\",\n\"دهان: آمیلاز بزاقی، معده با سلول‌های اصلی (پپسینوژن)، سلول‌های جداری (HCl و فاکتور درونی) و سلول‌های مخاطی. pH معده حدود ۲ است. در دوازدهه صفرا (امولسیون‌کننده) و آنزیم‌های لوزالمعده (تریپسین، لیپاز، آمیلاز) ترشح می‌شوند؛ بی‌کربنات pH را بالا می‌برد. سکرتین و کوله‌سیستوکینین هورمون‌های گوارشی‌اند. پرزها و ریزپرزها سطح جذب روده‌ی باریک را به حدود ۲۰۰ متر مربع می‌رسانند. چربی‌ها به عروق لنفی (شیل) و بقیه‌ی مواد به سیاهرگ باب می‌روند. کبد گلیکوژن ذخیره می‌کند، سم‌زدایی دارد و پروتئین‌های پلاسما را می‌سازد.\\n\\nدر روده‌ی بزرگ، میکروب‌ها فیبر را تخمیر می‌کنند و اسیدهای چرب کوتاه‌زنجیر می‌سازند.\",\n\"پتانسیل استراحت حدود ۷۰- میلی‌ولت است. در پتانسیل عمل، کانال‌های Na⁺ دریچه‌دار با ولتاژ باز می‌شوند و غشا به حدود ۴۰+ می‌رسد؛ سپس کانال‌های K⁺ باز و پایین‌روی رخ می‌دهد. در رشته‌های میلین‌دار (سلول‌های شوان و الیگودندروسیت)، هدایت جهشی در گره‌های رانویه سرعت را بالا می‌برد. سیناپس شیمیایی: ورود Ca²⁺ به پایانه‌ی پیش‌سیناپسی، تخلیه‌ی ناقل، اتصال به گیرنده‌ی پس‌سیناپسی. انواع ناقل: استیل‌کولین (اتصال عصب-عضله)، دوپامین، سروتونین، GABA (بازدارنده). کمبود دوپامین در پارکینسون دیده می‌شود. دستگاه عصبی خودمختار با هم‌حس (جنگ و گریز) و پادهم‌حس (استراحت و گوارش) تنظیم می‌شود.\\n\\nمخچه تعادل و هماهنگی حرکات و هیپوتالاموس همایستایی و گرسنگی و دما را کنترل می‌کند.\",\n\"هورمون‌ها پپتیدی (انسولین)، استروئیدی (کورتیزول) و آمینی (آدرنالین، تیروکسین) هستند. هورمون‌های پپتیدی به گیرنده‌ی غشایی و استروئیدی به گیرنده‌ی درونی می‌چسبند. محور هیپوتالاموس-هیپوفیز-غده‌ی هدف با بازخورد منفی تنظیم می‌شود. هیپوفیز پیشین هورمون رشد، TSH، ACTH، FSH، LH و پرولاکتین و هیپوفیز پسین اکسی‌توسین و ADH را آزاد می‌کند. در دیابت نوع ۱ سلول‌های بتا از بین می‌روند و در نوع ۲ مقاومت به انسولین رخ می‌دهد. کورتیزول در استرس طولانی قند خون را بالا و ایمنی را سرکوب می‌کند. پاراتورمون و کلسی‌تونین کلسیم خون را تنظیم می‌کنند.\\n\\nکمبود ید کافی در رژیم تیروکسین را کاهش می‌دهد و TSH بالا غده را بزرگ می‌کند (گواتر).\",\n\"کلیه در هر دقیقه حدود ۱۲۵ میلی‌لیتر صاف‌شده (GFR) تولید می‌کند. در لوله‌ی پیچ‌خورده‌ی نزدیک حدود ۶۵٪ آب و نمک و همه‌ی گلوکز بازجذب می‌شود. قوس هنله با سازوکار ضدجریان شیب غلظت اسمزی در مدولا ایجاد می‌کند. ADH روزنه‌ی آکواپورین در مجرای جمع‌کننده را باز می‌کند تا آب بیشتر بازجذب شود و ادرار غلیظ شود. آلدوسترون بازجذب سدیم را زیاد می‌کند و رنین-آنژیوتانسین فشار خون را تنظیم می‌کند. اریتروپویتین از کلیه گلبول قرمز‌سازی را تحریک می‌کند. وجود گلوکز در ادرار نشانه‌ی دیابت است.\\n\\nاوره حاصل تجزیه‌ی آمونیاک در چرخه‌ی اوره در کبد و در جانوران آبزی آمونیاک، در پرندگان اسید اوریک دفع می‌شود.\",\n\"استخوان از ماده‌ی معدنی (هیدروکسی‌آپاتیت) و رشته‌های کلاژن ساخته شده است. سلول‌های استخوان‌ساز (استئوبلاست) و استخوان‌خوار (استئوکلاست) پیوسته بازسازی می‌کنند و پاراتورمون و ویتامین D آن را تنظیم می‌کنند. پوکی استخوان از افت تراکم ماده‌ی معدنی است. ماهیچه‌ی اسکلتی از رشته‌های ماهیچه‌ای و آن‌ها از میوفیبریل‌هاست و واحد ساختاری آن سارکومر است. در لغزش رشته‌ها، سر میوزین به اکتین می‌چسبد و با مصرف ATP می‌چرخد. وقتی یون کلسیم از شبکه‌ی سارکوپلاسمی آزاد شود، تروپونین جایگاه اتصال را باز می‌کند. رشته‌های کند (قرمز، هوازی) و تند (سفید، بی‌هوازی) متفاوت‌اند. کراتین‌فسفات ذخیره‌ی سریع انرژی است.\\n\\nمفاصل سینوویال (زانو) مایع روان‌کننده دارند و غضروف ضربه را جذب می‌کند.\"],\n\nbeh:[\n\"رفتار از دو دیدگاه نزدیک و غایی بررسی می‌شود: چگونه رفتار رخ می‌دهد (سازوکار) و چرا تکامل یافته است. نیکو تینبرگن چهار پرسش را مطرح کرد: سازوکار، رشد، کارکرد و تکامل. الگوی عمل ثابت پاسخی قالبی است که با محرک نشانه راه می‌افتد؛ مانند رفتار نشاندن تخم‌ها در غاز. شرطی‌شدن کلاسیک (پاولوف) رابطه‌ی دو محرک و شرطی‌شدن فعال (اسکینر) رابطه‌ی رفتار و پیامد را می‌آموزد. یادگیری مکانی در زنبورها و پرندگان نقشه‌ی شناختی می‌سازد. نقش‌پذیری لورنز و آواز آموختن در گنجشک‌ها نیز دوره‌ی حساس دارند. ژن‌ها و محیط هر دو سهم دارند، و مثلاً ژن foraging در مگس سرکه الگوی جست‌وجوی غذا را تغییر می‌دهد.\\n\\nحس درد، قلمرو و جست‌وجوی غذا همگی بر پایه‌ی هزینه و فایده تحلیل می‌شوند.\",\n\"زبان رقص زنبور عسل را کارل فون فریش کشف کرد: در رقص هشتی، زاویه‌ی رقص نسبت به عمود، زاویه‌ی منبع غذا نسبت به خورشید و مدت رقص فاصله را می‌رساند. فرومون‌ها انواعی دارند: هشداردهنده، رد پا، جنسی و ملکه. در پرندگان آواز مانند نغمه‌ی نر قلمرو را اعلام و ماده را جذب می‌کند و تعدادی از آوازها آموخته می‌شوند. ارتباط حیوانات با علامت دروغین هم دیده می‌شود، مثل تقلید ظاهر گونه‌ی دیگر. پستانداران از حالت چهره و حالت بدن برای پیام استفاده می‌کنند. نهنگ‌ها و فیل‌ها با صدای فرکانس پایین تا ده‌ها کیلومتر ارتباط می‌گیرند.\\n\\nارتباط ممکن است هزینه‌دار باشد: صدای بلند شکارچی را جذب می‌کند.\",\n\"مهاجرت نیازمند هماهنگی درونی است: طول روز، هورمون‌ها و ذخیره‌ی چربی. پرندگان از قطب‌نمای خورشیدی (با جبران حرکت خورشید)، ستاره‌ای و مغناطیسی (کریپتوکروم در چشم) استفاده می‌کنند. ساعت زیستی در پستانداران در هسته‌ی فوق‌چلیپایی هیپوتالاموس قرار دارد و با نور شبکیه و هورمون ملاتونین هماهنگ می‌شود. ژن‌های ساعت مانند PER و CLOCK چرخه‌ی بازخوردی رونویسی ایجاد می‌کنند. مهاجرت‌های عمودی روزانه‌ی پلانکتون‌ها در اقیانوس‌ها از بزرگ‌ترین مهاجرت‌های زمین است. ماهی سالمون برای تخم‌ریزی با تشخیص بو به رودخانه‌ی زادگاه بازمی‌گردد.\\n\\nخواب زمستانی و تابستانی نیز ریتم‌های سالانه‌اند و سوخت‌وساز را به شدت پایین می‌آورند.\",\n\"انتخاب خویشاوندی نظریه‌ی همیلتون است: ژنی که کمک به خویشاوندان را تقویت کند ممکن است گسترش یابد اگر r×B>C باشد، یعنی ضریب خویشاوندی ضرب‌در سود بیش از هزینه. در حشرات هاپلودیپلوئید (زنبور و مورچه)، خواهرها ۷۵٪ ژن مشترک دارند. ایثار متقابل در خفاش خون‌آشام که غذا به هم‌لانه‌ای گرسنه می‌دهد دیده می‌شود. شکار گروهی (گرگ‌ها) و دفاع گروهی (گاو مشک) فایده دارند. اما گروه‌های بزرگ‌تر رقابت داخلی هم دارند. سلسله‌مراتب تسلط (نظم نوک‌زدن) درگیری را کاهش می‌دهد. در موش‌خرمای برهنه، جامعه‌ای با ملکه‌ی تولیدمثلی وجود دارد؛ نمونه‌ای از اجتماعی بودن واقعی در پستانداران.\\n\\nیادگیری اجتماعی و فرهنگ در شامپانزه‌ها، نهنگ‌ها و پرندگان هم گزارش شده است.\",\n\"آمار جفت‌یابی با اصل بیتمن توضیح داده می‌شود: نرها از جفت‌های بیشتر سود می‌برند، ولی ماده‌ها گزینش‌گرترند. انتخاب جنسی شامل رقابت درون‌جنسی (شاخ گوزن) و انتخاب جفت (رنگ و آواز) است. نظریه‌ی ماده‌ی خوب‌ژن: صفات پرهزینه نشان‌دهنده‌ی سلامت است. در بعضی گونه‌ها نقش‌ها برعکس است، مانند اسب دریایی که نر آبستن می‌شود. نظام جفت‌گیری شامل تک‌همسری، چندهمسری و چندشوهری است. مراقبت پدر و مادر با کیفیت قلمرو و اطمینان از پدری ارتباط دارد. فرزندکشی در برخی شیرها هنگام تغییر رهبر دیده می‌شود. بعضی پرندگان انگل لانه‌اند، مانند فاخته که تخم را در لانه‌ی گونه‌ی دیگر می‌گذارد.\\n\\nبرای تحلیل رفتار از نظریه‌ی بازی‌ها استفاده می‌شود؛ مفهوم راهبرد پایدار تکاملی مدلی از نبرد شاهین-کبوتر است.\"],\n\nevo:[\n\"فراوانی اَلل‌ها با انتخاب تغییر می‌کند. انتخاب جهت‌دار یک انتهای طیف صفت را ترجیح می‌دهد (مقاومت به آنتی‌بیوتیک)، پایدارکننده اعتدال را (وزن نوزاد انسان) و گسسته‌کننده دو انتها را. مثال کلاسیک: منقار سهره‌های داروین در خشکسالی ضخیم‌تر شد (پیتر و رزمری گرانت). اَلل داسی‌شکل در مناطق مالاریاخیز در هتروزیگوت‌ها مزیت دارد (برتری هتروزیگوت). انتخاب جنسی و انتخاب خویشاوندی انواع دیگرند. شایستگی کل شامل بقا و تعداد فرزندان بارور است. فقط تفاوت‌های ارثی به نسل بعد می‌رسند و صفات اکتسابی (مثل عضله‌ی ورزشکار) ارثی نمی‌شوند؛ این تفاوت لامارک و داروین است.\\n\\nمحدودیت‌ها: انتخاب بر ساختارهای موجود عمل می‌کند و محصول نهایی همیشه بهینه نیست.\",\n\"فسیل‌ها با روش‌هایی مانند پرتوسنجی (کربن ۱۴ تا حدود ۵۰ هزار سال و اورانیوم برای سنگ‌های قدیمی‌تر) تاریخ‌گذاری می‌شوند. نیمه‌عمر کربن ۱۴ حدود ۵۷۳۰ سال است. اندام‌های همتا (دست انسان و بال خفاش) از نیای مشترک و اندام‌های همتا‌نما (بال حشره و پرنده) از همگرایی‌اند. رویان‌شناسی مقایسه‌ای نشان می‌دهد جنین انسان شیار حلقی و دم دارد. شواهد مولکولی: توالی سیتوکروم c در انسان و شامپانزه یکسان و با مخمر حدود ۴۰٪ متفاوت است. تکامل مشاهده‌شده: مقاومت آفات به حشره‌کش و تکامل ویروس‌ها. جغرافیای زیستی: مارسوپیال‌ها در استرالیا ریشه در جدایی قاره‌ها دارند.\\n\\nژن‌های کاذب (شبه‌ژن) مانند ژن ناقص ساخت ویتامین C در انسان شاهد نیای مشترک با نخستی‌هاست.\",\n\"مفهوم گونه‌ی زیستی: جمعیت‌هایی که آمیزش و فرزند زایا دارند. سدهای پیش‌زیگوتی شامل جدایی زیستگاه، زمانی، رفتاری، مکانیکی و گامتی و سدهای پس‌زیگوتی شامل دورگه‌ی ناپایا و نازا هستند. گونه‌زایی دگرمیهنی با جدایی جغرافیایی (اثر بنیان‌گذار در جزایر) رخ می‌دهد. گونه‌زایی هم‌میهنی در ماهی‌های سیکلید با انتخاب جنسی نیز دیده شده است. چندلادی‌شدن (ناشی از خطای میوز) در گیاهان گونه‌ی جدید را ناگهانی می‌سازد؛ گندم نان شش‌لادی (۶n) است. منطقه‌ی دورگه‌گیری مکانی است که دو گونه به هم می‌رسند و دورگه می‌دهند. تابش سازشی بعد از انقراض‌های دسته‌جمعی رخ داده است، مثل پستانداران پس از انقراض دایناسورها.\\n\\nتعادل نقطه‌ای می‌گوید تکامل با دوره‌های ایستایی و جهش‌های سریع پیش می‌رود، در برابر تدریج‌گرایی.\",\n\"معادله‌ی هاردی-واینبرگ: p+q=1 و p²+2pq+q²=1. اگر ۱ در ۲۵۰۰ نفر دارای بیماری نهفته باشد (q²=0٫۰۰۰۴) آنگاه q=۰٫۰۲ و ناقلان 2pq حدود ۳٫۹٪ هستند. رانش ژنی در جمعیت‌های کوچک ممکن است اَلل را ثابت یا حذف کند. جریان ژن مهاجرت جمعیت‌ها را شبیه می‌کند. جهش خطاست ولی تنها منبع اَلل جدید است. انتخاب طبیعی تنها عامل سازگاری است. انتخاب غیرتصادفی جفت (درون‌آمیزی) فراوانی هتروزیگوت‌ها را کم می‌کند. برای تعیین سرعت تکامل، ساعت مولکولی را استفاده می‌کنند، به این شرط که جهش‌های خنثی با نرخ ثابت انباشته شوند.\\n\\nنظریه‌ی خنثی کیمورا می‌گوید بخش بزرگی از تفاوت‌های مولکولی ناشی از رانش جهش‌های خنثی است.\",\n\"سه ویژگی کلیدی تبار انسان: دوپایی (استرالوپیتکوس آفارنسیس با «لوسی»، ۳٫۲ میلیون سال پیش)، بزرگ‌شدن مغز (هومو ارکتوس با حدود ۹۰۰ سانتی‌متر مکعب) و ابزار و فرهنگ. حجم مغز انسان امروزی حدود ۱۳۵۰ سانتی‌متر مکعب است. هومو هابیلیس ابزار سنگی ساده ساخت. نئاندرتال‌ها حدود ۴۰ هزار سال پیش ناپدید شدند. DNA باستان نشان می‌دهد غیرآفریقایی‌ها ۱ تا ۲ درصد DNA نئاندرتال و بعضی مردمان آسیا و اقیانوسیه DNA دنیسووایی دارند. مدل «خروج از آفریقا» می‌گوید انسان امروزی از آفریقا پراکنده شد. تنوع ژنتیکی در آفریقا بیش از جاهای دیگر است. تطابق پوست و رنگ مو با تابش فرابنفش مناطق شکل گرفت.\\n\\nغارهای ایران، مانند غارهای زاگرس، شواهدی از سکونت نئاندرتال‌ها و انسان‌های امروزی دارند.\",\n\"فیلوژنی با روش‌هایی مانند پارسیمونی بیشینه و درست‌نمایی بیشینه ساخته می‌شود. صفات مشترک مشتق (هم‌ریختی) برای تعریف کلاد مفیدند، نه صفات نیایی مشترک. گروه تک‌نیایی یک نیا و همه‌ی نوادگانش را دارد؛ «خزندگان» به معنی سنتی تک‌نیایی نیستند چون پرندگان را کنار می‌گذارد. انتقال افقی ژن در باکتری‌ها درخت را به «شبکه» نزدیک می‌کند. همزیستی درونی تبار میتوکندری را به آلفاپروتئوباکتری‌ها و کلروپلاست را به سیانوباکتری‌ها می‌رساند. ریشه‌ی درخت زندگی نیای مشترک جهانی (LUCA) است که حدود ۴ میلیارد سال پیش زیسته است.\\n\\nدر بازسازی زمان انشعاب‌ها، فسیل‌ها و ساعت مولکولی با هم کالیبره می‌شوند.\"],\n\ntax:[\n\"سه قلمرو بر پایه‌ی توالی ژن 16S rRNA مشخص شد. آرکی‌ها غشای دارای پیوند اتری و دیواره‌ی بدون پپتیدوگلیکان دارند. گروه‌های آرکی: گرمادوست افراطی، نمک‌دوست افراطی و متان‌زا. یوکاریوت‌ها با ابرگروه‌هایی مانند اوپیستوکونت (جانوران و قارچ‌ها)، آرکئوپلاستیدا (گیاهان و جلبک‌های سبز)، آمیبوزوآ و SAR رده‌بندی می‌شوند. سلسله‌های سنتی شش‌گانه (باکتری، آرکی، آغازیان، قارچ، گیاه، جانور) در کتاب‌های درسی دیده می‌شود، اما آغازیان شاخه‌ی تک‌نیایی نیست. ویروس‌ها در هیچ‌یک از قلمروها قرار نمی‌گیرند.\\n\\nرده‌بندی مدرن از ژن‌های نشانگر (مثل بارکد DNA ژن COI در جانوران) نیز استفاده می‌کند.\",\n\"سلسله‌مراتب: قلمرو، شاخه، رده، راسته، تیره، سرده، گونه. مثال انسان: یوکاریا، جانوران، طنابداران، پستانداران، نخستی‌ها، انسان‌تباران (Hominidae)، سرده‌ی Homo و گونه‌ی sapiens. نام‌گذاری علمی طبق کدهای بین‌المللی (ICZN برای جانوران و ICN برای گیاهان) است. نام سرده با حرف بزرگ و گونه با حرف کوچک و هر دو ایتالیک نوشته می‌شود. کلید شناسایی دوشاخه‌ای ابزاری برای تعیین گونه است. در رده‌بندی فیلوژنتیک (کلادیستیک) فقط گروه‌های تک‌نیایی پذیرفته می‌شوند.\\n\\nنام‌های رایج مبهم‌اند: «ماهی» چند گروه دور از هم را می‌پوشاند در حالی که نام علمی دقیق است.\",\n\"مفهوم گونه‌ی زیستی از ارنست مایر است و برای جانداران غیرجنسی و فسیلی ناکارآمد است. مفهوم ریخت‌شناسی از ویژگی‌های ظاهری، مفهوم بوم‌شناختی از جایگاه بوم‌شناختی و مفهوم فیلوژنتیک از کوچک‌ترین شاخه‌ی منشعب استفاده می‌کند. گونه‌های حلقوی مانند سبزقبای سبز در اطراف فلات تبت نشان می‌دهند مرز گونه‌ها تدریجی است. ترکیبات دورگه‌ی ببر و شیر در اسارت (لایگر) در طبیعت رخ نمی‌دهد. قاطر در شمار کروموزوم‌ها (۶۳) مشکل میوز دارد، پس نازاست. تنوع درون‌گونه‌ای شامل زیرگونه و واریته است. در انسان، «نژاد» از نظر زیستی ساختار ژنتیکی معتبری ندارد و تنوع میان افراد درون یک جمعیت بیش از میان جمعیت‌هاست.\\n\\nپژوهش‌های ژنومی گاهی گونه‌های پنهان را آشکار می‌کند که ظاهر یکسان ولی ژن متفاوت دارند.\",\n\"سه سطح تنوع زیستی: ژنتیکی، گونه‌ای و بوم‌سازگانی. ارزش‌های تنوع زیستی شامل خدمات بوم‌سازگانی مانند گرده‌افشانی، پالایش آب، تثبیت خاک و تنظیم اقلیم است. عوامل تهدید با اختصار HIPPO بیان می‌شود: زیستگاه (Habitat)، گونه‌های مهاجم (Invasive)، آلودگی (Pollution)، جمعیت انسان (Population) و بهره‌برداری بیش از حد (Overharvesting). تکه‌تکه شدن زیستگاه جمعیت‌ها را کوچک و آسیب‌پذیر می‌کند و درون‌آمیزی را زیاد می‌کند. جمعیت کمینه‌ی پایدار و راهروهای زیستی از ابزارهای حفاظت‌اند. حفاظت برون‌جایگاهی (باغ‌وحش و بانک بذر) مکمل حفاظت درون‌جایگاهی است. معاهده‌ی رامسر (در ایران، ۱۹۷۱) برای حفاظت از تالاب‌هاست.\\n\\nگونه‌های چتر مانند پلنگ و یوزپلنگ با حفاظت از خود از گونه‌های دیگر هم حفاظت می‌کنند.\",\n\"نقاط داغ تنوع زیستی را نورمن مایرز معرفی کرد: منطقه‌هایی با دست‌کم ۱۵۰۰ گونه‌ی گیاه آوندی بومی که بیش از ۷۰٪ پوشش اولیه‌اش از بین رفته است. مناطق ایرانی-تورانی و قفقاز از نقاط داغ‌اند. ایران حدود ۸۰۰۰ گونه گیاه آوندی دارد و حدود ۱۷۰۰ گونه بومی، و ۵۰۰ گونه پرنده، ۲۰۰ پستاندار. مناطق مهم: جنگل‌های هیرکانی (میراث جهانی)، جنگل‌های زاگرس، دشت‌های کویری و تالاب‌ها. گونه‌های شاخص: یوزپلنگ آسیایی، گوزن زرد ایرانی، شیر ایرانی منقرض‌شده در ایران، و خرس سیاه بلوچی.\\n\\nمناطق چهارگانه‌ی سازمان حفاظت محیط زیست ایران شامل پارک ملی، اثر طبیعی ملی، پناهگاه حیات وحش و منطقه‌ی حفاظت‌شده است.\"],\n\neco:[\n\"بوم‌شناسی از چند سطح بررسی می‌شود: فرد، جمعیت، اجتماع، بوم‌سازگان، زیست‌بوم و زیست‌کره. جایگاه بوم‌شناختی ترکیبی از زیستگاه و نقش گونه است. اصل طرد رقابتی می‌گوید دو گونه با جایگاه یکسان نمی‌توانند پایدار هم‌زیست باشند. تفکیک جایگاه رقابت را کم می‌کند. گونه‌ی کلیدی (ستاره‌ی دریایی در جزر و مدی) و گونه‌ی مهندس بوم‌سازگان (سمور آبی) اثرات بزرگ دارند. توالی بوم‌شناختی اولیه (بر سنگ بی‌خاک) و ثانویه (پس از آتش) گونه‌ها را به‌تدریج به جامعه‌ی اوج می‌رساند. اختلال میانه تنوع را بیشینه می‌کند.\\n\\nبوم‌شناسی سیمای سرزمین بررسی الگوی تکه‌ها و راهروها در مقیاس‌های بزرگ‌تر است.\",\n\"تولید اولیه‌ی ناخالص (GPP) کل انرژی فتوسنتزی است و تولید اولیه‌ی خالص NPP = GPP − تنفس گیاهان. بازده انتقال بین سطوح ۵ تا ۲۰ درصد (معمولاً ۱۰٪) است. هرم زیست‌توده ممکن است در اقیانوس‌ها وارون باشد چون فیتوپلانکتون سریع تولید می‌شود. تجزیه‌کننده‌ها (قارچ و باکتری) و کنده‌خوارها (کرم خاکی) مواد را بازیافت می‌کنند. در بزرگ‌نمایی زیستی (بیومگنیفیکیشن)، مواد پایدار مانند DDT و جیوه در سطوح بالای غذایی غلظت بیشتری می‌یابند. در تحلیل رواناب، ساختار شبکه‌ی غذایی پیچیده است و حذف گونه‌ی کلیدی آبشار غذایی ایجاد می‌کند، مانند بازگشت گرگ به یلواستون که شمار گوزن و در نتیجه ساختار رودخانه را تغییر داد.\\n\\nانرژی خورشید حدود ۱٪ توسط فتوسنتز ذخیره می‌شود.\",\n\"چرخه‌ی کربن: ذخایر اصلی جو، اقیانوس‌ها، خاک، سوخت فسیلی و زیست‌توده است. نیتروژن ۷۸٪ جو است ولی باید تثبیت شود (ریزوبیوم، آزوتوباکتر و سیانوباکتری‌ها یا رعدوبرق). مراحل: تثبیت (N₂→NH₃)، آمونیاک‌سازی، نیتریفیکاسیون (NH₄⁺→NO₂⁻→NO₃⁻ با نیتروزوموناس و نیتروباکتر) و دنیتریفیکاسیون (NO₃⁻→N₂). فسفر چرخه‌ی رسوبی دارد و عامل محدودکننده‌ی آب‌های شیرین است. یوتریفیکاسیون: کود زیاد، شکوفایی جلبکی، کاهش اکسیژن (هیپوکسی) و مرگ آبزیان (مناطق مرده). باران اسیدی از SO₂ و NOx ایجاد می‌شود.\\n\\nچرخه‌ی آب از تبخیر، تعرق، چگالش و بارش و رواناب ساخته شده است و جنگل‌زدایی آن را تغییر می‌دهد.\",\n\"رشد نمایی dN/dt = rN است و رشد لجستیک dN/dt = rN(K−N)/K. راهبردهای r (تولیدمثل سریع، فرزند فراوان و کوچک؛ باکتری، حشرات) و K (تعداد کم، مراقبت بیشتر؛ فیل، انسان). منحنی‌های بقا نوع I (مرگ‌ومیر پایین در جوانی و بالا در پیری)، نوع II و نوع III (مرگ‌ومیر بالا در جوانی) هستند. هرم سنی ساختار جمعیت را نشان می‌دهد: قاعده‌ی پهن یعنی رشد سریع. مدل شکارچی-طعمه لوتکا-ولترا نوسان‌های دوره‌ای نشان می‌دهد. متاجمعیت‌ها شامل لکه‌های جداگانه‌ی زیستگاه و مهاجرت میان‌شان است. جمعیت انسان از حدود ۸ میلیارد گذشته و ردپای بوم‌شناختی مصرف را می‌سنجد.\\n\\nتراکم‌وابستگی منفی باعث تعادل می‌شود و جمعیت حول K نوسان می‌کند.\",\n\"زیست‌بوم‌ها عمدتاً با دما و بارش تعیین می‌شوند: جنگل بارانی حاره (بیش از ۲۰۰۰ میلی‌متر بارش و بیشترین تنوع)، ساوانا، بیابان (زیر ۲۵۰ میلی‌متر)، چاپارال، علفزار معتدل، جنگل برگریز، تایگا (سوزنی‌برگ)، تندرا (یخ‌زمین دائمی). در آب‌ها، لایه‌بندی نوری (ناحیه‌ی نوری و بی‌نور) و حرارتی تعیین‌کننده است. مصب رودخانه‌ها پربارترین بوم‌سازگان‌ها هستند. صخره‌های مرجانی کمتر از ۰٫۱٪ سطح اقیانوس و حدود ۲۵٪ گونه‌های دریایی را دارند. کوه‌ها لایه‌بندی ارتفاعی دارند. تالاب‌ها سیل را مهار و رسوب را نگه می‌دارند و منبع غذای پرندگان مهاجرند.\\n\\nایران چهار فصل و اقلیم‌های هیرکانی، زاگرسی، ایرانو-تورانی و خلیج فارس و دریای عمان دارد.\",\n\"اثر گلخانه‌ای طبیعی دمای زمین را حدود ۳۳ درجه گرم‌تر از حالت بدون جو نگه می‌دارد. غلظت CO₂ از حدود ۲۸۰ ppm در پیش از صنعت به بیش از ۴۲۰ ppm رسیده است. بازخوردهای مثبت: کاهش آلبیدو با ذوب یخ، آزادسازی متان از یخ‌زمین. پیامدها: بالا آمدن سطح دریا (انبساط گرمایی و ذوب)، اسیدی شدن اقیانوس‌ها (کاهش کربنات برای صدف و مرجان)، رویدادهای حدی و تغییر فنولوژی (زمان‌بندی گل‌دهی و مهاجرت). راه‌حل‌ها: کاهش انتشار، انرژی‌های تجدیدپذیر، جنگل‌کاری و احیای تالاب‌ها و کاهش هدررفت غذا. توافق پاریس هدف نگه داشتن گرمایش زیر ۲ درجه و تلاش برای ۱٫۵ درجه را دارد.\\n\\nپایداری یعنی تأمین نیاز امروز بدون به خطر انداختن توان نسل‌های آینده.\"],\n\nbio:[\n\"آنزیم‌های برشی (EcoRI و غیره) توالی‌های پالیندرومی ۴ تا ۸ جفت‌بازی را می‌شناسند و انتهای چسبنده می‌سازند. ناقل‌ها شامل پلاسمید (دارای ژن مقاومت به آنتی‌بیوتیک، جایگاه چندکلونی و مبدأ همانندسازی)، ویروس‌ها و کروموزوم مصنوعی‌اند. غربالگری با آنتی‌بیوتیک و ژن lacZ (کلنی‌های سفید و آبی) انجام می‌شود. سلول میزبان با تبدیل (شوک حرارتی) DNA می‌گیرد. در گیاهان از آگروباکتریوم و تفنگ ژنی استفاده می‌شود. انسولین نوترکیب از ۱۹۸۲ به بازار آمد. کتابخانه‌ی ژنی مجموعه‌ی قطعات ژنومی یا cDNA است. cDNA با نسخه‌برداری معکوس از mRNA ساخته می‌شود و اینترون ندارد، پس در باکتری قابل بیان است.\\n\\nنگرانی‌ها: انتقال ژن به گونه‌های وحشی، آلرژی و مالکیت معنوی.\",\n\"PCR با آغازگر ژن هدف را بین دو نقطه تکثیر می‌کند و از آنزیم Taq پلیمراز (از Thermus aquaticus) بهره می‌برد. دمای واسرشت‌سازی ۹۴ تا ۹۸، اتصال ۵۰ تا ۶۵ و گسترش ۷۲ درجه است. تعداد نسخه‌ها پس از n چرخه حدود ۲ⁿ است. qPCR مقدار را به صورت زمان واقعی اندازه می‌گیرد. در الکتروفورز ژل آگارز، DNA به سمت قطب مثبت می‌رود و قطعات کوچک‌تر سریع‌تر حرکت می‌کنند. توالی‌یابی سنگر (پایان‌دهنده‌های دی‌دئوکسی) و روش‌های نسل جدید (ایلومینا) و نانوپور وجود دارد. پروژه‌ی ژنوم انسان از ۱۹۹۰ تا ۲۰۰۳ اجرا شد و در ۲۰۲۲ توالی کاملاً بدون شکاف به دست آمد.\\n\\nاثر انگشت DNA بر پایه‌ی تکرارهای کوتاه پشت سر هم (STR) است و در پزشکی قانونی و آزمون پدری کاربرد دارد.\",\n\"سلول‌های بنیادی دو ویژگی دارند: خودنوسازی و تمایز. توانایی آن‌ها در مراحل تکوین کاهش می‌یابد: همه‌توان (زیگوت)، پرتوان (توده‌ی سلولی درونی بلاستوسیست)، چندتوان (خونساز) و تک‌توان. با چهار عامل ترنسکریپشن (یاماناکا، نوبل ۲۰۱۲) سلول بالغ به iPS بازبرنامه‌ریزی می‌شود. در پیوند مغز استخوان، سلول‌های بنیادی خونساز بیماران لوسمی را درمان می‌کنند. ارگانوئید‌ها ساختارهای مینیاتوری سه‌بعدی اندام‌ها در آزمایشگاه‌اند. کلونینگ تولیدمثلی با انتقال هسته‌ی سلول بدنی به تخمک بدون هسته انجام می‌شود. چالش‌ها: خطر تومورزایی، رد ایمنی و ملاحظات اخلاقی.\\n\\nدرمان با سلول‌های CAR-T گیرنده‌ی مهندسی‌شده به لنفوسیت T می‌دهد تا سلول سرطانی را بشناسد.\",\n\"بیوانفورماتیک شامل پایگاه‌هایی مانند GenBank و UniProt و PDB است. تراز توالی (محلی و سراسری) شباهت را می‌سنجد و بر پایه‌ی آن درخت فیلوژنتیک رسم می‌شود. ژنومیکس، پروتئومیکس، ترانسکریپتومیکس و متابولومیکس سطوح مختلف داده‌ی زیستی‌اند. شبیه‌سازی دینامیک مولکولی اتصال دارو به پروتئین را پیش‌بینی می‌کند. شبکه‌های عصبی مانند آلفافولد ساختار سه‌بعدی پروتئین را از توالی با دقت نزدیک به آزمایش پیش‌بینی می‌کنند و در ۲۰۲۴ جایزه‌ی نوبل شیمی گرفت. پزشکی شخصی از ژنوم فرد برای انتخاب دارو بهره می‌برد.\\n\\nزیست‌شناسی سامانه‌ای شبکه‌ی برهم‌کنش ژن‌ها و پروتئین‌ها را مدل‌سازی می‌کند.\",\n\"در کشاورزی، ذرت Bt سم باکتری Bacillus thuringiensis را تولید می‌کند و در برابر کرم ساقه‌خوار مقاوم است. برنج طلایی پیش‌ساز ویتامین A دارد. چالش مقاومت آفات و اثرات بوم‌شناختی باید مدیریت شود. تخمیر صنعتی: مخمر در تولید اتانول و نان، باکتری‌های لاکتیکی در ماست، قارچ‌ها در تولید آنتی‌بیوتیک‌ها و آنزیم‌ها و اسیدهای آلی. بیوراکتورها شرایط (دما، pH، اکسیژن) را کنترل می‌کنند. زیست‌پالایی با باکتری‌های نفت‌خوار (مثل سودوموناس) آلودگی نفتی را کاهش می‌دهد. بیوپلاستیک‌ها از PHA باکتریایی و نشاسته ساخته می‌شوند. زیست‌شناسی ترکیبی مسیرهای متابولیکی تازه‌ای در میکروب‌ها می‌سازد.\\n\\nقانون ایمنی زیستی و برچسب‌گذاری مواد غذایی تراریخته در کشورها متفاوت است.\",\n\"روش علمی چرخه‌ای است: مشاهده، پرسش، فرضیه، پیش‌بینی، آزمایش، تحلیل و بازنگری. فرضیه‌ی صفر در آزمون آماری عدم تفاوت را فرض می‌کند و مقدار p احتمال داده‌هایی حداقل این حد افراطی است اگر فرض صفر درست باشد؛ p<0٫۰۵ معمولاً معنادار شمرده می‌شود. حجم نمونه‌ی بزرگ‌تر خطا را کاهش می‌دهد. کورسازی دوگانه سوگیری را کم می‌کند. در میکروسکوپ نوری قدرت تفکیک حدود ۲۰۰ نانومتر است و میکروسکوپ الکترونی عبوری (TEM) ساختار درونی و روبشی (SEM) سطح را نشان می‌دهد. سانتریفیوژ اندامک‌ها را بر اساس چگالی جدا می‌کند و کروماتوگرافی مواد را بر پایه‌ی اندازه یا بار. ردیابی رادیوایزوتوپی مسیرهای متابولیک را روشن کرده است؛ مثلاً کالوین از کربن ۱۴ استفاده کرد.\\n\\nداوری همتایان، تکرارپذیری و گزارش شفاف روش‌ها اعتبار علمی را حفظ می‌کنند.\"]\n});\n\nvar NEWCH={\norgl:{id:\"orgl\",h:185,name:\"اندامک‌های سلول\",hl:\"اندامک\",tag:\"ساختار درون‌سلولی\",scale:\"۰٫۱ تا ۱۰ میکرومتر\",\nintro:\"اندامک‌ها اجزای تخصصی درون سلول‌اند که هر کدام وظیفه‌ای ویژه دارند. جدا کردن واکنش‌ها در محفظه‌های غشادار بازده و کنترل سلول را بالا می‌برد. در این فصل هر اندامک جداگانه و با جزئیات بررسی می‌شود.\",\ntopics:[\n{t:\"هسته\",d:\"هسته یکی از بزرگ‌ترین اندامک‌های سلول یوکاریوتی و نگهدارنده‌ی ژنوم است. ماده‌ی ژنتیکی درون آن به شکل کروماتین قرار دارد و رونویسی و همانندسازی در آن انجام می‌شود.\",m:\"هسته با دو غشا پوشیده شده است که در جاهایی به هم می‌رسند و منفذهای هسته‌ای می‌سازند. درون هسته هستک دیده می‌شود که محل ساخت زیرواحدهای ریبوزوم است. لایه‌ی لامینا از رشته‌های پروتئینی در سطح درونی غشا شکل هسته را حفظ می‌کند. اندازه‌ی هسته معمولاً ۵ تا ۱۰ میکرومتر است و در گلبول‌های قرمز بالغ پستانداران وجود ندارد.\",adv:\"منفذ هسته‌ای کمپلکسی از حدود ۳۰ نوع پروتئین به نام نوکلئوپورین است و ذره‌های کوچک را آزادانه ولی مولکول‌های بزرگ را فقط با نشانه‌ی ورود (NLS) و پروتئین‌های ایمپورتین عبور می‌دهد. انتقال فعال به وسیله‌ی شیب RanGTP انجام می‌شود. در سلول انسان حدود ۲۰ هزار ژن رمزکننده‌ی پروتئین در هسته وجود دارد. هتروکروماتین بسیار فشرده و ساکت است و یوکروماتین بازتر و فعال است. هنگام میتوز پوشش هسته با فسفریلاسیون لامینا فرو می‌ریزد و در تلوفاز دوباره تشکیل می‌شود. جهش در ژن لامین A به بیماری پروژریا (پیری زودرس) می‌انجامد.\\n\\nفضاهای زیرهسته‌ای مانند اجسام کاخال و لکه‌های اسپکل مناطق ویژه‌ی پردازش RNA هستند.\",k:[\"دو غشا و منفذهای هسته‌ای دارد\",\"هستک ریبوزوم می‌سازد\",\"کروماتین فشرده ساکت و کروماتین باز فعال است\"],x:\"در گلبول قرمز بالغ انسان هسته وجود ندارد تا جای بیشتری برای هموگلوبین باشد.\",terms:[\"پوشش هسته\",\"هستک\",\"کروماتین\",\"لامینا\",\"منفذ هسته‌ای\"]},\n{t:\"ریبوزوم\",d:\"ریبوزوم کارخانه‌ی پروتئین‌سازی سلول است و mRNA را به زنجیره‌ی آمینواسید ترجمه می‌کند. این ساختار غشا ندارد و در همه‌ی سلول‌ها یافت می‌شود.\",m:\"ریبوزوم از دو زیرواحد بزرگ و کوچک تشکیل شده که از rRNA و پروتئین ساخته شده‌اند. ریبوزوم‌های باکتری‌ها 70S و ریبوزوم‌های یوکاریوتی 80S هستند. ریبوزوم‌ها هم آزاد در سیتوزول و هم متصل به شبکه‌ی آندوپلاسمی زبر دیده می‌شوند. چندین ریبوزوم هم‌زمان روی یک mRNA کار می‌کنند و ساختاری به نام پلی‌ریبوزوم می‌سازند.\",adv:\"فعالیت پپتیدیل‌ترانسفرازی ریبوزوم را rRNA انجام می‌دهد، نه پروتئین؛ بنابراین ریبوزوم یک ریبوزیم است و این مدرکی برای فرضیه‌ی «جهان RNA» به‌شمار می‌رود. ریبوزوم سه جایگاه A (پذیرنده)، P (پپتیدی) و E (خروج) دارد. در هر ثانیه یک ریبوزوم باکتریایی حدود ۱۵ تا ۲۰ آمینواسید و یوکاریوتی حدود ۳ تا ۶ آمینواسید می‌افزاید. آنتی‌بیوتیک‌هایی مانند استرپتومایسین و تتراسایکلین ریبوزوم باکتری را مهار می‌کنند و ریبوزوم انسان را نه. در ترجمه، فاکتورهای آغاز و طویل‌سازی (EF-Tu) با مصرف GTP دقت را بالا می‌برند.\\n\\nریبوزوم میتوکندری شبیه باکتری است و همین یکی از دلیل‌های مهم نظریه‌ی درون‌همزیستی است.\",k:[\"محل ترجمه‌ی mRNA است\",\"از rRNA و پروتئین ساخته شده است\",\"غشا ندارد\"],x:\"یک سلول در حال رشد انسان میلیون‌ها ریبوزوم دارد و سلول‌های لوزالمعده به دلیل ترشح آنزیم‌ها ریبوزوم بسیار فراوانی دارند.\",terms:[\"rRNA\",\"70S و 80S\",\"جایگاه A P E\",\"پلی‌ریبوزوم\"]},\n{t:\"شبکه‌ی آندوپلاسمی\",d:\"شبکه‌ی آندوپلاسمی (ER) سامانه‌ی گسترده‌ای از کیسه‌ها و لوله‌های غشادار است که با پوشش هسته در ارتباط است. دو نوع زبر و صاف دارد.\",m:\"شبکه‌ی زبر ریبوزوم دارد و پروتئین‌هایی را می‌سازد که قرار است ترشح شوند، در غشا قرار گیرند یا به لیزوزوم بروند. شبکه‌ی صاف ریبوزوم ندارد و لیپید، فسفولیپید و استروئید می‌سازد، سم‌زدایی می‌کند و در سلول‌های ماهیچه‌ای کلسیم ذخیره می‌کند. سلول‌های ترشحی مانند سلول‌های کبد و لوزالمعده شبکه‌ی گسترده‌ای دارند.\",adv:\"پروتئین‌های ترشحی با توالی سیگنال به‌وسیله‌ی ذره‌ی شناسایی سیگنال (SRP) به غشای شبکه هدایت می‌شوند و هم‌زمان با ترجمه از منفذ وارد حفره‌ی شبکه می‌شوند. در حفره‌ی شبکه پروتئین‌های همراه (مانند BiP) به تاخوردگی کمک می‌کنند و گلیکوزیلاسیون اولیه انجام می‌شود. تجمع پروتئین‌های نادرست تاخورده «پاسخ پروتئین‌های تاخورده‌نشده» (UPR) را فعال می‌کند و در استرس شدید آپوپتوز آغاز می‌شود. آنزیم‌های سیتوکروم P450 در شبکه‌ی صاف کبد داروها و سموم را آب‌دوست می‌کنند. شبکه‌ی سارکوپلاسمی در ماهیچه، با کانال‌های ریانودین کلسیم را برای انقباض آزاد می‌کند.\\n\\nمصرف فنوباربیتال در کبد شبکه‌ی صاف را گسترش می‌دهد و تحمل دارویی ایجاد می‌کند.\",k:[\"زبر: پروتئین‌سازی و صاف: لیپیدسازی\",\"با پوشش هسته در ارتباط است\",\"در سم‌زدایی و ذخیره‌ی کلسیم نقش دارد\"],x:\"کبد افراد الکلی شبکه‌ی صاف گسترده‌تری دارد، چون با سم‌زدایی بیشتر سازگار شده است.\",terms:[\"ER زبر\",\"ER صاف\",\"توالی سیگنال\",\"UPR\"]},\n{t:\"دستگاه گلژی\",d:\"گلژی انبار و مرکز توزیع سلول است و پروتئین‌ها و لیپیدهای رسیده از شبکه را اصلاح، دسته‌بندی و به مقصد می‌فرستد.\",m:\"دستگاه گلژی از کیسه‌های مسطح غشادار (سیستِرن) تشکیل شده است. سمت ورودی (cis) رو به شبکه و سمت خروجی (trans) رو به غشای سلول است. وزیکول‌ها مواد را از شبکه به گلژی و از گلژی به غشا، لیزوزوم یا بیرون سلول می‌برند. گلژی در سلول‌های غددی بسیار فراوان است. در گیاهان در ساخت دیواره‌ی سلولی هم نقش دارد.\",adv:\"در گلژی گلیکوزیلاسیون ادامه می‌یابد، قندهای O-پیوندی افزوده می‌شود و پروتئین‌ها برچسب مقصد می‌گیرند؛ مانند مانوز-۶-فسفات که آنزیم‌ها را به لیزوزوم می‌فرستد. در نبود این برچسب بیماری I-cell رخ می‌دهد که آنزیم‌ها به جای لیزوزوم به بیرون ترشح می‌شوند. وزیکول‌ها با پوشش‌های COPII (از ER به گلژی)، COPI (بازگشت) و کلاترین (از شبکه‌ی ترانس گلژی) ساخته می‌شوند و پروتئین‌های SNARE همجوشی وزیکول با غشای هدف را اختصاصی می‌کنند. ترشح تنظیم‌شده نیازمند سیگنال (مانند افزایش کلسیم) است، مانند رها شدن انسولین.\\n\\nکامیلو گلژی این ساختار را در ۱۸۹۸ با رنگ‌آمیزی نقره در نورون‌ها دید.\",k:[\"اصلاح، بسته‌بندی و ارسال می‌کند\",\"دارای سمت cis و trans است\",\"وزیکول‌های ترشحی می‌سازد\"],x:\"سلول‌های جامی روده با گلژی بزرگ مخاط ترشح می‌کنند.\",terms:[\"سیستِرن\",\"cis و trans\",\"وزیکول\",\"SNARE\"]},\n{t:\"میتوکندری\",d:\"میتوکندری نیروگاه سلول است و بیشتر ATP هوازی را می‌سازد. دو غشا و DNA مخصوص خود را دارد.\",m:\"غشای بیرونی صاف و غشای درونی دارای چین‌خوردگی‌هایی به نام کریستا است که سطح را زیاد می‌کند. فضای درون غشای درونی ماتریکس نام دارد که آنزیم‌های چرخه‌ی کربس را دارد. فضای بین دو غشا محل تجمع پروتون است. تعداد میتوکندری در سلول‌های پرانرژی مانند ماهیچه‌ی قلب و کبد بسیار زیاد است. میتوکندری‌ها هم تقسیم می‌شوند و هم با یکدیگر ادغام می‌شوند.\",adv:\"زنجیره‌ی انتقال الکترون چهار کمپلکس (I تا IV) دارد و پروتون‌ها را از ماتریکس به فضای بین‌غشایی پمپ می‌کند. کمپلکس V (ATP سنتاز) با بازگشت پروتون، ATP می‌سازد و به ازای هر ATP حدود ۴ پروتون مصرف می‌کند. پروتئین جداکننده‌ی UCP1 در چربی قهوه‌ای پروتون را بدون ساخت ATP برمی‌گرداند و انرژی را به شکل گرما تلف می‌کند (ترموژنز نوزادان). DNA میتوکندری حلقوی (حدود ۱۶٫۵ هزار جفت باز، ۳۷ ژن) تقریباً همیشه از مادر به ارث می‌رسد و جهش‌های آن بیماری‌های میتوکندریایی ایجاد می‌کند. در آپوپتوز، آزاد شدن سیتوکروم c از میتوکندری کاسپازها را فعال می‌کند. میتوکندری‌ها گونه‌های فعال اکسیژن (ROS) تولید می‌کنند و آسیب ناشی از آن‌ها با پیری و برخی بیماری‌ها ارتباط دارد.\\n\\nنظریه‌ی درون‌همزیستی لین مارگولیس می‌گوید میتوکندری از آلفاپروتئوباکتری‌هایی پدید آمده که درون یک سلول میزبان همزیست شده‌اند.\",k:[\"بیشترین ATP در غشای درونی ساخته می‌شود\",\"DNA حلقوی و ریبوزوم مخصوص دارد\",\"به نظریه‌ی درون‌همزیستی مرتبط است\"],x:\"سلول‌های ماهیچه‌ی قلب حدود ۳۰ درصد حجم خود را میتوکندری دارند.\",terms:[\"کریستا\",\"ماتریکس\",\"ATP سنتاز\",\"ترموژنز\"]},\n{t:\"کلروپلاست\",d:\"کلروپلاست اندامک فتوسنتزکننده‌ی گیاهان و جلبک‌هاست و انرژی نور را در قند ذخیره می‌کند.\",m:\"کلروپلاست دو غشای بیرونی و درونی دارد. در درون آن کیسه‌های مسطح تیلاکوئید روی هم گرانا می‌سازند و مایع اطراف آن بستره (استروما) نام دارد. کلروفیل در غشای تیلاکوئید قرار دارد. واکنش‌های نوری در تیلاکوئید و چرخه‌ی کالوین در بستره انجام می‌شود. یک سلول برگ ۲۰ تا ۱۰۰ کلروپلاست دارد.\",adv:\"کلروپلاست یکی از اعضای خانواده‌ی پلاستیدهاست؛ دیگر اعضای آن عبارت‌اند از کروموپلاست (رنگ میوه‌ها)، لوکوپلاست، آمیلوپلاست (ذخیره‌ی نشاسته) و اتیوپلاست (در گیاه رشدکرده در تاریکی). پلاستید DNA حلقوی و ریبوزوم 70S دارد و بخشی از پروتئین‌هایش را می‌سازد ولی بیشتر ژن‌ها به هسته منتقل شده‌اند. در غشای تیلاکوئید، دو فتوسیستم، سیتوکروم b6f و ATP سنتاز قرار دارند و شیب پروتون در حفره‌ی تیلاکوئید ساخته می‌شود. در چرخه‌ی کالوین آنزیم روبیسکو بیش از نیمی از پروتئین محلول برگ را تشکیل می‌دهد. کلروپلاست‌ها در نور جهت‌یابی می‌کنند و در نور شدید به لبه‌ی سلول می‌روند تا آسیب نبینند.\\n\\nسیانوباکتری‌ها (باکتری‌های سبز-آبی) نیای تکاملی کلروپلاست‌اند.\",k:[\"گرانا از تیلاکوئیدها ساخته شده است\",\"واکنش‌های نوری در تیلاکوئید رخ می‌دهد\",\"کلروپلاست DNA مخصوص دارد\"],x:\"پاییز با تجزیه‌ی کلروفیل، رنگ‌های کاروتنوئیدی زرد و نارنجی در برگ‌ها پیدا می‌شود.\",terms:[\"گرانا\",\"استروما\",\"کلروفیل\",\"پلاستید\"]},\n{t:\"لیزوزوم و پراکسی‌زوم\",d:\"این دو اندامک کوچک غشادار بخش «بازیافت و سم‌زدایی» سلول را تشکیل می‌دهند. لیزوزوم‌ها مواد را هضم می‌کنند و پراکسی‌زوم‌ها ترکیبات سمی را خنثی می‌کنند.\",m:\"لیزوزوم‌ها آنزیم‌های هیدرولیتیک دارند که در محیط اسیدی (pH حدود ۵) کار می‌کنند. آن‌ها ذرات بلعیده‌شده، اندامک‌های فرسوده و مولکول‌های اضافی را هضم می‌کنند. پراکسی‌زوم‌ها آنزیم‌های اکسیدکننده دارند که H₂O₂ تولید می‌کنند و کاتالاز آن را به آب و اکسیژن تبدیل می‌کند. در کبد و کلیه فراوان‌اند و اسیدهای چرب بلند را می‌شکنند.\",adv:\"هضم اندامک‌های فرسوده خودخواری (اتوفاژی) نام دارد و یوشینوری اوسومی برای کشف سازوکار آن نوبل ۲۰۱۶ را گرفت. اتوفاگوزوم با لیزوزوم همجوش می‌شود. نقص آنزیم‌های لیزوزومی بیماری‌های ذخیره‌ای ایجاد می‌کند، مانند بیماری تی-ساکس (کمبود هگزوزآمینیداز A و تجمع گانگلیوزید در نورون) و بیماری گوشه. پمپ پروتون V-ATPase لیزوزوم را اسیدی می‌کند. در سندرم زلوگر ساخت پراکسی‌زوم‌های کارآمد دچار نقص است و این به اختلال شدید عصبی می‌انجامد. در گیاهان، گلی‌اکسی‌زوم‌ها چربی دانه را در جوانه‌زنی به قند تبدیل می‌کنند.\\n\\nنوتروفیل‌ها و ماکروفاژها لیزوزوم‌های فراوان دارند و میکروب‌ها را از راه فاگوزوم-لیزوزوم می‌کشند.\",k:[\"لیزوزوم در محیط اسیدی هضم می‌کند\",\"پراکسی‌زوم H₂O₂ را با کاتالاز تجزیه می‌کند\",\"اتوفاژی بازیافت اندامک‌هاست\"],x:\"دم نوزاد قورباغه در دگردیسی با کمک آنزیم‌های لیزوزومی به تدریج جذب می‌شود.\",terms:[\"هیدرولاز اسیدی\",\"کاتالاز\",\"اتوفاژی\",\"فاگوزوم\"]},\n{t:\"واکوئل و ویژگی‌های سلول گیاهی\",d:\"واکوئل کیسه‌ی غشادار بزرگی است که در سلول‌های گیاهی تا ۹۰ درصد حجم سلول را می‌گیرد و در ذخیره‌ی آب و مواد و ایجاد استحکام نقش دارد.\",m:\"غشای واکوئل (تونوپلاست) ورود و خروج مواد را کنترل می‌کند. شیره‌ی واکوئل آب، قند، نمک، رنگدانه‌ی آنتوسیانین و مواد زائد دارد. فشار آب درون واکوئل بر دیواره‌ی سلول وارد می‌شود و تورژسانس ایجاد می‌کند که برگ‌ها را سفت نگه می‌دارد. در جانوران واکوئل‌های کوچک غذایی و انقباضی دیده می‌شوند.\",adv:\"آنتوسیانین‌ها در واکوئل رنگ‌های قرمز تا بنفش و آبی میوه و گل را می‌سازند و رنگشان با pH تغییر می‌کند. تونوپلاست پمپ‌های پروتون و کانال‌های آکواپورین دارد. در گیاهان شورپسند، نمک در واکوئل جمع می‌شود تا پتانسیل اسمزی سلول پایین و آب جذب شود. در پارامسی، واکوئل انقباضی آب اضافه‌ی ناشی از اسمز را بیرون می‌ریزد. تفاوت‌های کلیدی سلول گیاهی با جانوری: دیواره‌ی سلولزی، کلروپلاست و واکوئل مرکزی بزرگ و نبود سانتریول در گیاهان عالی.\\n\\nپلاسمولیز وقتی رخ می‌دهد که سلول گیاهی در محیط هیپرتونیک آب از دست بدهد و غشا از دیواره جدا شود.\",k:[\"در گیاهان بزرگ و مرکزی است\",\"تورژسانس برگ‌ها را سفت می‌کند\",\"پلاسمولیز در محیط پرنمک رخ می‌دهد\"],x:\"کاهو در آب نمک آب از دست می‌دهد، سلول‌هایش پلاسمولیز می‌شوند و پژمرده می‌شود؛ در آب خالص دوباره سفت می‌شود.\",terms:[\"تونوپلاست\",\"تورژسانس\",\"آنتوسیانین\",\"پلاسمولیز\"]},\n{t:\"اسکلت سلولی، مژک و تاژک\",d:\"اسکلت سلولی شبکه‌ای از رشته‌های پروتئینی است که شکل سلول را حفظ می‌کند، اندامک‌ها را جابه‌جا می‌کند و حرکت سلول را ممکن می‌سازد.\",m:\"سه گروه رشته دارد: ریزرشته‌ها (اکتین، قطر حدود ۷ نانومتر)، رشته‌های میانی (قطر حدود ۱۰ نانومتر، مثل کراتین) و ریزلوله‌ها (توبولین، حدود ۲۵ نانومتر). ریزلوله‌ها در دوک تقسیم و در مژک و تاژک نقش دارند. مژک‌ها کوتاه و فراوان‌اند و تاژک‌ها بلند و کم‌اند. ساختار مژک و تاژک یوکاریوتی معمولاً ۹+۲ (نه جفت ریزلوله به‌علاوه‌ی دو ریزلوله‌ی مرکزی) است.\",adv:\"موتورهای مولکولی کینزین و دینئین با مصرف ATP بر روی ریزلوله‌ها مواد را حمل می‌کنند: کینزین معمولاً به سمت انتهای مثبت (محیط) و دینئین به سمت انتهای منفی (مرکز). ریزلوله‌ها ناپایدارند و با ناپایداری پویا رشد و کوتاه می‌شوند؛ داروهایی مانند تاکسول (در شیمی‌درمانی) و کلشی‌سین آن‌ها را هدف می‌گیرند و تقسیم سلول را مهار می‌کنند. اکتین و میوزین در انقباض ماهیچه و تقسیم سیتوپلاسم نقش دارند. سانتریول‌ها (۹ دسته‌ی سه‌تایی ریزلوله) در مرکز سازمان‌دهی ریزلوله‌ها (سانتروزوم) قرار دارند و در ساخت دوک نقش دارند. نقص دینئین مژک‌ها سندرم کارتاژنر را ایجاد می‌کند که با عفونت‌های تنفسی و ناباروری همراه است.\\n\\nدر اسپرم، تاژک با دینئین موجی حرکت می‌کند و میتوکندری‌ها در قطعه‌ی میانی انرژی را تأمین می‌کنند.\",k:[\"ریزرشته، رشته‌ی میانی و ریزلوله سه جزء اصلی‌اند\",\"ساختار مژک و تاژک ۹+۲ است\",\"دینئین و کینزین موتور مولکولی‌اند\"],x:\"مژک‌های نای ذرات و مخاط را به سمت بالا می‌رانند و دود سیگار آن‌ها را از کار می‌اندازد.\",terms:[\"توبولین\",\"اکتین\",\"دینئین\",\"سانتریول\"]}\n],\nfact:\"اگر همه‌ی غشاهای درونی یک سلول کبد را باز کنید، سطحی ده‌ها برابر سطح غشای بیرونی سلول به دست می‌آید.\",\nquiz:[\n{q:\"کدام اندامک در ساخت ریبوزوم نقش دارد؟\",o:[\"هستک\",\"گلژی\",\"لیزوزوم\",\"واکوئل\"],a:0,e:\"rRNA در هستک ساخته می‌شود و همان‌جا با پروتئین‌ها ترکیب می‌شود و زیرواحدهای ریبوزوم را می‌سازد.\"},\n{q:\"آنزیم‌های لیزوزوم در چه محیطی بهترین کارایی را دارند؟\",o:[\"بازی\",\"خنثی\",\"اسیدی\",\"بسیار گرم\"],a:2,e:\"pH درون لیزوزوم حدود ۵ است.\"},\n{q:\"ساختار ۹+۲ مربوط به کدام است؟\",o:[\"میتوکندری\",\"مژک و تاژک\",\"هسته\",\"ریبوزوم\"],a:1,e:\"نه جفت ریزلوله‌ی محیطی و دو ریزلوله‌ی مرکزی.\"}]},\n\n};\n\nvar GL={\n\"پیوند هیدروژنی\":\"پیوند ضعیفی بین سر مثبت یک مولکول و سر منفی مولکول دیگر؛ مثلاً بین مولکول‌های آب\",\n\"پیوند کووالانسی\":\"پیوند قوی بین اتم‌ها که با به‌اشتراک‌گذاشتن الکترون ساخته می‌شود\",\n\"قطبی\":\"دارای یک سر کمی مثبت و یک سر کمی منفی؛ مولکول‌های قطبی در آب حل می‌شوند\",\n\"آب‌گریز\":\"موادی که از آب دورند و در آن حل نمی‌شوند، مثل چربی\",\n\"آب‌دوست\":\"موادی که با آب میل ترکیبی دارند و در آن حل می‌شوند\",\n\"گرمای ویژه\":\"مقدار گرمایی که لازم است دمای یک گرم ماده یک درجه بالا برود\",\n\"بافر\":\"محلولی که pH را تقریباً ثابت نگه می‌دارد\",\n\"pH\":\"عددی که اسیدی یا بازی‌بودن را نشان می‌دهد؛ ۷ خنثی، کمتر از ۷ اسیدی و بیشتر از ۷ بازی است\",\n\"آنتروپی\":\"معیار بی‌نظمی؛ سیستم‌ها خودبه‌خود به سمت بی‌نظمی بیشتر می‌روند\",\n\"واسرشت\":\"از دست رفتن شکل سه‌بعدی پروتئین بر اثر گرما یا اسید که کارکرد آن را از بین می‌برد\",\n\"واسرشت‌سازی\":\"جدا شدن دو رشته‌ی DNA از هم با گرما\",\n\"آمینواسید\":\"واحد سازنده‌ی پروتئین‌ها؛ ۲۰ نوع آمینواسید در طبیعت وجود دارد\",\n\"پیوند پپتیدی\":\"پیوندی که آمینواسیدها را در زنجیره‌ی پروتئین به هم وصل می‌کند\",\n\"پلیمر\":\"مولکول بزرگی که از تکرار واحدهای کوچک مشابه ساخته شده است\",\n\"گلوکز\":\"قند ساده‌ای که سوخت اصلی سلول‌هاست\",\n\"تک‌قندی\":\"ساده‌ترین قند که نمی‌شود آن را به قندهای کوچک‌تر شکست، مثل گلوکز\",\n\"دوقندی\":\"قندی که از اتصال دو تک‌قندی ساخته شده، مثل شکر معمولی\",\n\"چندقندی\":\"زنجیره‌ی بلندی از قندهای ساده، مثل نشاسته و سلولز\",\n\"نشاسته\":\"ماده‌ی ذخیره‌ی قند در گیاهان\",\n\"گلیکوژن\":\"ماده‌ی ذخیره‌ی قند در جانوران که بیشتر در کبد و ماهیچه است\",\n\"سلولز\":\"چندقندی ساختاری که دیواره‌ی سلول گیاهی را می‌سازد\",\n\"کیتین\":\"ماده‌ی محکمی که اسکلت بیرونی حشرات و دیواره‌ی قارچ‌ها را می‌سازد\",\n\"اسید چرب\":\"واحد سازنده‌ی چربی‌ها؛ زنجیره‌ای بلند از کربن\",\n\"تری‌گلیسرید\":\"چربی معمولی که از یک گلیسرول و سه اسید چرب ساخته می‌شود\",\n\"فسفولیپید\":\"چربی‌ای با یک سر آب‌دوست و دو دم آب‌گریز که غشای سلول را می‌سازد\",\n\"کلسترول\":\"لیپیدی که در غشای سلول است و ماده‌ی اولیه‌ی ساخت برخی هورمون‌هاست\",\n\"لیپوپروتئین\":\"بسته‌ای از چربی و پروتئین که چربی‌ها را در خون جابه‌جا می‌کند، مثل LDL و HDL\",\n\"نوکلئوتید\":\"واحد سازنده‌ی DNA و RNA؛ شامل یک قند، یک فسفات و یک باز آلی\",\n\"ATP\":\"مولکول حامل انرژی سلول؛ انرژی با جدا شدن یک فسفات آن آزاد می‌شود\",\n\"NADH\":\"مولکولی که الکترون و انرژی را در تنفس سلولی جابه‌جا می‌کند\",\n\"آنزیم\":\"پروتئینی که سرعت واکنش‌های شیمیایی بدن را بالا می‌برد\",\n\"پیش‌ماده\":\"ماده‌ای که آنزیم روی آن کار می‌کند\",\n\"جایگاه فعال\":\"بخشی از آنزیم که پیش‌ماده به آن می‌چسبد\",\n\"انرژی فعال‌سازی\":\"انرژی لازم برای شروع یک واکنش شیمیایی\",\n\"کوفاکتور\":\"یون یا مولکول کمکی که برای کار آنزیم لازم است\",\n\"کوآنزیم\":\"مولکول کمکی آلی (اغلب از ویتامین‌ها) که برای کار آنزیم لازم است\",\n\"آلوستریک\":\"تنظیمی که با چسبیدن مولکول به جایی غیر از جایگاه فعال آنزیم انجام می‌شود\",\n\"بازدارنده\":\"ماده‌ای که کار آنزیم را کند یا متوقف می‌کند\",\n\"زیموژن\":\"شکل غیرفعال یک آنزیم که بعداً فعال می‌شود\",\n\"کاتالیزور\":\"ماده‌ای که واکنش را سریع‌تر می‌کند و خودش مصرف نمی‌شود\",\n\"هموگلوبین\":\"پروتئین قرمز گلبول‌های خون که اکسیژن را حمل می‌کند\",\n\"کلاژن\":\"پروتئین محکم و رشته‌ای که پوست، استخوان و رباط‌ها را می‌سازد\",\n\"چاپرون\":\"پروتئینی که به تاخوردگی درست پروتئین‌های دیگر کمک می‌کند\",\n\"پریون\":\"پروتئین بدشکل و عفونت‌زا که بیماری‌های مغزی ایجاد می‌کند\",\n\"ریبوزیم\":\"RNA ای که خودش مثل آنزیم کار می‌کند\",\n\"پروکاریوت\":\"جاندار بدون هسته‌ی واقعی، مثل باکتری‌ها\",\n\"یوکاریوت\":\"جاندار دارای هسته‌ی واقعی و اندامک‌های غشادار، مثل انسان، گیاه و قارچ\",\n\"اندامک\":\"بخش تخصصی درون سلول که کار ویژه‌ای انجام می‌دهد\",\n\"نوکلئوئید\":\"ناحیه‌ای در باکتری که DNA در آن جمع شده و غشا ندارد\",\n\"پلاسمید\":\"حلقه‌ی کوچک DNA اضافی در باکتری‌ها که اغلب ژن مقاومت به دارو دارد\",\n\"پپتیدوگلیکان\":\"ماده‌ی محکم دیواره‌ی با a(255,255,255,.3)}\n.li.seen:not(.on)::after{content:\"✓\";margin-inline-start:auto;color:var(--k);font-weight:800}\n.li.sp{border-style:dashed}\n.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px clamp(16px,3vw,32px) 22px;animation:rise .35s ease both;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px));\n  background-image:linear-gradient(180deg,var(--soft),transparent 230px)}\n@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.panel .kick{font-size:.82rem;color:var(--ac);font-weight:700;display:flex;gap:8px;align-items:center}\n.panel .kick i{display:inline-block;width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2))}\n.panel h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.4;margin:2px 0 10px;background:linear-gradient(100deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}\n.panel .l1{font-size:1.12rem;font-weight:500;margin:0 0 12px}\n.panel p{max-width:46em;margin:0 0 12px}\n.panel h4{font-family:var(--disp);font-weight:400;font-size:1.3rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}\n.panel h4::before{content:\"\";width:12px;height:12px;border-radius:4px;background:var(--ac2);transform:rotate(45deg)}\n.adv{margin-top:6px;border-radius:20px;padding:4px 20px 8px;background:color-mix(in srgb,var(--ac) 8%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-inline-start:6px solid var(--ac)}\n.adv h4{margin-top:14px}\n.adv p{font-size:.98rem}\n.gl{border-bottom:2px dotted var(--ac);cursor:help}\n.glnote{font-size:.88rem;color:var(--muted);margin:0 0 10px}\n.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px;margin:0}\n.gloss div{border:1px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--card)}\n.gloss dt{font-weight:700;color:var(--ac);font-size:.95rem}\n.gloss dd{margin:0;font-size:.9rem;color:var(--muted);line-height:1.6}\n.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}\n.key{--k:oklch(var(--L) var(--C) calc(var(--h) + var(--n)*55));border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--k) 14%,var(--card));border:1.5px solid color-mix(in srgb,var(--k) 55%,transparent);font-size:.95rem;line-height:1.6}\n.key b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--k);color:#fff;font-size:.8rem;margin-bottom:4px}\n.ex{border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,var(--card)),color-mix(in srgb,var(--ac2) 20%,var(--card)));border:1.5px dashed var(--ac)}\n.ex b{color:var(--ac);font-family:var(--disp);font-weight:400;font-size:1.1rem;margin-inline-end:6px}\n.terms{display:flex;gap:8px;flex-wrap:wrap}\n.terms span{--k:oklch(var(--L) var(--C) calc(var(--h) + var(--n)*40));font-size:.82rem;padding:1px 14px;border-radius:99px;background:var(--k);color:#fff;font-weight:500}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}\n.pg{border:1.5px solid var(--ac);background:transparent;color:var(--fg);border-radius:99px;padding:4px 18px;cursor:pointer;font-size:.92rem}\n.pg:hover{background:var(--ac);color:#fff}\n.bigfact{font-size:1.2rem;line-height:1.8;max-width:40em}\n.bigfact::first-letter{color:var(--ac)}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}\n.opt{font-size:1rem;text-align:start;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}\n.opt:hover:not([disabled]){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}\n.opt.ok{border-color:#1f9d55;background:color-mix(in srgb,#1f9d55 24%,var(--card))}\n.opt.no{border-color:#d1493f;background:color-mix(in srgb,#d1493f 20%,var(--card))}\n.qtext{font-size:1.1rem;font-weight:700;margin:6px 0 12px}\n.expl{margin:12px 0 0;font-size:.95rem;color:var(--muted)}\n.next{margin-top:12px;padding:6px 22px;border-radius:99px;border:0;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;font-weight:700;font-size:.95rem}\n.empty{display:none;text-align:center;padding:40px 0;color:var(--muted)}\nfooter{margin-top:50px;background:var(--hero1);color:var(--herofg);padding-block:36px calc(36px + env(safe-area-inset-bottom,0px))}\nfooter .wrap{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}\nfooter b{font-family:var(--disp);font-weight:400;font-size:1.7rem;color:#ffe56a}\nfooter p{margin:0;color:#a6e0d0;font-size:.9rem}\n@media (max-width:820px){\n  .layout{grid-template-columns:minmax(0,1fr);gap:14px}\n  .list{max-height:none;position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}\n  .li{width:auto;flex:none;white-space:nowrap}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}\n<\/style>\n\n<header class=\"hero\" id=\"hero\">\n  <canvas id=\"cells\" aria-hidden=\"true\"><\/canvas>\n  <div class=\"wrap\">\n    <div class=\"eyebrow\"><i><\/i> A journey from molecules to the biosphere<\/div>\n    <h1>BioMate<\/h1>\n    <p class=\"lead\">All of biology, chapter by chapter. Open a chapter and read one topic at a time: the core explanation, a specialist view, key points, an example and a quiz.<\/p>\n    <div class=\"byline\"><span>Designed &amp; built by<\/span><b>Sadra Farahbakhshian<\/b><\/div>\n  <\/div>\n<\/header>\n\n<nav class=\"nav\" aria-label=\"Chapters\">\n  <div class=\"wrap\">\n    <button class=\"brand\" id=\"home\" type=\"button\">BioMate<\/button>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <a class=\"langbtn\" id=\"lang\" href=\"index.html\" lang=\"fa\" aria-label=\"تغییر زبان به فارسی\">فارسی<\/a>\n    <button class=\"iconbtn\" id=\"theme\" type=\"button\" aria-label=\"Toggle theme\">◐<\/button>\n  <\/div>\n<\/nav>\n\n<main id=\"app\"><\/main>\n\n<footer>\n  <div class=\"wrap\">\n    <div><b>BioMate<\/b><p>Learn biology, step by step<\/p><\/div>\n    <p>Designed and built by <b style=\"font-size:1.25rem\">Sadra Farahbakhshian<\/b><\/p>\n  <\/div>\n<\/footer>\n\n<script>\nvar D=[\n{id:\"mol\",h:215,name:\"Molecules of Life\",hl:\"Life\",tag:\"Biochemistry\",scale:\"1–100 nm\",\nintro:\"Every living thing is built from a few families of molecules. Carbon chemistry makes it possible to build large, stable, and enormously diverse molecules.\",\ntopics:[\n[\"Water: the solvent of life\",\"Water is a polar molecule, and its hydrogen bonds give it cohesion, a high specific heat, and a strong ability to dissolve other substances. This is why cellular reactions take place in a watery environment and body temperature stays stable.\",[\"Hydrogen bond\",\"Polarity\",\"Specific heat\"]],\n[\"Carbohydrates\",\"Sugars are a quick source of energy and a structural material. Glucose is a monosaccharide, sucrose is a disaccharide, and starch, glycogen, and cellulose are polysaccharides. Cellulose makes up the plant cell wall.\",[\"Glucose\",\"Starch\",\"Cellulose\",\"Glycogen\"]],\n[\"Lipids\",\"Fats, phospholipids, and steroids are mostly hydrophobic. Phospholipids form the lipid bilayer of membranes, and fats store energy in a compact form. Hormones such as estrogen are steroids.\",[\"Phospholipid\",\"Triglyceride\",\"Cholesterol\"]],\n[\"Proteins\",\"Proteins are chains of amino acids that fold into a specific three-dimensional shape. Their shape determines their function: enzyme, antibody, carrier, or structural material. Twenty different amino acids are used to build them.\",[\"Amino acid\",\"Peptide bond\",\"Tertiary structure\"]],\n[\"Nucleic acids\",\"DNA and RNA are built from nucleotides and store and transmit hereditary information. ATP is also a nucleotide and serves as the cell’s energy currency.\",[\"DNA\",\"RNA\",\"ATP\",\"Nucleotide\"]],\n[\"Enzymes\",\"Enzymes are biological catalysts that greatly speed up reactions by lowering the activation energy. Each enzyme has a specific active site, and temperature, pH, and inhibitors affect it.\",[\"Active site\",\"Substrate\",\"Inhibitor\"]]],\nfact:\"If you stretched out the DNA of a single human cell, it would be about two meters long, yet it fits inside a nucleus only a few micrometers across.\",\nquiz:[\n{q:\"Which bond stabilizes the secondary structure of proteins and the base pairs of DNA?\",o:[\"Ionic\",\"Hydrogen\",\"Metallic\",\"Nonpolar covalent\"],a:1,e:\"Hydrogen bonds are weak, but there are so many of them that they stabilize these structures.\"},\n{q:\"What is the building block of proteins?\",o:[\"Nucleotide\",\"Fatty acid\",\"Amino acid\",\"Monosaccharide\"],a:2,e:\"Proteins are polymers of amino acids.\"},\n{q:\"How do enzymes speed up a reaction?\",o:[\"By raising the temperature\",\"By lowering the activation energy\",\"By being used up\",\"By changing the product\"],a:1,e:\"Enzymes are not consumed; they only lower the activation energy.\"}]},\n\n{id:\"cell\",h:170,name:\"The Cell: Unit of Life\",hl:\"Cell\",tag:\"Cell biology\",scale:\"1–100 µm\",\nintro:\"Every living thing is made of one or more cells. The cell is the smallest unit that has all the characteristics of life: metabolism, growth, response to the environment, and reproduction.\",\ntopics:[\n[\"Prokaryotic and eukaryotic cells\",\"Bacteria and archaea have no separate nucleus, and their circular DNA lies in the cytoplasm. Eukaryotic cells (animals, plants, fungi, protists) have a nucleus and membrane-bound organelles.\",[\"Prokaryote\",\"Eukaryote\",\"Nucleoid\"]],\n[\"Organelles\",\"The nucleus is the control center, mitochondria produce energy, the endoplasmic reticulum and Golgi apparatus process and package proteins, lysosomes digest materials, and chloroplasts carry out photosynthesis in plants.\",[\"Mitochondrion\",\"Golgi apparatus\",\"Lysosome\",\"Chloroplast\",\"Ribosome\"]],\n[\"Cell membrane\",\"The membrane is made of a phospholipid bilayer with embedded proteins, and it is selectively permeable. The fluid mosaic model describes it.\",[\"Fluid mosaic\",\"Channel\",\"Sodium-potassium pump\"]],\n[\"Transport across membranes\",\"Diffusion and osmosis occur without using energy. Active transport uses ATP to move substances against their concentration gradient. Endocytosis and exocytosis move large particles.\",[\"Osmosis\",\"Facilitated diffusion\",\"Active transport\"]],\n[\"Cellular respiration and photosynthesis\",\"In cellular respiration, glucose yields up to about 30 ATP through glycolysis, the Krebs (citric acid) cycle, and the electron transport chain. Photosynthesis does the reverse, storing light energy in sugar.\",[\"Glycolysis\",\"Krebs cycle\",\"ATP synthase\"]],\n[\"Cell cycle and division\",\"Mitosis divides one cell into two identical cells and is used for growth and repair. Meiosis produces four cells with half the chromosomes and creates genetic diversity. Faulty control of the cycle leads to cancer.\",[\"Mitosis\",\"Meiosis\",\"Checkpoint\",\"Crossing over\"]]],\nfact:\"Your body makes about two million new red blood cells every second. All the cells in your body began from a single fertilized egg.\",\nquiz:[\n{q:\"Which organelle produces the most ATP?\",o:[\"Golgi apparatus\",\"Lysosome\",\"Mitochondrion\",\"Ribosome\"],a:2,e:\"The mitochondrion is the site of the electron transport chain and produces the most ATP.\"},\n{q:\"How many cells does meiosis produce at the end?\",o:[\"2 identical cells\",\"4 cells with half the chromosomes\",\"4 identical cells\",\"8 cells\"],a:1,e:\"Through two divisions, meiosis produces four genetically different haploid cells.\"},\n{q:\"What is the movement of water from a dilute solution to a concentrated one across a semipermeable membrane called?\",o:[\"Osmosis\",\"Active transport\",\"Exocytosis\",\"Replication\"],a:0,e:\"Osmosis is the diffusion of water.\"}]},\n\n{id:\"gen\",h:280,name:\"Genetics & Molecular Biology\",hl:\"Genetics\",tag:\"Heredity\",scale:\"2 nm to 10 µm\",\nintro:\"Genetics asks how traits pass from one generation to the next. Molecular biology shows how this information is read and turned into proteins.\",\ntopics:[\n[\"DNA structure\",\"DNA is made of two antiparallel strands wound into a double helix. Adenine (A) pairs with thymine (T), and guanine (G) pairs with cytosine (C). The sequence of bases encodes genetic information.\",[\"Double helix\",\"Base pair\",\"Chromatin\"]],\n[\"Replication\",\"DNA replicates semiconservatively. Helicase unwinds the strands, and DNA polymerase builds the new strand. Its accuracy is about one error per billion bases.\",[\"Helicase\",\"DNA polymerase\",\"Semiconservative\"]],\n[\"The central dogma\",\"DNA is transcribed into RNA, and the RNA is then translated into protein at the ribosome. Every three consecutive bases form a codon, which specifies one amino acid.\",[\"Transcription\",\"Translation\",\"Codon\",\"tRNA\"]],\n[\"Mendelian inheritance\",\"Using pea plants, Mendel showed that each trait is determined by two alleles. The dominant allele prevails over the recessive one. The law of segregation and the law of independent assortment came from his experiments.\",[\"Dominant\",\"Recessive\",\"Punnett square\",\"Heterozygous\"]],\n[\"Beyond Mendel\",\"Codominance, incomplete dominance, multiple alleles, gene linkage, and sex-linked inheritance create more complex patterns. The ABO blood group is an example of codominance and multiple alleles.\",[\"Codominance\",\"X-linked\",\"Linkage\"]],\n[\"Mutation and gene therapy\",\"A mutation is a lasting change in the DNA sequence. Some are harmful, some neutral, and some beneficial. CRISPR-Cas9 technology can now edit genes with precision.\",[\"Point mutation\",\"CRISPR\",\"Epigenetics\"]]],\nfact:\"The human genome has about three billion base pairs, but only about two percent of it codes for proteins.\",\nquiz:[\n{q:\"Which base is found in RNA in place of thymine?\",o:[\"Adenine\",\"Uracil\",\"Cytosine\",\"Guanine\"],a:1,e:\"RNA contains uracil (U).\"},\n{q:\"What phenotypic ratio results from crossing two heterozygous parents (Aa × Aa)?\",o:[\"1:1\",\"1:2:1\",\"3:1\",\"9:3:3:1\"],a:2,e:\"Three dominant to one recessive.\"},\n{q:\"Where does translation take place?\",o:[\"Nucleus\",\"Ribosome\",\"Golgi apparatus\",\"Lysosome\"],a:1,e:\"Ribosomes read mRNA and link amino acids together.\"}]},\n\n{id:\"mic\",h:100,name:\"Microbes & Immunity\",hl:\"Immunity\",tag:\"Microbiology\",scale:\"0.1–10 µm\",\nintro:\"The invisible world of microbes makes up a large share of Earth’s biomass. Most are harmless or beneficial, and only a few cause disease.\",\ntopics:[\n[\"Bacteria\",\"Single-celled prokaryotes that reproduce by binary fission. They come in shapes such as spheres, rods, and spirals. The human gut is home to trillions of beneficial bacteria.\",[\"Peptidoglycan cell wall\",\"Gram-positive\",\"Microbiome\"]],\n[\"Viruses\",\"Particles of genetic material inside a protein coat that reproduce only inside a host cell. Whether they are alive is debated, and many consider them to lie on the border between living and nonliving.\",[\"Capsid\",\"Bacteriophage\",\"Retrovirus\"]],\n[\"Fungi and protists\",\"Yeasts, molds, and mushrooms are eukaryotes that absorb food from outside. Protists such as amoebas and Plasmodium (the cause of malaria) are single-celled.\",[\"Yeast\",\"Hypha\",\"Plasmodium\"]],\n[\"Innate immunity\",\"The first line of defense: skin, mucus, stomach acid, phagocytic white blood cells, and inflammation. The response is fast and nonspecific.\",[\"Macrophage\",\"Inflammation\",\"Interferon\"]],\n[\"Adaptive immunity\",\"B lymphocytes make antibodies, and killer T cells destroy infected cells. After an encounter with a pathogen, memory cells speed up the next response.\",[\"Antibody\",\"T lymphocyte\",\"Immune memory\"]],\n[\"Vaccines and antibiotics\",\"A vaccine trains the immune system without causing disease. Antibiotics work only on bacteria, and their misuse leads to drug resistance.\",[\"Drug resistance\",\"Herd immunity\",\"mRNA\"]]],\nfact:\"The number of bacteria in the human body is roughly equal to the number of our own cells.\",\nquiz:[\n{q:\"Which type of organism do antibiotics act on?\",o:[\"Viruses\",\"Bacteria\",\"All microbes\",\"Cancer\"],a:1,e:\"Antibiotics have no effect on viruses.\"},\n{q:\"Which cell is responsible for producing antibodies?\",o:[\"B lymphocyte\",\"Macrophage\",\"Platelet\",\"Red blood cell\"],a:0,e:\"B lymphocytes (after turning into plasma cells) secrete antibodies.\"},\n{q:\"What do viruses need in order to reproduce?\",o:[\"Light\",\"A host cell\",\"Soil\",\"Free oxygen\"],a:1,e:\"They have no independent metabolism.\"}]},\n\n{id:\"plant\",h:135,name:\"The World of Plants\",hl:\"Plants\",tag:\"Botany\",scale:\"1 mm to 100 m\",\nintro:\"Through photosynthesis, plants turn sunlight into food, and they form the base of most terrestrial food chains.\",\ntopics:[\n[\"Plant structure\",\"Roots absorb water and minerals, stems carry them upward, and leaves are the center of photosynthesis. The tissues of the vascular system are xylem (water transport) and phloem (transport of sugar-rich sap).\",[\"Xylem\",\"Phloem\",\"Stomata\"]],\n[\"Photosynthesis\",\"In the light reactions, light energy is used to make ATP and NADPH. In the Calvin cycle, CO₂ is converted into sugar. The oxygen released comes from the splitting of water.\",[\"Chlorophyll\",\"Calvin cycle\",\"Thylakoid\"]],\n[\"Plant groups\",\"Mosses lack vascular tissue, ferns are seedless vascular plants, gymnosperms bear naked seeds, and angiosperms are flowering plants. Angiosperms are the largest plant group.\",[\"Moss\",\"Fern\",\"Gymnosperm\",\"Angiosperm\"]],\n[\"Flowers and reproduction\",\"Pollination is carried out by wind or animals. Double fertilization in angiosperms produces the embryo and the endosperm. The fruit develops from the flower’s ovary.\",[\"Double fertilization\",\"Pollination\",\"Fruit\"]],\n[\"Plant hormones\",\"Auxin guides growth and phototropism, gibberellin promotes germination, cytokinin promotes cell division, ethylene promotes fruit ripening, and abscisic acid controls dormancy and stomatal closure.\",[\"Auxin\",\"Ethylene\",\"Phototropism\"]],\n[\"Adaptations\",\"Cacti tolerate drought by storing water, and carnivorous plants make up for nitrogen-poor soil by trapping insects. CAM plants open their stomata at night.\",[\"CAM\",\"Carnivorous plant\",\"Root symbiosis\"]]],\nfact:\"On a summer day, a large tree transpires hundreds of liters of water through its leaves.\",\nquiz:[\n{q:\"The oxygen released in photosynthesis comes from which substance?\",o:[\"CO₂\",\"Glucose\",\"Water\",\"Light\"],a:2,e:\"Oxygen is released when water is split by light.\"},\n{q:\"In which vessels does the sugar-rich sap travel?\",o:[\"Xylem\",\"Phloem\",\"Stomata\",\"Cambium\"],a:1,e:\"Phloem carries sugars from the leaves to the rest of the plant.\"},\n{q:\"Which hormone speeds up fruit ripening?\",o:[\"Ethylene\",\"Auxin\",\"Gibberellin\",\"Cytokinin\"],a:0,e:\"Ethylene is a gas that speeds up ripening.\"}]},\n\n{id:\"anim\",h:85,name:\"Animals\",hl:\"Animals\",tag:\"Zoology\",scale:\"1 mm to 30 m\",\nintro:\"Animals are multicellular heterotrophs (they consume food made by other organisms), and most of them can move and sense their surroundings. From simple sponges to mammals, they all share a common evolutionary history.\",\ntopics:[\n[\"Invertebrates\",\"More than 95 percent of animal species lack a backbone: sponges, cnidarians, worms, mollusks, arthropods, and echinoderms. Insects are the most numerous group.\",[\"Arthropods\",\"Mollusks\",\"Exoskeleton\"]],\n[\"Vertebrates\",\"Fishes, amphibians, reptiles, birds, and mammals have a backbone. The move onto land was accompanied by the appearance of limbs and efficient lungs, followed later by the shelled egg.\",[\"Vertebral column\",\"Amnion\",\"Warm-blooded\"]],\n[\"Reproduction and development\",\"Sexual reproduction creates diversity, while asexual reproduction is fast. In embryonic development, the fertilized egg passes through successive divisions to a blastula, then a gastrula and the germ layers.\",[\"Zygote\",\"Gastrula\",\"Metamorphosis\"]],\n[\"Amazing adaptations\",\"The camel uses body water very sparingly, bats find their way by echolocation, and the polar bear has a thick layer of fat under the skin and special fur. Every adaptation is the product of natural selection.\",[\"Echolocation\",\"Hibernation\",\"Camouflage\"]],\n[\"Nervous systems\",\"From the simple nerve net of a jellyfish to the complex brain of mammals. Behaviors range from simple reflexes to learning and memory.\",[\"Neuron\",\"Ganglion\",\"Cerebral cortex\"]],\n[\"Symbiosis\",\"Bees and flowers, corals and algae, and gut bacteria are examples of symbiosis. Parasites live at the expense of their host.\",[\"Mutualism\",\"Parasitism\",\"Commensalism\"]]],\nfact:\"The combined weight of all the ants on Earth is estimated to exceed that of all wild birds.\",\nquiz:[\n{q:\"Which group has the largest number of animal species?\",o:[\"Mammals\",\"Fishes\",\"Insects\",\"Birds\"],a:2,e:\"Insects have more than a million known species.\"},\n{q:\"In which group did the amnion first appear?\",o:[\"Amphibians\",\"Fishes\",\"The ancestors of reptiles, birds, and mammals\",\"Sponges\"],a:2,e:\"The amniotic egg made life fully on land possible.\"},\n{q:\"What type of symbiosis is the relationship between coral and algae?\",o:[\"Parasitism\",\"Mutualism\",\"Competition\",\"Predation\"],a:1,e:\"Both partners benefit.\"}]},\n\n{id:\"human\",h:38,name:\"The Human Body\",hl:\"Human\",tag:\"Physiology\",scale:\"1–2 m\",\nintro:\"The human body is a collection of systems that work simultaneously to keep the internal environment stable; this stability is called homeostasis.\",\ntopics:[\n[\"Circulation\",\"The four-chambered heart pumps blood along two routes, pulmonary and systemic. Arteries carry blood away from the heart, and veins return it to the heart. Capillaries are where substances are exchanged.\",[\"Atrium\",\"Ventricle\",\"Hemoglobin\"]],\n[\"Respiration\",\"Air travels through the pharynx and trachea to the bronchi and alveoli. In the alveoli, O₂ enters the blood and CO₂ leaves it. The diaphragm changes the volume of the chest cavity.\",[\"Alveolus\",\"Diaphragm\",\"Gas exchange\"]],\n[\"Digestion\",\"Food is broken down in the mouth, stomach, and small intestine, and most absorption takes place through the villi of the small intestine. Bile (from the liver) and pancreatic juice empty into the small intestine, and the large intestine absorbs water.\",[\"Amylase\",\"Pepsin\",\"Intestinal villus\"]],\n[\"The nervous system\",\"The brain and spinal cord are the processing centers, and nerves carry signals. A nerve signal is transmitted by changes in membrane potential and by chemical neurotransmitters at the synapse.\",[\"Neuron\",\"Synapse\",\"Action potential\"]],\n[\"Endocrine glands\",\"Hormones are chemical messengers carried in the blood. Insulin and glucagon regulate blood sugar, the thyroid regulates metabolism, and the pituitary gland controls other glands.\",[\"Insulin\",\"Pituitary gland\",\"Negative feedback\"]],\n[\"Kidneys and excretion\",\"The kidneys filter the blood with nephrons, regulate water and salts, and produce urine. Each kidney has about one million nephrons.\",[\"Nephron\",\"Filtration\",\"ADH\"]],\n[\"Skeleton and muscle\",\"Bones are made of calcium phosphate minerals and the protein collagen. Muscles shorten by the sliding of actin and myosin filaments. Their energy source is ATP.\",[\"Actin\",\"Myosin\",\"Joint\"]]],\nfact:\"Over an average lifetime, the human heart beats several billion times without a single day of rest.\",\nquiz:[\n{q:\"In which part of the lung does gas exchange take place?\",o:[\"Trachea\",\"Bronchus\",\"Alveoli\",\"Diaphragm\"],a:2,e:\"The thin walls of the alveoli and capillaries make the exchange possible.\"},\n{q:\"Which hormone raises blood sugar when it drops?\",o:[\"Insulin\",\"Glucagon\",\"ADH\",\"Thyroxine\"],a:1,e:\"Glucagon raises blood sugar.\"},\n{q:\"What is the structural and functional unit of the kidney?\",o:[\"Neuron\",\"Nephron\",\"Villus\",\"Alveolus\"],a:1,e:\"The nephron filters the blood.\"}]},\n\n{id:\"beh\",h:350,name:\"Animal Behavior\",hl:\"Behavior\",tag:\"Ethology\",scale:\"1 second to a lifetime\",\nintro:\"Behavior is an animal’s action in response to its environment. Part of it is genetic and part is learned, and both are shaped by natural selection.\",\ntopics:[\n[\"Instinct and learning\",\"Instinct appears without training, such as a newborn’s sucking. Learning includes habituation, conditioning, and imprinting. With dogs, Pavlov demonstrated classical conditioning.\",[\"Conditioning\",\"Imprinting\",\"Instinct\"]],\n[\"Communication\",\"Animals send messages with sound, smell, movement, and color. The honeybee’s dance conveys the direction and distance of food. Pheromones are chemical messengers between individuals of a species.\",[\"Pheromone\",\"Waggle dance\",\"Signal\"]],\n[\"Migration and biological clocks\",\"Birds and sea turtles navigate using Earth’s magnetic field and the stars. The biological clock coordinates the circadian rhythm.\",[\"Circadian rhythm\",\"Navigation\",\"Migration\"]],\n[\"Social life\",\"Ants and bees build colonies with a division of labor. Wolves and elephants live in family groups. From an evolutionary viewpoint, cooperation sometimes depends on shared genes.\",[\"Colony\",\"Altruism\",\"Hierarchy\"]],\n[\"Mating behavior\",\"Colorful displays and male song directed at females can signal genetic fitness. Sexual selection sometimes shapes traits that make survival harder, such as the peacock’s tail.\",[\"Sexual selection\",\"Territoriality\",\"Parental care\"]]],\nfact:\"New Caledonian crows make tools from thin twigs and leaves to pull insects out of cracks in wood.\",\nquiz:[\n{q:\"Who described classical conditioning?\",o:[\"Mendel\",\"Pavlov\",\"Darwin\",\"Watson\"],a:1,e:\"Pavlov, with dogs and the sound of a bell.\"},\n{q:\"What is a pheromone?\",o:[\"A blood hormone\",\"A chemical messenger between individuals\",\"A type of antibody\",\"A digestive enzyme\"],a:1,e:\"Pheromones are released from the body and affect the behavior of members of the same species.\"},\n{q:\"What regulates the circadian rhythm?\",o:[\"The biological clock\",\"Heat alone\",\"Food alone\",\"Antibodies\"],a:0,e:\"The biological clock is synchronized by light.\"}]},\n\n{id:\"evo\",h:310,name:\"Evolution\",hl:\"Evolution\",tag:\"Evolutionary biology\",scale:\"Millions of years\",\nintro:\"Evolution is the unifying framework of biology. Darwin and Wallace showed that species arose from common ancestors through natural selection.\",\ntopics:[\n[\"Natural selection\",\"Individuals in a population differ from one another, some of these differences are heritable, and individuals with better-suited traits leave more offspring. The result is a change in allele frequencies over generations.\",[\"Fitness\",\"Variation\",\"Adaptation\"]],\n[\"Evidence for evolution\",\"Fossils, comparative anatomy (homologous and vestigial structures), DNA similarity, and biogeography all support evolution.\",[\"Fossil\",\"Homologous structure\",\"Comparative genomics\"]],\n[\"Speciation\",\"Geographic isolation of populations and the accumulation of genetic differences eventually block interbreeding, and a new species arises. The cichlids of the African lakes are an example.\",[\"Geographic isolation\",\"Reproductive barrier\",\"Adaptive radiation\"]],\n[\"Genetic drift and gene flow\",\"Besides selection, genetic drift (chance events in small populations), gene flow, and mutation also change allele frequencies. Hardy–Weinberg describes the state of a population that is not evolving.\",[\"Genetic drift\",\"Founder effect\",\"Hardy–Weinberg\"]],\n[\"Human evolution\",\"Homo sapiens arose in Africa about 300,000 years ago. Fossils of Australopithecus and Homo erectus show the path of our evolution.\",[\"Homo sapiens\",\"Bipedalism\",\"Neanderthal\"]],\n[\"The tree of life\",\"A phylogenetic tree shows the evolutionary relationships among species. Common descent links all living things.\",[\"Common ancestor\",\"Clade\",\"Phylogeny\"]]],\nfact:\"Whales evolved from four-legged land-dwelling ancestors and still have small pelvic bones.\",\nquiz:[\n{q:\"Which term describes reproductive success?\",o:[\"Strength\",\"Fitness\",\"Speed\",\"Lifespan\"],a:1,e:\"Fitness is an individual’s contribution to the next generation.\"},\n{q:\"The small pelvic bone of a whale is an example of what?\",o:[\"A vestigial structure\",\"A homologous structure\",\"A new mutation\",\"Symbiosis\"],a:0,e:\"A vestigial structure has lost its original function.\"},\n{q:\"What does speciation usually begin with?\",o:[\"Isolation of populations\",\"A rise in temperature\",\"Migration of everyone\",\"A drop in mutations\"],a:0,e:\"Geographic isolation cuts off gene flow.\"}]},\n\n{id:\"tax\",h:245,name:\"Biodiversity & Classification\",hl:\"Classification\",tag:\"Systematics\",scale:\"More than 8 million species\",\nintro:\"Biologists classify organisms into nested groups based on how closely they are related. Biodiversity is the variety of genes, species, and ecosystems.\",\ntopics:[\n[\"The three domains of life\",\"Bacteria, archaea, and eukaryotes. Archaea often live in harsh environments such as hot springs and salt flats.\",[\"Archaea\",\"Bacteria\",\"Eukarya\"]],\n[\"The hierarchy\",\"Domain, kingdom, phylum, class, order, family, genus, and species. Linnaeus popularized the two-part scientific name (genus and species), as in Homo sapiens.\",[\"Linnaeus\",\"Binomial nomenclature\",\"Species\"]],\n[\"The species concept\",\"A species is a group of individuals that interbreed and produce fertile offspring. This definition is difficult to apply to asexual organisms or fossils.\",[\"Biological species\",\"Hybrid\",\"Subspecies\"]],\n[\"The extinction crisis\",\"The current extinction rate is estimated at tens to hundreds of times the natural rate. Habitat destruction, hunting, invasive species, and climate change are the main causes.\",[\"Endangered species\",\"Habitat\",\"IUCN\"]],\n[\"Biodiversity hotspots\",\"Tropical regions such as the Amazon forests and parts of Asia hold countless species. Iran, too, has diverse climates and many endemic species, such as the Asiatic cheetah.\",[\"Endemic species\",\"Cheetah\",\"National park\"]]],\nfact:\"Most of Earth’s species have not yet been named; estimates point to millions of unknown species.\",\nquiz:[\n{q:\"What is the scientific name of humans?\",o:[\"Homo erectus\",\"Homo sapiens\",\"Pan troglodytes\",\"Canis lupus\"],a:1,e:\"The genus Homo and the species sapiens.\"},\n{q:\"Which of these is not a domain of life?\",o:[\"Archaea\",\"Bacteria\",\"Eukarya\",\"Viruses\"],a:3,e:\"Viruses do not fit into the three domains.\"},\n{q:\"What is the greatest threat to species?\",o:[\"Habitat destruction\",\"Rain\",\"Sunlight\",\"Stars\"],a:0,e:\"The destruction and fragmentation of habitats.\"}]},\n\n{id:\"eco\",h:195,name:\"Ecology\",hl:\"Ecology\",tag:\"Ecosystems\",scale:\"1 m to 1,000 km\",\nintro:\"Ecology studies how organisms relate to one another and to their environment. From a single population to the biosphere, energy and matter are in constant flow.\",\ntopics:[\n[\"Levels of organization\",\"Individual, population, community, ecosystem, biome, and biosphere. Each level has its own distinctive properties.\",[\"Population\",\"Community\",\"Biosphere\"]],\n[\"Energy flow\",\"Energy passes from the sun to producers and then to consumers. At each trophic level, about 10 percent of the energy reaches the next level, so energy always decreases as you move up the energy pyramid.\",[\"Food chain\",\"Energy pyramid\",\"Decomposer\"]],\n[\"Nutrient cycles\",\"Carbon, nitrogen, phosphorus, and water are recycled between organisms and the environment. Nitrogen-fixing bacteria convert atmospheric nitrogen gas into a usable form.\",[\"Carbon cycle\",\"Nitrogen fixation\",\"Transpiration\"]],\n[\"Population dynamics\",\"Under favorable conditions, populations grow exponentially, but the carrying capacity of the environment turns growth into a logistic (S-shaped) curve. Competition, predation, and disease regulate population size.\",[\"Carrying capacity\",\"Exponential growth\",\"Competition\"]],\n[\"Biomes\",\"Rainforest, desert, taiga, grassland, tundra, marine, and freshwater. Each has its own temperature, rainfall, and organisms.\",[\"Taiga\",\"Coral\",\"Wetland\"]],\n[\"Climate change and conservation\",\"Greenhouse gases raise Earth’s temperature and harm corals, melt glaciers, and alter rainfall patterns. Habitat protection, renewable energy, and sustainable agriculture are among the solutions.\",[\"Global warming\",\"Carbon footprint\",\"Sustainability\"]]],\nfact:\"Rainforests cover less than seven percent of Earth’s land, yet about half of Earth’s species live in them.\",\nquiz:[\n{q:\"In an energy pyramid, about what percentage of energy reaches the next level?\",o:[\"100\",\"50\",\"10\",\"1\"],a:2,e:\"The approximate ten percent rule.\"},\n{q:\"Which organism converts CO₂ into organic matter?\",o:[\"Producer\",\"Predator\",\"Parasite\",\"Decomposer\"],a:0,e:\"Producers make their own food.\"},\n{q:\"What does the logistic growth curve show?\",o:[\"Endless growth\",\"The carrying capacity of the environment\",\"Extinction\",\"Mutation\"],a:1,e:\"The population approaches the carrying capacity.\"}]},\n\n{id:\"bio\",h:58,name:\"Biotechnology & Modern Science\",hl:\"Modern\",tag:\"Technology\",scale:\"From genes to industry\",\nintro:\"Biotechnology uses biological processes to produce medicine, food, and energy. Many of its methods are built on molecular genetics.\",\ntopics:[\n[\"Genetic engineering\",\"Using restriction enzymes and vectors such as plasmids, a gene of interest is inserted into a host. Recombinant insulin is made in bacteria by this method.\",[\"Plasmid\",\"Restriction enzyme\",\"Recombinant DNA\"]],\n[\"PCR and sequencing\",\"The polymerase chain reaction (PCR) amplifies a piece of DNA millions of times in a few hours. Sequencing reads the order of the bases, and the Human Genome Project was made possible by it.\",[\"PCR\",\"Electrophoresis\",\"Genome\"]],\n[\"Stem cells\",\"These cells can develop into many cell types and are used to treat blood diseases and repair tissue. Current research focuses on growing tissues and organs in the laboratory.\",[\"Pluripotent\",\"Tissue engineering\",\"Cloning\"]],\n[\"Bioinformatics\",\"Data science and biology working together to analyze genomes, predict protein structure, and find new drugs. Artificial intelligence has produced a major leap in this field.\",[\"Database\",\"BLAST\",\"Protein structure\"]],\n[\"Agriculture and industry\",\"Pest-resistant plants, industrial fermentation, biofuels, and the biological treatment of wastewater are examples. The debate over their safety and ethics continues.\",[\"Transgenic\",\"Fermentation\",\"Bioremediation\"]],\n[\"The scientific method and tools\",\"Observation, hypothesis, controlled experiment, and peer review are the foundation of science. Light and electron microscopes, centrifuges, and staining are common tools.\",[\"Hypothesis\",\"Control group\",\"Microscope\"]]],\nfact:\"mRNA vaccines went from design to emergency-use authorization in less than a year; decades of basic research had made this possible.\",\nquiz:[\n{q:\"What is PCR used for?\",o:[\"Cutting proteins\",\"Amplifying DNA\",\"Making RNA\",\"Staining\"],a:1,e:\"PCR multiplies the target fragment.\"},\n{q:\"What role does a plasmid play in genetic engineering?\",o:[\"Vector\",\"Host\",\"Enzyme\",\"Food\"],a:0,e:\"It car
