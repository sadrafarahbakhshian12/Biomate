px;background:var(--k);color:#fff;font-weight:500}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}\n.pg{border:1.5px solid var(--ac);background:transparent;color:var(--fg);border-radius:99px;padding:4px 18px;cursor:pointer;font-size:.92rem}\n.pg:hover{background:var(--ac);color:#fff}\n.bigfact{font-size:1.2rem;line-height:2;max-width:40em}\n.bigfact::first-letter{color:var(--ac)}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}\n.opt{font-size:1rem;text-align:start;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}\n.opt:hover:not([disabled]){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}\n.opt.ok{border-color:#1f9d55;background:color-mix(in srgb,#1f9d55 24%,var(--card))}\n.opt.no{border-color:#d1493f;background:color-mix(in srgb,#d1493f 20%,var(--card))}\n.qtext{font-size:1.1rem;font-weight:700;margin:6px 0 12px}\n.expl{margin:12px 0 0;font-size:.95rem;color:var(--muted)}\n.next{margin-top:12px;padding:6px 22px;border-radius:99px;border:0;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;font-weight:700;font-size:.95rem}\n.empty{display:none;text-align:center;padding:40px 0;color:var(--muted)}\nfooter{margin-top:50px;background:var(--hero1);color:var(--herofg);padding-block:36px calc(36px + env(safe-area-inset-bottom,0px))}\nfooter .wrap{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}\nfooter b{font-family:var(--disp);font-weight:400;font-size:1.7rem;color:#ffe56a}\nfooter p{margin:0;color:#a6e0d0;font-size:.9rem}\n@media (max-width:820px){\n  .layout{grid-template-columns:minmax(0,1fr);gap:14px}\n  .list{max-height:none;position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}\n  .li{width:auto;flex:none;white-space:nowrap}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}\n<\/style>\n\n<header class=\"hero\" id=\"hero\">\n  <canvas id=\"cells\" aria-hidden=\"true\"><\/canvas>\n  <div class=\"wrap\">\n    <div class=\"eyebrow\"><i><\/i> سفری از مولکول تا زیست‌کره<\/div>\n    <h1>زیست‌یار<\/h1>\n    <p class=\"lead\">همه‌ی زیست‌شناسی، فصل به فصل. روی هر فصل بزنید تا باز شود و هر مبحث را جداگانه بخوانید: توضیح اصلی، نگاه تخصصی، نکته‌های کلیدی، مثال و آزمون.<\/p>\n    <div class=\"byline\"><span>طراحی و ساخت<\/span><b>صدرا فرح بخشیان<\/b><\/div>\n  <\/div>\n<\/header>\n\n<nav class=\"nav\" aria-label=\"فصل‌ها\">\n  <div class=\"wrap\">\n    <button class=\"brand\" id=\"home\" type=\"button\">زیست‌یار<\/button>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <a class=\"langbtn\" id=\"lang\" href=\"en.html\" lang=\"en\" aria-label=\"Switch to English\">EN<\/a>\n    <button class=\"iconbtn\" id=\"theme\" type=\"button\" aria-label=\"تغییر پوسته\">◐<\/button>\n  <\/div>\n<\/nav>\n\n<main id=\"app\"><\/main>\n\n<footer>\n  <div class=\"wrap\">\n    <div><b>زیست‌یار<\/b><p>یادگیری زیست‌شناسی، مرحله به مرحله<\/p><\/div>\n    <p>طراح و سازنده: <b style=\"font-size:1.25rem\">صدرا فرح بخشیان<\/b><\/p>\n  <\/div>\n<\/footer>\n\n<script>\nvar D=[\n{id:\"mol\",h:215,name:\"مولکول‌های حیات\",hl:\"حیات\",tag:\"زیست‌شیمی\",scale:\"۱ تا ۱۰۰ نانومتر\",\nintro:\"هر موجود زنده از چند خانواده‌ی مولکولی ساخته شده است. شیمی کربن این امکان را می‌دهد که مولکول‌های بزرگ، پایدار و بسیار متنوع بسازد.\",\ntopics:[\n[\"آب؛ حلال حیات\",\"آب مولکولی قطبی است و با پیوند هیدروژنی چسبندگی، گرمای ویژه‌ی بالا و توان انحلال زیادی دارد. به همین دلیل واکنش‌های سلولی در محیط آبی انجام می‌شوند و دمای بدن پایدار می‌ماند.\",[\"پیوند هیدروژنی\",\"قطبیت\",\"گرمای ویژه\"]],\n[\"کربوهیدرات‌ها\",\"قندها منبع سریع انرژی و مواد ساختاری‌اند. گلوکز تک‌قندی، ساکارز دوقندی و نشاسته، گلیکوژن و سلولز چندقندی‌اند. سلولز دیواره‌ی سلول گیاهی را می‌سازد.\",[\"گلوکز\",\"نشاسته\",\"سلولز\",\"گلیکوژن\"]],\n[\"لیپیدها\",\"چربی‌ها، فسفولیپیدها و استروئیدها عمدتاً آب‌گریزند. فسفولیپیدها دولایه‌ی غشا را می‌سازند و چربی‌ها انرژی را به صورت فشرده ذخیره می‌کنند. هورمون‌هایی مانند استروژن از استروئیدها هستند.\",[\"فسفولیپید\",\"تری‌گلیسرید\",\"کلسترول\"]],\n[\"پروتئین‌ها\",\"پروتئین‌ها زنجیره‌ای از آمینواسیدها هستند که به شکل سه‌بعدی خاصی تا می‌خورند. شکل آن‌ها کارشان را تعیین می‌کند؛ آنزیم، پادتن، ناقل و ماده‌ی ساختاری. ۲۰ آمینواسید متفاوت در ساختار آن‌ها به کار می‌رود.\",[\"آمینواسید\",\"پیوند پپتیدی\",\"ساختار سوم\"]],\n[\"نوکلئیک‌اسیدها\",\"DNA و RNA از نوکلئوتیدها ساخته شده‌اند و اطلاعات وراثتی را ذخیره و منتقل می‌کنند. ATP نیز یک نوکلئوتید است و ارز انرژی سلول به شمار می‌رود.\",[\"DNA\",\"RNA\",\"ATP\",\"نوکلئوتید\"]],\n[\"آنزیم‌ها\",\"آنزیم‌ها کاتالیزورهای زیستی‌اند و با کاهش انرژی فعال‌سازی سرعت واکنش را بسیار زیاد می‌کنند. هر آنزیم جایگاه فعال ویژه‌ای دارد و دما، pH و بازدارنده‌ها بر آن اثر می‌گذارند.\",[\"جایگاه فعال\",\"پیش‌ماده\",\"بازدارنده\"]]],\nfact:\"اگر DNA یک سلول انسان را بکشید، حدود دو متر طول دارد؛ اما درون هسته‌ای به قطر چند میکرومتر جا می‌گیرد.\",\nquiz:[\n{q:\"کدام پیوند، ساختار دوم پروتئین و جفت‌بازهای DNA را پایدار می‌کند؟\",o:[\"یونی\",\"هیدروژنی\",\"فلزی\",\"اشتراکی ناقطبی\"],a:1,e:\"پیوندهای هیدروژنی ضعیف‌اند اما تعدادشان زیاد است و ساختارها را پایدار می‌کنند.\"},\n{q:\"واحد سازنده‌ی پروتئین‌ها کدام است؟\",o:[\"نوکلئوتید\",\"اسید چرب\",\"آمینواسید\",\"مونوساکارید\"],a:2,e:\"پروتئین‌ها پلیمر آمینواسیدها هستند.\"},\n{q:\"آنزیم‌ها چگونه واکنش را سریع‌تر می‌کنند؟\",o:[\"با افزایش دما\",\"با کاهش انرژی فعال‌سازی\",\"با مصرف شدن\",\"با تغییر محصول\"],a:1,e:\"آنزیم‌ها مصرف نمی‌شوند و فقط انرژی فعال‌سازی را کم می‌کنند.\"}]},\n\n{id:\"cell\",h:170,name:\"سلول؛ واحد زندگی\",hl:\"سلول\",tag:\"زیست‌شناسی سلولی\",scale:\"۱ تا ۱۰۰ میکرومتر\",\nintro:\"هر موجود زنده از یک یا چند سلول ساخته شده است. سلول کوچک‌ترین واحدی است که همه‌ی ویژگی‌های حیات را دارد: متابولیسم، رشد، پاسخ به محیط و تولیدمثل.\",\ntopics:[\n[\"سلول پیش‌هسته‌ای و هسته‌دار\",\"باکتری‌ها و آرکی‌ها هسته‌ی مجزا ندارند و DNA حلقوی آن‌ها در سیتوپلاسم است. سلول‌های یوکاریوتی (جانوران، گیاهان، قارچ‌ها، آغازیان) هسته و اندامک‌های غشادار دارند.\",[\"پروکاریوت\",\"یوکاریوت\",\"نوکلئوئید\"]],\n[\"اندامک‌ها\",\"هسته مرکز فرمان است، میتوکندری انرژی می‌سازد، شبکه‌ی آندوپلاسمی و گلژی پروتئین‌ها را پردازش و بسته‌بندی می‌کنند، لیزوزوم‌ها هضم می‌کنند و کلروپلاست در گیاهان فتوسنتز می‌کند.\",[\"میتوکندری\",\"گلژی\",\"لیزوزوم\",\"کلروپلاست\",\"ریبوزوم\"]],\n[\"غشای سلولی\",\"غشا از دولایه‌ی فسفولیپیدی و پروتئین‌های شناور ساخته شده و نفوذپذیری انتخابی دارد. مدل موزاییک سیال آن را توصیف می‌کند.\",[\"موزاییک سیال\",\"کانال\",\"پمپ سدیم-پتاسیم\"]],\n[\"انتقال مواد\",\"انتشار و اسمز بدون مصرف انرژی انجام می‌شوند. انتقال فعال با مصرف ATP مواد را خلاف شیب غلظت جابه‌جا می‌کند. اندوسیتوز و اگزوسیتوز ذره‌های بزرگ را جابه‌جا می‌کنند.\",[\"اسمز\",\"انتشار تسهیل‌شده\",\"انتقال فعال\"]],\n[\"تنفس سلولی و فتوسنتز\",\"در تنفس سلولی گلوکز طی گلیکولیز، چرخه‌ی کربس و زنجیره‌ی انتقال الکترون تا حدود ۳۰ ATP می‌دهد. فتوسنتز برعکس، انرژی نور را در قند ذخیره می‌کند.\",[\"گلیکولیز\",\"چرخه‌ی کربس\",\"ATP سنتاز\"]],\n[\"چرخه‌ی سلولی و تقسیم\",\"میتوز یک سلول را به دو سلول یکسان تقسیم می‌کند و برای رشد و ترمیم است. میوز چهار سلول با نصف کروموزوم می‌سازد و تنوع ژنتیکی ایجاد می‌کند. کنترل نادرست چرخه به سرطان می‌انجامد.\",[\"میتوز\",\"میوز\",\"نقطه‌ی وارسی\",\"کراسینگ‌اور\"]]],\nfact:\"در بدن شما هر ثانیه حدود دو میلیون گلبول قرمز تازه ساخته می‌شود. همه‌ی سلول‌های بدن شما از یک سلول تخم آغاز شده‌اند.\",\nquiz:[\n{q:\"کدام اندامک بیشترین ATP را تولید می‌کند؟\",o:[\"گلژی\",\"لیزوزوم\",\"میتوکندری\",\"ریبوزوم\"],a:2,e:\"میتوکندری جایگاه زنجیره‌ی انتقال الکترون و بیشترین تولید ATP است.\"},\n{q:\"میوز در پایان چند سلول می‌دهد؟\",o:[\"۲ سلول یکسان\",\"۴ سلول با نصف کروموزوم\",\"۴ سلول یکسان\",\"۸ سلول\"],a:1,e:\"میوز با دو تقسیم، چهار هاپلوئید متفاوت می‌سازد.\"},\n{q:\"حرکت آب از محیط رقیق به غلیظ از طریق غشای نیمه‌تراوا چه نام دارد؟\",o:[\"اسمز\",\"انتقال فعال\",\"اگزوسیتوز\",\"همانندسازی\"],a:0,e:\"اسمز انتشار آب است.\"}]},\n\n{id:\"gen\",h:280,name:\"ژنتیک و زیست‌شناسی مولکولی\",hl:\"ژنتیک\",tag:\"وراثت\",scale:\"۲ نانومتر تا ۱۰ میکرومتر\",\nintro:\"ژنتیک می‌پرسد صفات چگونه از نسلی به نسل بعد می‌رسند. زیست‌شناسی مولکولی نشان می‌دهد این اطلاعات چگونه خوانده و به پروتئین تبدیل می‌شود.\",\ntopics:[\n[\"ساختار DNA\",\"DNA از دو رشته‌ی پادموازی ساخته شده که به شکل مارپیچ دوگانه پیچیده‌اند. بازهای A با T و G با C جفت می‌شوند. توالی بازها اطلاعات ژنتیکی را رمز می‌کند.\",[\"مارپیچ دوگانه\",\"جفت‌باز\",\"کروماتین\"]],\n[\"همانندسازی\",\"DNA به صورت نیمه‌حفاظتی همانندسازی می‌شود. هلیکاز رشته‌ها را باز می‌کند و DNA پلیمراز رشته‌ی جدید می‌سازد. دقت آن حدود یک خطا در هر میلیارد باز است.\",[\"هلیکاز\",\"DNA پلیمراز\",\"نیمه‌حفاظتی\"]],\n[\"دگم مرکزی\",\"DNA به RNA رونویسی و سپس RNA در ریبوزوم به پروتئین ترجمه می‌شود. هر سه باز متوالی یک رمزه (کدون) است و یک آمینواسید را مشخص می‌کند.\",[\"رونویسی\",\"ترجمه\",\"کدون\",\"tRNA\"]],\n[\"وراثت مندلی\",\"مندل با نخودفرنگی نشان داد هر صفت را دو اَلل تعیین می‌کند. اَلل غالب بر نهفته چیره می‌شود. قانون جداشدن و قانون جورشدن مستقل از آزمایش‌های او به دست آمدند.\",[\"غالب\",\"نهفته\",\"مربع پانت\",\"هتروزیگوت\"]],\n[\"فراتر از مندل\",\"هم‌توانی، بارزی ناقص، چندآللی، پیوستگی ژنی و وراثت وابسته به جنس، الگوهای پیچیده‌تری می‌سازند. گروه خونی ABO نمونه‌ی هم‌توانی و چندآللی است.\",[\"هم‌توانی\",\"وابسته به X\",\"پیوستگی\"]],\n[\"جهش و ژن‌درمانی\",\"جهش تغییر پایدار در توالی DNA است. برخی مضر، برخی خنثی و برخی سودمندند. فناوری CRISPR-Cas9 اکنون می‌تواند ژن را با دقت ویرایش کند.\",[\"جهش نقطه‌ای\",\"CRISPR\",\"اپی‌ژنتیک\"]]],\nfact:\"ژنوم انسان حدود سه میلیارد جفت باز دارد، اما فقط حدود دو درصد آن پروتئین می‌سازد.\",\nquiz:[\n{q:\"در RNA به جای تیمین کدام باز است؟\",o:[\"آدنین\",\"اوراسیل\",\"سیتوزین\",\"گوانین\"],a:1,e:\"RNA اوراسیل (U) دارد.\"},\n{q:\"از تلاقی دو والد هتروزیگوت (Aa×Aa) چه نسبت فنوتیپی داریم؟\",o:[\"۱:۱\",\"۱:۲:۱\",\"۳:۱\",\"۹:۳:۳:۱\"],a:2,e:\"سه غالب در برابر یک نهفته.\"},\n{q:\"ترجمه در کجا انجام می‌شود؟\",o:[\"هسته\",\"ریبوزوم\",\"گلژی\",\"لیزوزوم\"],a:1,e:\"ریبوزوم‌ها mRNA را می‌خوانند و آمینواسیدها را به هم می‌چسبانند.\"}]},\n\n{id:\"mic\",h:100,name:\"میکروب‌ها و ایمنی\",hl:\"ایمنی\",tag:\"میکروب‌شناسی\",scale:\"۰٫۱ تا ۱۰ میکرومتر\",\nintro:\"جهان نامرئی میکروب‌ها بخش بزرگی از زیست‌توده‌ی زمین را تشکیل می‌دهد. بیشتر آن‌ها بی‌خطر یا سودمندند و فقط تعداد کمی بیماری‌زا هستند.\",\ntopics:[\n[\"باکتری‌ها\",\"تک‌سلولی‌های پیش‌هسته‌ای که با تقسیم دوتایی تکثیر می‌شوند. شکل‌هایی چون کروی، میله‌ای و مارپیچی دارند. روده‌ی انسان خانه‌ی هزاران میلیارد باکتری مفید است.\",[\"دیواره‌ی پپتیدوگلیکان\",\"گرم مثبت\",\"میکروبیوم\"]],\n[\"ویروس‌ها\",\"ذره‌هایی از ماده‌ی ژنتیکی درون پوشش پروتئینی که فقط درون سلول میزبان تکثیر می‌شوند. درباره‌ی زنده‌بودن آن‌ها اختلاف‌نظر است و بسیاری آن‌ها را در مرز زنده و غیرزنده می‌دانند.\",[\"کپسید\",\"باکتریوفاژ\",\"رتروویروس\"]],\n[\"قارچ‌ها و آغازیان\",\"مخمرها، کپک‌ها و قارچ‌های خوراکی یوکاریوتی‌اند و غذا را از بیرون جذب می‌کنند. آغازیانی مانند آمیب و پلاسمودیوم (عامل مالاریا) تک‌سلولی هستند.\",[\"مخمر\",\"هیف\",\"پلاسمودیوم\"]],\n[\"ایمنی ذاتی\",\"نخستین خط دفاع: پوست، مخاط، اسید معده، گلبول‌های سفید بیگانه‌خوار و التهاب. پاسخ سریع و غیراختصاصی است.\",[\"ماکروفاژ\",\"التهاب\",\"اینترفرون\"]],\n[\"ایمنی اکتسابی\",\"لنفوسیت‌های B پادتن می‌سازند و T کشنده سلول‌های آلوده را نابود می‌کنند. بعد از آشنایی با عامل بیماری، سلول‌های حافظه سرعت پاسخ بعدی را بالا می‌برند.\",[\"پادتن\",\"لنفوسیت T\",\"حافظه‌ی ایمنی\"]],\n[\"واکسن و آنتی‌بیوتیک\",\"واکسن سامانه‌ی ایمنی را بدون بیماری آموزش می‌دهد. آنتی‌بیوتیک‌ها فقط بر باکتری‌ها اثر دارند و مصرف نابجای آن‌ها مقاومت دارویی ایجاد می‌کند.\",[\"مقاومت دارویی\",\"ایمنی جمعی\",\"mRNA\"]]],\nfact:\"شمار باکتری‌های بدن انسان تقریباً با شمار سلول‌های خود ما برابر است.\",\nquiz:[\n{q:\"آنتی‌بیوتیک بر کدام عامل اثر دارد؟\",o:[\"ویروس\",\"باکتری\",\"همه‌ی میکروب‌ها\",\"سرطان\"],a:1,e:\"آنتی‌بیوتیک‌ها بر ویروس‌ها اثری ندارند.\"},\n{q:\"تولید پادتن وظیفه‌ی کدام سلول است؟\",o:[\"لنفوسیت B\",\"ماکروفاژ\",\"پلاکت\",\"گلبول قرمز\"],a:0,e:\"لنفوسیت B (پس از تبدیل به پلاسماسل) پادتن ترشح می‌کند.\"},\n{q:\"ویروس‌ها برای تکثیر به چه چیزی نیاز دارند؟\",o:[\"نور\",\"سلول میزبان\",\"خاک\",\"اکسیژن آزاد\"],a:1,e:\"آن‌ها متابولیسم مستقل ندارند.\"}]},\n\n{id:\"plant\",h:135,name:\"دنیای گیاهان\",hl:\"گیاهان\",tag:\"گیاه‌شناسی\",scale:\"۱ میلی‌متر تا ۱۰۰ متر\",\nintro:\"گیاهان با فتوسنتز نور خورشید را به غذا تبدیل می‌کنند و پایه‌ی بیشتر زنجیره‌های غذایی خشکی هستند.\",\ntopics:[\n[\"ساختار گیاه\",\"ریشه آب و املاح را جذب می‌کند، ساقه آن‌ها را می‌رساند و برگ مرکز فتوسنتز است. بافت‌های سامانه‌ی آوندی چوب (انتقال آب) و آبکش (انتقال شیره‌ی پرورده) هستند.\",[\"آوند چوبی\",\"آبکش\",\"روزنه\"]],\n[\"فتوسنتز\",\"در واکنش‌های نوری، انرژی نور ATP و NADPH می‌سازد. در چرخه‌ی کالوین، CO₂ به قند تبدیل می‌شود. اکسیژن حاصل از شکافتن آب است.\",[\"کلروفیل\",\"چرخه‌ی کالوین\",\"تیلاکوئید\"]],\n[\"رده‌های گیاهی\",\"خزه‌ها بدون آوند، سرخس‌ها آوندی بی‌دانه، بازدانگان دانه‌ی لخت و نهان‌دانگان گل‌دار هستند. نهان‌دانگان بزرگ‌ترین گروه گیاهی‌اند.\",[\"خزه\",\"سرخس\",\"بازدانگان\",\"نهان‌دانگان\"]],\n[\"گل و تولیدمثل\",\"گرده‌افشانی با باد یا جانوران انجام می‌شود. لقاح مضاعف نهان‌دانگان رویان (جنین) و درون‌دانه می‌سازد. میوه از تخمدان گل پدید می‌آید.\",[\"لقاح مضاعف\",\"گرده‌افشانی\",\"میوه\"]],\n[\"هورمون‌های گیاهی\",\"اکسین رشد و نورگرایی را هدایت می‌کند، جیبرلین جوانه‌زنی، سیتوکینین تقسیم سلولی، اتیلن رسیدن میوه و آبسزیک‌اسید خواب و بستن روزنه را.\",[\"اکسین\",\"اتیلن\",\"نورگرایی\"]],\n[\"سازگاری‌ها\",\"کاکتوس‌ها با ذخیره‌ی آب کم‌آبی را تحمل می‌کنند و گیاهان گوشتخوار با به‌دام‌انداختن حشره، کمبود نیتروژن خاک فقیر را جبران می‌کنند. گیاهان CAM شب‌ها روزنه را باز می‌کنند.\",[\"CAM\",\"گیاه گوشتخوار\",\"همزیستی ریشه\"]]],\nfact:\"یک درخت بزرگ در روز تابستان صدها لیتر آب از برگ‌ها تعرق می‌کند.\",\nquiz:[\n{q:\"اکسیژن آزاد شده در فتوسنتز از کدام ماده می‌آید؟\",o:[\"CO₂\",\"گلوکز\",\"آب\",\"نور\"],a:2,e:\"با شکافت نوری آب اکسیژن آزاد می‌شود.\"},\n{q:\"شیره‌ی پرورده در کدام آوند حرکت می‌کند؟\",o:[\"چوبی\",\"آبکش\",\"روزنه\",\"کامبیوم\"],a:1,e:\"آبکش قندها را از برگ به بقیه‌ی گیاه می‌رساند.\"},\n{q:\"کدام هورمون رسیدن میوه را تسریع می‌کند؟\",o:[\"اتیلن\",\"اکسین\",\"جیبرلین\",\"سیتوکینین\"],a:0,e:\"اتیلن گازی است که رسیدن را سرعت می‌دهد.\"}]},\n\n{id:\"anim\",h:85,name:\"جانوران\",hl:\"جانوران\",tag:\"جانورشناسی\",scale:\"۱ میلی‌متر تا ۳۰ متر\",\nintro:\"جانوران موجوداتی پریاخته‌ای و هتروتروف‌اند (غذای آماده می‌خورند) که بیشترشان حرکت و حس دارند. از اسفنج‌های ساده تا پستانداران، همگی تاریخ تکاملی مشترکی دارند.\",\ntopics:[\n[\"بی‌مهرگان\",\"بیش از ۹۵ درصد گونه‌های جانوری مهره ندارند: اسفنج‌ها، مرجانیان، کرم‌ها، نرم‌تنان، بندپایان و خارپوستان. حشرات پرتعدادترین گروه‌اند.\",[\"بندپایان\",\"نرم‌تنان\",\"اسکلت خارجی\"]],\n[\"مهره‌داران\",\"ماهی‌ها، دوزیستان، خزندگان، پرندگان و پستانداران ستون مهره دارند. گذار مهره‌داران به خشکی با پیدایش دست‌وپا و ریه‌های کارآمد و سپس تخم پوسته‌دار همراه بود.\",[\"ستون مهره\",\"آمنیون\",\"خون‌گرم\"]],\n[\"تولیدمثل و رشد\",\"تولیدمثل جنسی تنوع می‌سازد و غیرجنسی سریع است. در رشد جنینی، تخم لقاح‌یافته با تقسیم‌های پیاپی به بلاستولا و سپس گاسترولا و لایه‌های جنینی می‌رسد.\",[\"زیگوت\",\"گاسترولا\",\"دگردیسی\"]],\n[\"سازگاری‌های حیرت‌انگیز\",\"شتر آب بدن را با صرفه‌جویی زیاد مصرف می‌کند، خفاش با پژواک‌یابی راه می‌یابد و خرس قطبی چربی زیرجلدی و خز ویژه دارد. هر سازگاری حاصل انتخاب طبیعی است.\",[\"پژواک‌یابی\",\"خواب زمستانی\",\"استتار\"]],\n[\"دستگاه‌های عصبی\",\"از شبکه‌ی عصبی ساده‌ی عروس دریایی تا مغز پیچیده‌ی پستانداران. رفتارها از بازتاب‌های ساده تا یادگیری و حافظه را شامل می‌شوند.\",[\"نورون\",\"گانگلیون\",\"قشر مخ\"]],\n[\"همزیستی\",\"زنبور و گل، مرجان و جلبک، و باکتری‌های روده نمونه‌ی همزیستی‌اند. انگل‌ها به زیان میزبان زندگی می‌کنند.\",[\"مفیدزیستی\",\"انگلی\",\"هم‌سفرگی\"]]],\nfact:\"وزن همه‌ی مورچه‌های زمین از وزن همه‌ی پرندگان وحشی بیشتر برآورد می‌شود.\",\nquiz:[\n{q:\"کدام گروه بزرگ‌ترین شمار گونه‌ی جانوری را دارد؟\",o:[\"پستانداران\",\"ماهی‌ها\",\"حشرات\",\"پرندگان\"],a:2,e:\"حشرات بیش از یک میلیون گونه‌ی شناخته‌شده دارند.\"},\n{q:\"آمنیون در کدام گروه برای نخستین بار ظاهر شد؟\",o:[\"دوزیستان\",\"ماهی‌ها\",\"نیاکان خزندگان، پرندگان و پستانداران\",\"اسفنج‌ها\"],a:2,e:\"تخم آمنیوتی امکان زندگی کامل در خشکی داد.\"},\n{q:\"همزیستی مرجان و جلبک از چه نوع است؟\",o:[\"انگلی\",\"مفیدزیستی\",\"رقابتی\",\"شکارگری\"],a:1,e:\"هر دو سود می‌برند.\"}]},\n\n{id:\"human\",h:38,name:\"بدن انسان\",hl:\"انسان\",tag:\"فیزیولوژی\",scale:\"۱ تا ۲ متر\",\nintro:\"بدن انسان مجموعه‌ای از دستگاه‌هاست که هم‌زمان کار می‌کنند و محیط داخلی را پایدار نگه می‌دارند؛ این پایداری هم‌ایستایی نام دارد.\",\ntopics:[\n[\"گردش خون\",\"قلب چهارحفره‌ای خون را در دو مسیر ریوی و عمومی می‌چرخاند. سرخرگ‌ها خون را از قلب دور می‌کنند و سیاهرگ‌ها آن را به قلب برمی‌گردانند. مویرگ‌ها محل تبادل مواد هستند.\",[\"دهلیز\",\"بطن\",\"هموگلوبین\"]],\n[\"تنفس\",\"هوا از حلق و نای به نایژه‌ها و کیسه‌های هوایی می‌رسد. در کیسه‌های هوایی O₂ وارد خون و CO₂ از آن خارج می‌شود. دیافراگم حجم قفسه را تغییر می‌دهد.\",[\"کیسه‌ی هوایی\",\"دیافراگم\",\"تبادل گازها\"]],\n[\"گوارش\",\"غذا در دهان، معده و روده‌ی باریک تجزیه می‌شود و بیشتر جذب با پرزهای روده‌ی باریک انجام می‌شود. صفرا (از کبد) و شیره‌ی لوزالمعده به روده‌ی باریک می‌ریزند و روده‌ی بزرگ آب را جذب می‌کند.\",[\"آمیلاز\",\"پپسین\",\"پرز روده\"]],\n[\"دستگاه عصبی\",\"مغز و نخاع مرکز پردازش‌اند و اعصاب پیام را می‌رسانند. پیام عصبی با تغییر پتانسیل غشا و ناقل‌های شیمیایی در سیناپس منتقل می‌شود.\",[\"نورون\",\"سیناپس\",\"پتانسیل عمل\"]],\n[\"غدد درون‌ریز\",\"هورمون‌ها پیک‌های شیمیایی خون‌اند. انسولین و گلوکاگون قند خون را تنظیم می‌کنند، تیروئید سوخت‌وساز را تنظیم می‌کند و هیپوفیز به غدد دیگر فرمان می‌دهد.\",[\"انسولین\",\"هیپوفیز\",\"بازخورد منفی\"]],\n[\"کلیه و دفع\",\"کلیه‌ها با نفرون‌ها خون را صاف می‌کنند، آب و املاح را تنظیم و ادرار را می‌سازند. هر کلیه حدود یک میلیون نفرون دارد.\",[\"نفرون\",\"فیلتراسیون\",\"ADH\"]],\n[\"اسکلت و ماهیچه\",\"استخوان‌ها از املاح کلسیم و پروتئین کلاژن ساخته شده‌اند. ماهیچه‌ها با لغزش رشته‌های اکتین و میوزین کوتاه می‌شوند. منبع انرژی آن‌ها ATP است.\",[\"اکتین\",\"میوزین\",\"مفصل\"]]],\nfact:\"قلب شما در عمر یک انسان معمولی چند میلیارد بار می‌تپد، بدون یک روز استراحت.\",\nquiz:[\n{q:\"تبادل گازها در کدام بخش ریه انجام می‌شود؟\",o:[\"نای\",\"نایژه\",\"کیسه‌های هوایی\",\"دیافراگم\"],a:2,e:\"دیواره‌ی نازک کیسه‌ها و مویرگ‌ها تبادل را ممکن می‌کند.\"},\n{q:\"کاهش قند خون را کدام هورمون جبران می‌کند؟\",o:[\"انسولین\",\"گلوکاگون\",\"ADH\",\"تیروکسین\"],a:1,e:\"گلوکاگون قند خون را بالا می‌برد.\"},\n{q:\"واحد ساختاری و عملکردی کلیه چیست؟\",o:[\"نورون\",\"نفرون\",\"پرز\",\"آلوئول\"],a:1,e:\"نفرون خون را صاف می‌کند.\"}]},\n\n{id:\"beh\",h:350,name:\"رفتار جانوران\",hl:\"رفتار\",tag:\"رفتارشناسی\",scale:\"۱ ثانیه تا یک عمر\",\nintro:\"رفتار کنش جانور در پاسخ به محیط است. بخشی از آن ژنتیکی و بخشی آموخته است، و هر دو تحت انتخاب طبیعی شکل می‌گیرند.\",\ntopics:[\n[\"رفتار غریزی و یادگیری\",\"غریزه بدون آموزش بروز می‌کند، مانند مکیدن نوزاد. یادگیری شامل عادی‌شدن، شرطی‌شدن و نقش‌پذیری است. پاولوف با سگ‌ها شرطی‌شدن کلاسیک را نشان داد.\",[\"شرطی‌شدن\",\"نقش‌پذیری\",\"غریزه\"]],\n[\"ارتباط\",\"جانوران با صدا، بو، حرکت و رنگ پیام می‌دهند. رقص زنبور عسل جهت و فاصله‌ی غذا را می‌رساند. فرومون‌ها پیک شیمیایی بین افراد یک گونه‌اند.\",[\"فرومون\",\"رقص زنبور\",\"نشانه\"]],\n[\"مهاجرت و ساعت زیستی\",\"پرندگان و لاک‌پشت‌ها با میدان مغناطیسی و ستارگان مسیر می‌یابند. ساعت زیستی ریتم شبانه‌روزی را هماهنگ می‌کند.\",[\"ریتم شبانه‌روزی\",\"جهت‌یابی\",\"مهاجرت\"]],\n[\"زندگی اجتماعی\",\"مورچه‌ها و زنبورها کلنی‌هایی با تقسیم کار می‌سازند. گرگ‌ها و فیل‌ها گروه‌های خانوادگی دارند. از دید تکاملی، همکاری گاهی به ژن‌های مشترک بستگی دارد.\",[\"کلنی\",\"ایثار\",\"سلسله‌مراتب\"]],\n[\"رفتار جفت‌یابی\",\"نمایش‌های رنگارنگ و آواز نر برای ماده‌ها می‌تواند نشانه‌ی شایستگی ژنتیکی باشد. انتخاب جنسی گاهی صفاتی را شکل می‌دهد که بقا را دشوار می‌کنند، مانند دم طاووس.\",[\"انتخاب جنسی\",\"قلمروخواهی\",\"پرورش فرزند\"]]],\nfact:\"کلاغ‌های کالدونیای جدید برای بیرون کشیدن حشره از شکاف چوب، از شاخه‌ی نازک و برگ ابزار می‌سازند.\",\nquiz:[\n{q:\"شرطی‌شدن کلاسیک را چه کسی توصیف کرد؟\",o:[\"مندل\",\"پاولوف\",\"داروین\",\"واتسون\"],a:1,e:\"پاولوف با سگ‌ها و صدای زنگ.\"},\n{q:\"فرومون چیست؟\",o:[\"هورمون خونی\",\"پیک شیمیایی بین افراد\",\"نوعی پادتن\",\"آنزیم گوارشی\"],a:1,e:\"فرومون‌ها از بدن آزاد می‌شوند و بر رفتار هم‌گونان اثر می‌گذارند.\"},\n{q:\"ریتم شبانه‌روزی را چه تنظیم می‌کند؟\",o:[\"ساعت زیستی\",\"فقط گرما\",\"فقط غذا\",\"پادتن\"],a:0,e:\"ساعت زیستی با نور هماهنگ می‌شود.\"}]},\n\n{id:\"evo\",h:310,name:\"تکامل\",hl:\"تکامل\",tag:\"زیست‌شناسی تکاملی\",scale:\"میلیون‌ها سال\",\nintro:\"تکامل چارچوب یکپارچه‌ی زیست‌شناسی است. داروین و والاس نشان دادند گونه‌ها با انتخاب طبیعی از نیاکان مشترک پدید آمده‌اند.\",\ntopics:[\n[\"انتخاب طبیعی\",\"افراد یک جمعیت با هم تفاوت دارند، برخی از این تفاوت‌ها ارثی‌اند و افرادی با صفات سازگارتر زادآوری بیشتری دارند. نتیجه، تغییر فراوانی اَلل‌ها در نسل‌هاست.\",[\"شایستگی\",\"تنوع\",\"سازگاری\"]],\n[\"شواهد تکامل\",\"فسیل‌ها، آناتومی مقایسه‌ای (اندام‌های همتا و وستیجیال)، شباهت DNA و جغرافیای زیستی همگی از تکامل پشتیبانی می‌کنند.\",[\"فسیل\",\"اندام همتا\",\"ژنوم مقایسه‌ای\"]],\n[\"گونه‌زایی\",\"جدایی جغرافیایی جمعیت‌ها و انباشت تفاوت‌های ژنتیکی سرانجام جلوی آمیزش را می‌گیرد و گونه‌ی جدید پدید می‌آید. سیکلیدهای دریاچه‌های آفریقا نمونه‌اند.\",[\"جدایی جغرافیایی\",\"سد تولیدمثلی\",\"تابش سازشی\"]],\n[\"رانش و جریان ژن\",\"غیر از انتخاب، رانش ژنی (تصادف در جمعیت‌های کوچک)، جریان ژن و جهش نیز فراوانی اَلل‌ها را تغییر می‌دهند. هاردی-واینبرگ حالت بدون تکامل را توصیف می‌کند.\",[\"رانش ژنی\",\"اثر بنیان‌گذار\",\"هاردی-واینبرگ\"]],\n[\"تکامل انسان\",\"انسان خردمند حدود ۳۰۰ هزار سال پیش در آفریقا پدید آمد. فسیل‌های استرالوپیتکوس و هومو ارکتوس مسیر تکامل ما را نشان می‌دهند.\",[\"هومو ساپینس\",\"دوپایی\",\"نئاندرتال\"]],\n[\"درخت زندگی\",\"نمودار فیلوژنی روابط خویشاوندی گونه‌ها را نشان می‌دهد. تبار مشترک همه‌ی موجودات را به هم پیوند می‌دهد.\",[\"نیای مشترک\",\"کلاد\",\"فیلوژنی\"]]],\nfact:\"نهنگ‌ها از نیاکانی چهارپا و خشکی‌زی تکامل یافته‌اند و هنوز استخوان‌های لگن کوچکی دارند.\",\nquiz:[\n{q:\"کدام شاخص، موفقیت تولیدمثلی را اندازه می‌گیرد؟\",o:[\"قدرت\",\"شایستگی\",\"سرعت\",\"عمر\"],a:1,e:\"شایستگی یعنی سهم فرد در نسل بعد.\"},\n{q:\"استخوان لگن کوچک نهنگ مثالی از چیست؟\",o:[\"اندام وستیجیال\",\"اندام همتا\",\"جهش تازه\",\"همزیستی\"],a:0,e:\"اندام وستیجیال کارکرد اصلی را از دست داده است.\"},\n{q:\"گونه‌زایی معمولاً با چه چیزی آغاز می‌شود؟\",o:[\"جدایی جمعیت‌ها\",\"افزایش دما\",\"مهاجرت همه\",\"کاهش جهش\"],a:0,e:\"جدایی جغرافیایی جریان ژن را قطع می‌کند.\"}]},\n\n{id:\"tax\",h:245,name:\"تنوع زیستی و رده‌بندی\",hl:\"رده‌بندی\",tag:\"سیستماتیک\",scale:\"بیش از ۸ میلیون گونه\",\nintro:\"زیست‌شناسان موجودات را بر پایه‌ی خویشاوندی در گروه‌های تو در تو دسته‌بندی می‌کنند. تنوع زیستی، گوناگونی ژن‌ها، گونه‌ها و بوم‌سازگان‌هاست.\",\ntopics:[\n[\"سه قلمرو حیات\",\"باکتری‌ها، آرکی‌ها و یوکاریوت‌ها. آرکی‌ها اغلب در محیط‌های سخت مانند چشمه‌ی آب گرم و شورزار زندگی می‌کنند.\",[\"آرکی\",\"باکتری\",\"یوکاریا\"]],\n[\"سلسله‌مراتب\",\"قلمرو، سلسله، شاخه، رده، راسته، تیره، سرده و گونه. نام علمی دوبخشی (سرده و گونه) را لینه رایج کرد، مانند Homo sapiens.\",[\"لینه\",\"نام‌گذاری دواسمی\",\"گونه\"]],\n[\"مفهوم گونه\",\"گونه گروهی از افراد است که با هم آمیزش می‌کنند و فرزند زایا می‌آورند. این تعریف برای موجودات غیرجنسی یا فسیل‌ها دشوار است.\",[\"گونه‌ی زیستی\",\"دورگه\",\"نژاد\"]],\n[\"بحران انقراض\",\"نرخ انقراض کنونی ده‌ها تا صدها برابر نرخ طبیعی برآورد می‌شود. تخریب زیستگاه، شکار، گونه‌های مهاجم و تغییر اقلیم مهم‌ترین عوامل‌اند.\",[\"گونه‌ی در خطر\",\"زیستگاه\",\"IUCN\"]],\n[\"نقاط داغ تنوع\",\"مناطق گرمسیری مانند جنگل‌های آمازون و بخش‌هایی از آسیا گونه‌های بی‌شماری دارند. ایران نیز اقلیم‌های متنوع و گونه‌های بومی فراوانی دارد، مانند یوزپلنگ آسیایی.\",[\"گونه‌ی بومی\",\"یوزپلنگ\",\"پارک ملی\"]]],\nfact:\"بیشتر گونه‌های زمین هنوز نام‌گذاری نشده‌اند؛ برآوردها از میلیون‌ها گونه‌ی ناشناخته حکایت دارند.\",\nquiz:[\n{q:\"نام علمی انسان چیست؟\",o:[\"Homo erectus\",\"Homo sapiens\",\"Pan troglodytes\",\"Canis lupus\"],a:1,e:\"سرده‌ی Homo و گونه‌ی sapiens.\"},\n{q:\"کدام یک قلمرو حیات نیست؟\",o:[\"آرکی\",\"باکتری\",\"یوکاریا\",\"ویروس‌ها\"],a:3,e:\"ویروس‌ها در سه قلمرو جا نمی‌گیرند.\"},\n{q:\"بزرگ‌ترین تهدید برای گونه‌ها چیست؟\",o:[\"تخریب زیستگاه\",\"باران\",\"نور خورشید\",\"ستارگان\"],a:0,e:\"تخریب و تکه‌تکه‌شدن زیستگاه.\"}]},\n\n{id:\"eco\",h:195,name:\"بوم‌شناسی\",hl:\"بوم‌شناسی\",tag:\"اکولوژی\",scale:\"۱ متر تا ۱۰۰۰ کیلومتر\",\nintro:\"بوم‌شناسی رابطه‌ی موجودات با یکدیگر و محیط را بررسی می‌کند. از یک جمعیت تا زیست‌کره، انرژی و مواد در جریان‌اند.\",\ntopics:[\n[\"سطوح سازمان\",\"فرد، جمعیت، جامعه، بوم‌سازگان، زیست‌بوم و زیست‌کره. هر سطح ویژگی‌های ویژه‌ی خود را دارد.\",[\"جمعیت\",\"جامعه\",\"زیست‌کره\"]],\n[\"جریان انرژی\",\"انرژی از خورشید به تولیدکننده‌ها و سپس مصرف‌کننده‌ها می‌رسد. در هر سطح غذایی حدود ۱۰ درصد انرژی به سطح بعدی می‌رسد، پس انرژی با بالا رفتن در هرم انرژی همواره کمتر می‌شود.\",[\"زنجیره‌ی غذایی\",\"هرم انرژی\",\"تجزیه‌کننده\"]],\n[\"چرخه‌های مواد\",\"کربن، نیتروژن، فسفر و آب میان جانداران و محیط بازیافت می‌شوند. باکتری‌های تثبیت‌کننده‌ی نیتروژن نیتروژن گازی هوا را به شکل قابل‌استفاده درمی‌آورند.\",[\"چرخه‌ی کربن\",\"تثبیت نیتروژن\",\"تعرق\"]],\n[\"پویایی جمعیت\",\"جمعیت‌ها در شرایط مطلوب نمایی رشد می‌کنند، ولی ظرفیت تحمل محیط رشد را به منحنی لجستیک (S‌شکل) تبدیل می‌کند. رقابت، شکار و بیماری اندازه‌ی جمعیت را تنظیم می‌کنند.\",[\"ظرفیت تحمل\",\"رشد نمایی\",\"رقابت\"]],\n[\"زیست‌بوم‌ها\",\"جنگل بارانی، بیابان، تایگا، علفزار، تندرا، دریا و آب شیرین. هر کدام دما، بارش و موجودات ویژه‌ای دارند.\",[\"تایگا\",\"مرجان\",\"تالاب\"]],\n[\"تغییر اقلیم و حفاظت\",\"گازهای گلخانه‌ای دمای زمین را بالا می‌برند و مرجان‌ها، یخچال‌ها و الگوی بارش را تغییر می‌دهند. حفاظت از زیستگاه، انرژی تجدیدپذیر و کشاورزی پایدار راه‌حل‌ها هستند.\",[\"گرمایش جهانی\",\"ردپای کربن\",\"پایداری\"]]],\nfact:\"جنگل‌های بارانی کمتر از هفت درصد خشکی‌ها را می‌پوشانند ولی حدود نیمی از گونه‌های زمین در آن‌ها زندگی می‌کنند.\",\nquiz:[\n{q:\"در هرم انرژی، حدود چه درصدی از انرژی به سطح بعد می‌رسد؟\",o:[\"۱۰۰\",\"۵۰\",\"۱۰\",\"۱\"],a:2,e:\"قاعده‌ی تقریبی ده درصد.\"},\n{q:\"کدام موجود CO₂ را به ماده‌ی آلی تبدیل می‌کند؟\",o:[\"تولیدکننده\",\"شکارچی\",\"انگل\",\"تجزیه‌کننده\"],a:0,e:\"تولیدکننده‌ها خودپرورند.\"},\n{q:\"منحنی رشد لجستیک چه چیزی را نشان می‌دهد؟\",o:[\"رشد بی‌پایان\",\"ظرفیت تحمل محیط\",\"انقراض\",\"جهش\"],a:1,e:\"جمعیت به ظرفیت تحمل نزدیک می‌شود.\"}]},\n\n{id:\"bio\",h:58,name:\"زیست‌فناوری و دانش نوین\",hl:\"نوین\",tag:\"فناوری\",scale:\"از ژن تا صنعت\",\nintro:\"زیست‌فناوری از فرایندهای زیستی برای تولید دارو، غذا و انرژی بهره می‌گیرد. بسیاری از آن‌ها بر پایه‌ی ژنتیک مولکولی ساخته شده‌اند.\",\ntopics:[\n[\"مهندسی ژنتیک\",\"با آنزیم‌های برشی و ناقل‌هایی چون پلاسمید، ژن موردنظر درون یک میزبان وارد می‌شود. انسولین نوترکیب با همین روش در باکتری ساخته می‌شود.\",[\"پلاسمید\",\"آنزیم برشی\",\"DNA نوترکیب\"]],\n[\"PCR و توالی‌یابی\",\"PCR قطعه‌ای از DNA را در چند ساعت میلیون‌ها برابر تکثیر می‌کند. توالی‌یابی ترتیب بازها را می‌خواند و پروژه‌ی ژنوم انسان با آن پیش رفت.\",[\"PCR\",\"الکتروفورز\",\"ژنوم\"]],\n[\"سلول‌های بنیادی\",\"این سلول‌ها می‌توانند به انواع سلول تبدیل شوند و در درمان بیماری‌های خون و ترمیم بافت کاربرد دارند. پژوهش‌های کنونی بر ساخت بافت و اندام در آزمایشگاه متمرکز است.\",[\"پرتوان\",\"بافت‌سازی\",\"کلونینگ\"]],\n[\"بیوانفورماتیک\",\"علم داده و زیست‌شناسی با هم، برای تحلیل ژنوم‌ها، پیش‌بینی ساختار پروتئین و یافتن داروی تازه. هوش مصنوعی در این حوزه جهش بزرگی ایجاد کرده است.\",[\"پایگاه داده\",\"BLAST\",\"ساختار پروتئین\"]],\n[\"کشاورزی و صنعت\",\"گیاهان مقاوم به آفت، تخمیر صنعتی، سوخت زیستی و تصفیه‌ی زیستی پساب نمونه‌هایی‌اند. بحث درباره‌ی ایمنی و اخلاق استفاده از آن‌ها همچنان ادامه دارد.\",[\"تراریخته\",\"تخمیر\",\"زیست‌پالایی\"]],\n[\"روش علمی و ابزار\",\"مشاهده، فرضیه، آزمایش کنترل‌شده و داوری همتایان پایه‌ی علم‌اند. میکروسکوپ نوری و الکترونی، سانتریفیوژ و رنگ‌آمیزی ابزارهای رایج‌اند.\",[\"فرضیه\",\"گروه شاهد\",\"میکروسکوپ\"]]],\nfact:\"واکسن‌های mRNA از آزمایشگاه تا بازار در کمتر از یک سال طراحی، آزمایش و برای مصرف اضطراری تأیید شدند؛ پیش‌تر دهه‌ها تحقیق پایه‌ی آن‌ها را ممکن کرده بود.\",\nquiz:[\n{q:\"PCR برای چیست؟\",o:[\"شکافتن پروتئین\",\"تکثیر DNA\",\"ساخت RNA\",\"رنگ‌آمیزی\"],a:1,e:\"PCR قطعه‌ی هدف را چند برابر می‌کند.\"},\n{q:\"پلاسمید در مهندسی ژنتیک نقش چه چیزی را دارد؟\",o:[\"ناقل\",\"میزبان\",\"آنزیم\",\"غذا\"],a:0,e:\"ژن را به میزبان منتقل می‌کند.\"},\n{q:\"گروه شاهد برای چیست؟\",o:[\"مقایسه‌ی نتیجه\",\"تزئین\",\"کاهش هزینه\",\"افزودن متغیر\"],a:0,e:\"برای جدا کردن اثر متغیر مستقل.\"}]}\n];\nvar X={\nmol:[\n{m:\"هر مولکول آب یک اتم اکسیژن و دو اتم هیدروژن دارد. اکسیژن الکترون‌ها را بیشتر به سمت خود می‌کشد، پس سر اکسیژن کمی منفی و سر هیدروژن‌ها کمی مثبت می‌شود. همین قطبیت باعث می‌شود مولکول‌های آب با پیوند هیدروژنی به هم بچسبند و نمک‌ها و قندها را در خود حل کنند. آب مایع بودن را در گستره‌ی دمایی مناسب حفظ می‌کند و یخ از آب مایع سبک‌تر است، پس دریاچه‌ها از سطح یخ می‌زنند و موجودات زیر یخ زنده می‌مانند.\",k:[\"قطبی بودن مولکول آب، توان حلالیت را می‌سازد\",\"چسبندگی و پیوستگی آب، صعود شیره‌ی خام در گیاهان را ممکن می‌کند\",\"گرمای ویژه‌ی بالا مانع نوسان شدید دمای بدن می‌شود\"],x:\"عرق کردن بدن را خنک می‌کند، چون تبخیر آب مقدار زیادی گرما از پوست می‌برد.\"},\n{m:\"کربوهیدرات‌ها از کربن، هیدروژن و اکسیژن ساخته شده‌اند. تک‌قندی‌ها مانند گلوکز و فروکتوز کوچک‌ترین واحدند و دو تک‌قندی با پیوند گلیکوزیدی یک دوقندی می‌سازند. چندقندی‌ها زنجیره‌های بلندی از گلوکزند اما شکل اتصال آن‌ها کارکردشان را عوض می‌کند: نشاسته و گلیکوژن ذخیره‌ی انرژی‌اند ولی سلولز فقط ساختاری است و بیشتر جانوران نمی‌توانند آن را هضم کنند.\",k:[\"گلوکز سوخت اصلی سلول‌هاست\",\"گیاهان نشاسته و جانوران گلیکوژن ذخیره می‌کنند\",\"سلولز فراوان‌ترین ترکیب آلی روی زمین است\"],x:\"نان و برنج نشاسته دارند؛ آنزیم آمیلاز در دهان آن‌ها را کم‌کم شیرین می‌کند.\"},\n{m:\"لیپیدها گروهی ناهمگن‌اند که اغلب در آب حل نمی‌شوند. هر تری‌گلیسرید از یک گلیسرول و سه اسید چرب ساخته شده و بیش از دو برابر قند انرژی در هر گرم ذخیره می‌کند. فسفولیپید یک سر آب‌دوست و دو دم آب‌گریز دارد؛ در آب خودبه‌خود دولایه می‌شود و پایه‌ی هر غشای سلولی است. استروئیدها حلقه‌های متصل دارند و کلسترول، هورمون‌های جنسی و ویتامین D از این گروه‌اند.\",k:[\"فسفولیپیدها دولایه‌ی غشا را می‌سازند\",\"چربی‌ها عایق گرما و ذخیره‌ی انرژی‌اند\",\"کلسترول سیالیت غشا را تنظیم می‌کند\"],x:\"چربی زیرپوست خرس قطبی هم انبار انرژی است و هم عایق در برابر سرمای شدید.\"},\n{m:\"تنوع پروتئین‌ها از ترتیب آمینواسیدها می‌آید. ساختار اول همان توالی است، ساختار دوم مارپیچ آلفا و صفحه‌ی بتا، ساختار سوم تاخوردگی کامل زنجیره و ساختار چهارم کنار هم قرار گرفتن چند زنجیره است. تغییر یک آمینواسید گاهی کل شکل را عوض می‌کند، مانند بیماری کم‌خونی داسی‌شکل. گرما یا pH شدید پروتئین را واسرشت می‌کند، همان اتفاقی که هنگام پختن تخم‌مرغ می‌افتد.\",k:[\"ساختار سه‌بعدی کار پروتئین را مشخص می‌کند\",\"هموگلوبین چهار زنجیره دارد و اکسیژن می‌برد\",\"واسرشت‌شدن یعنی از دست رفتن شکل و کارکرد\"],x:\"سفیده‌ی تخم‌مرغ با پخته شدن سفید می‌شود، چون پروتئین‌ها واسرشت شده و به هم چسبیده‌اند.\"},\n{m:\"هر نوکلئوتید از یک قند، یک فسفات و یک باز آلی ساخته می‌شود. در DNA قند دئوکسی‌ریبوز و بازها A، T، G و C هستند؛ در RNA قند ریبوز و به جای T باز U وجود دارد. DNA دو رشته‌ای و پایدار است و برای حفظ اطلاعات مناسب است، RNA معمولاً تک‌رشته‌ای است و نقش پیام‌رسان و کارگر دارد. مولکول ATP از آدنین، ریبوز و سه فسفات تشکیل شده و جدا شدن فسفات آخر انرژی آزاد می‌کند.\",k:[\"در DNA، A با T و G با C جفت می‌شود\",\"انواع RNA: پیک، ناقل و ریبوزومی\",\"ATP پول انرژی همه‌ی سلول‌هاست\"],x:\"هر سلول عضله در ثانیه میلیون‌ها ATP مصرف می‌کند و آن را دوباره می‌سازد.\"},\n{m:\"آنزیم‌ها معمولاً پروتئین‌اند و هر کدام فقط یک یا چند پیش‌ماده‌ی مشخص را می‌شناسند. پیش‌ماده در جایگاه فعال می‌نشیند، پیچ و تاب مختصری در آنزیم رخ می‌دهد و واکنش با انرژی کمتر پیش می‌رود. در دمای بالا آنزیم واسرشت می‌شود و در pH نامناسب کارایی‌اش کم می‌شود؛ آنزیم معده در اسید فعال است ولی آنزیم روده‌ی باریک در محیط قلیایی. بازدارنده‌ها می‌توانند جایگاه فعال را ببندند یا شکل آنزیم را عوض کنند.\",k:[\"هر آنزیم برای یک پیش‌ماده‌ی ویژه است\",\"دما و pH بهینه دارد\",\"مصرف نمی‌شود و بارها به کار می‌رود\"],x:\"لاکتاز قند شیر (لاکتوز) را می‌شکند؛ کسانی که آن را کم دارند با نوشیدن شیر دچار ناراحتی می‌شوند.\"}],\n\ncell:[\n{m:\"در سلول پیش‌هسته‌ای DNA آزادانه در سیتوپلاسم قرار دارد و اندامک غشادار ندارد، اما ریبوزوم دارد. این سلول‌ها معمولاً از ۱ تا ۱۰ میکرومتر هستند. سلول‌های هسته‌دار بزرگ‌ترند (۱۰ تا ۱۰۰ میکرومتر) و بخش‌های داخلی خود را با غشا از هم جدا می‌کنند؛ این کار امکان انجام هم‌زمان واکنش‌های متضاد را فراهم می‌کند. نظریه‌ی درون‌همزیستی می‌گوید میتوکندری و کلروپلاست روزگاری باکتری‌های مستقلی بودند که به درون یک سلول بزرگ‌تر رفتند.\",k:[\"باکتری‌ها هسته ندارند ولی DNA دارند\",\"یوکاریوت‌ها اندامک غشادار دارند\",\"میتوکندری و کلروپلاست DNA و ریبوزوم مخصوص خود دارند\"],x:\"باکتری اشرشیاکلی هر ۲۰ دقیقه یک بار تقسیم می‌شود، پس در یک روز نسل‌های بسیاری می‌سازد.\"},\n{m:\"سیتوپلاسم شامل ماده‌ی نیمه‌شفاف درون سلول و اندامک‌هاست. هسته ژن‌ها را محافظت می‌کند و از راه منفذهای هسته‌ای با سیتوپلاسم ارتباط دارد و هستک ریبوزوم می‌سازد. شبکه‌ی آندوپلاسمی زبر ریبوزوم دارد و پروتئین می‌سازد، نوع صاف لیپید می‌سازد. گلژی پروتئین‌ها را بسته‌بندی و برچسب‌گذاری می‌کند. واکوئل در گیاهان آب ذخیره می‌کند و فشار تورژسانس را برای استواری سلول به‌وجود می‌آورد.\",k:[\"هسته‌ی سلول مرکز کنترل است\",\"میتوکندری نیروگاه سلول است\",\"لیزوزوم‌ها مواد زائد و ذرات را هضم می‌کنند\"],x:\"سلول‌های ترشح‌کننده‌ی آنزیم‌های گوارشی، شبکه‌ی آندوپلاسمی و گلژی بسیار گسترده‌ای دارند.\"},\n{m:\"دولایه‌ی فسفولیپیدی غشا به علت دم‌های آب‌گریز، به راحتی مولکول‌های قطبی و یون‌ها را عبور نمی‌دهد. پروتئین‌های غشایی نقش‌های گوناگونی دارند: کانال، ناقل، گیرنده، آنزیم و برچسب هویتی. در سطح بیرونی، کربوهیدرات‌ها به لیپید و پروتئین متصل می‌شوند و سلول‌ها یکدیگر را از این نشانه‌ها می‌شناسند. دیواره‌ی سلولی در گیاهان، قارچ‌ها و باکتری‌ها بیرون غشا قرار دارد و به شکل سلول استحکام می‌دهد.\",k:[\"غشا نفوذپذیری انتخابی دارد\",\"پروتئین‌ها نقش ناقل و گیرنده دارند\",\"کلسترول سیالیت غشا را تنظیم می‌کند\"],x:\"گروه‌های خونی A و B و O به دلیل قندهای متفاوت روی غشای گلبول‌های قرمز است.\"},\n{m:\"در انتشار ساده مولکول‌ها از غلظت زیاد به کم می‌روند و در انتشار تسهیل‌شده این کار با کمک پروتئین‌های کانالی یا ناقل انجام می‌شود. اسمز حرکت آب از محلول رقیق‌تر به غلیظ‌تر است. در انتقال فعال، پمپ سدیم-پتاسیم در هر بار کار سه یون سدیم را بیرون و دو یون پتاسیم را داخل می‌برد و ATP مصرف می‌کند. این پمپ بخش بزرگی از انرژی سلول‌های عصبی را می‌گیرد و پتانسیل غشا را پایدار نگه می‌دارد.\",k:[\"انتشار بدون مصرف انرژی است\",\"انتقال فعال به ATP نیاز دارد\",\"اندوسیتوز ذرات بزرگ را وارد می‌کند\"],x:\"اگر گلبول قرمز را در آب مقطر بگذارید به‌خاطر اسمز آب جذب می‌کند و می‌ترکد.\"},\n{m:\"تنفس سلولی چهار مرحله دارد: گلیکولیز در سیتوپلاسم گلوکز را به پیرووات می‌شکند، سپس پیرووات به میتوکندری می‌رود، چرخه‌ی کربس الکترون‌دهنده‌هایی مانند NADH می‌سازد و در زنجیره‌ی انتقال الکترون، اکسیژن پذیرنده‌ی نهایی است و ATP سنتاز بیشترین ATP را می‌سازد. در نبود اکسیژن، تخمیر انجام می‌شود که انرژی بسیار کمتری می‌دهد. در فتوسنتز نیز واکنش‌های نوری در تیلاکوئید و چرخه‌ی کالوین در بستره رخ می‌دهد.\",k:[\"گلیکولیز بی‌هوازی و در سیتوپلاسم است\",\"بیشتر ATP در غشای درونی میتوکندری ساخته می‌شود\",\"تخمیر لاکتیکی در عضله هنگام ورزش شدید رخ می‌دهد\"],x:\"خمیر نان بر اثر تخمیر مخمر پف می‌کند، چون CO₂ تولید می‌شود.\"},\n{m:\"چرخه‌ی سلولی از مراحل G1، S، G2 و M ساخته شده است. در S همانندسازی DNA رخ می‌دهد و در M هسته و سپس سیتوپلاسم تقسیم می‌شود. میتوز در چهار مرحله‌ی پروفاز، متافاز، آنافاز و تلوفاز انجام می‌شود. در میوز، کروموزوم‌های همتا قطعاتی را عوض می‌کنند و ترکیب‌های ژنتیکی تازه پدید می‌آید. سرطان وقتی رخ می‌دهد که ژن‌های کنترل‌کننده‌ی چرخه جهش یابند و سلول بی‌وقفه تقسیم شود.\",k:[\"میتوز سلول‌های همانند می‌سازد\",\"میوز گامت می‌سازد\",\"جهش در ژن‌های کنترلی خطر سرطان را زیاد می‌کند\"],x:\"زخم پوست در چند روز ترمیم می‌شود، چون سلول‌های اطراف با میتوز جایگزین می‌شوند.\"}],\n\ngen:[\n{m:\"ساختار مارپیچ دوگانه را واتسون و کریک در سال ۱۹۵۳ با کمک تصاویر پراش پرتو ایکس روزالیند فرانکلین پیشنهاد کردند. ستون هر رشته از قند و فسفات است و بازها به سمت داخل‌اند. دو رشته پادموازی‌اند، یعنی جهت آن‌ها خلاف هم است. در هسته، DNA دور پروتئین‌های هیستون می‌پیچد و نوکلئوزوم می‌سازد و سپس کروماتین فشرده‌تر می‌شود تا در کروموزوم‌ها جا شود.\",k:[\"A با T دو پیوند و G با C سه پیوند هیدروژنی می‌سازد\",\"هیستون‌ها DNA را بسته‌بندی می‌کنند\",\"ژن بخشی از DNA است که یک محصول را رمز می‌کند\"],x:\"انسان ۲۳ جفت کروموزوم دارد، ولی ذرت ۱۰ جفت و سگ ۳۹ جفت.\"},\n{m:\"همانندسازی از نقطه‌ی آغاز شروع می‌شود، هلیکاز دو رشته را از هم باز می‌کند و پرایماز آغازگر کوتاهی می‌سازد. DNA پلیمراز فقط می‌تواند نوکلئوتید را به انتهای ۳' اضافه کند، بنابراین رشته‌ی پیشرو پیوسته و رشته‌ی پیرو قطعه‌قطعه (قطعات اکازاکی) ساخته می‌شود و لیگاز آن‌ها را به هم می‌دوزد. DNA پلیمراز توان تصحیح دارد و اشتباهات را برمی‌دارد، پس دقت زیاد است.\",k:[\"همانندسازی نیمه‌حفاظتی است\",\"رشته‌ی پیرو قطعه‌قطعه ساخته می‌شود\",\"لیگاز قطعات را به هم می‌پیوندد\"],x:\"DNA هر سلول انسان پیش از تقسیم در چند ساعت همانندسازی می‌شود.\"},\n{m:\"در رونویسی، RNA پلیمراز به راه‌انداز (پیشبر) ژن می‌چسبد و رشته‌ی mRNA می‌سازد. در یوکاریوت‌ها بخش‌های درون‌ژنی (اینترون) بریده و بخش‌های برون‌ژنی (اگزون) به هم متصل می‌شوند. در ترجمه، tRNA با پادرمزه‌ی خود به رمزه‌ی mRNA می‌چسبد و آمینواسید مناسب را می‌آورد. ریبوزوم آمینواسیدها را با پیوند پپتیدی وصل می‌کند تا به رمزه‌ی پایان برسد. رمز ژنتیک برای همه‌ی موجودات تقریباً یکسان است.\",k:[\"در یوکاریوت‌ها رونویسی در هسته و ترجمه در ریبوزوم انجام می‌شود\",\"هر رمزه سه نوکلئوتید است\",\"AUG رمزه‌ی آغاز است\"],x:\"ژن انسولین انسان را می‌توان به باکتری داد و باکتری انسولین انسانی می‌سازد.\"},\n{m:\"مندل صفت‌هایی مانند رنگ گل و شکل بذر را روی هزاران گیاه نخود بررسی کرد. نسل اول دورگ‌ها همه شبیه یک والد (غالب) بودند و در نسل دوم نسبت ۳ به ۱ ظاهر شد. او نتیجه گرفت که هر فرد دو عامل وراثتی دارد که هنگام تشکیل گامت‌ها جدا می‌شوند. در تلاقی دو صفت هم‌زمان، نسبت ۹:۳:۳:۱ به دست می‌آید که نشان می‌دهد صفات می‌توانند مستقل از هم به ارث برسند.\",k:[\"ژنوتیپ مجموعه‌ی اَلل‌های فرد است و فنوتیپ ظاهر آن\",\"هموزیگوت دو اَلل یکسان و هتروزیگوت دو اَلل متفاوت دارد\",\"مربع پانت احتمال‌ها را نشان می‌دهد\"],x:\"اگر هر دو والد ناقل بیماری نهفته‌ای باشند، هر فرزند با احتمال ۲۵٪ مبتلا می‌شود.\"},\n{m:\"در هم‌بارزی (هم‌توانی) هر دو اَلل بروز می‌کنند، مانند گروه خونی AB. در بارزی ناقص، هتروزیگوت حد واسط دو والد است؛ گل میمونی قرمز با سفید گل صورتی می‌دهد. ژن‌های روی یک کروموزوم معمولاً با هم به ارث می‌رسند و تنها کراسینگ‌اور آن‌ها را جدا می‌کند. صفات وابسته به X مانند کوررنگی و هموفیلی در مردان شایع‌ترند چون فقط یک X دارند.\",k:[\"چندآللی یعنی بیش از دو اَلل در جمعیت\",\"ژن‌های وابسته به X در مردان با یک اَلل نهفته هم بروز می‌کنند\",\"محیط نیز بر بیان بسیاری از صفات اثر دارد\"],x:\"رنگ پوست انسان تحت تأثیر چند ژن است و به یک ژن محدود نیست.\"},\n{m:\"جهش‌ها می‌توانند جانشینی یک باز، حذف یا اضافه‌شدن باز یا تغییرات کروموزومی باشند. جهش‌های تغییر چارچوب خواندن (حذف یا اضافه) معمولاً پروتئین را کاملاً عوض می‌کنند. عوامل جهش‌زا مانند پرتو فرابنفش و برخی مواد شیمیایی خطا را زیاد می‌کنند. اپی‌ژنتیک بررسی تغییراتی است که بدون تغییر توالی DNA بیان ژن را عوض می‌کند. CRISPR با یک RNA راهنما، آنزیم Cas9 را به محل ژن می‌رساند و آن را می‌برد.\",k:[\"جهش ماده‌ی خام تکامل است\",\"اپی‌ژنتیک بدون تغییر توالی بر بیان ژن اثر می‌گذارد\",\"ویرایش ژن چالش‌های اخلاقی دارد\"],x:\"در کم‌خونی داسی‌شکل، جهش تغییر یک باز یک آمینواسید هموگلوبین را عوض می‌کند.\"}],\n\nmic:[\n{m:\"باکتری‌ها دیواره‌ای از پپتیدوگلیکان دارند و در رنگ‌آمیزی گرم به دو گروه مثبت و منفی تقسیم می‌شوند. بسیاری برای حرکت تاژک دارند و برخی در شرایط سخت درون‌هاگ می‌سازند. باکتری‌ها می‌توانند با پیوند (کونژوگاسیون) پلاسمید رد و بدل کنند، و همین راهی برای گسترش مقاومت دارویی است. همچنین سیانوباکتری‌ها فتوسنتز می‌کنند و بخش بزرگی از اکسیژن اولیه‌ی زمین را ساختند.\",k:[\"تقسیم دوتایی سریع است\",\"پلاسمید ژن‌های مقاومت را جابه‌جا می‌کند\",\"بیشتر باکتری‌ها بی‌ضرر یا مفیدند\"],x:\"ماست و پنیر محصول فعالیت باکتری‌های لاکتیکی‌اند.\"},\n{m:\"ویروس کپسید پروتئینی و ژنوم DNA یا RNA دارد و برخی غشای چربی هم دارند. چرخه‌ی آن شامل اتصال، ورود، همانندسازی، مونتاژ و خروج است. باکتریوفاژها باکتری‌ها را آلوده می‌کنند. رتروویروس‌ها مانند HIV با آنزیم نسخه‌بردار معکوس از RNA، DNA می‌سازند و در ژنوم میزبان جا می‌دهند. جهش سریع ویروس‌ها دلیل نیاز به واکسن آنفلوآنزای سالانه است.\",k:[\"ویروس‌ها سلول ندارند\",\"هر ویروس میزبان ویژه‌ای دارد\",\"آنتی‌بیوتیک بر آن‌ها بی‌اثر است\"],x:\"باکتریوفاژها را برای درمان عفونت‌های مقاوم به آنتی‌بیوتیک هم آزموده‌اند.\"},\n{m:\"قارچ‌ها دیواره‌ای از کیتین دارند و با هیف‌ها (ریسه‌ها) شبکه‌ای به نام میسلیوم می‌سازند. آن‌ها تجزیه‌کننده‌های اصلی طبیعت‌اند و برخی با ریشه‌ی گیاهان همزیستی (میکوریز) می‌کنند. پنی‌سیلین از قارچ پنی‌سیلیوم به دست آمد. آغازیان گروه گسترده‌ای از یوکاریوت‌هایی هستند که گیاه، جانور یا قارچ نیستند: جلبک‌های تک‌سلولی، آمیب و پارامسی نمونه‌اند.\",k:[\"قارچ‌ها هتروتروف‌اند\",\"میکوریز جذب آب و املاح گیاه را زیاد می‌کند\",\"پلاسمودیوم با پشه‌ی آنوفل منتقل می‌شود\"],x:\"پنی‌سیلین را الکساندر فلمینگ در سال ۱۹۲۸ تصادفی کشف کرد.\"},\n{m:\"پوست و مخاط مانع فیزیکی‌اند و اشک و بزاق لیزوزیم دارند که دیواره‌ی باکتری را می‌شکند. اگر میکروب عبور کند، ماکروفاژها و نوتروفیل‌ها آن را می‌بلعند (بیگانه‌خواری) و ماستوسیت‌های بافت آسیب‌دیده هیستامین ترشح می‌کنند که رگ‌ها را گشاد می‌کند؛ نتیجه‌ی آن قرمزی، گرما و تورم محل التهاب است. مولکول‌های اینترفرون سلول‌های اطراف را در برابر ویروس آماده می‌کنند.\",k:[\"ایمنی ذاتی اختصاصی نیست و سریع است\",\"تب فعالیت دفاعی را بالا می‌برد\",\"التهاب علامت پاسخ دفاعی است\"],x:\"چرک، مجموعه‌ی گلبول‌های سفید مرده و میکروب‌هاست.\"},\n{m:\"آنتی‌ژن مولکولی است که پادتن به آن می‌چسبد. پادتن‌ها پروتئین‌های Y شکل با جایگاه‌های اتصال اختصاصی‌اند و می‌توانند میکروب را بی‌اثر کنند یا نشانه‌گذاری کنند. لنفوسیت T کمک‌کننده پاسخ‌ها را هماهنگ می‌کند و T کشنده سلول‌های آلوده را از بین می‌برد. بار نخست پاسخ آهسته است ولی در تماس بعدی سلول‌های حافظه پاسخ را سریع و قوی می‌کنند. بیماری‌های خودایمنی وقتی رخ می‌دهند که بدن به سلول‌های خود حمله کند.\",k:[\"پادتن اختصاصی است\",\"حافظه‌ی ایمنی پایه‌ی واکسن است\",\"آلرژی پاسخ شدید به آنتی‌ژن بی‌خطر است\"],x:\"سرخک پس از یک بار ابتلا معمولاً ایمنی همیشگی می‌دهد.\"},\n{m:\"واکسن عامل ضعیف‌شده، کشته‌شده، یا قطعه‌ای از آن را وارد می‌کند تا بدن حافظه بسازد. در واکسن mRNA، دستور ساخت یک پروتئین ویروسی به سلول می‌رسد. وقتی بیشتر افراد جامعه ایمن باشند، گسترش بیماری برای کسانی که واکسن نزده‌اند هم دشوار می‌شود (ایمنی جمعی). مصرف بی‌مورد آنتی‌بیوتیک باکتری‌های مقاوم را برمی‌گزیند و درمان آینده را دشوار می‌کند.\",k:[\"دوره‌ی آنتی‌بیوتیک را تا آخر باید کامل کرد\",\"واکسن پیش از بیماری آموزش می‌دهد\",\"ایمنی جمعی از افراد آسیب‌پذیر محافظت می‌کند\"],x:\"آبله با واکسیناسیون جهانی در سال ۱۹۸۰ ریشه‌کن اعلام شد.\"}],\n\nplant:[\n{m:\"ریشه با تارهای کشنده سطح جذب را بسیار زیاد می‌کند. در ساقه هر دو آوند چوبی و آبکش وجود دارد و در دولپه‌ای‌ها دسته‌های آوندی در یک حلقه‌اند. برگ از روپوست، میانبرگ و آوندها تشکیل شده و روزنه‌ها با سلول‌های نگهبان باز و بسته می‌شوند تا تبادل گاز و تعرق تنظیم شود. تعرق، آب را از ریشه تا برگ می‌کشد.\",k:[\"چوب آب و املاح را بالا می‌برد\",\"آبکش قندها را پخش می‌کند\",\"روزنه‌ها تبادل گاز و تعرق را کنترل می‌کنند\"],x:\"حلقه‌های سالانه‌ی درخت حاصل فعالیت کامبیوم در فصل‌های مختلف است.\"},\n{m:\"واکنش‌های نوری در غشای تیلاکوئید با جذب نور توسط کلروفیل انجام می‌شود، آب شکسته و O₂ آزاد می‌شود و ATP و NADPH ساخته می‌شود. در چرخه‌ی کالوین (بستره)، آنزیم روبیسکو CO₂ را تثبیت می‌کند و با مصرف ATP و NADPH قند سه‌کربنه می‌سازد. شدت نور، غلظت CO₂ و دما بر سرعت فتوسنتز اثر می‌گذارند. گیاهان C4 مانند ذرت در هوای گرم کارایی بیشتری دارند.\",k:[\"واکنش‌های نوری در تیلاکوئید رخ می‌دهد\",\"چرخه‌ی کالوین در بستره است\",\"روبیسکو فراوان‌ترین آنزیم زمین است\"],x:\"جلبک‌ها و باکتری‌های دریایی نزدیک نیمی از اکسیژن زمین را تولید می‌کنند.\"},\n{m:\"خزه‌ها آوند ندارند و باید در مکان‌های مرطوب باشند و تولیدمثل آن‌ها به آب نیاز دارد. سرخس‌ها آوند دارند اما دانه ندارند و با هاگ زاده می‌شوند. بازدانگان مانند کاج دانه‌ی بدون پوشش و مخروط دارند. نهان‌دانگان گل و میوه دارند و دانه در درون تخمدان محافظت می‌شود. این ویژگی به آن‌ها سازگاری گسترده داد.\",k:[\"چرخه‌ی زندگی گیاهان تناوب نسل دارد\",\"دانه موجب گسترش در خشکی شد\",\"نهان‌دانگان به تک‌لپه‌ای و دولپه‌ای تقسیم می‌شوند\"],x:\"گندم و برنج از تک‌لپه‌ای‌ها و لوبیا و نخود از دولپه‌ای‌ها هستند.\"},\n{m:\"گل شامل کاسبرگ، گلبرگ، پرچم (اندام نر) و مادگی (اندام ماده) است. دانه‌ی گرده بر کلاله می‌نشیند و لوله‌ی گرده به سمت تخمک رشد می‌کند. یکی از دو سلول اسپرم با تخمزا لقاح می‌دهد و زیگوت می‌سازد و دیگری با دو هسته‌ی دیگر درون‌دانه را می‌سازد. دانه جنین و ذخیره‌ی غذا دارد و میوه به پراکنش آن کمک می‌کند.\",k:[\"گرده‌افشانی با حشره، باد یا پرنده انجام می‌شود\",\"لقاح مضاعف ویژه‌ی نهان‌دانگان است\",\"میوه از تخمدان ساخته می‌شود\"],x:\"رنگ و بوی گل‌ها جاذب زنبورها هستند و گلبرگ‌های پهن برای فرود آن‌ها طراحی شده است.\"},\n{m:\"اکسین در نوک ساقه ساخته می‌شود و در سمت تاریک تجمع می‌یابد، پس آن سمت بیشتر رشد می‌کند و ساقه به سمت نور خم می‌شود. جیبرلین طویل‌شدن ساقه و جوانه‌زنی دانه را تحریک می‌کند. سیتوکینین با اکسین در تقسیم سلولی همکاری می‌کند. آبسزیک‌اسید هنگام کم‌آبی روزنه‌ها را می‌بندد. اتیلن گازی است که میوه‌ها را می‌رساند و برگ‌ها را می‌ریزد.\",k:[\"اکسین ساقه را به سمت نور می‌برد\",\"آبسزیک‌اسید هورمون تنش است\",\"هورمون‌ها در مقدار کم کار می‌کنند\"],x:\"یک موز رسیده کنار سیب سبز آن را سریع‌تر می‌رساند چون اتیلن آزاد می‌کند.\"},\n{m:\"کاکتوس‌ها برگ را به خار تبدیل کرده و ساقه‌ی ضخیم آبدار دارند. گیاهان CAM مانند کاکتوس شب CO₂ را جذب می‌کنند تا روز تعرق کم شود. گیاهان آبزی بافت هوادار دارند. گیاهان گوشتخوار در خاک فقیر از نظر نیتروژن، با به دام انداختن حشره نیتروژن می‌گیرند. بعضی گیاهان با باکتری‌های ریزوبیوم همزیستی می‌کنند و نیتروژن هوا را تثبیت می‌کنند، مانند گیاهان خانواده‌ی نخود.\",k:[\"سازگاری حاصل انتخاب طبیعی است\",\"گیاهان تیره‌ی نخود خاک را حاصلخیز می‌کنند\",\"همزیستی ریشه سود دوطرفه دارد\"],x:\"سس گیاه انگلی است و بدون کلروفیل، از میزبان مواد می‌گیرد.\"}],\n\nanim:[\n{m:\"بی‌مهرگان بیشتر گونه‌های جانوری هستند. اسفنج‌ها بافت واقعی ندارند، مرجانیان تقارن شعاعی و گوارش ساده دارند، پلاناریا نخستین جانوران با تقارن دوطرفه‌اند و کرم‌های حلقوی مانند کرم خاکی بدنی بندبند دارند. نرم‌تنان شامل حلزون، صدف و هشت‌پایند و بندپایان اسکلت بیرونی و اندام‌های مفصل‌دار دارند. خارپوستان مانند ستاره‌ی دریایی تقارن شعاعی در بزرگسالی دارند.\",k:[\"بندپایان بزرگ‌ترین شاخه‌اند\",\"اسکلت بیرونی نیاز به پوست‌اندازی دارد\",\"نرم‌تنان بدن نرم و اغلب صدف دارند\"],x:\"هشت‌پا سه قلب و خون آبی‌رنگ دارد و از باهوش‌ترین بی‌مهرگان است.\"},\n{m:\"در مهره‌داران، ستون مهره از نخاع محافظت می‌کند. ماهی‌ها آبشش و قلب دو‌حفره‌ای دارند. دوزیستان در مرحله‌ی لارو آبششی و در بزرگسالی ریوی‌اند. خزندگان پوست خشک و تخم دارای پوسته دارند. پرندگان پر دارند و استخوان‌هایشان سبک است، پستانداران مو دارند و فرزندان خود را با شیر تغذیه می‌کنند. قلب پرندگان و پستانداران چهارحفره‌ای است.\",k:[\"دوزیستان پوست مرطوب دارند\",\"پرندگان و پستانداران خون‌گرم‌اند\",\"پستانداران غدد شیری دارند\"],x:\"خفاش تنها پستاندار پروازکننده است.\"},\n{m:\"در لقاح خارجی، گامت‌ها در آب آزاد می‌شوند و در لقاح داخلی درون بدن ماده می‌آمیزند. تخم‌گذاران جنین را درون تخم می‌پرورانند و زنده‌زایان درون رحم. جنین در گاسترولا سه لایه‌ی خارجی، میانی و داخلی می‌سازد که به ترتیب پوست و عصب، ماهیچه و استخوان، و لوله‌ی گوارش را به وجود می‌آورند. در دگردیسی مانند قورباغه، بدن لارو به شکل بالغ تغییر می‌کند.\",k:[\"گاسترولا اساس سه لایه‌ی جنینی است\",\"دگردیسی در حشرات و دوزیستان رخ می‌دهد\",\"مراقبت از فرزند در پستانداران بیشتر است\"],x:\"پروانه چهار مرحله دارد: تخم، لارو، شفیره و بالغ.\"},\n{m:\"شتر چربی را در کوهان ذخیره می‌کند و ادرار غلیظ دارد. خفاش و دلفین با فرستادن صوت و دریافت پژواک، محیط را «می‌بینند». قورباغه‌های سمی با رنگ‌های درخشان خطرشان را اعلام می‌کنند و آفتاب‌پرست رنگ خود را تغییر می‌دهد. خرس‌ها و جوندگان زمستان‌خواب سوخت‌وساز را کم و انرژی ذخیره‌شده را مصرف می‌کنند. این‌ها همگی نتیجه‌ی ده‌ها میلیون سال انتخاب طبیعی‌اند.\",k:[\"استتار در برابر شکارچی محافظت می‌کند\",\"هشداردهنده‌ها رنگ‌های تند دارند\",\"سازگاری یعنی ویژگی سودمند در محیط\"],x:\"ماهی‌های قطبی پروتئین ضدیخ در خون دارند.\"},\n{m:\"سامانه‌ی عصبی جانوران ساده شبکه‌ای پراکنده است. جانوران پیچیده‌تر دارای طناب عصبی و گانگلیون‌اند. مغز در مهره‌داران به بخش‌هایی مانند مخ، مخچه و ساقه‌ی مغز تقسیم می‌شود. اندام‌های حسی اطلاعات را به شکل پیام عصبی به مغز می‌فرستند؛ چشم ساده تا چشم مرکب حشرات و چشم عدسی‌دار مهره‌داران. اندازه‌ی نسبی مغز با توانایی یادگیری ارتباط دارد.\",k:[\"نورون‌ها واحد پیام‌رسان‌اند\",\"حواس اطلاعات را جمع‌آوری می‌کنند\",\"مخ مرکز تفکر و حافظه است\"],x:\"زنبور عسل رنگ‌های فرابنفش را می‌بیند که چشم انسان نمی‌بیند.\"},\n{m:\"همزیستی دو گونه‌ی متفاوت در تماس دائمی است. در مفیدزیستی هر دو سود می‌برند، مانند باکتری‌های شکمبه‌ی گاو که سلولز را هضم می‌کنند. در همسفرگی یکی سود می‌برد و دیگری بی‌تفاوت است. در انگلی یکی سود و دیگری زیان می‌بیند، مانند کک و کنه. شکارگری و رقابت هم روابط مهم‌اند و تعادل جمعیت‌ها را تنظیم می‌کنند.\",k:[\"مفیدزیستی دوطرفه است\",\"انگل معمولاً میزبان را نمی‌کشد\",\"رقابت برای منابع محدود رخ می‌دهد\"],x:\"ماهی دلقک و شقایق دریایی با هم زندگی می‌کنند و از هم محافظت می‌کنند.\"}],\n\nhuman:[\n{m:\"قلب با دریچه‌هایی که خون را یک‌طرفه نگه می‌دارند، خون را پمپ می‌کند. خون کم‌اکسیژن از دهلیز راست به بطن راست و سپس ریه‌ها می‌رود، خون اکسیژن‌دار به دهلیز و بطن چپ می‌آید و از سرخرگ آئورت به بدن پمپ می‌شود. خون از پلاسما، گلبول‌های قرمز، گلبول‌های سفید و پلاکت تشکیل می‌شود. پلاکت‌ها در لخته‌شدن خون نقش دارند. فشار خون بالا قلب و رگ‌ها را آسیب می‌زند.\",k:[\"گردش ریوی خون را به ریه می‌برد\",\"هموگلوبین اکسیژن حمل می‌کند\",\"پلاکت‌ها لخته می‌سازند\"],x:\"یک قطره خون میلیون‌ها گلبول قرمز دارد.\"},\n{m:\"هوا از بینی وارد می‌شود و گرم و مرطوب و فیلتر می‌شود. در دم، دیافراگم پایین می‌رود و قفسه بزرگ می‌شود و فشار ریه کم می‌شود، پس هوا وارد می‌شود. در آلوئول‌ها، O₂ به خون و CO₂ از خون به هوا می‌رود. بیشتر CO₂ به صورت بی‌کربنات در خون حمل می‌شود. سیگار مژک‌های مجاری را فلج می‌کند و خطر سرطان را بالا می‌برد.\",k:[\"سطح آلوئول‌ها حدود ۷۰ متر مربع است\",\"مراکز تنفس در ساقه‌ی مغز هستند\",\"CO₂ زیاد تنفس را تحریک می‌کند\"],x:\"ورزش شدید ریتم تنفس را بالا می‌برد چون CO₂ خون زیاد می‌شود.\"},\n{m:\"گوارش مکانیکی و شیمیایی از دهان شروع می‌شود: آمیلاز بزاق نشاسته را می‌شکند. در معده، اسید کلریدریک و پپسین پروتئین‌ها را تجزیه می‌کنند. صفرا چربی‌ها را ریز می‌کند، لوزالمعده آنزیم‌های قوی می‌ریزد و بیشتر جذب در روده‌ی باریک رخ می‌دهد که پرزهای فراوان دارد. روده‌ی بزرگ آب و املاح را جذب و مدفوع را شکل می‌دهد.\",k:[\"صفرا از کبد است و در کیسه‌ی صفرا ذخیره می‌شود\",\"پرزها سطح جذب را زیاد می‌کنند\",\"میکروبیوم به گوارش کمک می‌کند\"],x:\"طول روده‌ی باریک چند متر است و غذا چند ساعت در آن می‌ماند.\"},\n{m:\"نورون از جسم سلولی، دندریت و آکسون ساخته شده است. در حالت استراحت داخل نورون نسبت به بیرون منفی است. وقتی تحریک به آستانه برسد کانال‌های سدیمی باز می‌شوند و پتانسیل عمل پدید می‌آید که در طول آکسون پیش می‌رود. در سیناپس ناقل‌های عصبی مانند دوپامین و استیل‌کولین آزاد می‌شوند. دستگاه عصبی خودمختار شامل هم‌حس و پادهم‌حس است.\",k:[\"پتانسیل عمل همه یا هیچ است\",\"میلین سرعت پیام را بالا می‌برد\",\"بازتاب پاسخ سریع بدون دخالت مغز است\"],x:\"عکس‌العمل کشیدن دست از شیء داغ، بازتابی نخاعی و پیش از آگاهی است.\"},\n{m:\"غدد درون‌ریز هورمون را به خون می‌ریزند. هیپوفیز که «غده‌ی فرمانده» است هورمون‌هایی ترشح می‌کند که غدد دیگر را تنظیم می‌کنند. تیروئید سرعت سوخت‌وساز را تنظیم می‌کند و کمبود ید باعث گواتر می‌شود. پانکراس انسولین و گلوکاگون می‌سازد، و در دیابت این تعادل از بین می‌رود. تنظیم بیشتر هورمون‌ها با بازخورد منفی است.\",k:[\"هورمون‌ها اثر دیرتر و ماندگارتر از اعصاب دارند\",\"دیابت یعنی اختلال در قند خون\",\"آدرنالین بدن را برای واکنش آماده می‌کند\"],x:\"در هنگام ترس، آدرنالین ضربان قلب را بالا می‌برد.\"},\n{m:\"خون در گلومرول کلیه صاف می‌شود و مواد کوچک وارد کپسول بومن می‌شوند. سپس در لوله‌های پیچ‌خورده، گلوکز و بیشتر آب بازجذب می‌شود و مواد زائد مانند اوره به ادرار می‌پیوندند. هورمون ضدادراری (ADH) میزان بازجذب آب را تنظیم می‌کند. کلیه همچنین فشار خون و pH را کنترل می‌کند. اگر کلیه‌ها از کار بیفتند، دیالیز یا پیوند لازم است.\",k:[\"هر نفرون یک گلومرول دارد\",\"اوره از تجزیه‌ی پروتئین است\",\"ADH آب را حفظ می‌کند\"],x:\"نوشیدن آب کم، ادرار را غلیظ و تیره می‌کند.\"},\n{m:\"استخوان بافت زنده است که پیوسته بازسازی می‌شود و کلسیم و فسفر ذخیره می‌کند. استخوان‌ها در مفصل‌ها با رباط به هم و ماهیچه‌ها با زردپی به استخوان می‌چسبند. ماهیچه‌ی اسکلتی ارادی و ماهیچه‌ی صاف غیرارادی است و ماهیچه‌ی قلبی ویژگی‌های ویژه‌ی خود را دارد. انقباض در سارکومر با لغزیدن اکتین بر میوزین انجام می‌شود و به یون کلسیم و ATP نیاز دارد.\",k:[\"ماهیچه‌ها با جفت‌های متضاد کار می‌کنند\",\"ورزش استخوان را محکم‌تر می‌کند\",\"ویتامین D جذب کلسیم را زیاد می‌کند\"],x:\"در بدن انسان بیش از ۶۰۰ ماهیچه و ۲۰۶ استخوان در بزرگسالی وجود دارد.\"}],\n\nbeh:[\n{m:\"غریزه‌ها الگوی ثابت عمل دارند و با یک محرک راه می‌افتند؛ جوجه‌اردک‌ها اولین جسم متحرک را دنبال می‌کنند (نقش‌پذیری، کار کنراد لورنز). در شرطی‌شدن کلاسیک، محرک خنثی با محرک طبیعی جفت می‌شود و پاسخ ایجاد می‌کند. در شرطی‌شدن فعال (اسکینر)، رفتاری که پاداش بگیرد تکرار می‌شود. یادگیری با درک و بینش هم در شامپانزه‌ها دیده می‌شود.\",k:[\"عادی‌شدن ساده‌ترین نوع یادگیری است\",\"پاداش رفتار را تقویت می‌کند\",\"نقش‌پذیری در دوره‌ی حساس رخ می‌دهد\"],x:\"سگ با شنیدن صدای ظرف غذا بزاق ترشح می‌کند.\"},\n{m:\"ارتباط می‌تواند شنیداری، دیداری، شیمیایی یا لمسی باشد. نهنگ‌ها آوازهای دوربرد می‌خوانند، کرم شب‌تاب با نور خود جفت را جذب می‌کند و مورچه‌ها با رد فرومونی مسیر غذا را به هم‌لانه‌ای‌ها نشان می‌دهند. زنبور کارگر با رقص حلقوی یا هشت‌شکل محل منبع غذا را می‌گوید. نشانه‌ها باید برای گیرنده قابل فهم باشند و فایده‌ای تکاملی داشته باشند.\",k:[\"فرومون‌ها پیام شیمیایی‌اند\",\"رنگ و صدا برای جفت‌یابی و هشدار به کار می‌روند\",\"ارتباط، همکاری را ممکن می‌کند\"],x:\"پرندگان هشدار خطر می‌دهند و گروه به سرعت پراکنده می‌شود.\"},\n{m:\"مهاجرت‌های فصلی برای رسیدن به غذا یا محل زادآوری است. پرستوها هزاران کیلومتر می‌روند و لاک‌پشت‌ها به ساحل زادگاه برمی‌گردند. آن‌ها از خورشید، ستارگان، میدان مغناطیسی زمین و بو کمک می‌گیرند. ساعت زیستی درونی ریتم خواب و بیداری را نزدیک به ۲۴ ساعت نگه می‌دارد و با نور تنظیم می‌شود.\",k:[\"مهاجرت اغلب غریزی است\",\"هورمون‌ها زمان مهاجرت را تنظیم می‌کنند\",\"جت‌لگ نتیجه‌ی به‌هم‌خوردن ساعت زیستی است\"],x:\"پرستوی دریایی قطبی بیش از ۷۰ هزار کیلومتر در سال مهاجرت می‌کند.\"},\n{m:\"در جوامع حشرات اجتماعی مانند زنبور و موریانه، ملکه تولیدمثل می‌کند و کارگرها نازا هستند و کار می‌کنند. چنین ایثاری را می‌توان با شایستگی فراگیر توضیح داد: کارگرها ژن‌های مشترک با ملکه دارند و با کمک به او ژن‌های خود را حفظ می‌کنند. در پستانداران، گله‌ها به شکار کمک می‌کنند و در برابر شکارچی محافظت می‌کنند و رهبری و سلسله‌مراتب نظم می‌دهد.\",k:[\"کلنی تقسیم کار دارد\",\"ایثار با ژن‌های مشترک توضیح داده می‌شود\",\"گروه‌زیستی از شکارچی محافظت می‌کند\"],x:\"یک کندو ممکن است ده‌ها هزار زنبور و یک ملکه داشته باشد.\"},\n{m:\"در بسیاری از گونه‌ها، ماده‌ها پرهزینه‌تر تولیدمثل می‌کنند و گزینش‌گرترند، پس نرها برای جلب توجه رقابت یا خودنمایی می‌کنند. نمایش‌های پیچیده مانند رقص پرنده‌ی بهشتی یا شاخ‌های گوزن به ماده‌ها از سلامت ژنتیکی نر خبر می‌دهند. قلمروخواهی منابع را برای زادآوری حفظ می‌کند. مراقبت از فرزند در پرندگان و پستانداران هزینه دارد اما بقای نوزاد را بالا می‌برد.\",k:[\"انتخاب جنسی به صفات نمایشی می‌انجامد\",\"قلمرو منابع را حفظ می‌کند\",\"مراقبت از نوزاد شایستگی را بالا می‌برد\"],x:\"نر طاووس هر سال دم زیبا و سنگین خود را می‌سازد تا جذب ماده شود.\"}],\n\nevo:[\n{m:\"سه شرط انتخاب طبیعی: تنوع در جمعیت، وراثت‌پذیری آن تنوع و تفاوت در زادآوری. در جمعیت‌هایی که شکارچی یا بیماری دارند، افرادی که صفت بهتری دارند بیشتر زنده می‌مانند و ژن‌هایشان فراوان‌تر می‌شود. مثال کلاسیک، پروانه‌ی فلفلی در انگلستان است که پس از صنعتی شدن و تیره شدن درخت‌ها، نوع تیره بیشتر شد. انتخاب طبیعی بر فنوتیپ اثر می‌گذارد، ولی نتیجه‌ی آن تغییر در فراوانی ژن‌هاست.\",k:[\"انتخاب بر فرد اثر می‌گذارد، ولی جمعیت تکامل می‌یابد\",\"سازگاری با محیط به معنی شایستگی بیشتر است\",\"انتخاب جهت‌دار، پایدارکننده و گسسته‌کننده انواع آن هستند\"],x:\"باکتری‌های مقاوم به آنتی‌بیوتیک مثالی زنده از انتخاب طبیعی هستند.\"},\n{m:\"فسیل‌ها در لایه‌های رسوبی به ترتیب سن قرار گرفته‌اند و گونه‌های گذار مانند آرکئوپتریکس ویژگی‌های خزنده و پرنده را دارند. اندام‌های همتا مانند دست انسان، بال خفاش و باله‌ی نهنگ ساختار استخوانی مشابه دارند. همچنین شباهت توالی DNA و پروتئین‌ها شاخص دقیقی از خویشاوندی است؛ انسان و شامپانزه نزدیک ۹۸ تا ۹۹ درصد DNA مشترک دارند.\",k:[\"فسیل سن و تاریخچه را نشان می‌دهد\",\"اندام همتا از نیای مشترک است\",\"مولکول‌ها خویشاوندی را تأیید می‌کنند\"],x:\"فسیل تیکتالیک حلقه‌ی گذار میان ماهی و چهارپایان است.\"},\n{m:\"گونه‌زایی دگرمیهنی با جدایی جغرافیایی رخ می‌دهد؛ مانند سهره‌های داروین در جزایر گالاپاگوس. گونه‌زایی هم‌میهنی بدون جدایی جغرافیایی و با چندلاد‌شدن، به‌ویژه در گیاهان، اتفاق می‌افتد. سدهای تولیدمثلی شامل تفاوت در زمان جفت‌گیری، رفتار، ناسازگاری گامت‌ها و نازایی دورگه‌هاست. وقتی گونه‌ای به محیط‌های متعدد می‌رسد، تابش سازشی رخ می‌دهد.\",k:[\"جدایی جغرافیایی جریان ژن را قطع می‌کند\",\"قاطر دورگه‌ی اسب و الاغ نازاست\",\"تابش سازشی گونه‌های متنوع می‌سازد\"],x:\"سهره‌های گالاپاگوس منقارهای مختلفی برای غذاهای متفاوت دارند.\"},\n{m:\"رانش ژنی در جمعیت‌های کوچک بیشتر دیده می‌شود، مانند اثر بطری یا اثر بنیان‌گذار. در اثر بطری، جمعیت به دلیل یک بلای طبیعی ناگهان کم می‌شود و تنوع ژنتیکی افت می‌کند، مانند یوزپلنگ‌ها. شرایط تعادل هاردی-واینبرگ شامل جمعیت بزرگ، آمیزش تصادفی، نبود جهش، مهاجرت و انتخاب است و اگر یکی نقض شود تکامل رخ می‌دهد. فرمول آن p²+2pq+q²=1 است.\",k:[\"رانش تصادفی است\",\"جریان ژن جمعیت‌ها را شبیه می‌کند\",\"جهش تنوع تازه می‌سازد\"],x:\"در یک جزیره‌ی دورافتاده، چند مهاجر اولیه ژن‌های جمعیت بعدی را تعیین می‌کنند.\"},\n{m:\"انسان‌تباران از حدود ۶ میلیون سال پیش از نیای مشترک با شامپانزه‌ها جدا شدند. استرالوپیتکوس‌ها دوپا بودند و مغز کوچک داشتند. هومو ارکتوس ابزار ساخت و آتش را به کار برد و از آفریقا بیرون رفت. نئاندرتال‌ها در اروپا و غرب آسیا بودند و بخشی از ژنوم انسان‌های امروز غیرآفریقایی از آن‌هاست. انسان خردمند هنر، زبان و فرهنگ پیچیده دارد.\",k:[\"دوپایی پیش از بزرگ‌شدن مغز بود\",\"ابزارسازی و آتش مهم بودند\",\"انسان‌ها با نئاندرتال‌ها آمیزش کردند\"],x:\"آثار باستانی غار در ایران، از دوران نئاندرتال‌ها نشانه‌هایی دارد.\"},\n{m:\"درخت فیلوژنی از داده‌های ریخت‌شناسی و مولکولی ساخته می‌شود. هر گره نشان‌دهنده‌ی نیای مشترک است و کلاد یعنی یک نیا و همه‌ی نوادگانش. انسان از نظر تکاملی به شامپانزه نزدیک‌تر است تا به ماهی و پرندگان به تمساح نزدیک‌ترند تا مارمولک، چون نیای مشترک جدیدتری دارند. با مقایسه‌ی ژن‌ها می‌توان زمان انشعاب را نیز تخمین زد (ساعت مولکولی).\",k:[\"شاخه‌های درخت زمان و خویشاوندی را می‌رساند\",\"نیای مشترک هر کلاد را می‌بندد\",\"داده‌های ژنتیکی درخت‌ها را اصلاح کرده‌اند\"],x:\"درخت زندگی نشان می‌دهد قارچ‌ها از گیاهان به جانوران نزدیک‌ترند.\"}],\n\ntax:[\n{m:\"سه قلمرو را کارل ووز بر پایه‌ی توالی RNA ریبوزومی تعریف کرد. باکتری‌ها و آرکی‌ها هر دو پیش‌هسته‌ای‌اند، ولی آرکی‌ها از نظر ژنتیکی به یوکاریوت‌ها نزدیک‌ترند. یوکاریوت‌ها شامل آغازیان، قارچ‌ها، گیاهان و جانوران‌اند. بسیاری از آرکی‌ها دما، نمک یا اسید زیاد را تحمل می‌کنند و در اعماق اقیانوس و منابع آب گرم یافت می‌شوند.\",k:[\"قلمروها بر اساس ژنتیک تعریف شده‌اند\",\"آرکی‌ها اغلب شرایط سخت را تحمل می‌کنند\",\"باکتری و آرکی هسته ندارند\"],x:\"متان‌زاها آرکی‌هایی‌اند که در دستگاه گوارش گاو متان تولید می‌کنند.\"},\n{m:\"رده‌بندی لینه‌ای از قلمرو تا گونه ۸ سطح دارد: قلمرو، فرمانرو، شاخه، رده، راسته، تیره، سرده، گونه. نام علمی دو‌اسمی به زبان لاتین است و به صورت ایتالیک (Homo sapiens) نوشته می‌شود. این نظام در همه‌ی کشورها یکسان است و از اشتباه جلوگیری می‌کند. امروزه تاکسونومی مدرن با استفاده از DNA رده‌ها را بازنگری می‌کند.\",k:[\"نام علمی جهانی است\",\"هر سطح شامل سطح‌های بعدی است\",\"رده‌بندی مدرن فیلوژنتیک است\"],x:\"نام علمی گربه‌ی خانگی Felis catus و نام علمی شیر Panthera leo است؛ این دو سرده‌ی متفاوتی دارند.\"},\n{m:\"چند تعریف برای گونه وجود دارد. تعریف زیستی بر ناتوانی در آمیزش یا نازایی دورگه‌ها تکیه دارد. تعریف ریخت‌شناسی بر شباهت ظاهری و تعریف فیلوژنتیک بر تاریخچه‌ی مشترک. برخی گونه‌ها دورگه می‌دهند، مثل شیر و ببر در اسارت (لایگر). در باکتری‌ها که غیرجنسی‌اند تعریف زیستی کاربرد ندارد.\",k:[\"هیچ تعریفی کامل نیست\",\"دورگه‌ها معمولاً نازا هستند\",\"مرز گونه‌ها در طبیعت گاه نامشخص است\"],x:\"قاطر دورگه‌ی اسب ماده و الاغ نر است و معمولاً نازاست.\"},\n{m:\"انقراض طبیعی همیشه بوده، اما نرخ آن اکنون بسیار بیشتر است و بعضی دانشمندان از ششمین انقراض دسته‌جمعی سخن می‌گویند. عوامل اصلی شامل تخریب و تکه‌تکه‌شدن زیستگاه، شکار بی‌رویه، آلودگی، گونه‌های مهاجم و تغییر اقلیم‌اند. اتحادیه‌ی جهانی حفاظت از طبیعت (IUCN) فهرست سرخ گونه‌ها را منتشر می‌کند. حفاظت از زیستگاه مؤثرترین راه است.\",k:[\"زیستگاه مهم‌ترین عامل است\",\"فهرست سرخ وضعیت گونه‌ها را می‌گوید\",\"احیای گونه‌ها ممکن اما دشوار است\"],x:\"یوزپلنگ آسیایی تنها در ایران زنده است و کمتر از ۵۰ قلاده دارد.\"},\n{m:\"نقاط داغ، مناطقی با گونه‌های بومی بسیار و در معرض تهدیدند. جنگل‌های حاره، صخره‌های مرجانی و جزایر نمونه‌اند. ایران به دلیل کوهستان، کویر، جنگل‌های هیرکانی و خلیج فارس تنوع زیستی بالایی دارد. گونه‌های بومی در هیچ جای دیگر جهان یافت نمی‌شوند. حفاظت از آن‌ها در پارک‌ها و مناطق حفاظت‌شده انجام می‌شود.\",k:[\"گونه‌ی بومی فقط در یک منطقه است\",\"جنگل هیرکانی میراث جهانی است\",\"تنوع ژنتیکی اساس پایداری است\"],x:\"جنگل‌های هیرکانی شمال ایران در فهرست میراث جهانی یونسکو ثبت شده‌اند.\"}],\n\neco:[\n{m:\"یک فرد گونه‌ی خود را نمایندگی می‌کند، جمعیت همه‌ی افراد یک گونه در یک ناحیه‌اند، جامعه شامل همه‌ی جمعیت‌های آن ناحیه است و بوم‌سازگان جامعه را به همراه عوامل غیرزنده در بر می‌گیرد. زیست‌بوم مجموعه‌ای بزرگ با اقلیم مشابه است، مانند بیابان یا تایگا. زیست‌کره مجموعه‌ی همه‌ی بوم‌سازگان‌های زمین است. عوامل زنده و غیرزنده با هم اثر متقابل دارند.\",k:[\"جمعیت یک گونه است\",\"جامعه چند گونه دارد\",\"بوم‌سازگان عوامل غیرزنده را هم دارد\"],x:\"یک برکه، بوم‌سازگانی کوچک شامل ماهی، گیاه، میکروب، آب و نور است.\"},\n{m:\"تولیدکننده‌ها قند می‌سازند، مصرف‌کننده‌های اول گیاه‌خوارند، مصرف‌کننده‌های بعدی گوشتخوارند و تجزیه‌کننده‌ها مواد را بازیافت می‌کنند. در هر سطح غذایی بخش زیادی انرژی به صورت گرما و تنفس از بین می‌رود، پس زنجیره‌ها معمولاً کوتاه‌اند. شبکه‌ی غذایی تصویر واقعی‌تری از ارتباط زنجیره‌هاست. تجمع زیستی مواد سمی مانند جیوه در سطوح بالا بیشتر می‌شود.\",k:[\"انرژی یک‌طرفه و مواد چرخه‌ای‌اند\",\"هرم زیست‌توده نیز وجود دارد\",\"شکارچی بالا بیشترین سم را جمع می‌کند\"],x:\"نهنگ‌های بزرگ از موجودات ریز پلانکتون تغذیه می‌کنند و زنجیره‌ی کوتاهی دارند.\"},\n{m:\"در چرخه‌ی کربن، گیاهان CO₂ را جذب و جانداران آن را آزاد می‌کنند و سوزاندن سوخت فسیلی سطح CO₂ را بالا می‌برد. در چرخه‌ی نیتروژن، باکتری‌های تثبیت‌کننده N₂ را به آمونیوم تبدیل می‌کنند، نیترات‌ساز آن را به نیترات می‌رساند و باکتری‌های نیترات‌زدا دوباره گاز می‌سازند. فسفر از سنگ‌ها وارد چرخه می‌شود. مصرف زیاد کود باعث یوتریفیکاسیون و مرگ آبزیان می‌شود.\",k:[\"سوخت فسیلی چرخه‌ی کربن را به هم می‌زند\",\"باکتری‌ها در چرخه‌ی نیتروژن اساسی‌اند\",\"کود اضافه آب را آلوده می‌کند\"],x:\"رشد انفجاری جلبک‌ها در دریاچه‌ها نتیجه‌ی ورود زیاد فسفات و نیترات است.\"},\n{m:\"رشد نمایی در حضور منابع فراوان رخ می‌دهد، اما منابع محدودند و جمعیت در نهایت به ظرفیت تحمل می‌رسد. عوامل وابسته به تراکم مانند رقابت و بیماری با شلوغی افزایش می‌یابند، و عوامل مستقل از تراکم مانند آتش‌سوزی یا سیل بر همه‌ی افراد اثر می‌گذارند. جمعیت انسان از میلیارد اول تا هشتم، با فناوری و کشاورزی بسیار سریع رشد کرده است.\",k:[\"ظرفیت تحمل سقف جمعیت است\",\"شکارچی و طعمه نوسان‌های دوره‌ای دارند\",\"رشد نمایی در منابع محدود پایدار نیست\"],x:\"جمعیت خرگوش و سیاه‌گوش در شمال کانادا نوسان‌های هماهنگ دارند.\"},\n{m:\"جنگل‌های بارانی گرم و پربارانند و بیشترین تنوع را دارند، بیابان‌ها بارش کم و گونه‌های سازگار دارند، تایگا جنگل سوزنی‌برگ سرد است، تندرا یخ‌زده و بدون درخت است و علفزارها میزبان گله‌های بزرگ چراکننده‌اند. آب‌های شیرین شامل رودخانه و دریاچه و تالاب‌اند و دریاها شامل صخره‌ی مرجانی تا ژرفای تاریک. تالاب‌ها فیلتر طبیعی آب‌اند و سیل را کم می‌کنند.\",k:[\"اقلیم نوع زیست‌بوم را می‌سازد\",\"مرجان‌ها تنوع آبی بالایی دارند\",\"تالاب‌ها بسیار ارزشمندند\"],x:\"تالاب انزلی و هورالعظیم از تالاب‌های ارزشمند منطقه‌ی ما هستند.\"},\n{m:\"CO₂، متان و بخار آب گازهای گلخانه‌ای هستند که گرما را در جو نگه می‌دارند. فعالیت انسان این گازها را زیاد کرده و میانگین دمای زمین بالا رفته است. پیامدها شامل ذوب یخچال‌ها، بالا آمدن آب دریاها، خشکسالی و سیل، سفیدشدگی مرجان‌ها و جابه‌جایی زیستگاه گونه‌هاست. راه‌حل‌ها: انرژی خورشیدی و بادی، بهره‌وری انرژی، جنگل‌کاری و حفاظت از تالاب‌ها.\",k:[\"گرمایش جهانی علت انسانی دارد\",\"اسیدی‌شدن اقیانوس‌ها به مرجان‌ها آسیب می‌زند\",\"کاهش مصرف و بازیافت ضروری است\"],x:\"درخت‌کاری و حفاظت از جنگل‌ها، کربن را در درازمدت ذخیره می‌کند.\"}],\n\nbio:[\n{m:\"در مهندسی ژنتیک، آنزیم برشی DNA را در جایگاه ویژه‌ای می‌برد، قطعه‌ی ژن مورد نظر به پلاسمید متصل می‌شود (DNA نوترکیب) و آنزیم لیگاز آن‌ها را می‌چسباند. پلاسمید به باکتری وارد می‌شود و باکتری ژن را بیان می‌کند. محصولاتی مانند انسولین، هورمون رشد و واکسن هپاتیت B به این شیوه ساخته می‌شوند. گیاهان تراریخته نیز با همین فناوری ساخته می‌شوند.\",k:[\"آنزیم‌های برشی قیچی مولکولی‌اند\",\"لیگاز چسب مولکولی است\",\"باکتری‌ها کارخانه‌ی دارو می‌شوند\"],x:\"پیش از این، انسولین را از لوزالمعده‌ی گاو و خوک استخراج می‌کردند.\"},\n{m:\"PCR با سه مرحله‌ی تکرارشونده کار می‌کند: واسرشت‌سازی در دمای بالا، اتصال آغازگر در دمای پایین‌تر و گسترش با DNA پلیمراز مقاوم به گرما. پس از ۳۰ چرخه میلیاردها نسخه به دست می‌آید. الکتروفورز ژل قطعات DNA را بر اساس اندازه جدا می‌کند و برای آزمایش‌های هویت و تشخیص بیماری به کار می‌رود. توالی‌یابی نسل جدید ژنوم کامل را در چند ساعت می‌خواند.\",k:[\"PCR نیاز به آغازگر دارد\",\"الکتروفورز قطعات را بر اساس اندازه جدا می‌کند\",\"اثر انگشت DNA هویت را مشخص می‌کند\"],x:\"تشخیص ویروس‌ها از نمونه‌ی بینی با PCR انجام می‌شود.\"},\n{m:\"سلول‌های بنیادی جنینی می‌توانند به همه‌ی سلول‌ها تبدیل شوند، و سلول‌های بنیادی بزرگسالان مانند مغز استخوان فقط چند نوع. در سال ۲۰۰۶ دانشمندان توانستند سلول‌های پوست را به سلول‌های پرتوان القایی (iPS) بازبرنامه‌ریزی کنند، که بدون نابودی جنین به دست می‌آیند. کاربردها: پیوند مغز استخوان برای سرطان خون، ترمیم پوست سوخته و مدل‌سازی بیماری در آزمایشگاه. کلونینگ تولید جانداری هم‌ژن با جاندار دیگر است، مانند میش دالی.\",k:[\"iPS بدون جنین ساخته می‌شود\",\"پیوند مغز استخوان از سلول‌های بنیادی است\",\"کلونینگ هسته را به تخمک بدون هسته می‌برد\"],x:\"میش دالی نخستین پستاندار کلون‌شده از سلول بالغ بود (۱۹۹۶).\"},\n{m:\"بیوانفورماتیک با الگوریتم‌ها توالی‌ها را مقایسه می‌کند. با ابزارهایی مانند BLAST می‌توان یک توالی ناشناخته را با پایگاه داده‌ی جهانی مقایسه کرد. پیش‌بینی ساختار پروتئین با هوش مصنوعی (مانند آلفافولد) یکی از بزرگ‌ترین پیشرفت‌های اخیر است و طراحی دارو را سریع‌تر کرده است. تحلیل داده‌های ژنوم، سلامت شخصی‌شده و شناخت بیماری‌ها را ممکن می‌کند.\",k:[\"بیوانفورماتیک زیست و رایانه است\",\"پایگاه‌های داده‌ی عمومی در دسترس‌اند\",\"هوش مصنوعی شکل پروتئین‌ها را حدس می‌زند\"],x:\"پروژه‌ی ژنوم انسان ۱۳ سال طول کشید؛ امروز چند ساعت.\"},\n{m:\"گیاهان تراریخته مقاوم به آفت یا خشکی، برنج غنی از ویتامین و گندم مقاوم به خشکی ساخته شده‌اند. در صنعت، تخمیر برای تولید نان، ماست، آنزیم و دارو به کار می‌رود. بیوگاز و بیواتانول سوخت‌های زیستی هستند و زیست‌پالایی از میکروب‌ها برای پاکسازی نفت و فلزات سنگین بهره می‌برد. نگرانی‌های اخلاقی و زیست‌محیطی باید با پژوهش و قانون مدیریت شود.\",k:[\"تراریخته‌ها ژن بیگانه دارند\",\"تخمیر در صنایع غذا و دارو مهم است\",\"زیست‌پالایی آلودگی را با میکروب پاک می‌کند\"],x:\"برای ساخت پنیر، آنزیم رنت نوترکیب تولیدشده در باکتری‌ها جایگزین رنت گوساله شد.\"},\n{m:\"روش علمی با مشاهده و پرسش شروع می‌شود، سپس فرضیه‌ی آزمون‌پذیر طرح می‌شود. در آزمایش، یک متغیر مستقل تغییر می‌کند و متغیر وابسته اندازه‌گیری می‌شود و بقیه عوامل ثابت می‌مانند. گروه شاهد برای مقایسه ضروری است. داده‌ها آماری تحلیل می‌شوند و نتایج برای داوری همتایان منتشر می‌شود. میکروسکوپ نوری تا ۱۰۰۰ برابر و الکترونی تا میلیون‌ها برابر بزرگ می‌کند.\",k:[\"فرضیه باید قابل ابطال باشد\",\"تکرارپذیری پایه‌ی اعتبار است\",\"میکروسکوپ الکترونی ساختارهای ریزتر را نشان می‌دهد\"],x:\"لوئی پاستور با آزمایش فلاسک گردن‌قوی، پیدایش خودبه‌خودی میکروب‌ها را رد کرد.\"}]\n};\n\nvar S={\nmol:[\n[\"زاویه‌ی پیوند H–O–H حدود ۱۰۴٫۵ درجه است و هر مولکول آب می‌تواند تا چهار پیوند هیدروژنی بسازد (دو به عنوان دهنده و دو به عنوان گیرنده). انرژی هر پیوند هیدروژنی حدود ۲۰ کیلوژول بر مول است، یعنی حدود یک‌بیستم پیوند کووالانسی O–H، اما تعداد زیاد آن‌ها گرمای تبخیر بسیار بالای آب (حدود ۴۰٫۷ کیلوژول بر مول) و گرمای ویژه‌ی ۴٫۱۸ ژول بر گرم‌درجه را می‌سازد. ثابت دی‌الکتریک حدود ۸۰ باعث می‌شود جاذبه‌ی بین یون‌ها در آب ضعیف شود و نمک‌ها حل شوند.\",\"اثر آب‌گریزی نیروی اصلی تاخوردگی پروتئین‌ها و تشکیل غشاست: گروه‌های ناقطبی آب را مجبور به نظم‌گرفتن می‌کنند و کنار هم قرار گرفتن آن‌ها آنتروپی آب آزادشده را بالا می‌برد. آب خالص به مقدار ۱۰⁻⁷ مول بر لیتر یون H⁺ دارد (Kw = ۱۰⁻¹⁴) و خون با سامانه‌ی بافر بی‌کربنات (H₂CO₃/HCO₃⁻) pH را در بازه‌ی ۷٫۳۵ تا ۷٫۴۵ نگه می‌دارد. در آوند چوبی، طبق نظریه‌ی چسبندگی-کشش، ستون آب می‌تواند تحت فشار منفی چند مگاپاسکال بالا برود.\"],\n[\"در آمیلوز، گلوکزها با پیوند α(1→4) خطی و مارپیچی به هم متصل‌اند. آمیلوپکتین هر ۲۴ تا ۳۰ واحد یک شاخه‌ی α(1→6) دارد و گلیکوژن پرشاخه‌تر است (هر ۸ تا ۱۲ واحد)، که امکان آزادسازی هم‌زمان گلوکز از انتهاهای متعدد را می‌دهد. در سلولز واحدها با پیوند β(1→4) وصل‌اند و هر واحد نسبت به همسایه‌اش ۱۸۰ درجه می‌چرخد، پس زنجیره‌ها کاملاً صاف و با پیوند هیدروژنی بین‌زنجیره‌ای به ریزرشته‌های بسیار مقاوم تبدیل می‌شوند.\",\"گلوکز در محلول به شکل حلقه‌ی پیرانوزی با آنومرهای α و β وجود دارد. ورود گلوکز به سلول با ناقل‌های GLUT انجام می‌شود: GLUT1 در بیشتر بافت‌ها، GLUT2 در کبد و پانکراس، و GLUT4 در عضله و بافت چربی که با انسولین به غشا می‌رود. لاکتوز از گالاکتوز و گلوکز با پیوند β(1→4) ساخته شده و تجزیه‌ی آن به آنزیم لاکتاز نیاز دارد. قندهای متصل به پروتئین‌ها و لیپیدها (گلیکوزیلاسیون) در تشخیص سلولی، مانند سامانه‌ی گروه‌های خونی، نقش دارند.\"],\n[\"اسیدهای چرب سیرنشده با پیوند دوگانه‌ی سیس خمیدگی ایجاد می‌کنند و نقطه‌ی ذوب را پایین می‌آورند؛ به همین دلیل روغن‌ها در دمای اتاق مایع‌اند. امگا-۳ (آلفا-لینولنیک، EPA و DHA) و امگا-۶ اسیدهای چرب ضروری‌اند که بدن نمی‌تواند بسازد. سوختن کامل یک مولکول پالمیتات (۱۶ کربن) حدود ۱۰۶ ATP می‌دهد و انرژی هر گرم چربی حدود ۹ کیلوکالری است، در برابر ۴ کیلوکالری برای قند و پروتئین.\",\"در غشا، فسفاتیدیل‌کولین و فسفاتیدیل‌اتانول‌آمین فراوان‌ترند و فسفاتیدیل‌سرین به طور عادی در لایه‌ی داخلی است؛ خارج شدن آن به لایه‌ی بیرونی علامت مرگ برنامه‌ریزی‌شده (آپوپتوز) برای بیگانه‌خوارهاست. کلسترول ۲۰ تا ۳۰ درصد مولی لیپیدهای غشای جانوری را می‌سازد و در دمای بالا از سیالیت زیاد و در دمای پایین از سفت‌شدن جلوگیری می‌کند. کلسترول در خون درون لیپوپروتئین‌ها حمل می‌شود: LDL آن را به بافت‌ها و HDL به کبد برمی‌گرداند.\"],\n[\"پیوند پپتیدی بخشی از ویژگی پیوند دوگانه دارد و مسطح است؛ چرخش آزاد فقط در زوایای φ و ψ کنار کربن آلفا رخ می‌دهد و نمودار راماچاندران زوایای مجاز را نشان می‌دهد. مارپیچ α دارای ۳٫۶ آمینواسید در هر دور و گام ۰٫۵۴ نانومتر است و پیوند هیدروژنی بین C=O آمینواسید i و N–H آمینواسید i+4 آن را پایدار می‌کند. صفحه‌ی β از رشته‌های موازی یا پادموازی ساخته می‌شود. ساختار سوم با اثر آب‌گریزی، پیوند یونی، هیدروژنی و پل دی‌سولفیدی (بین سیستئین‌ها) نگه داشته می‌شود.\",\"چاپرون‌ها مانند HSP70 و چاپرونین GroEL در تاخوردگی درست کمک می‌کنند و تاخوردگی نادرست به بیماری‌هایی مانند آلزایمر و بیماری‌های پریونی می‌انجامد. در هموگلوبین (α₂β₂) اتصال O₂ به یک زیرواحد اتصال به دیگران را آسان‌تر می‌کند (هم‌کاری مثبت) و اثر بور نشان می‌دهد در pH پایین‌تر و CO₂ بالاتر اکسیژن آسان‌تر آزاد می‌شود. جایگزینی گلوتامات با والین در موقعیت ۶ زنجیره‌ی β باعث هموگلوبین S و کم‌خونی داسی‌شکل می‌شود. کلاژن از سه زنجیره‌ی مارپیچ با تکرار Gly–X–Y ساخته شده است.\"],\n[\"نوکلئوزید شامل باز و قند است و با افزودن فسفات به نوکلئوتید تبدیل می‌شود. نوکلئوتیدها با پیوند فسفودی‌استر بین کربن ۳' یک قند و ۵' قند بعدی به هم می‌رسند، پس هر رشته جهت ۵' به ۳' دارد. A و G پورین (دو حلقه) و C، T و U پیریمیدین (یک حلقه) هستند. قانون چارگاف می‌گوید در DNA دو‌رشته‌ای A=T و G=C است. B-DNA رایج‌ترین شکل است: ۱۰٫۵ جفت باز در هر دور، گام ۳٫۴ نانومتر و قطر ۲ نانومتر.\",\"گروه ۲'-هیدروکسیل در ریبوز RNA را نسبت به آبکافت ناپایدارتر می‌کند و این یکی از دلایل پایداری بیشتر DNA است. RNAها انواع متنوعی دارند: mRNA، tRNA (حدود ۷۶ نوکلئوتید)، rRNA که هسته‌ی کاتالیزوری ریبوزوم است (یک ریبوزیم)، miRNA که بیان ژن را خاموش می‌کند و RNAهای بلند غیررمزکننده. ATP هنگام آبکافت به ADP در شرایط استاندارد حدود ۳۰٫۵ کیلوژول بر مول آزاد می‌کند و در شرایط سلول تا ۵۰ کیلوژول. همچنین NAD و FAD و کوآنزیم A ساختار نوکلئوتیدی دارند.\"],\n[\"معادله‌ی میکائیلیس-منتن v = Vmax[S]/(Km+[S]) سرعت واکنش را شرح می‌دهد؛ Km غلظت پیش‌ماده‌ای است که سرعت نصف Vmax شود و هرچه کمتر باشد میل ترکیبی بیشتر است. بازدارنده‌ی رقابتی Km را زیاد می‌کند ولی Vmax ثابت می‌ماند و بازدارنده‌ی غیررقابتی Vmax را کم می‌کند. مدل «جور شدن القایی» (کوشلند) می‌گوید جایگاه فعال هنگام اتصال تغییر شکل می‌دهد. آنزیم کاتالاز تا ۱۰⁷ واکنش در ثانیه انجام می‌دهد و برخی آنزیم‌ها سرعت را تا ۱۰¹⁷ برابر می‌کنند.\",\"آنزیم‌ها در هفت رده‌اند: اکسیدوردوکتازها، ترانسفرازها، هیدرولازها، لیازها، ایزومرازها، لیگازها و ترانسلوکازها (جابه‌جاکننده‌ها). بسیاری به کوفاکتور (یون‌هایی مانند Mg²⁺ و Zn²⁺) یا کوآنزیم (مشتقات ویتامین‌ها مانند NAD⁺ از نیاسین) نیاز دارند. تنظیم آلوستریک یعنی اتصال مولکول در جایی غیر از جایگاه فعال؛ مثلاً فسفوفروکتوکیناز-۱ در گلیکولیز با ATP و سیترات مهار و با AMP فعال می‌شود. بازدارندگی پسخوردی مسیر را متناسب با نیاز سلول خاموش می‌کند. بسیاری از آنزیم‌های گوارشی به صورت زیموژن (مثل پپسینوژن) ساخته می‌شوند تا خود سلول را هضم نکنند.\"]],\n\ncell:[\n[\"ریبوزوم پیش‌هسته‌ای ۷۰S است (زیرواحدهای ۵۰S و ۳۰S) و ریبوزوم یوکاریوتی ۸۰S (۶۰S و ۴۰S)؛ این تفاوت اساس کار بسیاری از آنتی‌بیوتیک‌هاست که ریبوزوم باکتری را هدف می‌گیرند. توالی ژن ۱۶S rRNA برای رده‌بندی باکتری‌ها به کار می‌رود. دیواره‌ی باکتری از پپتیدوگلیکان (زنجیره‌های N-استیل‌گلوکزآمین و N-استیل‌مورامیک‌اسید با پیوند عرضی پپتیدی) ساخته می‌شود و پنی‌سیلین سنتز همین پیوندها را مهار می‌کند. غشای آرکی‌ها لیپیدهای اتری دارد، نه استری.\",\"نظریه‌ی درون‌همزیستی (لین مارگولیس) می‌گوید میتوکندری از آلفا-پروتئوباکتری و کلروپلاست از سیانوباکتری آمده است. شواهد: دو غشا، DNA حلقوی، ریبوزوم ۷۰S و تقسیم دوتایی. نسبت سطح به حجم محدودیت اندازه‌ی سلول را تعیین می‌کند: وقتی سلول بزرگ‌تر شود، حجم سریع‌تر از سطح زیاد می‌شود و تبادل مواد دشوار می‌شود، پس سلول‌های هسته‌دار با غشاهای درونی سطح را افزایش می‌دهند.\"],\n[\"پوشش هسته دو غشا دارد و منفذهای هسته‌ای (مجموعه‌هایی با جرم حدود ۱۲۰ مگادالتون و حدود ۳۰ نوع نوکلئوپورین) انتقال انتخابی را کنترل می‌کنند. هستک جایگاه رونویسی rRNA توسط RNA پلیمراز I و مونتاژ زیرواحدهای ریبوزوم است. ژنوم میتوکندری انسان ۱۶٬۵۶۹ جفت باز و ۳۷ ژن دارد و تقریباً کاملاً از مادر ارث می‌رسد. غشای درونی میتوکندری چین‌خورده (کریستا) است تا سطح زنجیره‌ی انتقال الکترون زیاد شود.\",\"پروتئین‌هایی که باید ترشح شوند توسط توالی نشانه (پپتید نشانه) و ذره‌ی شناسایی سیگنال (SRP) به شبکه‌ی آندوپلاسمی زبر هدایت می‌شوند. در دستگاه گلژی از وجه cis تا trans تغییراتی مانند گلیکوزیلاسیون و برچسب‌گذاری برای مقصد انجام می‌شود. لیزوزوم‌ها با pH حدود ۴٫۵ تا ۵ حاوی بیش از ۵۰ هیدرولاز اسیدی‌اند؛ نقص آن‌ها بیماری‌های ذخیره‌ی لیزوزومی ایجاد می‌کند. اسکلت سلولی شامل ریزرشته‌های اکتین (قطر ۷ نانومتر)، رشته‌های میانی (۸ تا ۱۲) و ریزلوله‌های توبولین (۲۵ نانومتر) است و پروتئین‌های موتور کینزین و داینئین بار را روی آن‌ها جابه‌جا می‌کنند.\"],\n[\"مدل موزاییک سیال را سینگر و نیکلسون در ۱۹۷۲ پیشنهاد کردند. ضخامت غشا حدود ۷ تا ۸ نانومتر است و لیپیدها در صفحه‌ی غشا به آسانی جابه‌جا می‌شوند، اما جابه‌جایی از یک لایه به لایه‌ی دیگر (فلیپ‌فلاپ) کند است و آنزیم‌های فلیپاز آن را تنظیم می‌کنند. در غشاهای جانوری میکرودومین‌هایی به نام قایق‌های لیپیدی غنی از کلسترول وجود دارد که پروتئین‌های پیام‌رسانی را متمرکز می‌کنند. در سطح بیرونی لایه‌ای از کربوهیدرات (گلیکوکالیکس) قرار دارد.\",\"گیرنده‌های جفت‌شونده با پروتئین G (GPCR) با اتصال لیگاند، پروتئین G را فعال می‌کنند و پیک ثانویه‌ای مانند cAMP یا IP₃ تولید می‌شود که آبشار پیام را تقویت می‌کند. گیرنده‌های تیروزین‌کینازی با فسفریله‌شدن خود پیام رشد را منتقل می‌کنند. اتصالات سلولی سه نوع‌اند: محکم (مانع نشت)، دسموزوم (استحکام مکانیکی) و شکافی (کانال‌های اتصال‌دهنده یا کونکسون که یون‌ها را بین سلول‌ها جابه‌جا می‌کنند و در قلب هماهنگی انقباض را می‌دهند). پتانسیل استراحت نورون حدود منفی ۷۰ میلی‌ولت است.\"],\n[\"انتشار از قانون فیک پیروی می‌کند و سرعت آن با شیب غلظت و مساحت سطح متناسب است. آکوآپورین‌ها (AQP) کانال‌های آب‌اند و یک کانال می‌تواند حدود سه میلیارد مولکول آب در ثانیه عبور دهد. پمپ Na⁺/K⁺-ATPase در هر چرخه ۳ یون سدیم را بیرون و ۲ یون پتاسیم را داخل می‌برد و حدود ۲۰ تا ۲۵ درصد ATP سلول در حالت استراحت (و تا ۷۰ درصد در نورون‌ها) را مصرف می‌کند. در انتقال فعال ثانویه، مانند ناقل SGLT1 در روده، گلوکز با کمک شیب سدیم وارد می‌شود.\",\"فشار اسمزی از رابطه‌ی π = iMRT به دست می‌آید. سلول در محلول هم‌فشار (ایزوتونیک) تغییر حجم نمی‌دهد، در هیپوتونیک آب جذب می‌کند و در هیپرتونیک چروکیده (پلاسمولیز در گیاهان) می‌شود. اندوسیتوز با کمک کلاترین رایج‌ترین راه ورود لیگاندهایی مانند LDL با گیرنده‌ی LDL است. اگزوسیتوز آنزیم‌ها و ناقل‌های عصبی به پروتئین‌های SNARE بستگی دارد که وزیکول را با غشا همجوش می‌کنند؛ سم بوتولینوم همین پروتئین‌ها را می‌شکند.\"],\n[\"گلیکولیز ۱۰ مرحله دارد و سود خالص آن ۲ ATP و ۲ NADH است؛ مرحله‌ی کلیدی کنترل آن آنزیم PFK-1 است. پیرووات با کمپلکس پیرووات دهیدروژناز به استیل‌کوآ تبدیل می‌شود. در چرخه‌ی کربس به ازای هر گلوکز ۶ NADH و ۲ FADH₂ و ۲ GTP حاصل می‌شود. کمپلکس‌های I تا IV در غشای درونی میتوکندری الکترون را به O₂ می‌رسانند و کمپلکس‌های I، III و IV پروتون‌ها را پمپ می‌کنند؛ طبق نظریه‌ی شیمی‌اسمزی پیتر میچل، ATP سنتاز (F₀F₁) از جریان پروتون‌ها ATP می‌سازد. به طور تقریبی ۲٫۵ ATP برای هر NADH و ۱٫۵ برای هر FADH₂ به دست می‌آید و حاصل کل حدود ۳۰ تا ۳۲ ATP است.\",\"در فتوسنتز، فتوسیستم II (P680) آب را می‌شکافد (مجموعه‌ی تولید اکسیژن با خوشه‌ی Mn₄CaO₅) و الکترون‌ها در زنجیره‌ی Z از PSII به PSI (P700) می‌روند و NADPH تولید می‌شود. در چرخه‌ی کالوین، روبیسکو CO₂ را به ریبولوز بیس‌فسفات می‌چسباند و دو مولکول ۳-فسفوگلیسرات پدید می‌آید؛ برای ساخت یک G3P سه CO₂، ۹ ATP و ۶ NADPH لازم است. روبیسکو با O₂ نیز واکنش می‌دهد (فتوتنفس) که کارایی را کم می‌کند و گیاهان C4 و CAM راهکارهایی برای کاهش آن دارند.\"],\n[\"چرخه‌ی سلولی را کمپلکس‌های سیکلین و کیناز وابسته به سیکلین (CDK) کنترل می‌کنند. نقطه‌ی وارسی G1/S (نقطه‌ی محدودیت) با آزادشدن فاکتور E2F از پروتئین Rb باز می‌شود و پروتئین p53 در صورت آسیب DNA چرخه را متوقف یا آپوپتوز را آغاز می‌کند. در G2/M، کمپلکس CDK1-سیکلین B (MPF) ورود به میتوز را فرمان می‌دهد. نقطه‌ی وارسی دوک مانع آنافاز می‌شود تا همه‌ی کروموزوم‌ها به ریزلوله‌ها وصل شوند. در آنافاز، آنزیم سپاراز پروتئین کوهزین را می‌برد و کروماتیدهای خواهر جدا می‌شوند.\",\"سیتوکینز در سلول جانوری با حلقه‌ی انقباضی اکتین-میوزین و در گیاه با ساخت صفحه‌ی سلولی انجام می‌شود. در پروفاز I میوز، همتاها جفت می‌شوند (سیناپس) و کیاسما در محل کراسینگ‌اور پدید می‌آید؛ جدا نشدن کروموزوم‌ها (ناجدایی) می‌تواند به تریزومی ۲۱ (سندرم داون) منجر شود. ژن‌های سرطان‌زا (انکوژن، مانند RAS) با جهش افزایش عملکرد و ژن‌های سرکوبگر تومور (مانند p53 و RB) با کاهش عملکرد به سرطان می‌انجامند. سلول‌های طبیعی انسان معمولاً حدود ۵۰ بار تقسیم می‌شوند (حد هی‌فلیک) چون تلومرها کوتاه می‌شوند؛ آنزیم تلومراز در سلول‌های بنیادی و سرطانی فعال است.\"]],\n\ngen:[\n[\"واتسون و کریک مدل خود را در ۱۹۵۳ بر پایه‌ی پراش پرتو X (عکس ۵۱ روزالیند فرانکلین) ارائه کردند. شیار بزرگ و شیار کوچک در سطح مارپیچ جایگاه اتصال پروتئین‌های تنظیمی‌اند. در یوکاریوت‌ها ۱۴۷ جفت باز DNA دور یک هسته‌ی هشت‌تایی هیستون (H2A, H2B, H3, H4 هر کدام دو نسخه) می‌پیچد و نوکلئوزوم می‌سازد؛ رشته‌ی ۱۱ نانومتری با هیستون H1 به رشته‌ی ۳۰ نانومتری و سپس حلقه‌ها و کروموزوم فشرده می‌شود.\",\"یوکروماتین کمتر فشرده و فعال و هتروکروماتین بسیار فشرده و خاموش است. استیلاسیون هیستون بار مثبت آن را کم و DNA را در دسترس می‌کند و متیلاسیون برخی آمینواسیدها خاموشی می‌آورد. ژنوم هاپلوئید انسان حدود ۳ میلیارد جفت باز و حدود ۲۰ هزار ژن رمزکننده‌ی پروتئین دارد و کمتر از ۲ درصد آن اگزون است؛ بقیه شامل اینترون، توالی‌های تنظیمی و تکرارهای فراوان (مانند ترانسپوزون‌ها) است.\"],\n[\"همانندسازی در باکتری از یک نقطه‌ی آغاز (oriC) و در یوکاریوت‌ها از هزاران نقطه‌ی آغاز شروع می‌شود. هلیکاز DNA را باز می‌کند، پروتئین‌های SSB رشته‌های باز را نگه می‌دارند و توپوایزومراز فشار پیچش را آزاد می‌کند. پرایماز آغازگر کوتاه RNA می‌سازد و DNA پلیمراز III (در باکتری) در جهت ۵'→۳' رشته‌ی پیشرو را پیوسته و رشته‌ی پیرو را به شکل قطعات اکازاکی (۱۰۰ تا ۲۰۰۰ نوکلئوتید) می‌سازد. DNA پلیمراز I آغازگرها را برمی‌دارد و لیگاز شکاف‌ها را می‌بندد.\",\"دقت کل همانندسازی حدود یک خطا در ۱۰⁹ تا ۱۰¹⁰ باز است که از سه سازوکار می‌آید: انتخاب درست نوکلئوتید، تصحیح‌خوانی ۳'→۵' توسط پلیمراز و ترمیم ناجور‌جفت‌ها. در انتهای کروموزوم‌های خطی، رشته‌ی پیرو نمی‌تواند کامل شود (مشکل انتها) و تلومرها (تکرار TTAGGG در انسان) کوتاه می‌شوند مگر آنکه تلومراز آن‌ها را بازسازی کند. میزان همانندسازی در باکتری حدود ۱۰۰۰ نوکلئوتید بر ثانیه و در یوکاریوت حدود ۵۰ است.\"],\n[\"در رونویسی باکتری، زیرواحد سیگما RNA پلیمراز را به راه‌انداز می‌رساند. در یوکاریوت‌ها فاکتورهای عمومی رونویسی و RNA پلیمراز II به جعبه‌ی TATA و راه‌انداز می‌چسبند و عناصر افزاینده از دور بیان را تقویت می‌کنند. mRNA یوکاریوتی پس از رونویسی کلاهک ۵' (۷-متیل‌گوانوزین)، دم پلی‌A و پیرایش دریافت می‌کند؛ اسپلایس‌زوم اینترون‌ها را حذف می‌کند و پیرایش جایگزین باعث می‌شود یک ژن چند پروتئین بسازد.\",\"در ترجمه، آمینواسیل‌tRNA سنتتاز هر آمینواسید را به tRNA درست می‌چسباند. ریبوزوم سه جایگاه A، P و E دارد. آغاز با رمزه‌ی AUG (متیونین) و پایان با یکی از رمزه‌های UAA، UAG و UGA است که آمینواسید ندارند. کد ژنتیک افزونگی دارد (۶۴ رمزه برای ۲۰ آمینواسید) و چون بیشتر تفاوت در باز سوم است، بسیاری از جهش‌های نقطه‌ای خاموش‌اند. در باکتری رو
