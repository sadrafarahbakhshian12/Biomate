ries the gene into the host.\"},\n{q:\"What is a control group for?\",o:[\"Comparing the result\",\"Decoration\",\"Cutting costs\",\"Adding a variable\"],a:0,e:\"To isolate the effect of the independent variable.\"}]}\n];\n\nvar X={mol:[\n{m:\"Each water molecule has one oxygen atom and two hydrogen atoms. Oxygen pulls the shared electrons toward itself, so the oxygen end is slightly negative and the hydrogen ends are slightly positive. This polarity lets water molecules stick together through hydrogen bonds and dissolve salts and sugars. Water stays liquid over a useful range of temperatures, and ice is less dense than liquid water, so lakes freeze from the surface down and organisms beneath the ice survive.\",k:[\"Water’s polarity makes it a powerful solvent\",\"Cohesion and adhesion let water rise through plants as xylem sap\",\"High specific heat prevents sharp swings in body temperature\"],x:\"Sweating cools the body because evaporating water carries a large amount of heat away from the skin.\"},\n{m:\"Carbohydrates are made of carbon, hydrogen, and oxygen. Monosaccharides such as glucose and fructose are the smallest units, and two monosaccharides joined by a glycosidic bond form a disaccharide. Polysaccharides are long chains of glucose, but the way the units are linked changes their function: starch and glycogen store energy, while cellulose is purely structural and most animals cannot digest it.\",k:[\"Glucose is the main fuel of cells\",\"Plants store starch and animals store glycogen\",\"Cellulose is the most abundant organic compound on Earth\"],x:\"Bread and rice contain starch; the enzyme amylase in your mouth gradually turns it sweet.\"},\n{m:\"Lipids are a diverse group, most of which do not dissolve in water. A triglyceride is built from one glycerol and three fatty acids, and it stores more than twice as much energy per gram as sugar. A phospholipid has one hydrophilic head and two hydrophobic tails; in water it spontaneously forms a bilayer, the foundation of every cell membrane. Steroids have fused rings, and cholesterol, sex hormones, and vitamin D belong to this group.\",k:[\"Phospholipids form the membrane bilayer\",\"Fats provide insulation and store energy\",\"Cholesterol regulates membrane fluidity\"],x:\"A polar bear’s fat layer is both an energy store and insulation against extreme cold.\"},\n{m:\"The diversity of proteins comes from the order of their amino acids. The primary structure is the sequence itself, the secondary structure is the alpha helix and beta sheet, the tertiary structure is the complete folding of the chain, and the quaternary structure is the assembly of several chains. Changing a single amino acid can sometimes alter the whole shape, as in sickle cell disease. Heat or extreme pH denatures a protein, which is what happens when an egg is cooked.\",k:[\"A protein’s 3D structure determines its function\",\"Hemoglobin has four chains and carries oxygen\",\"Denaturation means loss of shape and function\"],x:\"Egg white turns white when cooked because its proteins denature and stick together.\"},\n{m:\"Each nucleotide consists of a sugar, a phosphate, and an organic base. In DNA the sugar is deoxyribose and the bases are A, T, G, and C; in RNA the sugar is ribose and U replaces T. DNA is double-stranded and stable, which suits it for preserving information, while RNA is usually single-stranded and acts as a messenger and worker. The ATP molecule consists of adenine, ribose, and three phosphates, and removing the last phosphate releases energy.\",k:[\"In DNA, A pairs with T and G pairs with C\",\"Types of RNA: messenger, transfer, and ribosomal\",\"ATP is the energy currency of all cells\"],x:\"Every muscle cell uses millions of ATP molecules per second and regenerates them again and again.\"},\n{m:\"Enzymes are usually proteins, and each recognizes only one or a few specific substrates. The substrate binds at the active site, the enzyme changes shape slightly, and the reaction proceeds with less energy. At high temperature an enzyme denatures, and at an unsuitable pH its efficiency drops; a stomach enzyme works in acid, while a small-intestine enzyme works in an alkaline environment. Inhibitors can block the active site or change the enzyme’s shape.\",k:[\"Each enzyme is specific to a particular substrate\",\"Each has an optimal temperature and pH\",\"It is not used up and works again and again\"],x:\"Lactase breaks down milk sugar (lactose); people who make too little of it get an upset stomach from drinking milk (lactose intolerance).\"}\n],cell:[\n{m:\"In a prokaryotic cell the DNA lies freely in the cytoplasm, and there are no membrane-bound organelles, although ribosomes are present. These cells are usually 1–10 µm across. Eukaryotic cells are larger (10–100 µm) and separate their interior compartments with membranes, which allows opposing reactions to run at the same time. The endosymbiotic theory says that mitochondria and chloroplasts were once independent bacteria that moved inside a larger cell.\",k:[\"Bacteria have no nucleus but do have DNA\",\"Eukaryotes have membrane-bound organelles\",\"Mitochondria and chloroplasts have their own DNA and ribosomes\"],x:\"The bacterium Escherichia coli divides every 20 minutes, so it produces many generations in a single day.\"},\n{m:\"The cytoplasm consists of the semifluid material inside the cell, together with the organelles. The nucleus protects the genes and communicates with the cytoplasm through nuclear pores, and the nucleolus builds ribosomes. Rough endoplasmic reticulum has ribosomes and makes proteins, while smooth ER makes lipids. The Golgi apparatus packages and labels proteins. In plants, the vacuole stores water and generates the turgor pressure that keeps cells firm.\",k:[\"The nucleus is the cell’s control center\",\"Mitochondria are the cell’s power plants\",\"Lysosomes digest waste and particles\"],x:\"Cells that secrete digestive enzymes have a very extensive endoplasmic reticulum and Golgi apparatus.\"},\n{m:\"Because of its hydrophobic tails, the phospholipid bilayer of the membrane does not easily let polar molecules and ions through. Membrane proteins play many roles: channels, carriers, receptors, enzymes, and identity tags. On the outer surface, carbohydrates are attached to lipids and proteins, and cells recognize one another by these markers. The cell wall of plants, fungi, and bacteria lies outside the membrane and gives the cell strength and shape.\",k:[\"The membrane is selectively permeable\",\"Proteins act as carriers and receptors\",\"Cholesterol regulates membrane fluidity\"],x:\"The A, B, and O blood groups are due to different sugars on the surface of red blood cell membranes.\"},\n{m:\"In simple diffusion, molecules move from high to low concentration, and in facilitated diffusion this happens with the help of channel or carrier proteins. Osmosis is the movement of water from a more dilute solution to a more concentrated one. In active transport, the sodium-potassium pump moves three sodium ions out and two potassium ions in with each cycle, using ATP. This pump uses a large share of the energy of nerve cells and helps maintain the membrane potential stable.\",k:[\"Diffusion uses no energy\",\"Active transport requires ATP\",\"Endocytosis brings in large particles\"],x:\"If you put a red blood cell in distilled water, it takes up water by osmosis and bursts.\"},\n{m:\"Cellular respiration has four stages: glycolysis in the cytoplasm breaks glucose into pyruvate, pyruvate then enters the mitochondrion, the Krebs cycle produces electron carriers such as NADH, and in the electron transport chain oxygen is the final acceptor and ATP synthase makes the most ATP. Without oxygen, fermentation takes place, which yields far less energy. Photosynthesis likewise has two stages: the light reactions occur in the thylakoids and the Calvin cycle in the stroma.\",k:[\"Glycolysis is anaerobic and occurs in the cytoplasm\",\"Most ATP is made at the inner mitochondrial membrane\",\"Lactic acid fermentation occurs in muscle during intense exercise\"],x:\"Bread dough rises through yeast fermentation because CO₂ is produced.\"},\n{m:\"The cell cycle consists of the G1, S, G2, and M phases. DNA replication occurs in S phase, and in M phase the nucleus and then the cytoplasm divide. Mitosis proceeds in four stages: prophase, metaphase, anaphase, and telophase. In meiosis, homologous chromosomes exchange segments, producing new genetic combinations. Cancer occurs when the genes that control the cycle mutate and the cell divides without stopping.\",k:[\"Mitosis produces identical cells\",\"Meiosis produces gametes\",\"Mutations in control genes raise the risk of cancer\"],x:\"A skin wound heals in a few days because neighboring cells replace the lost ones by mitosis.\"}\n],gen:[\n{m:\"Watson and Crick proposed the double helix structure in 1953 with the help of Rosalind Franklin’s X-ray diffraction images. The backbone of each strand is sugar and phosphate, and the bases point inward. The two strands are antiparallel, meaning they run in opposite directions. In the nucleus, DNA wraps around histone proteins to form nucleosomes, and the chromatin then condenses further to fit within chromosomes.\",k:[\"A–T forms two hydrogen bonds and G–C forms three\",\"Histones package DNA\",\"A gene is a segment of DNA that codes for one product\"],x:\"Humans have 23 pairs of chromosomes, but maize has 10 pairs and dogs have 39.\"},\n{m:\"Replication begins at an origin, helicase unwinds the two strands, and primase builds a short primer. DNA polymerase can add nucleotides only to the 3’ end, so the leading strand is made continuously while the lagging strand is made in pieces (Okazaki fragments), which ligase stitches together. DNA polymerase can proofread and removes mistakes, so accuracy is high.\",k:[\"Replication is semiconservative\",\"The lagging strand is made in fragments\",\"Ligase joins the fragments\"],x:\"The DNA of each human cell is replicated in a few hours before the cell divides.\"},\n{m:\"In transcription, RNA polymerase binds to the gene’s promoter and builds an mRNA strand. In eukaryotes, the non-coding regions (introns) are cut out and the coding regions (exons) are joined together. In translation, a tRNA binds the mRNA codon with its anticodon and brings the matching amino acid. The ribosome links the amino acids with peptide bonds until it reaches a stop codon. The genetic code is nearly the same in all organisms.\",k:[\"In eukaryotes, transcription occurs in the nucleus and translation at the ribosome\",\"Each codon is three nucleotides\",\"AUG is the start codon\"],x:\"The human insulin gene can be put into bacteria, and the bacteria then make human insulin.\"},\n{m:\"Mendel studied traits such as flower color and seed shape in thousands of pea plants. The first-generation hybrids all resembled one parent (the dominant one), and in the second generation a 3:1 ratio appeared. He concluded that each individual has two hereditary factors that separate when gametes form. In a cross involving two traits at once, a 9:3:3:1 ratio is obtained, which shows that traits can be inherited independently of one another.\",k:[\"Genotype is an individual’s set of alleles and phenotype is its appearance\",\"A homozygote has two identical alleles and a heterozygote has two different alleles\",\"The Punnett square shows probabilities\"],x:\"If both parents are carriers of a recessive disease, each child has a 25% chance of being affected.\"},\n{m:\"In codominance both alleles are expressed, as in the AB blood group. In incomplete dominance the heterozygote is intermediate between the parents; a red four-o’clock flower crossed with a white one gives pink. Genes on the same chromosome are usually inherited together, and only crossing over separates them. X-linked traits such as color blindness and hemophilia are more common in males because they have only one X.\",k:[\"Multiple alleles means more than two alleles in the population\",\"X-linked genes are expressed in males even with a single recessive allele\",\"The environment also affects the expression of many traits\"],x:\"Human skin color is influenced by several genes and is not limited to one gene.\"},\n{m:\"Mutations can be base substitutions, insertions or deletions of bases, or chromosomal changes. Frameshift mutations (deletions or insertions) usually alter the protein drastically. Mutagens such as ultraviolet radiation and certain chemicals increase errors. Epigenetics is the study of changes that alter gene expression without changing the DNA sequence. CRISPR uses a guide RNA to bring the Cas9 enzyme to a gene’s location and cut it.\",k:[\"Mutation is the raw material of evolution\",\"Epigenetics affects gene expression without changing the sequence\",\"Gene editing raises ethical challenges\"],x:\"In sickle cell disease, a one-base mutation changes one amino acid of hemoglobin.\"}\n],mic:[\n{m:\"Bacteria have a cell wall of peptidoglycan and are divided into Gram-positive and Gram-negative groups by Gram staining. Many have flagella for movement, and some form endospores under harsh conditions. Bacteria can exchange plasmids through conjugation, which is one way drug resistance spreads. Cyanobacteria also carry out photosynthesis and produced a large part of Earth’s early oxygen.\",k:[\"Binary fission is rapid\",\"Plasmids carry resistance genes from cell to cell\",\"Most bacteria are harmless or beneficial\"],x:\"Yogurt and cheese are products of the activity of lactic acid bacteria.\"},\n{m:\"A virus has a protein capsid and a DNA or RNA genome, and some also have a lipid envelope. Its cycle includes attachment, entry, replication, assembly, and release. Bacteriophages infect bacteria. Retroviruses such as HIV use the enzyme reverse transcriptase to make DNA from RNA and insert it into the host genome. The rapid mutation of viruses is the reason a new influenza vaccine is needed every year.\",k:[\"Viruses are not cells\",\"Each virus has a specific host\",\"Antibiotics have no effect on them\"],x:\"Bacteriophages have even been tested for treating antibiotic-resistant infections.\"},\n{m:\"Fungi have a cell wall of chitin and form a network called a mycelium from hyphae. They are nature’s main decomposers, and some form symbiotic associations (mycorrhizae) with plant roots. Penicillin was obtained from the fungus Penicillium. Protists are a broad group of eukaryotes that are not plants, animals, or fungi; unicellular algae, amoebas, and Paramecium are examples.\",k:[\"Fungi are heterotrophs\",\"Mycorrhizae increase a plant’s uptake of water and minerals\",\"Plasmodium is transmitted by the Anopheles mosquito\"],x:\"Alexander Fleming discovered penicillin by accident in 1928.\"},\n{m:\"Skin and mucous membranes are physical barriers, and tears and saliva contain lysozyme, which breaks down bacterial cell walls. If a microbe gets through, macrophages and neutrophils engulf it (phagocytosis), and mast cells in the damaged tissue release histamine, which dilates blood vessels; the result is the redness, warmth, and swelling of inflammation. Interferon molecules prepare neighboring cells against viruses.\",k:[\"Innate immunity is nonspecific and fast\",\"Fever boosts defensive activity\",\"Inflammation is a sign of a defensive response\"],x:\"Pus is a collection of dead white blood cells and microbes.\"},\n{m:\"An antigen is a molecule that an antibody binds to. Antibodies are Y-shaped proteins with specific binding sites, and they can neutralize or tag a microbe. Helper T lymphocytes coordinate responses, and killer T cells destroy infected cells. The first response is slow, but on later exposure memory cells make the response fast and strong. Autoimmune diseases occur when the body attacks its own cells.\",k:[\"Antibodies are specific\",\"Immune memory is the basis of vaccines\",\"Allergy is an exaggerated response to a harmless antigen\"],x:\"After one infection, measles usually gives lifelong immunity.\"},\n{m:\"A vaccine introduces a weakened or killed pathogen, or a piece of it, so that the body builds memory. In an mRNA vaccine, the instructions for making one viral protein are delivered to the cell. When most people in a community are immune, the disease has difficulty spreading even to those who are unvaccinated (herd immunity). Unnecessary use of antibiotics selects for resistant bacteria and makes future treatment harder.\",k:[\"An antibiotic course must be completed\",\"A vaccine trains the body before disease\",\"Herd immunity protects vulnerable people\"],x:\"Smallpox was declared eradicated in 1980 through worldwide vaccination.\"}\n],plant:[\n{m:\"The root greatly increases its absorbing surface with root hairs. The stem contains both xylem and phloem, and in dicots the vascular bundles are arranged in a ring. The leaf consists of the epidermis, mesophyll, and vascular tissue, and stomata open and close by means of guard cells to regulate gas exchange and transpiration. Transpiration pulls water from the roots up to the leaves.\",k:[\"Xylem carries water and minerals upward\",\"Phloem distributes sugars\",\"Stomata control gas exchange and transpiration\"],x:\"A tree’s annual rings result from cambium activity in different seasons.\"},\n{m:\"The light reactions take place in the thylakoid membrane: chlorophyll absorbs light, water is split and O₂ is released, and ATP and NADPH are made. In the Calvin cycle (in the stroma), the enzyme rubisco fixes CO₂, and using ATP and NADPH the cycle builds a three-carbon sugar. Light intensity, CO₂ concentration, and temperature affect the rate of photosynthesis. C4 plants such as maize are more efficient in hot weather.\",k:[\"The light reactions occur in the thylakoid\",\"The Calvin cycle occurs in the stroma\",\"Rubisco is the most abundant enzyme on Earth\"],x:\"Marine algae and bacteria produce nearly half of Earth’s oxygen.\"},\n{m:\"Mosses have no vascular tissue, so they must live in moist places, and their reproduction requires water. Ferns have vascular tissue but no seeds and reproduce by spores. Gymnosperms such as pines have naked seeds and cones. Angiosperms have flowers and fruits, and the seed is protected inside the ovary. This feature gave them wide adaptability.\",k:[\"The plant life cycle involves alternation of generations\",\"The seed enabled spread on land\",\"Angiosperms are divided into monocots and dicots\"],x:\"Wheat and rice are monocots, while beans and peas are dicots.\"},\n{m:\"A flower consists of sepals, petals, stamens (the male organs), and a pistil (the female organ). A pollen grain lands on the stigma, and a pollen tube grows toward the ovule. One of the two sperm cells fertilizes the egg to form the zygote, and the other joins with two other nuclei to form the endosperm. The seed contains the embryo and a food reserve, and the fruit helps disperse it.\",k:[\"Pollination is carried out by insects, wind, or birds\",\"Double fertilization is unique to angiosperms\",\"The fruit develops from the ovary\"],x:\"The colors and scents of flowers attract bees, and broad petals serve as landing platforms for them.\"},\n{m:\"Auxin is made at the shoot tip and accumulates on the dark side, so that side grows more and the stem bends toward the light. Gibberellin stimulates stem elongation and seed germination. Cytokinin works with auxin in cell division. Abscisic acid closes the stomata during water shortage. Ethylene is a gas that ripens fruit and causes leaves to drop.\",k:[\"Auxin bends the stem toward light\",\"Abscisic acid is the stress hormone\",\"Hormones act in tiny amounts\"],x:\"A ripe banana next to a green apple ripens it faster by releasing ethylene.\"},\n{m:\"Cacti have turned their leaves into spines and have thick, fleshy stems. CAM plants such as cacti take up CO₂ at night so that less water is lost by transpiration during the day. Aquatic plants have air-filled tissue. Carnivorous plants growing in nitrogen-poor soil obtain nitrogen by trapping insects. Some plants live in symbiosis with Rhizobium bacteria and fix atmospheric nitrogen, as legumes do.\",k:[\"Adaptation is the result of natural selection\",\"Legumes enrich the soil\",\"Root symbiosis benefits both partners\"],x:\"Dodder is a parasitic plant that has little or no chlorophyll and takes its nutrients from its host.\"}\n],anim:[\n{m:\"Invertebrates make up most animal species. Sponges have no true tissues, cnidarians have radial symmetry and a simple digestive system, planarians are the first animals with bilateral symmetry, and annelids such as earthworms have a segmented body. Mollusks include snails, clams, and octopuses, and arthropods have an exoskeleton and jointed appendages. Echinoderms such as sea stars have radial symmetry as adults.\",k:[\"Arthropods are the largest phylum\",\"An exoskeleton requires molting\",\"Mollusks have a soft body and often a shell\"],x:\"An octopus has three hearts and blue blood and is one of the most intelligent invertebrates.\"},\n{m:\"In vertebrates, the backbone protects the spinal cord. Fish have gills and a two-chambered heart. Amphibians breathe with gills as larvae and with lungs as adults. Reptiles have dry skin and shelled eggs. Birds have feathers and light bones, and mammals have hair and nourish their young with milk. The hearts of birds and mammals are four-chambered.\",k:[\"Amphibians have moist skin\",\"Birds and mammals are warm-blooded\",\"Mammals have mammary glands\"],x:\"The bat is the only mammal capable of true flight.\"},\n{m:\"In external fertilization, gametes are released into the water, and in internal fertilization they unite inside the female’s body. Egg-layers develop the embryo inside an egg, and live-bearers develop it in the uterus. In the gastrula, the embryo forms three layers, the outer, middle, and inner, which give rise to the skin and nerves, the muscle and bone, and the digestive tube, respectively. In metamorphosis, as in a frog, the larval body changes into the adult form.\",k:[\"The gastrula is the basis of the three germ layers\",\"Metamorphosis occurs in insects and amphibians\",\"Parental care is greater in mammals\"],x:\"A butterfly has four stages: egg, larva, pupa, and adult.\"},\n{m:\"A camel stores fat in its hump and produces concentrated urine. Bats and dolphins “see” their surroundings by emitting sound and receiving the echo. Poisonous frogs advertise their danger with bright colors, and a chameleon changes its color. Hibernating bears and rodents reduce their metabolism and use their stored energy through the winter. All of these are the result of tens of millions of years of natural selection.\",k:[\"Camouflage protects against predators\",\"Warning coloration is bright\",\"An adaptation is a trait that is beneficial in the environment\"],x:\"Polar fish have antifreeze proteins in their blood.\"},\n{m:\"The nervous system of simple animals is a diffuse net. More complex animals have a nerve cord and ganglia. In vertebrates the brain is divided into parts such as the cerebrum, cerebellum, and brain stem. Sense organs send information to the brain as nerve impulses; eyes range from simple ones to the compound eyes of insects and the lens eyes of vertebrates. Relative brain size is related to learning ability.\",k:[\"Neurons are the messaging units\",\"Senses gather information\",\"The cerebrum is the center of thought and memory\"],x:\"The honeybee can see ultraviolet light, which the human eye cannot detect.\"},\n{m:\"Symbiosis is a close, long-term association between two different species. In mutualism both benefit, as with the bacteria in a cow’s rumen that digest cellulose. In commensalism one benefits and the other is unaffected. In parasitism one benefits and the other is harmed, as with fleas and ticks. Predation and competition are also important relationships and regulate the balance of populations.\",k:[\"Mutualism is beneficial to both\",\"A parasite usually does not kill its host\",\"Competition occurs over limited resources\"],x:\"Clownfish and sea anemones live together and protect each other.\"}\n]};\n\nObject.assign(X,{human:[\n{m:\"The heart pumps blood, and its valves keep the blood flowing in one direction. Oxygen-poor blood passes from the right atrium to the right ventricle and then to the lungs; oxygen-rich blood returns to the left atrium and left ventricle and is pumped to the body through the aorta. Blood consists of plasma, red blood cells, white blood cells, and platelets. Platelets take part in blood clotting. High blood pressure damages the heart and blood vessels.\",k:[\"Pulmonary circulation carries blood to the lungs\",\"Hemoglobin carries oxygen\",\"Platelets form clots\"],x:\"A single drop of blood contains millions of red blood cells.\"},\n{m:\"Air enters through the nose, where it is warmed, humidified, and filtered. During inhalation the diaphragm moves down, the chest expands, and the pressure in the lungs falls, so air flows in. In the alveoli, O₂ passes into the blood and CO₂ passes from the blood into the air. Most CO₂ is carried in the blood as bicarbonate. Smoking paralyzes the cilia of the airways and raises the risk of cancer.\",k:[\"The surface area of the alveoli is about 70 m²\",\"The respiratory centers are in the brainstem\",\"High CO₂ stimulates breathing\"],x:\"Intense exercise speeds up breathing because the CO₂ level in the blood rises.\"},\n{m:\"Mechanical and chemical digestion begin in the mouth: salivary amylase breaks down starch. In the stomach, hydrochloric acid and pepsin break down proteins. Bile breaks fats into tiny droplets, the pancreas releases powerful enzymes, and most absorption takes place in the small intestine, which has many villi. The large intestine absorbs water and salts and forms feces.\",k:[\"Bile is made in the liver and stored in the gallbladder\",\"Villi increase the surface area for absorption\",\"The microbiome aids digestion\"],x:\"The small intestine is several meters long, and food stays in it for several hours.\"},\n{m:\"A neuron is made up of a cell body, dendrites, and an axon. At rest, the inside of the neuron is negative relative to the outside. When a stimulus reaches threshold, sodium channels open and an action potential arises and travels along the axon. At the synapse, neurotransmitters such as dopamine and acetylcholine are released. The autonomic nervous system includes the sympathetic and parasympathetic divisions.\",k:[\"The action potential is all-or-none\",\"Myelin speeds up the signal\",\"A reflex is a fast response that does not involve the brain\"],x:\"Pulling your hand away from a hot object is a spinal reflex that happens before you are aware of it.\"},\n{m:\"Endocrine glands release hormones into the blood. The pituitary, the “master gland,” secretes hormones that regulate other glands. The thyroid regulates the metabolic rate, and iodine deficiency causes goiter. The pancreas makes insulin and glucagon, and in diabetes this balance is lost. Most hormones are regulated by negative feedback.\",k:[\"Hormones act more slowly and last longer than nerve signals\",\"Diabetes is a disorder of blood sugar\",\"Adrenaline prepares the body to react\"],x:\"When you are frightened, adrenaline raises your heart rate.\"},\n{m:\"Blood is filtered in the glomerulus of the kidney, and small substances enter Bowman’s capsule. Then, in the convoluted tubules, glucose and most of the water are reabsorbed, and waste products such as urea join the urine. Antidiuretic hormone (ADH) regulates how much water is reabsorbed. The kidneys also control blood pressure and pH. If the kidneys fail, dialysis or a transplant is needed.\",k:[\"Each nephron has one glomerulus\",\"Urea comes from the breakdown of protein\",\"ADH conserves water\"],x:\"Drinking too little water makes urine concentrated and dark.\"},\n{m:\"Bone is living tissue that is continually remodeled and stores calcium and phosphorus. At joints, bones are held together by ligaments, and muscles are attached to bones by tendons. Skeletal muscle is voluntary and smooth muscle is involuntary, while cardiac muscle has distinctive properties of its own. Contraction in the sarcomere occurs as actin slides over myosin, and it requires calcium ions and ATP.\",k:[\"Muscles work in opposing pairs\",\"Exercise makes bones stronger\",\"Vitamin D increases calcium absorption\"],x:\"The adult human body has more than 600 muscles and 206 bones.\"}\n],beh:[\n{m:\"Instincts are fixed action patterns triggered by a stimulus; ducklings follow the first moving object they see (imprinting, the work of Konrad Lorenz). In classical conditioning, a neutral stimulus is paired with a natural stimulus and comes to produce a response. In operant conditioning (Skinner), a behavior that is rewarded is repeated. Insight learning is also seen in chimpanzees.\",k:[\"Habituation is the simplest type of learning\",\"Reward reinforces behavior\",\"Imprinting occurs during a sensitive period\"],x:\"A dog salivates when it hears the sound of its food bowl.\"},\n{m:\"Communication can be auditory, visual, chemical, or tactile. Whales sing long-distance songs, fireflies attract mates with their light, and ants use pheromone trails to show nestmates the way to food. A worker bee tells the location of a food source with a round dance or a figure-eight (waggle) dance. Signals must be understandable to the receiver and must have an evolutionary benefit.\",k:[\"Pheromones are chemical messages\",\"Color and sound are used for finding mates and for warnings\",\"Communication makes cooperation possible\"],x:\"Birds give alarm calls when there is danger, and the group scatters quickly.\"},\n{m:\"Seasonal migrations are made to reach food or breeding sites. Swallows travel thousands of kilometers, and sea turtles return to the beach where they were born. They use the Sun, the stars, Earth’s magnetic field, and smell to navigate. An internal biological clock keeps the sleep–wake rhythm close to 24 hours and is adjusted by light.\",k:[\"Migration is often instinctive\",\"Hormones regulate the timing of migration\",\"Jet lag results from disruption of the biological clock\"],x:\"The Arctic tern migrates more than 70,000 km a year.\"},\n{m:\"In societies of social insects such as bees and termites, the queen reproduces while the workers are sterile and do the work. Such self-sacrifice can be explained by inclusive fitness: workers share genes with the queen and, by helping her, preserve their own genes. In mammals, herds help in hunting and protect against predators, and leadership and hierarchy provide order.\",k:[\"A colony has a division of labor\",\"Altruism is explained by shared genes\",\"Living in a group protects against predators\"],x:\"A single hive may contain tens of thousands of bees and one queen.\"},\n{m:\"In many species, females invest more in reproduction and are choosier, so males compete or put on displays to attract attention. Elaborate displays, such as the dance of a bird of paradise or the antlers of a deer, tell females about a male’s genetic health. Territoriality secures resources for breeding. Parental care in birds and mammals is costly but increases the survival of the young.\",k:[\"Sexual selection leads to showy traits\",\"A territory secures resources\",\"Caring for young increases fitness\"],x:\"Each year the male peacock grows his beautiful, heavy tail to attract a female.\"}\n],evo:[\n{m:\"Natural selection requires three conditions: variation in a population, heritability of that variation, and differences in reproduction. In populations facing predators or disease, individuals with a better trait survive more often and their genes become more common. A classic example is the peppered moth in England: after industrialization darkened the trees, the dark form became more common. Natural selection acts on the phenotype, but its result is a change in gene frequencies.\",k:[\"Selection acts on individuals, but populations evolve\",\"Adaptation to the environment means greater fitness\",\"Directional, stabilizing, and disruptive selection are its types\"],x:\"Antibiotic-resistant bacteria are a living example of natural selection.\"},\n{m:\"Fossils lie in sedimentary layers in order of age, and transitional species such as Archaeopteryx have both reptile and bird features. Homologous structures such as the human arm, the bat wing, and the whale flipper have a similar bone structure. Similarity in DNA sequences and proteins is also a precise measure of relatedness; humans and chimpanzees share about 98–99% of their DNA.\",k:[\"Fossils show age and history\",\"Homologous structures come from a common ancestor\",\"Molecules confirm relatedness\"],x:\"The fossil Tiktaalik is a transitional link between fish and tetrapods.\"},\n{m:\"Allopatric speciation occurs with geographic isolation, as with Darwin’s finches on the Galápagos Islands. Sympatric speciation occurs without geographic isolation and through polyploidy, especially in plants. Reproductive barriers include differences in mating time, behavior, gamete incompatibility, and hybrid sterility. When a species reaches many different environments, adaptive radiation occurs.\",k:[\"Geographic isolation cuts off gene flow\",\"The mule, a hybrid of horse and donkey, is sterile\",\"Adaptive radiation produces diverse species\"],x:\"The Galápagos finches have different beaks for different foods.\"},\n{m:\"Genetic drift is more common in small populations, as in the bottleneck effect or the founder effect. In a bottleneck, a population is suddenly reduced by a natural disaster and genetic diversity drops, as in cheetahs. The Hardy–Weinberg equilibrium conditions are a large population, random mating, and no mutation, migration, or selection; if any one is violated, evolution can occur. Its formula is p²+2pq+q²=1.\",k:[\"Drift is random\",\"Gene flow makes populations more alike\",\"Mutation creates new variation\"],x:\"On a remote island, a few early colonists determine the genes of the later population.\"},\n{m:\"Hominins split from a common ancestor with chimpanzees about 6 million years ago. Australopithecines walked on two legs and had small brains. Homo erectus used tools and fire and left Africa. Neanderthals lived in Europe and western Asia, and part of the genome of present-day non-African humans comes from them. Homo sapiens developed art, language, and a complex culture.\",k:[\"Walking upright came before brain enlargement\",\"Tool-making and fire were important\",\"Humans interbred with Neanderthals\"],x:\"Cave sites in Iran have yielded remains from the Neanderthal era.\"},\n{m:\"A phylogenetic tree is built from morphological and molecular data. Each node represents a common ancestor, and a clade is an ancestor and all of its descendants. Humans are evolutionarily closer to chimpanzees than to fish, and birds are closer to crocodiles than to lizards, because they share a more recent common ancestor. By comparing genes, the time of divergence can also be estimated (the molecular clock).\",k:[\"The branches of a tree convey time and relatedness\",\"The common ancestor defines each clade\",\"Genetic data have revised the trees\"],x:\"The tree of life shows that fungi are closer to animals than to plants.\"}\n],tax:[\n{m:\"The three domains were defined by Carl Woese on the basis of ribosomal RNA sequences. Bacteria and archaea are both prokaryotes, but archaea are genetically closer to eukaryotes. Eukaryotes include protists, fungi, plants, and animals. Many archaea tolerate high temperature, salt, or acid and are found in the deep ocean and hot springs.\",k:[\"Domains are defined by genetics\",\"Archaea often tolerate harsh conditions\",\"Bacteria and archaea have no nucleus\"],x:\"Methanogens are archaea that produce methane in the digestive tract of cattle.\"},\n{m:\"Linnaean classification has 8 levels from domain to species: domain, kingdom, phylum, class, order, family, genus, species. A scientific name is a two-part Latin name, written in italics (Homo sapiens). The system is the same in all countries and prevents confusion. Modern taxonomy now revises groups using DNA.\",k:[\"Scientific names are universal\",\"Each level includes the levels below it\",\"Modern classification is phylogenetic\"],x:\"The scientific name of the house cat is Felis catus and that of the lion is Panthera leo; they belong to different genera.\"},\n{m:\"There are several definitions of a species. The biological definition relies on inability to interbreed or on hybrid sterility. The morphological definition relies on similar appearance, and the phylogenetic definition on shared history. Some species do hybridize, such as the lion and tiger in captivity (the liger). The biological definition does not apply to bacteria, which are asexual.\",k:[\"No definition is complete\",\"Hybrids are usually sterile\",\"Species boundaries in nature are sometimes unclear\"],x:\"The mule is the hybrid of a female horse and a male donkey and is usually sterile.\"},\n{m:\"Natural extinction has always occurred, but its rate is now much higher, and some scientists speak of a sixth mass extinction. The main causes are habitat destruction and fragmentation, overhunting, pollution, invasive species, and climate change. The International Union for Conservation of Nature (IUCN) publishes the Red List of species. Habitat protection is the most effective approach.\",k:[\"Habitat is the most important factor\",\"The Red List reports the status of species\",\"Restoring species is possible but difficult\"],x:\"The Asiatic cheetah survives only in Iran, with fewer than 50 individuals.\"},\n{m:\"Hotspots are regions with many endemic species that are under threat. Tropical forests, coral reefs, and islands are examples. Iran has high biodiversity because of its mountains, deserts, Hyrcanian forests, and the Persian Gulf. Endemic species are found nowhere else in the world. They are protected in parks and protected areas.\",k:[\"An endemic species occurs in only one region\",\"The Hyrcanian forest is a World Heritage site\",\"Genetic diversity is the basis of sustainability\"],x:\"The Hyrcanian forests of northern Iran are inscribed on the UNESCO World Heritage List.\"}\n],eco:[\n{m:\"An individual represents its species, a population is all the individuals of one species in an area, a community includes all the populations in that area, and an ecosystem includes the community together with its nonliving factors. A biome is a large collection of ecosystems with a similar climate, such as a desert or the taiga. The biosphere is the sum of all of Earth’s ecosystems. Living and nonliving factors interact with each other.\",k:[\"A population is of one species\",\"A community has several species\",\"An ecosystem also includes nonliving factors\"],x:\"A pond is a small ecosystem that includes fish, plants, microbes, water, and light.\"},\n{m:\"Producers make sugars, primary consumers are herbivores, higher-level consumers are carnivores, and decomposers recycle materials. At each trophic level, much of the energy is lost as heat and through respiration, so food chains are usually short. A food web gives a more realistic picture of how chains are connected. Biomagnification of toxic substances such as mercury increases at the higher levels.\",k:[\"Energy flows in one direction while matter cycles\",\"Biomass pyramids also exist\",\"The top predator accumulates the most toxin\"],x:\"Large whales feed on tiny plankton and so have a short food chain.\"},\n{m:\"In the carbon cycle, plants take up CO₂ and organisms release it, and burning fossil fuels raises the CO₂ level. In the nitrogen cycle, nitrogen-fixing bacteria convert N₂ to ammonium, nitrifying bacteria convert it to nitrate, and denitrifying bacteria produce the gas again. Phosphorus enters the cycle from rocks. Excessive use of fertilizer causes eutrophication and the death of aquatic life.\",k:[\"Fossil fuels disrupt the carbon cycle\",\"Bacteria are essential in the nitrogen cycle\",\"Excess fertilizer pollutes water\"],x:\"The explosive growth of algae in lakes is the result of large inputs of phosphate and nitrate.\"},\n{m:\"Exponential growth occurs when resources are plentiful, but resources are limited and a population eventually reaches the carrying capacity. Density-dependent factors such as competition and disease increase with crowding, while density-independent factors such as fires or floods affect all individuals. The human population has grown very rapidly from the first billion to the eighth, thanks to technology and agriculture.\",k:[\"Carrying capacity is the population ceiling\",\"Predator and prey show periodic cycles\",\"Exponential growth is not sustainable with limited resources\"],x:\"The populations of hares and lynx in northern Canada fluctuate in step.\"},\n{m:\"Rainforests are hot and wet and have the greatest diversity; deserts have little rain and specially adapted species; the taiga is a cold coniferous forest; the tundra is frozen and treeless; and grasslands host large herds of grazers. Freshwater systems include rivers, lakes, and wetlands, and the seas range from coral reefs to the dark depths. Wetlands are natural water filters and reduce flooding.\",k:[\"Climate determines the type of biome\",\"Coral reefs have high marine diversity\",\"Wetlands are very valuable\"],x:\"The Anzali Wetland and Hur al-Azim are valuable wetlands of Iran.\"},\n{m:\"CO₂, methane, and water vapor are greenhouse gases that trap heat in the atmosphere. Human activity has increased these gases, and Earth’s average temperature has risen. The consequences include melting glaciers, rising sea levels, droughts and floods, coral bleaching, and shifts in the habitats of species. Solutions include solar and wind energy, energy efficiency, reforestation, and protection of wetlands.\",k:[\"Global warming has a human cause\",\"Ocean acidification harms corals\",\"Reducing consumption and recycling are essential\"],x:\"Planting trees and protecting forests store carbon in the long term.\"}\n],bio:[\n{m:\"In genetic engineering, a restriction enzyme cuts DNA at a specific site, the desired gene fragment is joined to a plasmid (recombinant DNA), and the enzyme ligase seals them together. The plasmid is introduced into a bacterium, and the bacterium expresses the gene. Products such as insulin, growth hormone, and the hepatitis B vaccine are made this way. Transgenic plants are also made with the same technology.\",k:[\"Restriction enzymes are molecular scissors\",\"Ligase is molecular glue\",\"Bacteria become drug factories\"],x:\"Previously, insulin was extracted from the pancreases of cattle and pigs.\"},\n{m:\"The polymerase chain reaction (PCR) works with three repeating steps: denaturation at high temperature, primer annealing at a lower temperature, and extension with a heat-resistant DNA polymerase. After 30 cycles, billions of copies are obtained. Gel electrophoresis separates DNA fragments by size and is used for identity tests and disease diagnosis. Next-generation sequencing reads a whole genome in a few hours.\",k:[\"PCR requires primers\",\"Electrophoresis separates fragments by size\",\"DNA fingerprinting establishes identity\"],x:\"Viruses can be detected in a nasal swab by PCR.\"},\n{m:\"Embryonic stem cells can become any cell type, whereas adult stem cells, such as those in bone marrow, can become only a few types. In 2006, scientists were able to reprogram skin cells into induced pluripotent stem (iPS) cells, which do not require destroying an embryo. Applications include bone marrow transplants for leukemia, repair of burned skin, and disease modeling in the laboratory. Cloning is producing an organism genetically identical to another organism, such as Dolly the sheep.\",k:[\"iPS cells are made without an embryo\",\"A bone marrow transplant uses stem cells\",\"In cloning, a nucleus is transferred into an enucleated egg\"],x:\"Dolly the sheep was the first mammal cloned from an adult cell (1996).\"},\n{m:\"Bioinformatics uses algorithms to compare sequences. With tools such as BLAST, an unknown sequence can be compared against a worldwide database. Predicting protein structure with artificial intelligence (such as AlphaFold) is one of the greatest recent advances and has made drug design faster. Analysis of genome data makes personalized medicine and a better understanding of diseases possible.\",k:[\"Bioinformatics combines biology and computing\",\"Public databases are available\",\"Artificial intelligence predicts protein shapes\"],x:\"The Human Genome Project took 13 years; today it takes a few hours.\"},\n{m:\"Transgenic plants have been made that are resistant to pests or drought, along with vitamin-enriched rice and drought-resistant wheat. In industry, fermentation is used to produce bread, yogurt, enzymes, and drugs. Biogas and bioethanol are biofuels, and bioremediation uses microbes to clean up oil and heavy metals. Ethical and environmental concerns must be managed through research and law.\",k:[\"Transgenic organisms carry foreign genes\",\"Fermentation is important in the food and drug industries\",\"Bioremediation cleans up pollution with microbes\"],x:\"In cheese making, recombinant rennet produced in bacteria replaced calf rennet.\"},\n{m:\"The scientific method begins with observation and a question, and then a testable hypothesis is proposed. In an experiment, one independent variable is changed, the dependent variable is measured, and all other factors are kept constant. A control group is essential for comparison. The data are analyzed statistically, and the results are published for peer review. A light microscope magnifies up to 1000 times and an electron microscope up to millions of times.\",k:[\"A hypothesis must be falsifiable\",\"Reproducibility is the basis of credibility\",\"The electron microscope reveals finer structures\"],x:\"With his swan-neck flask experiment, Louis Pasteur refuted the spontaneous generation of microbes.\"}\n]});\n\nvar S={\nmol:[\n[\"The H–O–H bond angle is about 104.5°, and each water molecule can form up to four hydrogen bonds (two as donor and two as acceptor). A hydrogen bond has an energy of about 20 kJ/mol, roughly one-twentieth of a covalent O–H bond, but their sheer number gives water its very high heat of vaporization (about 40.7 kJ/mol) and its specific heat of 4.18 J/(g·°C). A dielectric constant of about 80 weakens the attraction between ions in water, so salts dissolve.\",\"The hydrophobic effect is the main driving force behind protein folding and membrane formation: nonpolar groups force surrounding water into an ordered arrangement, and clustering them together raises the entropy of the water that is released. Pure water contains 10⁻⁷ mol/L of H⁺ ions (Kw = 10⁻¹⁴), and blood keeps its pH between 7.35 and 7.45 with the bicarbonate buffer system (H₂CO₃/HCO₃⁻). In the xylem, according to the cohesion–tension theory, a column of water can be pulled upward under a negative pressure of several megapascals.\"],\n[\"In amylose, glucose units are joined by α(1→4) bonds into a linear, helical chain. Amylopectin has an α(1→6) branch every 24–30 units, and glycogen is even more highly branched (every 8–12 units), which allows glucose to be released from many chain ends at once. In cellulose the units are joined by β(1→4) bonds and each unit is rotated 180° relative to its neighbor, so the chains are perfectly straight and, held together by hydrogen bonds between chains, form extremely strong microfibrils.\",\"In solution, glucose exists as a pyranose ring with α and β anomers. Glucose enters cells through GLUT transporters: GLUT1 in most tissues, GLUT2 in the liver and pancreas, and GLUT4 in muscle and adipose tissue, which moves to the membrane in response to insulin. Lactose is made of galactose and glucose joined by a β(1→4) bond, and its breakdown requires the enzyme lactase. Sugars attached to proteins and lipids (glycosylation) play roles in cell recognition, as in the blood group system.\"],\n[\"Unsaturated fatty acids with a cis double bond have a kink that lowers the melting point; this is why oils are liquid at room temperature. Omega-3 (alpha-linolenic acid, EPA, and DHA) and omega-6 fatty acids are essential fatty acids that the body cannot make. Complete oxidation of one molecule of palmitate (16 carbons) yields about 106 ATP, and fat provides about 9 kcal per gram, compared with 4 kcal for sugar and protein.\",\"In membranes, phosphatidylcholine and phosphatidylethanolamine are the most abundant, and phosphatidylserine is normally found in the inner leaflet; its appearance in the outer leaflet is an “eat me” signal of programmed cell death (apoptosis) for phagocytes. Cholesterol makes up 20–30 mol% of animal membrane lipids and prevents excessive fluidity at high temperature and stiffening at low temperature. Cholesterol is carried in the blood inside lipoproteins: LDL delivers it to tissues and HDL returns it to the liver.\"],\n[\"The peptide bond has partial double-bond character and is planar; free rotation occurs only at the φ and ψ angles around the alpha carbon, and the Ramachandran plot shows the allowed angles. The α helix has 3.6 amino acids per turn and a pitch of 0.54 nm, and it is stabilized by hydrogen bonds between the C=O of residue i and the N–H of residue i+4. The β sheet is built from parallel or antiparallel strands. Tertiary structure is held together by the hydrophobic effect, ionic bonds, hydrogen bonds, and disulfide bridges (between cysteines).\",\"Chaperones such as HSP70 and the chaperonin GroEL assist correct folding, and misfolding leads to diseases such as Alzheimer’s disease and prion diseases. In hemoglobin (α₂β₂), binding of O₂ to one subunit makes binding to the others easier (positive cooperativity), and the Bohr effect shows that oxygen is released more readily at lower pH and higher CO₂. Replacement of glutamate with valine at position 6 of the β chain produces hemoglobin S and sickle cell anemia. Collagen is made of three helical chains with a repeating Gly–X–Y sequence.\"],\n[\"A nucleoside consists of a base and a sugar, and becomes a nucleotide when a phosphate is added. Nucleotides are linked by phosphodiester bonds between the 3′ carbon of one sugar and the 5′ carbon of the next, so each strand has a 5′ to 3′ direction. A and G are purines (two rings), and C, T, and U are pyrimidines (one ring). Chargaff’s rule states that in double-stranded DNA, A = T and G = C. B-DNA is the most common form: 10.5 base pairs per turn, a pitch of 3.4 nm, and a diameter of 2 nm.\",\"The 2′-hydroxyl group on the ribose of RNA makes it more susceptible to hydrolysis, which is one reason DNA is more stable. RNAs come in many types: mRNA, tRNA (about 76 nucleotides), rRNA, which forms the catalytic core of the ribosome (a ribozyme), miRNA, which silences gene expression, and long noncoding RNAs. Hydrolysis of ATP to ADP releases about 30.5 kJ/mol under standard conditions and up to 50 kJ/mol under cellular conditions. NAD, FAD, and coenzyme A also have a nucleotide structure.\"],\n[\"The Michaelis–Menten equation, v = Vmax[S]/(Km+[S]), describes the reaction rate; Km is the substrate concentration at which the rate is half of Vmax, and the lower it is, the higher the affinity. A competitive inhibitor increases Km while Vmax stays the same, and a noncompetitive inhibitor lowers Vmax. The “induced fit” model (Koshland) states that the active site changes shape upon binding. The enzyme catalase carries out up to 10⁷ reactions per second, and some enzymes speed up a reaction by as much as 10¹⁷-fold.\",\"Enzymes fall into seven classes: oxidoreductases, transferases, hydrolases, lyases, isomerases, ligases, and translocases. Many require a cofactor (ions such as Mg²⁺ and Zn²⁺) or a coenzyme (vitamin derivatives such as NAD⁺, made from niacin). Allosteric regulation means a molecule binds at a site other than the active site; for example, phosphofructokinase-1 in glycolysis is inhibited by ATP and citrate and activated by AMP. Feedback inhibition shuts down a pathway according to the cell’s needs. Many digestive enzymes are made as zymogens (such as pepsinogen) so that they do not digest the cell that produces them.\"]],\n\ncell:[\n[\"The prokaryotic ribosome is 70S (50S and 30S subunits) and the eukaryotic ribosome is 80S (60S and 40S); this difference underlies the action of many antibiotics that target the bacterial ribosome. The sequence of the 16S rRNA gene is used to classify bacteria. The bacterial cell wall is made of peptidoglycan (chains of N-acetylglucosamine and N-acetylmuramic acid cross-linked by peptides), and penicillin inhibits the synthesis of these cross-links. Archaeal membranes contain ether lipids, not ester lipids.\",\"The endosymbiotic theory (Lynn Margulis) holds that mitochondria came from an alpha-proteobacterium and chloroplasts from a cyanobacterium. Evidence includes two membranes, circular DNA, 70S ribosomes, and division by binary fission. The surface-area-to-volume ratio sets the limit on cell size: as a cell grows larger, its volume increases faster than its surface area and exchange of materials becomes difficult, so eukaryotic cells increase their surface area with internal membranes.\"],\n[\"The nuclear envelope has two membranes, and nuclear pores (complexes with a mass of about 120 megadaltons and about 30 types of nucleoporins) control selective transport. The nucleolus is the site of rRNA transcription by RNA polymerase I and of ribosomal subunit assembly. The human mitochondrial genome has 16,569 base pairs and 37 genes and is inherited almost entirely from the mother. The inner mitochondrial membrane is folded (cristae) to increase the surface area available for the electron transport chain.\",\"Proteins destined for secretion are directed to the rough endoplasmic reticulum by a signal sequence (signal peptide) and the signal recognition particle (SRP). In the Golgi apparatus, from the cis face to the trans face, modifications such as glycosylation and tagging for destination take place. Lysosomes, with a pH of about 4.5–5, contain more than 50 acid hydrolases; defects in them cause lysosomal storage diseases. The cytoskeleton consists of actin microfilaments (7 nm in diameter), intermediate filaments (8–12 nm), and tubulin microtubules (25 nm), and the motor proteins kinesin and dynein move cargo along them.\"],\n[\"The fluid mosaic model was proposed by Singer and Nicolson in 1972. The membrane is about 7–8 nm thick, and lipids move easily within the plane of the membrane, but movement from one leaflet to the other (flip-flop) is slow and is regulated by flippase enzymes. Animal membranes contain cholesterol-rich microdomains called lipid rafts, which concentrate signaling proteins. On the outer surface lies a layer of carbohydrate (the glycocalyx).\",\"G protein–coupled receptors (GPCRs) activate a G protein upon ligand binding, and a second messenger such as cAMP or IP₃ is produced, amplifying the signaling cascade. Receptor tyrosine kinases transmit growth signals by phosphorylating themselves. There are three types of cell junctions: tight junctions (preventing leakage), desmosomes (mechanical strength), and gap junctions (connecting channels, or connexons, that move ions between cells and coordinate contraction in the heart). The resting potential of a neuron is about –70 mV.\"],\n[\"Diffusion follows Fick’s law, and its rate is proportional to the concentration gradient and the surface area. Aquaporins (AQP) are water channels, and a single channel can pass about three billion water molecules per second. In each cycle the Na⁺/K⁺-ATPase pump moves 3 sodium ions out and 2 potassium ions in, and it consumes about 20–25% of a cell’s ATP at rest (and up to 70% in neurons). In secondary active transport, as with the SGLT1 transporter in the intestine, glucose enters using the energy of the sodium gradient.\",\"Osmotic pressure is given by π = iMRT. A cell does not change volume in an isotonic solution, takes up water in a hypotonic solution, and shrinks in a hypertonic solution (plasmolysis in plants). Clathrin-mediated endocytosis is the most common route of entry for ligands such as LDL bound to the LDL receptor. Exocytosis of enzymes and neurotransmitters depends on SNARE proteins, which fuse the vesicle with the membrane; botulinum toxin cleaves these same proteins.\"],\n[\"Glycolysis has 10 steps and a net yield of 2 ATP and 2 NADH; its key control step is the enzyme PFK-1. Pyruvate is converted to acetyl-CoA by the pyruvate dehydrogenase complex. In the Krebs cycle, each glucose yields 6 NADH, 2 FADH₂, and 2 GTP. Complexes I to IV in the inner mitochondrial membrane pass electrons to O₂, and complexes I, III, and IV pump protons; according to Peter Mitchell’s chemiosmotic theory, ATP synthase (F₀F₁) makes ATP from the flow of protons. Roughly 2.5 ATP are produced per NADH and 1.5 per FADH₂, and the total yield is about 30–32 ATP.\",\"In photosynthesis, photosystem II (P680) splits water (the oxygen-evolving complex with its Mn₄CaO₅ cluster), and electrons travel along the Z scheme from PSII to PSI (P700), producing NADPH. In the Calvin cycle, rubisco attaches CO₂ to ribulose bisphosphate, giving two molecules of 3-phosphoglycerate; making one G3P requires three CO₂, 9 ATP, and 6 NADPH. Rubisco also reacts with O₂ (photorespiration), which lowers efficiency, and C4 and CAM plants have strategies to reduce it.\"],\n[\"The cell cycle is controlled by complexes of cyclins and cyclin-dependent kinases (CDKs). The G1/S checkpoint (restriction point) opens when the E2F factor is released from the Rb protein, and the p53 protein halts the cycle or initiates apoptosis if DNA is damaged. At G2/M, the CDK1–cyclin B complex (MPF) triggers entry into mitosis. The spindle checkpoint blocks anaphase until all chromosomes are attached to microtubules. In anaphase, the enzyme separase cleaves the protein cohesin and sister chromatids separate.\",\"Cytokinesis occurs by an actin–myosin contractile ring in animal cells and by formation of a cell plate in plants. In prophase I of meiosis, homologs pair (synapsis) and chiasmata form at the sites of crossing over; failure of chromosomes to separate (nondisjunction) can lead to trisomy 21 (Down syndrome). Cancer-causing genes (oncogenes, such as RAS) lead to cancer through gain-of-function mutations, and tumor suppressor genes (such as p53 and RB) through loss of function. Normal human cells usually divide about 50 times (the Hayflick limit) because telomeres shorten; the enzyme telomerase is active in stem cells and cancer cells.\"]],\n\ngen:[\n[\"Watson and Crick presented their model in 1953 on the basis of X-ray diffraction (Rosalind Franklin’s Photo 51). The major groove and minor groove on the surface of the helix are binding sites for regulatory proteins. In eukaryotes, 147 base pairs of DNA wrap around a histone octamer core (H2A, H2B, H3, and H4, two copies each) to form a nucleosome; the 11 nm fiber is compacted with histone H1 into the 30 nm fiber, and then into loops and the condensed chromosome.\",\"Euchromatin is less compact and transcriptionally active, and heterochromatin is highly compact and silent. Histone acetylation reduces the histone’s positive charge and makes DNA accessible, while methylation of certain amino acids brings about silencing. The human haploid genome has about 3 billion base pairs and about 20,000 protein-coding genes, and less than 2% of it consists of exons; the rest consists of introns, regulatory sequences, and abundant repeats (such as transposons).\"],\n[\"Replication begins from a single origin (oriC) in bacteria and from thousands of origins in eukaryotes. Helicase unwinds the DNA, SSB proteins hold the separated strands apart, and topoisomerase relieves torsional strain. Primase makes a short RNA primer, and DNA polymerase III (in bacteria) synthesizes in the 5′→3′ direction, making the leading strand continuously and the lagging strand as Okazaki fragments (100–2000 nucleotides). DNA polymerase I removes the primers, and ligase seals the gaps.\",\"The overall accuracy of replication is about one error per 10⁹–10¹⁰ bases, which comes from three mechanisms: correct nucleotide selection, 3′→5′ proofreading by the polymerase, and mismatch repair. At the ends of linear chromosomes, the lagging strand cannot be completed (the end-replication problem) and telomeres (the TTAGGG repeat in humans) shorten unless telomerase rebuilds them. The rate of replication is about 1000 nucleotides per second in bacteria and about 50 in eukaryotes.\"],\n[\"In bacterial transcription, the sigma subunit guides RNA polymerase to the promoter. In eukaryotes, general transcription factors and RNA polymerase II bind to the TATA box and promoter, and enhancer elements boost expression from a distance. After transcription, eukaryotic mRNA receives a 5′ cap (7-methylguanosine), a poly-A tail, and splicing; the spliceosome removes introns, and alternative splicing allows one gene to make several proteins.\",\"In translation, aminoacyl-tRNA synthetase attaches each amino acid to the correct tRNA. The ribosome has three sites: A, P, and E. Initiation occurs at the AUG codon (methionine) and termination at one of the stop codons UAA, UAG, or UGA, which do not code for an amino acid. The genetic code is redundant (64 codons for 20 amino acids), and because most of the redundancy lies in the third base, many point mutations are silent. In bacteria, transcription and translation are simultaneous, but in eukaryotes transcription occurs in the nucleus and translation in the cytoplasm.\"],\n[\"Mendel studied 7 traits in about 28,000 pea plants and formulated two laws: segregation (the two alleles of each gene separate during gamete formation) and independent assortment (alleles of genes on different chromosomes separate independently of each other). A test cross (a cross with a homozygous recessive) can reveal the genotype of a dominant individual: if all offspring show the dominant trait the individual is homozygous, and a 1:1 ratio indicates a heterozygote.\",\"Crossing over breaks the linkage of genes, and the frequency of recombination is a measure of the distance between genes; 1% recombination equals 1 centimorgan, and gene maps are drawn on this basis. Mendelian ratios can be compared with actual results using the chi-square (χ²) test. Another important point is that genetic ratios refer to probability, and each birth is independent of previous births.\"],\n[\"The ABO blood group is determined by the I gene with three alleles, Iᴬ, Iᴮ, and i; Iᴬ and Iᴮ are dominant over i and codominant with each other. In hemophilia A, which is X-linked, the gene for clotting factor VIII is mutated: a male with a single mutant X is affected, but a female must have two mutant X chromosomes, so carrier females are often healthy. In females, one of the two X chromosomes is randomly silenced in each cell (X inactivation, the Barr body), and this mosaicism is seen in the calico cat.\",\"Polygenic traits such as height and skin color show a continuous (bell-shaped) distribution and are also affected by the environment. Epistasis means that one gene masks the expression of another, as in Labrador coat color. Mitochondrial inheritance is only from the mother. Multifactorial inheritance and heritability (h²) describe the contribution of genetics to variation in a trait within a population and have no meaning for a specific individual. Single-gene diseases such as phenylketonuria (autosomal recessive) are caused by the absence of the enzyme phenylalanine hydroxylase.\"],\n[\"Substitution mutations are of three kinds: silent (the amino acid is unchanged), missense (a different amino acid), and nonsense (a premature stop codon). Deletion or insertion of a number of nucleotides that is not a multiple of three causes a frameshift. Larger mutations include deletions, duplications, inversions, and translocations. The cell has repair mechanisms: base excision repair, nucleotide excision repair (for thymine dimers caused by UV), mismatch repair, and double-strand break repair. Defects in repair cause diseases such as xeroderma pigmentosum.\",\"In CRISPR-Cas9, the guide RNA (sgRNA) has about 20 nucleotides complementary to the target site, and Cas9 must find a PAM sequence (such as NGG) next to the target; a double-strand break is then made, which is closed by non-homologous end joining (NHEJ, producing insertions and deletions) or homology-directed repair (HDR). The main concern is off-target effects. Epigenetics includes DNA methylation at CpG islands (silencing) and histone modification, and some changes are passed on to the next generation during cell division.\"]],\n\nmic:[\n[\"Gram staining is based on the thickness of the peptidoglycan: the thick layer in Gram-positive bacteria retains the violet dye, while Gram-negative bacteria have a thin layer plus an outer membrane containing lipopolysaccharide (endotoxin), which gives them greater resistance to antibiotics. Bacteria transfer DNA in three ways: transformation (uptake of free DNA), transduction (by phage), and conjugation (via a sex pilus). The R plasmid carries drug-resistance genes. The spores of bacteria such as Bacillus and Clostridium are highly resistant to heat and chemicals.\",\"The gut microbiome contains about 38 trillion bacteria; they ferment indigestible carbohydrates and produce short-chain fatty acids (butyrate), which are an energy source for intestinal cells, they make vitamin K and some of the B vitamins, and they play a role in immune development. Escherichia coli, the most common laboratory model, has a genome of 4.6 million base pairs and a division cycle of about 20 minutes.\"],\n[\"Viral genomes can be DNA or RNA, single-stranded or double-stranded. In the lytic cycle the virus is released by destroying the cell after replication, and in the lysogenic cycle (phage lambda) the genome joins the host chromosome (prophage) and is passed on with every division. HIV is a retrovirus: the enzyme reverse transcriptase makes DNA from RNA, integrase inserts it into the genome, and the virus targets helper T lymphocytes (CD4⁺).\",\"RNA viruses (such as influenza) have a high mutation rate because their RNA polymerase lacks proofreading. The influenza genome is segmented, and in a simultaneous infection with two strains the segments can be exchanged (antigenic shift). The surface proteins hemagglutinin (H) and neuraminidase (N) determine the names of subtypes (for example, H1N1). Specific antiviral drugs exist, such as protease and polymerase inhibitors, but antibiotics have no effect on viruses.\"],\n[\"The cell wall of fungi is made of chitin, and their membrane contains ergosterol instead of cholesterol; antifungal drugs such as the azoles inhibit ergosterol synthesis. Fungi commonly produce both sexual and asexual spores, and their main groups are the zygomycetes, ascomycetes, and basidiomycetes. The yeast Saccharomyces cerevisiae converts glucose to ethanol and CO₂ in alcoholic fermentation and is an important model for cell biology. To digest food, fungi secrete enzymes outside the body and absorb the products.\",\"Protists are a paraphyletic group (not a single lineage). Plasmodium, the malaria parasite, has a complex life cycle in the Anopheles mosquito and in humans: sporozoites go to the liver and then to red blood cells, causing periodic fevers. Trypanosoma, the cause of sleeping sickness, evades the immune system by continually changing its surface protein. Diatoms and brown algae photosynthesize in the sea and make up an important part of plankton.\"],\n[\"Innate immunity uses pattern recognition receptors (such as Toll-like receptors) to recognize molecular patterns shared by microbes (for example, LPS and fungal cell walls). Neutrophils are the most abundant white blood cells and, along with macrophages, carry out phagocytosis. The complement system is a group of plasma proteins that tag or puncture microbes through an activation cascade. Natural killer (NK) cells kill cells that lack MHC-I. Interferons induce an antiviral state in neighboring cells.\",\"Inflammation begins with the release of histamine from mast cells, which increases vessel permeability; cytokines (such as IL-1 and TNF-α) and prostaglandins recruit white blood cells and, in the brain, raise the temperature set point (fever). Fever slows the multiplication of many microbes. Chronic inflammation contributes to diseases such as atherosclerosis and type 2 diabetes.\"],\n[\"B lymphocytes carry a surface receptor (BCR) and T lymphocytes carry the TCR, and the diversity of these receptors arises from V(D)J gene recombination, which makes it possible to recognize more than 10¹⁰ antigens. Antigen-presenting cells display a fragment of the antigen on MHC-II to helper T cells (CD4), and infected cells display it on MHC-I to cytotoxic T cells (CD8). Antibodies (immunoglobulins) have five classes: IgG, the most abundant, crosses the placenta; IgA is found in milk and tears; IgM is the first response; IgE is involved in allergy and parasites; and IgD serves as a B cell receptor.\",\"Clonal selection: each lymphocyte has one specific receptor, and the antigen selects and expands the appropriate clone. Self-reactive lymphocytes are eliminated in the thymus and bone marrow (central tolerance); failure of this leads to autoimmune diseases such as type 1 diabetes and multiple sclerosis. In the primary response it takes 5–10 days to produce antibodies, while the secondary response occurs within 1–3 days and produces more antibodies with higher affinity.\"],\n[\"Types of vaccine: live attenuated (measles, rubella), inactivated (injected influenza), subunit/recombinant (hepatitis B), toxoid (tetanus, diphtheria), and mRNA. In an mRNA vaccine, the mRNA enters the cell inside a lipid nanoparticle and the ribosome makes the protein (for example, the virus spike protein); the mRNA is degraded after a few days and does not enter the genome. Herd immunity is reached when the immune fraction of the population exceeds 1 − 1/R₀; for measles, with an R₀ of about 12–18, more than 92–94% must be immune.\",\"Antibiotics act on specific bacterial targets: beta-lactams (penicillin) on wall synthesis, tetracyclines and macrolides on the 70S ribosome, quinolones on the enzyme gyrase, and rifampin on RNA polymerase. Resistance arises from mutation, plasmids, or enzymes such as beta-lactamase; MRSA is an important example. Misuse accelerates the selection of resistant strains, and the World Health Organization regards it as one of the major threats to health.\"]]\n};\n\nS.plant=[\n[\"In the root, the endodermis has a Casparian strip (impregnated with suberin) that blocks the apoplastic pathway and forces absorbed substances to pass through a membrane, which creates ion selectivity. The root takes up water along a water-potential gradient (osmosis) and solutes by means of transporters and active transport. In the stems of dicots, the vascular cambium divides to produce secondary xylem (inward) and secondary phloem (outward), thickening the stem. The difference between earlywood (spring wood) and latewood (summer wood) forms the annual rings.\",\"Xylem is built from dead conducting cells with lignified walls (tracheids and vessel elements). Phloem is built from living sieve-tube cells with companion cells, and the sap moves by the pressure-flow hypothesis (Münch) from source (leaf, high osmotic pressure) to sink (root, fruit). Stomata open through a change in the turgor of the guard cells: potassium and water enter, triggered by blue light. A plant loses more than 95% of the water it absorbs through transpiration.\"],\n[\"Light reactions: chlorophylls a and b and carotenoids absorb light (chlorophyll absorption peaks in blue and red light, and green is reflected). The proton gradient between the thylakoid lumen and the stroma drives ATP synthase (photophosphorylation). Cyclic electron flow produces only ATP. The Calvin cycle has three phases: fixation (rubisco), reduction (with ATP and NADPH), and regeneration of RuBP. Rubisco is slow (about 3 reactions per second), and to compensate, leaves contain a very large amount of it.\",\"In photorespiration, rubisco accepts oxygen instead of CO₂ and produces the toxic compound phosphoglycolate, which is recycled at an energy cost. C4 plants (maize, sugarcane) convert CO₂ into a four-carbon compound with the enzyme PEP carboxylase in mesophyll cells and release it in bundle-sheath cells, raising the CO₂ concentration around rubisco. In CAM plants, fixation takes place at night and the Calvin cycle during the day. Limiting factors: light, CO₂, and temperature (Blackman’s law of limiting factors).\"],\n[\"The life cycle of plants shows alternation of generations: a diploid sporophyte produces haploid spores by meiosis, and a spore grows into a haploid gametophyte, which produces gametes by mitosis. In mosses the gametophyte is dominant, and in the other groups the sporophyte is. Ferns have water-dependent fertilization. Gymnosperms have wind-borne pollen and naked seeds (such as pine and cypress). Angiosperms have flowers, fruits, and double fertilization, and make up about 90% of land plant species.\",\"Monocots have one cotyledon, leaves with parallel veins, petals in multiples of 3, a fibrous root system, and scattered vascular bundles in the stem. Dicots have two cotyledons, netted leaf veins, petals in multiples of 4 or 5, a taproot, and vascular bundles arranged in a ring. DNA analysis has shown that the dicots are not a single natural (monophyletic) group: many of the traditional dicots belong to separate lineages.\"],\n[\"In the anther, a pollen mother cell yields four microspores by meiosis, and each pollen grain has two cells (vegetative and generative). In the ovule, the embryo sac is seven-celled and eight-nucleate: an egg cell, two synergids, three antipodals, and one central cell with two polar nuclei. Double fertilization: one sperm with the egg cell forms a diploid zygote, and the other sperm with the two polar nuclei forms a triploid (3n) endosperm, which is the food reserve. After ripening, the seed germinates by taking up water and under the influence of gibberellin.\",\"Self-incompatibility prevents self-fertilization: the S genes of the stigma reject pollen grains with the same S allele. Vegetative propagation (grafting and cuttings) produces genetically identical offspring through mitosis. The fruit is formed from the ovary wall (and sometimes other parts of the flower), and being fleshy or winged helps dispersal. In some plants, pollination has coevolved with one particular insect.\"],\n[\"Auxin (indole-3-acetic acid) is made in the shoot tip and moved in a polar way by PIN transporters. Acid growth hypothesis: auxin activates the proton pump, the cell wall pH drops, the wall loosens, and water enters. A high auxin concentration slows root growth, and a high auxin level at the tip inhibits the growth of lateral buds (apical dominance), which is counteracted by cytokinin. The herbicide 2,4-D is an auxin mimic.\",\"Gibberellin induces alpha-amylase in the aleurone layer so that the seed’s starch is digested. Abscisic acid maintains seed dormancy and closes stomata during water deficit. Ethylene (C₂H₄) regulates ripening, leaf abscission, and the response to injury. Phytochrome is the receptor for red and far-red light and controls flowering according to the length of the night (short-day and long-day plants). In fact, the plant measures the length of the night, not the day.\"],\n[\"Many desert plants (xerophytes) reduce water loss with a thick cuticle, sunken stomata, and reduced leaves. CAM plants use the PEPC enzyme at night to convert CO₂ into malate and store it in the vacuole. Halophytes have salt-excreting glands. In aquatic plants, aerenchyma carries air to the roots. Legumes form root nodules with Rhizobium, whose nitrogenase enzyme converts N₂ into ammonia (a reaction that is very costly in energy and is inhibited by oxygen); leghemoglobin controls the oxygen level in the nodule.\",\"Carnivorous plants (Venus flytrap, Nepenthes) obtain nitrogen and phosphorus from their prey and keep photosynthesizing. The Venus flytrap closes when a sensory hair is triggered twice in succession (within about 20 seconds). Mycorrhizae form on the roots of 80–90% of plants, and the fungus receives sugar in exchange for phosphorus and water. Plants’ chemical defenses, such as alkaloids (nicotine, caffeine), terpenes, and phenols, are the source of some human drugs.\"]];\n\nS.anim=[\n[\"Invertebrates are classified by symmetry, body cavity, and embryonic development. Protostomes, such as mollusks and arthropods, form the mouth from the first embryonic opening (the blastopore), and deuterostomes, such as echinoderms and chordates, form the anus from the blastopore and the mouth from a second opening. Arthropods have a chitinous exoskeleton that grows by molting (ecdysis), an open circulatory system with hemolymph, and, in insects, tracheal respiration. Mollusks have a mantle and a foot, and cephalopods (octopuses and squids) have a closed circulatory system with three hearts.\",\"Sponges have collar cells (choanocytes) that move water with their flagella and capture food. Cnidarians (such as corals and jellyfish) have stinging cells (cnidocytes) and two body forms, the polyp and the medusa. Flatworms (planarians) have an incomplete gut, and annelids (earthworms) have a closed circulatory system and nephridia. Echinoderms have a water vascular system (tube feet) for locomotion and a high capacity for regeneration.\"],\n[\"Vertebrates have a notochord in the embryo, which is later replaced by the vertebral column. Circulatory systems: fish (two-chambered heart, a single circuit), amphibians (three-chambered), reptiles (mostly three-chambered with an incomplete septum; crocodilians are four-chambered), and birds and mammals (four-chambered, two separate circuits), which provides more efficient oxygen delivery for endothermy. Bony fish have a swim bladder and a lateral line.\",\"The amniotic egg has four membranes: amnion, chorion, yolk sac, and allantois; the amnion creates a small aquatic environment for the embryo. Birds have air sacs that provide one-way airflow through the lungs. Mammals reproduce with a placenta (placentals), with an underdeveloped newborn in a pouch (marsupials), or by laying eggs (monotremes, such as the platypus). Mammalian body temperature is about 37–39 °C, and mammals have insulation from hair and fat.\"],\n[\"Fertilization in animals involves the acrosomal reaction, in which enzymes break through the egg’s outer layer, and then the cortical reaction prevents a second sperm from entering. Cleavage is a series of rapid mitotic divisions without overall growth, and the blastula arises from it. Through cell movements, gastrulation forms three layers: ectoderm (skin, nervous system), mesoderm (muscle, bone, circulatory system), and endoderm (digestive tube and glands). Embryonic induction and Hox genes pattern the head-to-tail body axis.\",\"Metamorphosis in insects is complete (egg, larva, pupa, adult, as in the butterfly) or incomplete (nymph, as in the locust), and it is controlled by the hormones ecdysone and juvenile hormone. In the frog, the hormone thyroxine triggers metamorphosis. Some animals, such as crustaceans and sea stars, can regenerate organs. Parthenogenesis is common in the bee (males from unfertilized eggs) and in some lizards.\"],\n[\"In the camel, the kidney produces very concentrated urine, body temperature rises by up to 6 °C during the day so that it does not need to sweat, and its oval red blood cells
