swell several-fold when it suddenly drinks a large amount of water, but do not burst. Bats emit sound at 20–200 kHz and determine distance and direction from the delay of the echo. Antifreeze proteins in polar fish inhibit the formation of ice crystals. The poison of the poison dart frog (the alkaloid batrachotoxin) paralyzes nerves and muscles by keeping sodium channels open. The chameleon changes color by altering the structure of guanine nanocrystals in its skin cells.\",\"Hibernation is accompanied by a sharp drop in metabolism, heart rate, and temperature, and the body uses brown fat and its stores. A hibernating bear recycles urea without eating or urinating. These examples remind us that adaptation is not necessarily perfect and is the product of an evolutionary compromise.\"],\n[\"Neurobiology: neurons communicate through electrical synapses (gap junctions) or chemical synapses. The nervous system has evolved from the diffuse nerve net of Hydra (a cnidarian) to a central nervous system with a brain in vertebrates. In insects, the head ganglia make up the brain and the nerve cord is ventral. In mammals, the cerebral cortex has more folding and a larger surface area. The vertebrate lens focuses the image on the retina, which has rod receptors (dim light) and cone receptors (color).\",\"Special sense organs: infrared heat sensors in the rattlesnake, magnetoreceptors in birds (cryptochrome), the lateral line of fish for water vibrations, and electroreceptors in sharks and the platypus. The honeybee sees ultraviolet and senses polarized light. Memory and learning occur through long-term potentiation (LTP) at synapses.\"],\n[\"Symbiosis takes several forms. Mutualism: the gut bacteria of ruminants ferment cellulose, and termites harbor cellulose-digesting protists. Corals and their symbiotic algae (zooxanthellae) exchange sugar for shelter and minerals; if the temperature rises, the algae are lost and the coral turns white. Predation and defense drive coevolution: an arms race between predator and prey. Examples are Batesian mimicry (a harmless prey resembling a toxic animal) and Müllerian mimicry (several toxic species resembling one another).\",\"Internal parasites such as the tapeworm and the hydatid cyst worm (Echinococcus) have complex life cycles with several hosts. Some parasites manipulate host behavior; for example, Toxoplasma makes mice lose their fear of cat odor. Social parasitism (brood parasitism), as in the cuckoo, involves laying one’s eggs in the nest of another species. The keystone species concept: a species whose effect on an ecosystem is greater than its abundance would suggest, such as the sea star Pisaster or the sea otter.\"]];\n\nS.human=[\n[\"The heart beats automatically thanks to pacemaker cells (the sinoatrial, or SA, node): the SA node fires about 60–100 times per minute, and the signal reaches the atrioventricular (AV) node, the bundle of His, and the Purkinje fibers. The bicuspid (mitral) and tricuspid valves lie between atrium and ventricle, and the semilunar valves (aortic and pulmonary) lie at the exits; the “lub-dub” heart sound is their closing. Cardiac output = heart rate × stroke volume ≈ 70 × 70 = about 5 liters per minute. Normal blood pressure is 120/80 mm Hg.\",\"Blood is about 55% plasma (90% water) and 45% cells. A mature red blood cell has no nucleus, lives 120 days, and is produced in the bone marrow under the influence of the hormone erythropoietin (from the kidney). Each hemoglobin molecule has four hemes, and each red blood cell contains about 270 million hemoglobin molecules. Clotting: platelets aggregate, and the coagulation cascade converts fibrinogen into fibrin. Rh incompatibility between mother and fetus is an important example in blood immunology.\"],\n[\"Air travels through the nose, pharynx, larynx, trachea, bronchi, and bronchioles to the alveoli (about 300 million, with an exchange surface of 70–100 square meters). Surfactant (phospholipid and protein) reduces surface tension so that the alveoli do not collapse; a lack of it in premature infants causes respiratory distress syndrome. Ventilation works by pressure differences (Boyle’s law): inhalation means contraction of the diaphragm and intercostal muscles and an increase in the volume of the chest cavity. Vital capacity is about 4–5 liters.\",\"Gas exchange is driven by differences in partial pressure. In the blood, 98% of O₂ is bound to hemoglobin (saturation), while CO₂ is carried 70% as bicarbonate (with the enzyme carbonic anhydrase), 23% bound to hemoglobin, and 7% dissolved. The oxygen dissociation curve is S-shaped and shifts to the right with increased temperature or acidity. Carbon monoxide has an affinity for hemoglobin about 200 times greater than O₂ and is lethal. The respiratory center in the medulla oblongata responds to blood CO₂ and pH.\"],\n[\"Mouth: salivary amylase breaks starch down into maltose. The stomach begins protein digestion by secreting HCl (pH about 2) and pepsinogen (which becomes pepsin), while thick mucus and bicarbonate protect the wall. In the duodenum, bile emulsifies fat, pancreatic enzymes (trypsin, chymotrypsin, lipase, amylase) enter, and bicarbonate raises the pH. Brush-border enzymes (lactase, maltase, sucrase) complete digestion.\",\"The small intestine (6 m) has an area of about 30 square meters thanks to folds, villi, and microvilli (older estimates have gone as high as 200). Amino acids and glucose are absorbed by secondary active transport, and fats enter the lymph as chylomicrons. Vitamin B12 needs intrinsic factor. The large intestine absorbs water and electrolytes, and its microbiome makes vitamin K. Hormonal control: gastrin (stomach secretion), secretin (bicarbonate), and cholecystokinin (bile and enzymes).\"],\n[\"The resting potential is about −70 mV (sodium-potassium pump and potassium leak channels). On reaching threshold (about −55 mV), voltage-gated sodium channels open and sodium enters (depolarization up to +30 mV); then potassium channels open (repolarization), and the refractory period prevents the signal from traveling backward. In myelinated axons (Schwann cells and oligodendrocytes), saltatory conduction occurs at speeds of up to 120 m/s. Multiple sclerosis (MS) results from the destruction of myelin.\",\"At a chemical synapse, calcium entry makes vesicles fuse, and the transmitter (acetylcholine, glutamate, GABA, dopamine, serotonin) reaches the postsynaptic receptor and produces an excitatory or inhibitory potential; spatial and temporal summation decides whether the neuron fires. Autonomic nervous system: sympathetic (fight or flight, norepinephrine) and parasympathetic (rest and digest, acetylcholine). The brain is 2% of body weight but uses about 20% of the energy.\"],\n[\"The hypothalamus controls the releasing hormones of the pituitary. The anterior pituitary releases growth hormone (GH), TSH, ACTH, prolactin, FSH, and LH, and the posterior pituitary releases oxytocin and ADH (made in the hypothalamus). The thyroid makes T3 and T4 (iodine-containing), and iodine deficiency or hypothyroidism shows up as swelling of the gland (goiter). The parathyroid raises blood calcium with PTH, and calcitonin lowers it. Adrenal cortisol regulates long-term stress and blood sugar.\",\"Peptide hormones act through a membrane receptor and a second messenger (cAMP), while steroid and thyroid hormones act through an intracellular receptor and change gene expression. Insulin (β cells) increases glucose uptake and glycogen storage; in type 1 diabetes the β cells are destroyed by the immune system, and in type 2 there is insulin resistance. Symptoms: excessive thirst, excessive urination, and a fasting blood glucose above 126 mg/dL.\"],\n[\"The kidneys receive about 20–25% of cardiac output and filter about 180 liters of fluid per day, of which only about 1.5 liters becomes urine. Filtration occurs in the glomerulus (blood pressure), reabsorption in the proximal convoluted tubule (65% of water and sodium, all of the glucose and amino acids), the loop of Henle (raising osmotic concentration by a countercurrent mechanism), the distal convoluted tubule, and the collecting duct (regulated by ADH and aldosterone). Secretion of hydrogen and potassium ions and of drugs takes place in the tubules.\",\"The renin–angiotensin–aldosterone system is activated when blood pressure falls: angiotensin II constricts vessels, and aldosterone retains sodium and water. The kidney makes erythropoietin, calcitriol (active vitamin D), and renin. Kidney stones consist of crystals of calcium oxalate and uric acid. Kidney failure reduces the glomerular filtration rate (GFR) and is diagnosed by blood creatinine.\"],\n[\"Bone is made of a mineral matrix (hydroxyapatite, a calcium phosphate) and collagen. Bone-forming cells (osteoblasts), bone-resorbing cells (osteoclasts), and osteocytes carry out remodeling; parathyroid hormone and vitamin D regulate calcium. Osteoporosis is accompanied by a loss of density. Movable joints have synovial fluid and cartilage. Red bone marrow makes blood.\",\"Muscle structure: muscle fiber ← myofibril ← sarcomere (the contractile unit between two Z lines). In contraction (sliding filament theory), the myosin heads bind to actin and pull, using ATP; at rest, troponin and tropomyosin block binding, and the entry of Ca²⁺ from the sarcoplasmic reticulum removes this block. Energy: creatine phosphate, anaerobic glycolysis (lactate), and aerobic respiration; slow-twitch fibers (aerobic, marathon) and fast-twitch fibers (anaerobic, sprint).\"]];\n\nS.beh=[\n[\"Lorenz and Tinbergen described behavior in terms of the “fixed action pattern” (FAP) and the “sign stimulus”; an example is the herring gull chick’s response to the red spot on its parent’s beak. Learning occurs through habituation (loss of response to an unimportant stimulus), classical conditioning (Pavlov: conditioned + unconditioned stimulus → response), operant conditioning (Skinner: reward and punishment), and observational learning. Imprinting occurs during a sensitive period and is later almost irreversible.\",\"The nature-versus-nurture debate is today seen as an interaction; the song of songbirds has a general innate predisposition, but they learn the local dialect from their own species (for example, from the father). In the brain, the cortex and hippocampus are involved in forming memory, and dopamine in the reward system mediates reinforcement. Chimpanzees fish termites out of their mound with a stick, and tool culture differs among groups.\"],\n[\"Chemical communication with pheromones has the longest range: the male silkworm moth can sense the female’s bombykol molecule from several kilometers away. Acoustic communication in crickets, frogs, and birds serves to attract mates and defend territory. The honeybee dance (Karl von Frisch, Nobel Prize 1973): the round dance signals a nearby source and the figure-eight waggle dance a distant one; the angle of the dance relative to vertical gives the angle of the food source relative to the sun, and the duration of the dance gives the distance.\",\"A signal must be honest or reliable, otherwise the receiver will ignore it. In mimicry, deceptive communication also exists; for example, female Photuris fireflies imitate the mate-attraction light of another species and prey on the males that come. Background noise changes the pitch of song, as in urban birds.\"],\n[\"Migration is triggered by the biological clock, environmental cues (day length), and hormones. The sea turtle uses the magnetic field (inclination and intensity) as a magnetic map. Birds use the sun, the stars, and eye cryptochrome to sense the field. Salmon return by the smell of their natal river. The monarch butterfly migrates about 4000 km over several generations.\",\"The circadian clock in mammals is located in the suprachiasmatic nucleus of the hypothalamus, and with clock genes (PER and CLOCK) forms a feedback loop of about 24 hours. Light receptors (melanopsin) in the retina synchronize it with daylight. The hormone melatonin is released at night. Jet lag and night work disrupt this clock.\"],\n[\"Hamilton’s rule: an altruism gene spreads when rB > C (r is the coefficient of relatedness, B the benefit to the recipient, and C the cost to the actor). In bees and ants, because of haplodiploidy, sisters share 75% of their genes, which explains worker sterility. Another reason for altruism is reciprocity (a vampire bat that gives food to a hungry roostmate). The naked mole-rat has a society with a queen and is one of the few mammals with this pattern (eusociality).\",\"Sociality has benefits and costs: better defense and group hunting, but also competition and disease transmission. Dominance hierarchies arise through competition so that conflict is reduced (for example, the pecking order in chickens). Cooperative care of young (in elephants and some birds) and teaching (as in meerkats and lions) also occur.\"],\n[\"In Trivers’s theory, the sex that invests more in parental care (usually the female) is choosier, and the other sex competes for access. The peacock’s tail is an example of Zahavi’s “handicap principle”: it shows that its owner has survived in spite of it. Sexual selection has two types: intrasexual competition (deer antlers) and mate choice by the opposite sex (peacock’s tail). In some species the sex roles are reversed, as in the seahorse, where the male becomes pregnant.\",\"Mating systems: monogamy (most birds), polygyny, and polyandry. Territoriality protects resources. Parental care raises the cost of future reproduction. Some males use a “sneaker” tactic and mate without display; sperm also compete (sperm competition).\"]];\n\nS.evo=[\n[\"Darwin, with his idea of “descent with modification,” and Wallace, independently of him, proposed natural selection. A simple mathematical model: the change in allele frequency in one generation, Δp ≈ s·p·q/w̄ (in the simplest case), depends on the selection coefficient (s) and on the allele frequencies; relative fitness (w) is the average number of surviving offspring. Selection takes three forms: directional (favoring one extreme), stabilizing (favoring the middle, as with human birth weight) and disruptive (favoring both extremes, as with the beak of the African seedcracker finch). The peppered moth (Biston betularia) is the classic example of directional selection during the Industrial Revolution.\",\"Inclusive fitness (Hamilton) includes one’s offspring and relatives. Selection may act on genes, individuals or groups, but evolutionary change is always measured at the level of allele frequency in a population. Intense human-driven selection (artificial selection) in plants and livestock offers clear examples: maize from the wild grass teosinte and dogs from wolves. A well-documented example is the emergence of drug resistance in HIV and in bacteria within just a few years.\"],\n[\"Fossils are dated by radiometric methods (carbon-14 for up to 50 thousand years, uranium–lead for up to billions of years). Transitional animals include Tiktaalik (375 million years old, a fish with a neck and arm bones), Archaeopteryx (feathers and teeth), and the fossils of amphibious whales (Pakicetus, Ambulocetus). Homology ranges from the basic structure of the five-fingered limb to the shared Hox genes; structures with the same function but different origins (analogy), such as the wings of birds and insects, result from convergent evolution.\",\"Molecular evidence: the genetic code is universal, and DNA-repair and ribosomal genes are conserved. Humans carry the vitamin C gene (GULO) as an inactivated pseudogene; the same mutation is found in related primates. Human chromosome 2 arose from the fusion of two chromosomes of a chimpanzee-like ancestor (23 pairs versus 24). Biogeographical evidence: most Australian mammals are marsupials, and island animals are often endemic.\"],\n[\"Modes of speciation: allopatric (after geographic separation), sympatric, and parapatric (at the border between two populations). Prezygotic barriers: habitat, temporal, behavioral, mechanical and gametic isolation. Postzygotic barriers: hybrid inviability, hybrid sterility (the mule) and hybrid breakdown. Polyploidy in plants (an increase in the number of chromosome sets, often after hybridization) can create a new species in a single generation; bread wheat is a hexaploid (2n=42) derived from three ancestral species.\",\"Adaptive radiation: the cichlids of Lake Victoria produced about 500 species in less than 15 thousand years. Darwin’s finches (18 species) in the Galápagos Islands changed the length and depth of their beaks to match their food, and Peter and Rosemary Grant observed beak size changing during the drought of 1977. A hybrid zone between two closely related species is a place where the reinforcement of reproductive barriers can be studied.\"],\n[\"Hardy–Weinberg: p + q = 1 and p² + 2pq + q² = 1. If 1 person in 10,000 has a recessive disease, then q² = 0.0001, q = 0.01, and the carrier frequency 2pq ≈ 2%. Five factors cause change: genetic drift, gene flow, mutation, nonrandom mating and selection. Drift is stronger in small populations and leads to the fixation or loss of an allele. Founder effect: the high frequency of certain diseases in isolated populations (for example, Huntington’s disease around Lake Maracaibo).\",\"Bottleneck effect: about 10 thousand years ago the cheetah went through a severe population bottleneck, and its genetic diversity is very low (skin grafts between individuals are not rejected). Mutation is the ultimate source of variation, but most mutations are neutral or harmful (Kimura’s neutral theory). Gene flow homogenizes populations, and geographic isolation interrupts it. Inbreeding (mating between relatives) increases the frequency of homozygotes and exposes recessive diseases.\"],\n[\"The hominin lineage split from the chimpanzees about 6–7 million years ago (Sahelanthropus, Orrorin). Australopithecus afarensis (Lucy, 3.2 million years old) was bipedal and had a brain volume of about 450 cm³. Homo habilis made stone tools (about 2 million years ago); Homo erectus (brain volume 850–1100 cm³) used fire and migrated out of Africa; and Homo sapiens appeared 300 thousand years ago (Jebel Irhoud, Morocco); our brain volume is about 1350 cm³.\",\"Ancient DNA analysis has shown that non-African humans carry 1–2% Neanderthal DNA and some Oceanian populations carry 3–6% Denisovan DNA. Genetic diversity is greater in Africa than on other continents, which is consistent with the out-of-Africa migration and the founder effect. Human evolution is not linear; several species lived at the same time. In Iran, the Bisotun and Warwasi caves contain evidence of Mousterian tools (made by Neanderthals).\"],\n[\"Phylogenies are built with methods such as maximum parsimony (fewest changes), maximum likelihood and Bayesian inference, based on morphological characters or DNA sequences. Shared derived characters (synapomorphies) define a clade. Monophyly means an ancestor and all of its descendants; fishes and reptiles in the traditional sense are paraphyletic groups, because birds descended from reptiles and tetrapods from fishes.\",\"The molecular clock estimates divergence times from the relatively constant rate of neutral mutations and is calibrated with fossils. Horizontal gene transfer in bacteria turns the tree into a network. Endosymbiotic theory shows that some branches (the eukaryotes) arose from the merging of branches. According to recent research, LUCA (the last universal common ancestor) lived about 3.5–4.2 billion years ago.\"]];\n\nS.tax=[\n[\"By comparing 16S/18S rRNA sequences, Carl Woese proposed the three domains (1990). Archaea have ribosomes and a transcription machinery similar to those of eukaryotes (complex RNA polymerase, histones), but a cell structure similar to that of bacteria. Their membranes have ether linkages and phytanyl chains, and they live in extreme environments (thermophiles, halophiles, methanogens). The discovery of Asgard archaea has shown that eukaryotes arose from within the archaea.\",\"Bacteria have the greatest metabolic diversity: photoautotrophs, chemoautotrophs (nitrifiers), heterotrophs and anaerobes. Eukarya includes protists, plants, fungi and animals. Fungi and animals are more closely related to each other than to plants (the opisthokont group). Viruses have no place in the tree of life because they are not cells.\"],\n[\"Classification has 8 main levels: domain, kingdom, phylum, class, order, family, genus, species (plus sublevels). Rules of nomenclature (ICZN and ICN): a Latin binomial scientific name, with the genus capitalized and the species in lowercase, in italics; the first validly published name has priority. A dichotomous key is used for identification. DNA barcoding with the COI gene (animals) or rbcL and matK (plants) identifies species.\",\"Modern classification is phylogeny-based and splits up groups that are not monophyletic. Example: birds are nested within the dinosaurs (theropods). Common names can be misleading (starfish and jellyfish are not fish). Changes in classification are normal and are revised as new data arrive.\"],\n[\"The biological species concept (Mayr): groups of naturally interbreeding populations that are reproductively isolated from other such groups. Limitations: asexual organisms, fossils and species that hybridize (oaks, wolves and coyotes). Other concepts: morphological, ecological (niche), phylogenetic and recognition. A ring species: for example, the circumpolar ring of gulls, in which neighboring populations interbreed but the two ends of the ring do not.\",\"Cryptic species look alike but are genetically distinct, and DNA has revealed many of them. Hybrids are a challenge for classification: the mule (horse × donkey) and the liger. Keystone species and umbrella species (such as the cheetah and the leopard) are important in conservation.\"],\n[\"The background extinction rate is about 0.1–1 species per million species-years, and the current rate is estimated at 100–1000 times higher. The five previous mass extinctions: Ordovician, Devonian, Permian (96% of marine species), Triassic and Cretaceous (the dinosaurs, 66 million years ago). The current drivers (HIPPO): habitat destruction, invasive species, pollution, human population and overexploitation. Species–area relationship: with a 90% reduction in area, about half of the species are lost.\",\"Red List categories: Least Concern (LC), Near Threatened (NT), Vulnerable (VU), Endangered (EN), Critically Endangered (CR), Extinct in the Wild (EW) and Extinct (EX). Conservation is in situ (parks) or ex situ (zoos, seed banks). Successes include the California condor, the sea otter and the bison. The population of the Asiatic cheetah in Iran is fewer than 50 individuals, and road deaths and a scarcity of prey are its main threats.\"],\n[\"Myers’s hotspot criteria: at least 1,500 endemic plant species and the loss of 70% of the original habitat. The world has 36 hotspots, which make up about 2.5% of the land area and hold more than half of endemic plants and 43% of terrestrial vertebrates. Iran includes parts of the Iran–Anatolian and Caucasus hotspots. The Hyrcanian forests (about 50 million years old) became a World Heritage Site in 2019.\",\"Biodiversity is studied at three levels: genetic, species and ecosystem. Indices such as the Shannon index, H = −Σ pᵢ ln pᵢ, measure diversity. Ecosystem services include pollination, water purification, carbon storage and pest control. High diversity makes an ecosystem stable against disturbance (the insurance hypothesis).\"]];\n\nS.eco=[\n[\"Levels: organism → population → community → ecosystem → biome → biosphere. In population ecology, density, dispersion (uniform, random, clumped) and age structure (age pyramid) are described. The ecological niche is the set of conditions and resources a species needs. Competitive exclusion principle (Gause): two species with the same niche cannot coexist stably. Coexistence occurs through niche partitioning.\",\"Sampling methods: quadrats and transects for density; the mark–recapture method (Lincoln–Petersen) for mobile animals, with N = (M × C)/R. Example: 50 marked, and in the second capture 40 animals of which 10 are marked → N = 50×40/10 = 200. Keystone species and ecosystem engineers (the beaver) determine community structure. Ecological succession: primary (on bare rock) and secondary (after a fire) up to the climax community.\"],\n[\"Gross primary production (GPP) minus plant respiration equals net primary production (NPP). The efficiency of energy transfer between trophic levels is about 5–20% (average 10%); warm-blooded animals have lower efficiency than cold-blooded ones. For this reason food chains have 3–5 links and top carnivores are few. Pyramids: numbers, biomass and energy; the energy pyramid always decreases from base to apex, but the pyramid of numbers or biomass may be inverted (phytoplankton).\",\"Biomagnification: the pesticide DDT (in fatty tissue) and methylmercury (in muscle proteins) accumulate, and their concentration multiplies at each level; the thinning of eagle eggshells was an example. Decomposers (bacteria and fungi) mineralize dead organic matter. Oxygen-poor water (a dead zone) is produced in estuaries by algal blooms resulting from nitrogen and phosphorus fertilizers.\"],\n[\"Carbon cycle: the large reservoirs are in limestone and fossil fuels; the atmosphere holds about 800 gigatons of carbon. The atmospheric CO₂ concentration has risen from about 280 ppm before the industrial era to more than 420 ppm. Nitrogen cycle: fixation (N₂ → NH₃ by bacteria and lightning), ammonification (decomposition), nitrification (NH₄⁺ → NO₂⁻ → NO₃⁻ by Nitrosomonas and Nitrobacter) and denitrification (NO₃⁻ → N₂). The Haber–Bosch process made industrial fertilizer production possible and transformed the nitrogen cycle.\",\"The phosphorus cycle is sedimentary and has no atmospheric phase; phosphorus is the limiting factor in many waters. The water cycle proceeds through evaporation, condensation and precipitation. Eutrophication: nutrients → algal bloom → death of algae and oxygen consumption by bacteria → death of aquatic life. Ocean acidification (absorption of CO₂, with pH falling from 8.2 to 8.1) makes it harder for shells and coral skeletons to form.\"],\n[\"The exponential model dN/dt = rN (r is the intrinsic rate of increase) and the logistic model dN/dt = rN(K − N)/K, which has its maximum growth at N = K/2. r-strategists (high birth rate, short life, no parental care: insects and weeds) and K-strategists (few offspring, parental care, long life: elephants and humans). Life tables and survivorship curves (type I like humans, type II like birds, type III like oysters and fish).\",\"The predator–prey relationship (Lotka–Volterra) produces periodic oscillations: the snowshoe hare and the Canadian lynx, with a cycle of about 10 years. Density-dependent factors (competition, disease, predation) and density-independent factors (weather). Human population growth went from 1 billion in 1800 to 8 billion in 2022; the demographic transition model describes a decline in death rates followed by a decline in birth rates.\"],\n[\"Terrestrial biomes: tropical rainforest (more than 2,000 mm of rainfall, poor soil), grassland and savanna, desert (less than 250 mm), chaparral, temperate deciduous forest, taiga and tundra (permafrost). Iran has 11 of the 13 Köppen climates. Aquatic biomes: oceans (71% of Earth’s surface), coral reefs (less than 1% of the sea floor but 25% of marine species), estuaries and wetlands. The photic zone, down to 200 m, supports photosynthesis.\",\"Marine zones: the water column (pelagic) and the bottom (benthic), the deep sea, and hydrothermal vents where chemosynthetic bacteria form the base of the food chain. Wetlands are protected by the Ramsar Convention (signed in 1971 in the Iranian city of Ramsar). Lake Urmia is an example of a water crisis, with a loss of more than 80% of its area within two decades.\"],\n[\"The natural greenhouse effect makes the Earth about 33 degrees warmer than it would be without it. Greenhouse gases: CO₂ (about 75% of human-made greenhouse gases), CH₄ (28–30 times more potent over 100 years), N₂O and fluorinated gases. Global mean temperature is about 1.3–1.4 degrees above the preindustrial period, and the Paris Agreement targets 1.5 degrees. Positive feedbacks: melting ice and reduced reflectivity (albedo), and the release of methane from permafrost.\",\"Biological consequences: shifts in species ranges toward the poles and higher elevations, mismatches in timing (phenology) between flowers and pollinators, coral bleaching and the spread of diseases. Solutions: reducing emissions (renewable energy), carbon sequestration (forests, wetlands, soil), adaptation and habitat protection. The carbon footprint is calculated as CO₂ equivalent.\"]];\n\nS.bio=[\n[\"Genetic engineering: type II restriction enzymes (EcoRI cuts GAATTC) create sticky ends. A plasmid vector contains an ori, a resistance marker gene (for example ampR) and a multiple cloning site. Bacteria are transformed by heat shock or electroporation and selected with an antibiotic; the lacZ marker (blue–white colonies) shows successful insertion. In plants, Agrobacterium tumefaciens (Ti plasmid) is used to transfer genes.\",\"Examples: recombinant insulin (1978), growth hormone, factor VIII, the hepatitis B vaccine, Bt cotton (an insect-killing protein) and Golden Rice (beta-carotene). Gene therapy with a viral vector (adeno-associated virus, AAV) treats diseases such as spinal muscular atrophy. Challenges: safety, the vector, the insertion site and cost.\"],\n[\"Steps of PCR: denaturation at 94–98 degrees, primer annealing at 50–65 degrees, extension at 72 degrees with Taq polymerase (from Thermus aquaticus). After n cycles, 2ⁿ copies; 30 cycles give about a billion copies. RT-PCR starts from RNA, and qPCR uses a fluorescent dye to measure the starting amount. Agarose gel electrophoresis: DNA is negatively charged and moves toward the positive pole; smaller fragments move faster.\",\"Sanger sequencing uses chain-terminating dideoxynucleotides; next-generation sequencing (Illumina) reads billions of short fragments in parallel, and a human genome can be sequenced for under $1,000 in one day. Nanopore sequencing reads long molecules. Other applications: DNA fingerprinting with short tandem repeats (STRs) in forensic medicine and paternity testing.\"],\n[\"Stem cells have two properties: self-renewal and differentiation. Classification: totipotent (zygote), pluripotent (embryonic), multipotent (bone marrow) and unipotent. Shinya Yamanaka made induced pluripotent stem cells with four factors (Oct4, Sox2, Klf4, c-Myc) and received the Nobel Prize in 2012. These cells are used for disease modeling, drug testing and, in the future, autologous transplantation. Organoids are three-dimensional organ-like structures.\",\"Cloning: transferring the nucleus of an adult cell into an enucleated egg (SCNT) produced Dolly the sheep in 1996. Therapeutic and reproductive cloning; the latter is banned in humans. Challenges: tumor risk, transplant rejection, embryo ethics. Umbilical cord blood stem cells are used for blood diseases.\"],\n[\"Databases: GenBank, UniProt and PDB. BLAST compares a sequence against a database, and the E-value shows the number of chance matches expected. Multiple sequence alignment, phylogenetic tree construction and gene prediction from a genome are among the main tasks. RNA-seq gene expression analysis involves millions of reads and complex statistics for comparing groups.\",\"AlphaFold 2 (2020) predicts protein structure from sequence with accuracy close to experiment, and Demis Hassabis and John Jumper received the Nobel Prize in Chemistry in 2024; its database holds structures of more than 200 million proteins. Drug design and personalized medicine based on a patient’s genome are advancing. Limitations: data quality, bias and the interpretability of models.\"],\n[\"In agriculture: plants resistant to herbicides (glyphosate), to insects (Bt) and to drought, and plants with higher nutritional value. Industrial fermentation uses yeast and bacteria to produce ethanol, antibiotics, citric acid and enzymes. In bioremediation, bacteria such as Pseudomonas break down or immobilize oil and metals. A bioreactor provides a controlled environment of temperature, pH and oxygen for large-scale fermentation.\",\"Ethical and legal issues: labeling, food safety, gene flow to wild relatives, intellectual property over seeds, and access to food. Synthetic biology builds designed genetic circuits. Biosafety levels 1–4 are applied to different microbes.\"],\n[\"The scientific method is an iterative cycle: observation, question, hypothesis, prediction, experiment, analysis and revision. A good experiment has an independent variable, a dependent variable, controlled variables, a control group and replication with an adequate sample size. Statistics: mean, standard deviation and tests such as t and χ²; a p-value below 0.05 means that, if the null hypothesis is true, the probability of observing data at least this extreme is under 5%. Correlation does not necessarily imply causation.\",\"The light microscope has a resolving power of about 0.2 µm and a maximum useful magnification of about 1500×; the transmission electron microscope reaches 0.1 nm, and the SEM shows three-dimensional surfaces. Fluorescence microscopy with green fluorescent protein (GFP) tracks proteins in living cells. Centrifugation separates organelles by density and size. Cell culture and staining are other common tools.\"]];\n\n(function(){\nvar ch={id:\"org\",h:0,name:\"Organs of the Body\",hl:\"Organs\",tag:\"Anatomy\",scale:\"1–30 cm\",\nintro:\"Each organ combines several tissues to perform a specific job. Here you can read about the twelve main organs of the human body one by one: location, structure, cells, function, and common diseases.\",\ntopics:[\n[\"Brain\",\"The brain is the body’s control center and sits inside the skull. It weighs about 1.3–1.4 kg and contains roughly 86 billion neurons and a similar number of supporting cells (neuroglia). Its job is to receive sensory information, process it, make decisions, form memories and emotions, and control movement, as well as regulate vital functions such as breathing.\",[\"Cerebrum\",\"Cerebellum\",\"Brainstem\",\"Hippocampus\",\"Blood–brain barrier\"]],\n[\"Heart\",\"The heart is a muscular pump about the size of a fist, weighing around 300 g, located between the two lungs and slightly to the left. It beats about 100,000 times a day and circulates blood through two circuits, the pulmonary and the systemic. It has four chambers (two atria and two ventricles) and four valves.\",[\"Myocardium\",\"Valve\",\"Coronary artery\",\"Sinoatrial node\"]],\n[\"Lungs\",\"The lungs are two spongy organs in the chest that exchange oxygen and carbon dioxide between air and blood. The right lung has three lobes and the left has two (to make room for the heart). Each lung is covered by two layers of pleura.\",[\"Bronchus\",\"Alveolus\",\"Pleura\",\"Surfactant\"]],\n[\"Liver\",\"The liver is the largest internal organ (about 1.5 kg) and lies in the upper right abdomen. It performs more than 500 vital functions: making bile and blood proteins, storing glycogen and vitamins, detoxifying substances, and regulating blood sugar and fats.\",[\"Hepatocyte\",\"Bile\",\"Albumin\",\"Portal vein\"]],\n[\"Stomach\",\"The stomach is a J-shaped muscular sac that temporarily holds food, begins protein digestion with acid and enzymes, and churns the food into chyme. Its capacity is about 1–1.5 liters, and it can expand to several times that size.\",[\"Stomach acid\",\"Pepsin\",\"Gastrin\",\"Pylorus\"]],\n[\"Small intestine\",\"The small intestine is a tube about 6 m long in which final digestion and more than 90% of nutrient absorption take place. It has three parts, the duodenum, jejunum, and ileum, and its wall has villi and microvilli to increase the absorptive surface.\",[\"Duodenum\",\"Villus\",\"Microvillus\",\"Chylomicron\"]],\n[\"Large intestine\",\"The large intestine is about 1.5 m long. It absorbs the remaining water and salts, and forms and stores feces. Trillions of bacteria, most of them beneficial, live in it. It includes the cecum, the colon (ascending, transverse, descending, and sigmoid), the rectum, and the anus.\",[\"Cecum\",\"Colon\",\"Microbiome\",\"Appendix\"]],\n[\"Pancreas\",\"The pancreas is a gland about 15 cm long behind the stomach. It makes both digestive enzymes (the exocrine part) and hormones that regulate blood sugar (the endocrine part), so it is a digestive gland and a hormonal gland at the same time.\",[\"Islets of Langerhans\",\"Insulin\",\"Glucagon\",\"Trypsin\"]],\n[\"Kidneys\",\"The kidneys are two bean-shaped organs located behind the peritoneum (retroperitoneal), against the back wall of the abdomen. They filter the blood, excrete waste, regulate the volume and composition of body fluids, blood pressure, and pH, and make hormones. Each one weighs about 150 g and is about 11 cm long.\",[\"Nephron\",\"Glomerulus\",\"Ureter\",\"Bladder\"]],\n[\"Skin\",\"The skin is the largest organ of the body (about 1.5–2 m² and 15% of body weight). It is a protective barrier against microbes, water loss, and UV radiation; it senses touch and temperature, regulates body temperature, and makes vitamin D.\",[\"Epidermis\",\"Dermis\",\"Melanin\",\"Sweat gland\"]],\n[\"Eye\",\"The eye is the organ of vision: a sphere about 24 mm in diameter that focuses light and converts it into nerve signals. The cornea and lens project an inverted image onto the retina, and the brain interprets it.\",[\"Cornea\",\"Lens\",\"Retina\",\"Optic nerve\"]],\n[\"Ear\",\"The ear does two jobs: hearing and maintaining balance. It has three parts: the outer, middle, and inner ear. In it, a sound wave is converted into mechanical vibration and then into a nerve signal.\",[\"Eardrum\",\"Ossicle\",\"Cochlea\",\"Semicircular canals\"]]],\nfact:\"If all the villi of the small intestine were spread out flat, the absorptive surface would be about 30 m², more than ten times the surface of the skin. Likewise, the brain, though only about 2% of body weight, uses about 20% of the body’s energy.\",\nquiz:[\n{q:\"Which is the largest internal organ of the body?\",o:[\"Brain\",\"Liver\",\"Lung\",\"Stomach\"],a:1,e:\"The liver weighs about 1.5 kg.\"},\n{q:\"In which organ does most nutrient absorption take place?\",o:[\"Stomach\",\"Large intestine\",\"Small intestine\",\"Kidney\"],a:2,e:\"The villi and microvilli of the small intestine greatly increase the absorptive surface.\"},\n{q:\"What is the structural and functional unit of the kidney called?\",o:[\"Alveolus\",\"Nephron\",\"Hepatocyte\",\"Neuron\"],a:1,e:\"Each kidney has about one million nephrons.\"}]};\nvar X1=[\n{m:\"The cerebrum is the largest part of the brain and has two hemispheres joined by the corpus callosum. Each hemisphere has four lobes: frontal (planning, voluntary movement, Broca’s speech area), parietal (touch and spatial orientation), temporal (hearing, memory, language), and occipital (vision). Three layers of meninges (dura mater, arachnoid mater, and pia mater) and cerebrospinal fluid (about 150 mL) protect the brain.\",k:[\"The cerebellum controls balance and coordination of movement\",\"The hypothalamus regulates temperature, thirst, and hormones\",\"The brainstem controls breathing and heart rate\"],x:\"Damage to Broca’s area in the frontal lobe impairs the ability to produce speech, but the person still understands meaning.\"},\n{m:\"The heart wall has three layers: the epicardium (outer), myocardium (heart muscle), and endocardium (inner). The right atrium receives oxygen-poor blood from the venae cavae, the right ventricle sends it to the lungs, the left atrium receives oxygen-rich blood from the lungs, and the left ventricle (with a thicker wall) pumps it through the aorta to the body. The heart itself is nourished by the coronary arteries.\",k:[\"Valves keep blood flowing in one direction\",\"The heartbeat starts in the sinoatrial node\",\"The left ventricle is the strongest chamber\"],x:\"Blockage of a coronary artery causes a heart attack, because part of the heart muscle does not receive oxygen.\"},\n{m:\"Air passes from the trachea into the two main bronchi and, after about 23 branchings, reaches the bronchioles and alveolar sacs. The alveolar wall is only one cell thick (type I pneumocytes) and lies next to a capillary. Type II pneumocytes make surfactant. Total lung capacity is about 6 liters, but in quiet breathing only about half a liter moves in with each breath.\",k:[\"The pleura reduces friction between the lung and the chest wall\",\"Cilia in the airways sweep dust upward\",\"The diaphragm is the main muscle of inhalation\"],x:\"In asthma, the bronchi narrow and become inflamed, and breathing out becomes difficult.\"},\n{m:\"The liver has two sources of blood: the portal vein (about 75%, full of nutrients from the intestine) and the hepatic artery (25%, oxygen-rich). Its structural unit is the hexagonal liver lobule, in which hepatocytes are arranged as plates around a central vein, and blood flows past them in sinusoids. Bile (500–1000 mL per day) is collected in the bile ducts and concentrated in the gallbladder.\",k:[\"The liver converts ammonia to urea\",\"Cytochrome P450 enzymes break down drugs\",\"The liver has a high capacity for regeneration\"],x:\"After part of the liver is removed, the rest regrows to a large extent within a few weeks.\"},\n{m:\"The stomach has four regions: the cardia, fundus, body, and pylorus. Gastric glands contain a variety of cells: parietal cells (HCl and intrinsic factor), chief cells (pepsinogen), mucous cells (mucus and bicarbonate), and G cells (gastrin). The pH of the stomach is about 1–2, and the mucus layer protects the wall. Food stays for 2–6 hours and enters the duodenum as chyme.\",k:[\"The stomach lining is renewed every 3–5 days\",\"Intrinsic factor is needed for B12 absorption\",\"The pylorus regulates the exit of food\"],x:\"The bacterium Helicobacter pylori causes many stomach ulcers; Marshall and Warren received the Nobel Prize in 2005 for discovering it.\"},\n{m:\"The duodenum (25 cm) receives bile and pancreatic juice; the jejunum absorbs the most, and the ileum absorbs vitamin B12 and bile salts. Its wall has circular folds, villi (each containing a capillary and a lymphatic vessel called a lacteal), and microvilli, which bring the surface area to about 30 m². Stem cells in the crypts divide, and the lining is renewed every 3–5 days.\",k:[\"Fats are absorbed through the lymph\",\"Peyer’s patches are part of the gut’s immune system\",\"Brush-border enzymes complete digestion\"],x:\"In celiac disease, gluten destroys the villi and reduces absorption.\"},\n{m:\"The colon absorbs about 1.5 liters of water per day and forms feces; mass movements push it toward the rectum. Haustra (pouches) and the longitudinal muscle (taeniae coli) give it a puckered look. Gut bacteria ferment fiber and make vitamin K and short-chain fatty acids. Transit time is usually 24–72 hours.\",k:[\"The appendix is a lymphoid projection at the beginning of the colon\",\"Fiber is essential for colon health\",\"Feces are made of bacteria, fiber, and shed cells\"],x:\"Screening (colonoscopy) can catch colorectal cancer early and remove precancerous polyps before they become cancer.\"},\n{m:\"The exocrine part (about 98%) is made of acini that secrete the inactive proenzymes trypsinogen and chymotrypsinogen as well as the active enzymes lipase and amylase; trypsinogen is activated by enterokinase in the duodenum. Its ducts secrete bicarbonate to neutralize stomach acid. The endocrine part is the islets of Langerhans: alpha cells (glucagon), beta cells (insulin), delta cells (somatostatin), and PP cells.\",k:[\"Insulin lowers blood sugar\",\"Glucagon raises blood sugar\",\"Protein-digesting enzymes are made in an inactive form\"],x:\"In pancreatitis, enzymes are activated inside the gland itself and digest the tissue.\"},\n{m:\"The kidney has three regions: the cortex, the medulla with its renal pyramids, and the renal pelvis. The renal artery delivers about 20–25% of cardiac output (about 1.2 L/min). Urine passes from the pelvis through the ureter to the bladder and then out through the urethra. The kidney also makes erythropoietin (red blood cell production), renin, and the active form of vitamin D.\",k:[\"The kidneys filter about 180 liters of fluid per day\",\"The bladder’s capacity is about 400–600 mL\",\"Kidney stones are made of crystals of salts\"],x:\"In dialysis, a machine takes over the kidney’s job of cleaning waste from the blood.\"},\n{m:\"The skin has three layers. The epidermis (without blood vessels) has five layers, and keratinocytes move from the basal layer to the surface, die after about 28 days, and are shed. Melanocytes make melanin, which protects DNA against UV. The dermis contains collagen, blood vessels, nerves, hair follicles, and sweat and oil glands. The hypodermis is a layer of fat that insulates the body.\",k:[\"Langerhans cells are the immune cells of the skin\",\"The skin regulates temperature through sweating and widening of blood vessels\",\"Sunlight starts vitamin D production\"],x:\"Melanoma is a cancer of the pigment-making cells, and detecting it early can save a person’s life.\"},\n{m:\"Light passes through the cornea (about two-thirds of the eye’s refractive power) and the lens. The ciliary muscles change the shape of the lens for near and far vision (accommodation). The retina has about 120 million rods (low-light vision, rhodopsin) and 6 million cones (color; three types). The macula with its central pit (fovea) has the sharpest vision, and the optic disc, where the optic nerve leaves the eye, is the blind spot.\",k:[\"The iris regulates the size of the pupil\",\"The aqueous humor maintains eye pressure\",\"Vitamin A is needed to make rhodopsin\"],x:\"In nearsightedness, the image falls in front of the retina and is corrected with a concave lens.\"},\n{m:\"The outer ear carries sound to the eardrum. In the middle ear, three ossicles (malleus, incus, and stapes; the smallest bones of the body) amplify the vibration and pass it to the oval window of the cochlea. In the cochlea (2.5 turns), fluid vibration shakes the basilar membrane, and about 16,000 hair cells of the organ of Corti generate a nerve signal. High frequencies are registered near the base of the cochlea and low ones at its tip. The human hearing range is about 20–20,000 Hz.\",k:[\"The Eustachian tube equalizes middle-ear pressure with the air\",\"The semicircular canals sense rotational movement of the head\",\"Hair cells do not regenerate in humans\"],x:\"Very loud sound damages the hair cells and causes permanent hearing loss.\"}];\nvar S1=[\n[\"Neurons receive signals with dendrites and send them along axons; their cell bodies lie in gray matter and their myelinated axons make up white matter. Glial cells: astrocytes help create and maintain the blood–brain barrier and regulate glucose and ion levels, oligodendrocytes make myelin, and microglia are the immune cells of the brain. The blood–brain barrier, formed by tight junctions between capillary endothelial cells, keeps most molecules from entering. The brain has little energy reserve; a few minutes without oxygen is harmful.\",\"Explicit memory is consolidated in the hippocampus and stored in the cortex; the amygdala evaluates emotions (fear). In learning, synapses change through long-term potentiation (LTP) and NMDA receptors. Alzheimer’s disease is associated with deposits of amyloid plaques and tau tangles and with loss of synapses; Parkinson’s disease with the death of dopamine neurons in the substantia nigra.\"],\n[\"Conducting tissue: sinoatrial node (primary pacemaker) → atrioventricular node (0.1-second delay so the ventricles can fill) → bundle of His → Purkinje fibers. Electrocardiogram (ECG): P wave (atrial depolarization), QRS complex (ventricles), and T wave (ventricular repolarization). Cardiac muscle cells are joined by intercalated discs and gap junctions and contract like a single unit (a syncytium). The heart has abundant mitochondria (30% of cell volume).\",\"Systole and diastole make up a 0.8-second cycle (at 75 beats per minute). The Frank–Starling law: greater stretch of the wall (preload) gives a stronger contraction. The load on the left ventricle (aortic pressure) is the afterload. Heart failure means inadequate pumping. Chronic high blood pressure thickens the ventricle wall. A high blood level of troponin indicates a heart attack.\"],\n[\"The conducting airways (down to the terminal bronchioles) hold about 150 mL of dead space, and exchange takes place only in the respiratory zone. The blood–air barrier is extremely thin (about 0.5 µm), and gases cross it by diffusion. The ventilation–perfusion (V/Q) ratio is important for optimal exchange; gravity changes it between the upper and lower parts of the lung. Pleural fluid maintains negative pressure, and air entering the pleural space (pneumothorax) makes the lung collapse.\",\"COPD (chronic bronchitis and emphysema) is often caused by cigarette smoke and destroys the airways and alveoli. In pulmonary fibrosis, the tissue becomes stiff. Lung cancer is the leading cause of cancer death worldwide. The lung’s defense system: mucus and cilia (the mucociliary escalator) and alveolar macrophages. Spirometry measures volumes: FEV₁ and FVC.\"],\n[\"The main cell of the liver is the hepatocyte, which makes up about 80% of the liver’s volume. Metabolic functions: gluconeogenesis and glycogenolysis (keeping blood sugar steady), making cholesterol and lipoproteins, the urea cycle (converting toxic NH₃ to urea), making clotting factors and albumin (plasma osmotic pressure), and storing iron and vitamins A, D, and B12. Phase I (cytochrome P450) and phase II (conjugation) make drugs and toxins water-soluble for excretion.\",\"Bilirubin from the breakdown of heme in red blood cells is conjugated in the liver and secreted with bile; its buildup in the blood causes jaundice. Hepatitis (viruses A through E, alcohol, toxins) is inflammation of the liver, and cirrhosis is replacement of liver tissue with scar tissue. Nonalcoholic fatty liver is common with obesity. Kupffer cells are the liver’s macrophages. Up to 70% of the liver can be removed, and it regenerates.\"],\n[\"Regulation of secretion: the cephalic phase (seeing and smelling food), the gastric phase (stretch and peptides → gastrin → HCl), and the intestinal phase (negative feedback). HCl activates pepsinogen and kills bacteria. The proton pump H⁺/K⁺-ATPase of the parietal cell secretes the acid, and drugs such as omeprazole inhibit it. The mucosa is protected by secretion of bicarbonate, mucus, and prostaglandins.\",\"Drugs such as aspirin reduce prostaglandin production and increase the risk of ulcers. Gastroesophageal reflux is caused by weakness of the lower esophageal sphincter and causes heartburn. Stomach cancer is linked to Helicobacter and a high-salt diet. Ghrelin (the hunger hormone) is secreted by the stomach, and leptin (satiety) by fat tissue.\"],\n[\"Final digestion: brush-border enzymes (maltase, sucrase, lactase, peptidases) break disaccharides and dipeptides into absorbable units. Absorption: glucose and galactose through SGLT1 (sodium-dependent), fructose through GLUT5, amino acids through sodium-dependent transporters, and fats as micelles and then chylomicrons. Iron and calcium (with the help of vitamin D) are absorbed mostly in the duodenum, and B12 in the ileum.\",\"Movements: segmentation (mixing) and peristalsis are coordinated by the enteric nervous system (the myenteric and submucosal plexuses). Gut hormones: secretin, CCK, GIP, and GLP-1 (the target of diabetes and weight-loss drugs). Lactose intolerance, Crohn’s disease, and celiac disease are common disorders.\"],\n[\"The colon lining has no villi, and its glands are full of goblet cells (mucus). Water absorption takes place by sodium transport and osmosis. Diarrhea results from reduced absorption or increased secretion, and constipation from slow movement. The microbiome mostly consists of bacteria from the phyla Bacteroidota and Firmicutes and the genus Bifidobacterium; fiber fermentation provides butyrate to colon cells and affects immunity and even mood (the gut–brain axis).\",\"The defecation reflex is triggered by stretch of the rectum and involves the internal (involuntary) and external (voluntary) sphincters. Polyps can turn into cancer over years (the adenoma–carcinoma sequence). Inflammatory bowel disease (Crohn’s disease and ulcerative colitis) involves an inappropriate reaction of the immune system. Fecal microbiota transplant is used for Clostridioides difficile infection.\"],\n[\"Hormonal control: cholecystokinin (CCK) from the duodenum stimulates enzyme secretion when fat enters, and secretin stimulates bicarbonate. High glucose releases insulin from β cells (the ATP-sensitive K⁺ channel closes, the cell depolarizes, Ca²⁺ enters, and vesicles are released). Insulin increases glucose entry into muscle and fat (GLUT4) and glycogen synthesis. Glucagon does the opposite, breaking down glycogen in the liver.\",\"Type 1 diabetes: autoimmune destruction of β cells (insulin is needed); type 2: insulin resistance and gradual failure of β cells. HbA1c shows the average blood sugar of the past 2–3 months. Transplantation of islets of Langerhans and the insulin pump are among the treatments. Pancreatic cancer is often diagnosed late.\"],\n[\"Nephron: Bowman’s capsule and glomerulus (capillaries with pores, a negatively charged basement membrane, and podocyte cells) → proximal convoluted tubule (reabsorption of 65% of sodium and water, and of glucose and amino acids by secondary transport) → loop of Henle (descending limb permeable to water, ascending limb impermeable to water and actively pumping out salt) → distal tubule → collecting duct. Through the countercurrent mechanism and urea, the medulla becomes concentrated (up to 1200 mOsm), and the body can make concentrated urine. Normal GFR is about 125 mL per minute.\",\"Regulation: ADH inserts aquaporin-2 in the collecting duct and increases water reabsorption; aldosterone increases Na⁺ reabsorption and K⁺ excretion; ANP (from the atrium) increases sodium excretion. The kidney regulates pH by excreting H⁺ and reabsorbing HCO₃⁻. Diseases: nephritis, stones, urinary tract infection, and chronic kidney failure (diabetes and high blood pressure are the main causes).\"],\n[\"The layers of the epidermis from the bottom: basal, spinous, granular, clear (only in the palms and soles), and cornified. Keratin makes the surface waterproof. Touch: Merkel, Meissner, Pacinian, and Ruffini receptors; pain and temperature: free nerve endings. Eccrine glands (sweat, temperature), apocrine glands (armpit, pheromones), and sebaceous glands (sebum). Hair and nails are keratin derivatives. In the heat, the skin can secrete up to 1–2 liters of sweat per hour for cooling.\",\"Wound healing: clotting, inflammation, proliferation (granulation tissue and migration of keratinocytes), and remodeling (collagen). A first-degree burn involves only the epidermis, a second-degree burn the dermis, and a third-degree burn the full thickness. UVB radiation triggers vitamin D synthesis, but in large amounts it causes DNA mutations (thymine dimers) and skin cancer (basal cell, squamous cell, and melanoma). The skin has its own microbiome.\"],\n[\"Light signal: in the dark, rhodopsin (opsin + retinal) is not activated, the rods are depolarized and release neurotransmitter; with a photon, retinal changes shape and activates a transducin cascade; phosphodiesterase breaks down cGMP, the channels close, and the cell hyperpolarizes. So, unusually, photoreceptors respond to light by hyperpolarizing. Three types of cones (blue, green, red) make color; red–green color blindness is X-linked.\",\"Optics: the refractive power of the cornea is about 43 diopters and of the lens 15–20. Farsightedness (image behind the retina, convex lens), astigmatism (uneven cornea), presbyopia (stiffening of the lens). Cataract is clouding of the lens, and glaucoma is high eye pressure that damages the optic nerve. The crossing of nerves at the optic chiasm means the right hemisphere sees the left visual field.\"],\n[\"Hearing pathway: vibration of the eardrum → ossicles (about 20-fold amplification) → oval window → perilymph fluid → basilar membrane → bending of hair-cell stereocilia → opening of ion channels → signal in the cochlear nerve → brainstem nuclei → thalamus → auditory cortex (temporal lobe). Outer hair cells amplify sound. Sound intensity is measured in decibels; ordinary conversation is about 60 decibels, and sound above 85 decibels becomes harmful after hours of exposure.\",\"Balance: the utricle and saccule (calcium carbonate crystals called otoliths) sense linear acceleration and gravity, and the three semicircular canals with fluid sense angular acceleration of the head. In benign paroxysmal positional vertigo (BPPV), the crystals are displaced and cause sudden vertigo. Middle-ear infection (otitis) is common in children. Hearing aids and cochlear implants (an electrode in the cochlea) compensate for severe hearing loss.\"]];\nvar i=D.findIndex(function(c){return c.id===\"human\"})+1;\nD.splice(i,0,ch);X.org=X1;S.org=S1;\n})();\n\nvar ADV={};\nvar NEWCH={\norgl:{id:\"orgl\",h:185,name:\"Cell Organelles\",hl:\"Organelles\",tag:\"Inside the cell\",scale:\"0.1–10 µm\",\nintro:\"Organelles are specialized components inside the cell, each with a particular job. Separating reactions into membrane-bound compartments increases the cell’s efficiency and control. This chapter looks at each organelle in detail.\",\ntopics:[\n{t:\"Nucleus\",d:\"The nucleus is one of the largest organelles of the eukaryotic cell and the keeper of the genome. The genetic material inside it exists as chromatin, and transcription and replication take place there.\",m:\"The nucleus is enclosed by two membranes that meet at certain points to form nuclear pores. Inside the nucleus is the nucleolus, the site where ribosomal subunits are made. The lamina, a layer of protein filaments on the inner surface of the membrane, maintains the shape of the nucleus. The nucleus is usually 5–10 µm across, and it is absent from mature mammalian red blood cells.\",adv:\"The nuclear pore is a complex of about 30 types of proteins called nucleoporins. It lets small particles pass freely, but large molecules pass only with an entry signal (NLS) and importin proteins. Active transport is driven by the RanGTP gradient. In a human cell, about 20,000 protein-coding genes are located in the nucleus. Heterochromatin is highly condensed and silent, whereas euchromatin is more open and active. During mitosis the nuclear envelope breaks down through phosphorylation of the lamina, and it re-forms in telophase. Mutations in the lamin A gene lead to progeria (premature aging).\\n\\nSubnuclear compartments such as Cajal bodies and nuclear speckles are specialized regions of RNA processing.\",k:[\"It has two membranes and nuclear pores\",\"The nucleolus makes ribosomes\",\"Condensed chromatin is silent and open chromatin is active\"],x:\"The mature human red blood cell has no nucleus, which leaves more room for hemoglobin.\",terms:[\"Nuclear envelope\",\"Nucleolus\",\"Chromatin\",\"Lamina\",\"Nuclear pore\"]},\n{t:\"Ribosome\",d:\"The ribosome is the cell’s protein-making factory and translates mRNA into a chain of amino acids. It has no membrane and is found in all cells.\",m:\"The ribosome consists of a large and a small subunit made of rRNA and protein. Bacterial ribosomes are 70S and eukaryotic ribosomes are 80S. Ribosomes are found both free in the cytosol and attached to the rough endoplasmic reticulum. Several ribosomes work on a single mRNA at the same time, forming a structure called a polyribosome.\",adv:\"The peptidyl transferase activity of the ribosome is carried out by rRNA, not protein; the ribosome is therefore a ribozyme, and this is considered evidence for the “RNA world” hypothesis. The ribosome has three sites: A (aminoacyl), P (peptidyl) and E (exit). Each second, a bacterial ribosome adds about 15–20 amino acids and a eukaryotic ribosome about 3–6. Antibiotics such as streptomycin and tetracycline inhibit the bacterial ribosome but not the human one. During translation, initiation and elongation factors (such as EF-Tu) improve accuracy by consuming GTP.\\n\\nThe mitochondrial ribosome resembles that of bacteria, which is one of the key pieces of evidence for the endosymbiotic theory.\",k:[\"It is the site of mRNA translation\",\"It is made of rRNA and protein\",\"It has no membrane\"],x:\"A typical human cell has millions of ribosomes, and pancreatic cells, which secrete large amounts of enzymes, have even more.\",terms:[\"rRNA\",\"70S and 80S\",\"A, P and E sites\",\"Polyribosome\"]},\n{t:\"Endoplasmic reticulum\",d:\"The endoplasmic reticulum (ER) is an extensive system of membrane-bound sacs and tubes that is connected to the nuclear envelope. It comes in two types, rough and smooth.\",m:\"The rough ER has ribosomes and makes proteins that are destined to be secreted, to be placed in membranes, or to go to lysosomes. The smooth ER has no ribosomes; it makes lipids, phospholipids and steroids, detoxifies toxins, and stores calcium in muscle cells. Secretory cells such as those of the liver and pancreas have an extensive ER.\",adv:\"Secretory proteins with a signal sequence are directed to the ER membrane by the signal recognition particle (SRP) and enter the ER lumen through a pore as they are being translated. In the ER lumen, chaperone proteins (such as BiP) help with folding, and initial glycosylation takes place. The accumulation of misfolded proteins activates the “unfolded protein response” (UPR), and under severe stress apoptosis is initiated. Cytochrome P450 enzymes in the smooth ER of the liver make drugs and toxins water-soluble. The sarcoplasmic reticulum in muscle releases calcium for contraction through ryanodine channels.\\n\\nTaking phenobarbital expands the smooth ER in the liver and produces drug tolerance.\",k:[\"Rough: protein synthesis; smooth: lipid synthesis\",\"It is connected to the nuclear envelope\",\"It plays a role in detoxification and calcium storage\"],x:\"The liver of people who drink heavily has a more extensive smooth ER, because it has adapted to greater detoxification.\",terms:[\"Rough ER\",\"Smooth ER\",\"Signal sequence\",\"UPR\"]},\n{t:\"Golgi apparatus\",d:\"The Golgi is the cell’s warehouse and distribution center: it modifies, sorts and ships the proteins and lipids that arrive from the ER.\",m:\"The Golgi apparatus consists of flattened membrane-bound sacs (cisternae). The entry face (cis) faces the ER and the exit face (trans) faces the cell membrane. Vesicles carry materials from the ER to the Golgi and from the Golgi to the membrane, to lysosomes, or out of the cell. The Golgi is very abundant in glandular cells. In plants it also plays a role in building the cell wall.\",adv:\"In the Golgi, glycosylation continues, O-linked sugars are added, and proteins receive destination tags, such as mannose-6-phosphate, which sends enzymes to the lysosome. In the absence of this tag, I-cell disease occurs, in which enzymes are secreted out of the cell instead of going to the lysosome. Vesicles are formed with COPII coats (ER to Golgi), COPI coats (return trip) and clathrin (from the trans-Golgi network), and SNARE proteins make the fusion of a vesicle with its target membrane specific. Regulated secretion requires a signal (such as a rise in calcium), as in the release of insulin.\\n\\nCamillo Golgi first saw this structure in neurons in 1898 using silver staining.\",k:[\"It modifies, packages and ships\",\"It has a cis face and a trans face\",\"It makes secretory vesicles\"],x:\"Goblet cells of the intestine secrete mucus using a large Golgi apparatus.\",terms:[\"Cisterna\",\"cis and trans\",\"Vesicle\",\"SNARE\"]},\n{t:\"Mitochondrion\",d:\"The mitochondrion is the cell’s power plant and makes most of the aerobic ATP. It has two membranes and its own DNA.\",m:\"The outer membrane is smooth, and the inner membrane has folds called cristae that increase its surface area. The space inside the inner membrane is called the matrix and contains the enzymes of the Krebs cycle. The space between the two membranes is where protons accumulate. The number of mitochondria is very high in energy-demanding cells such as heart muscle and liver. Mitochondria both divide and fuse with one another.\",adv:\"The electron transport chain has four complexes (I–IV) and pumps protons from the matrix into the intermembrane space. Complex V (ATP synthase) makes ATP as protons flow back, using about 4 protons per ATP. The uncoupling protein UCP1 in brown fat returns protons without making ATP and wastes the energy as heat (thermogenesis in newborns). Mitochondrial DNA is circular (about 16.5 thousand base pairs, 37 genes) and is almost always inherited from the mother, and mutations in it cause mitochondrial diseases. In apoptosis, the release of cytochrome c from the mitochondrion activates caspases. Mitochondria produce reactive oxygen species (ROS), and the damage they cause is linked to aging and some diseases.\\n\\nLynn Margulis’s endosymbiotic theory states that mitochondria arose from alphaproteobacteria that became symbionts inside a host cell.\",k:[\"Most ATP is made at the inner membrane\",\"It has circular DNA and its own ribosomes\",\"It is linked to the endosymbiotic theory\"],x:\"Heart muscle cells are about 30 percent mitochondria by volume.\",terms:[\"Cristae\",\"Matrix\",\"ATP synthase\",\"Thermogenesis\"]},\n{t:\"Chloroplast\",d:\"The chloroplast is the photosynthetic organelle of plants and algae and stores light energy in sugar.\",m:\"The chloroplast has an outer and an inner membrane. Inside it, flattened thylakoid sacs stacked on top of each other form grana, and the fluid around them is called the stroma. Chlorophyll is located in the thylakoid membrane. The light reactions take place in the thylakoid and the Calvin cycle in the stroma. A leaf cell has 20–100 chloroplasts.\",adv:\"The chloroplast is one member of the plastid family; the others include chromoplasts (the colors of fruits), leucoplasts, amyloplasts (starch storage) and etioplasts (in a plant grown in the dark). Plastids have circular DNA and 70S ribosomes and make some of their own proteins, but most of their genes have been transferred to the nucleus. The thylakoid membrane contains the two photosystems, cytochrome b6f and ATP synthase, and the proton gradient is built up in the thylakoid lumen. In the Calvin cycle, the enzyme rubisco makes up more than half of the soluble protein of the leaf. Chloroplasts reposition themselves in response to light, and in strong light they move to the edge of the cell to avoid damage.\\n\\nCyanobacteria (blue-green bacteria) are the evolutionary ancestors of the chloroplast.\",k:[\"A granum is made of thylakoids\",\"The light reactions occur in the thylakoid\",\"The chloroplast has its own DNA\"],x:\"In autumn, as chlorophyll breaks down, the yellow and orange carotenoid pigments become visible in leaves.\",terms:[\"Granum\",\"Stroma\",\"Chlorophyll\",\"Plastid\"]},\n{t:\"Lysosome and peroxisome\",d:\"These two small membrane-bound organelles make up the cell’s “recycling and detoxification” department. Lysosomes digest materials and peroxisomes neutralize toxic compounds.\",m:\"Lysosomes contain hydrolytic enzymes that work in an acidic environment (pH about 5). They digest engulfed particles, worn-out organelles and surplus molecules. Peroxisomes contain oxidizing enzymes that produce H₂O₂, and catalase converts it into water and oxygen. They are abundant in the liver and kidney and break down long-chain fatty acids.\",adv:\"The digestion of worn-out organelles is called autophagy, and Yoshinori Ohsumi received the 2016 Nobel Prize for discovering its mechanism. The autophagosome fuses with the lysosome. Defects in lysosomal enzymes cause storage diseases, such as Tay–Sachs disease (a deficiency of hexosaminidase A with accumulation of ganglioside in neurons) and Gaucher disease. The proton pump V-ATPase acidifies the lysosome. In Zellweger syndrome, the formation of functional peroxisomes is defective, and this leads to severe neurological impairment. In plants, glyoxysomes convert seed fat into sugar during germination.\\n\\nNeutrophils and macrophages have abundant lysosomes and kill microbes through the phagosome–lysosome pathway.\",k:[\"Lysosomes digest in an acidic environment\",\"The peroxisome breaks down H₂O₂ with catalase\",\"Autophagy is the recycling of organelles\"],x:\"The tail of a tadpole is gradually resorbed during metamorphosis with the help of lysosomal enzymes.\",terms:[\"Acid hydrolase\",\"Catalase\",\"Autophagy\",\"Phagosome\"]},\n{t:\"Vacuole and features of the plant cell\",d:\"The vacuole is a large membrane-bound sac that in plant cells takes up to 90 percent of the cell’s volume and plays a role in storing water and materials and in providing rigidity.\",m:\"The vacuole membrane (tonoplast) controls the entry and exit of materials. Vacuolar sap contains water, sugars, salts, the pigment anthocyanin and waste materials. The water pressure inside the vacuole pushes against the cell wall and creates turgor, which keeps leaves firm. In animal cells, only small food vacuoles are found, and contractile vacuoles occur in some protists.\",adv:\"Anthocyanins in the vacuole create the red to purple and blue colors of fruits and flowers, and their color changes with pH. The tonoplast has proton pumps and aquaporin channels. In salt-tolerant plants, salt accumulates in the vacuole so that the cell’s osmotic potential falls and water is absorbed. In Paramecium, the contractile vacuole expels the excess water that enters by osmosis. The key differences between plant and animal cells are the cellulose wall, chloroplasts and a large central vacuole, and the absence of centrioles in higher plants.\\n\\nPlasmolysis occurs when a plant cell loses water in a hypertonic environment and the membrane pulls away from the wall.\",k:[\"It is large and central in plants\",\"Turgor keeps leaves firm\",\"Plasmolysis occurs in a salty environment\"],x:\"Lettuce in salt water loses water, its cells undergo plasmolysis and it wilts; in pure water it becomes firm again.\",terms:[\"Tonoplast\",\"Turgor\",\"Anthocyanin\",\"Plasmolysis\"]},\n{t:\"Cytoskeleton, cilia and flagella\",d:\"The cytoskeleton is a network of protein filaments that maintains the cell’s shape, moves organelles around, and makes cell movement possible.\",m:\"It has three groups of filaments: microfilaments (actin, about 7 nm in diameter), intermediate filaments (about 10 nm in diameter, such as keratin) and microtubules (tubulin, about 25 nm). Microtubules play a role in the spindle and in cilia and flagella. Cilia are short and numerous, whereas flagella are long and few. The internal structure (axoneme) of a eukaryotic cilium or flagellum is usually 9+2 (nine microtubule doublets plus two central microtubules).\",adv:\"The molecular motors kinesin and dynein carry cargo along microtubules using ATP: kinesin usually moves toward the plus end (the periphery) and dynein toward the minus end (the center). Microtubules are unstable and grow and shrink through dynamic instability; drugs such as taxol (used in chemotherapy) and colchicine target them and inhibit cell division. Actin and myosin play a role in muscle contraction and in the division of the cytoplasm (cytokinesis). Centrioles (9 triplets of microtubules) are located in the microtubule-organizing center (centrosome) and take part in building the spindle. A defect in ciliary dynein causes Kartagener syndrome, which is accompanied by respiratory infections and infertility.\\n\\nIn sperm, the flagellum moves in a wave-like way using dynein, and the mitochondria in the midpiece supply the energy.\",k:[\"Microfilaments, intermediate filaments and microtubules are the three main components\",\"Cilia and flagella have a 9+2 structure\",\"Dynein and kinesin are molecular motors\"],x:\"Cilia in the trachea push particles and mucus upward, and cigarette smoke disables them.\",terms:[\"Tubulin\",\"Actin\",\"Dynein\",\"Centriole\"]}\n],\nfact:\"If you unfolded all the internal membranes of a liver cell, you would get a surface area tens of times larger than that of the cell’s outer membrane.\",\nquiz:[\n{q:\"Which organelle plays a role in making ribosomes?\",o:[\"Nucleolus\",\"Golgi apparatus\",\"Lysosome\",\"Vacuole\"],a:0,e:\"rRNA is made in the nucleolus, where it combines with proteins to form the ribosomal subunits.\"},\n{q:\"In what kind of environment do lysosomal enzymes work best?\",o:[\"Basic\",\"Neutral\",\"Acidic\",\"Very hot\"],a:2,e:\"The pH inside the lysosome is about 5.\"},\n{q:\"Which structure has the 9+2 arrangement?\",o:[\"Mitochondrion\",\"Cilia and flagella\",\"Nucleus\",\"Ribosome\"],a:1,e:\"Nine peripheral microtubule doublets and two central microtubules.\"}]}\n};\n\nvar GL={\n\"hydrogen bond\":\"A weak attraction between a slightly positive hydrogen atom and a slightly negative atom such as oxygen or nitrogen.\",\n\"covalent bond\":\"A strong chemical bond in which two atoms share one or more pairs of electrons.\",\n\"polar\":\"Having an uneven distribution of charge, with one end slightly positive and the other slightly negative.\",\n\"hydrophobic\":\"Water-fearing: not mixing with water, like oil.\",\n\"hydrophilic\":\"Water-loving: dissolving in or being attracted to water.\",\n\"specific heat\":\"The amount of heat needed to raise the temperature of one gram of a substance by one degree Celsius; water’s is unusually high.\",\n\"buffer\":\"A solution that resists changes in pH when small amounts of acid or base are added.\",\n\"pH\":\"A scale from 0 to 14 that measures how acidic or basic a solution is.\",\n\"entropy\":\"A measure of disorder or randomness; in nature it tends to increase.\",\n\"denaturation\":\"The loss of a protein’s natural 3D shape, and therefore its function, caused by heat, acid or chemicals.\",\n\"denature\":\"To make a protein lose its natural 3D shape and function, for example by heating it.\",\n\"amino acid\":\"One of 20 small molecules that are linked in chains to build proteins.\",\n\"peptide bond\":\"The covalent bond that joins one amino acid to the next in a protein chain.\",\n\"polymer\":\"A large molecule made of many similar small units linked together in a chain.\",\n\"glucose\":\"A simple sugar that cells use as their main fuel for making energy.\",\n\"monosaccharide\":\"A single sugar unit, such as glucose, that cannot be broken into simpler sugars.\",\n\"disaccharide\":\"A sugar made of two sugar units joined together, such as sucrose.\",\n\"polysaccharide\":\"A long chain of many sugar units, such as starch or cellulose.\",\n\"starch\":\"The energy-storage polysaccharide made by plants, built from many glucose units.\",\n\"glycogen\":\"A branched chain of glucose that animals store in the liver and muscles as an energy reserve.\",\n\"cellulose\":\"A tough polysaccharide that forms the main part of plant cell walls.\",\n\"chitin\":\"A strong, flexible polysaccharide found in fungal cell walls and insect exoskeletons.\",\n\"fatty acid\":\"A long chain of carbon atoms with an acid group at one end; the building block of many fats.\",\n\"triglyceride\":\"A fat molecule made of glycerol attached to three fatty acids, used to store energy.\",\n\"phospholipid\":\"A fat-like molecule with a water-loving head and two water-fearing tails; it forms cell membranes.\",\n\"cholesterol\":\"A waxy, fat-like molecule that stabilizes cell membranes and is used to make some hormones.\",\n\"lipoprotein\":\"A particle made of fats and proteins that carries fats through the blood.\",\n\"nucleotide\":\"The building block of DNA and RNA, made of a sugar, a phosphate group and a nitrogen base.\",\n\"ATP\":\"Adenosine triphosphate, the molecule that cells use as a quick, usable source of energy.\",\n\"NADH\":\"A molecule that carries high-energy electrons from food breakdown to the energy-making machinery of the cell.\",\n\"enzyme\":\"A protein that speeds up a specific chemical reaction in living things without being used up.\",\n\"substrate\":\"The molecule that an enzyme acts on.\",\n\"active site\":\"The small pocket on an enzyme where the substrate binds and the reaction happens.\",\n\"activation energy\":\"The energy barrier that must be overcome before a chemical reaction can start.\",\n\"cofactor\":\"A non-protein helper, such as a metal ion, that an enzyme needs in order to work.\",\n\"coenzyme\":\"A small organic helper molecule, often made from a vitamin, that an enzyme needs in order to work.\",\n\"allosteric\":\"Describes regulation in which a molecule binds to a site other than the active site and changes the protein’s activity.\",\n\"inhibitor\":\"A molecule that slows down or blocks the action of an enzyme.\",\n\"zymogen\":\"An inactive form of an enzyme that is switched on only when needed.\",\n\"catalyst\":\"A substance that speeds up a chemical reaction without being used up.\",\n\"hemoglobin\":\"The iron-containing protein in red blood cells that carries oxygen.\",\n\"collagen\":\"A strong, rope-like protein that gives strength to skin, bones, tendons and other tissues.\",\n\"chaperone\":\"A protein that helps other proteins fold into their correct shape.\",\n\"prion\":\"An infectious, misfolded protein that makes normal proteins misfold too, causing brain diseases.\",\n\"ribozyme\":\"An RNA molecule that can act as an enzyme.\",\n\"prokaryote\":\"An organism, such as a bacterium, whose cells have no nucleus.\",\n\"eukaryote\":\"An organism whose cells have a nucleus and other membrane-bound compartments.\",\n\"organelle\":\"A small structure inside a cell that carries out a specific job.\",\n\"nucleoid\":\"The region in a prokaryotic cell where the DNA is located, with no membrane around it.\",\n\"plasmid\":\"A small, circular piece of DNA in bacteria that is separate from the main chromosome.\",\n\"peptidoglycan\":\"A mesh-like molecule of sugars and amino acids that makes up the bacterial cell wall.\",\n\"endosymbiosis\":\"The process by which one cell came to live inside another; it explains the origin of mitochondria and chloroplasts.\",\n\"mitochondrion\":\"The organelle that uses oxygen to make most of the cell’s ATP.\",\n\"mitochondria\":\"The organelles that use oxygen to make most of the cell’s ATP.\",\n\"chloroplast\":\"The organelle in plants and algae where photosynthesis takes place.\",\n\"Golgi apparatus\":\"The organelle that modifies, sorts and packages proteins and lipids for delivery.\",\n\"lysosome\":\"A small sac of digestive enzymes that breaks down waste and worn-out cell parts.\",\n\"endoplasmic reticulum\":\"A network of membrane tubes and sacs where proteins and lipids are made.\",\n\"ribosome\":\"A tiny particle that reads mRNA and builds proteins.\",\n\"nucleolus\":\"A dense spot inside the nucleus where ribosomes are assembled.\",\n\"nucleoli\":\"Dense spots inside the nucleus where ribosomes are assembled.\",\n\"nucleus\":\"The compartment of a eukaryotic cell that holds its DNA.\",\n\"nuclei\":\"The compartments of eukaryotic cells that hold their DNA.\",\n\"cytoskeleton\":\"A network of protein fibers that gives a
